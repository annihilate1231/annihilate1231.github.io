<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  [hidden]{display:none!important}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;color:#e6ecf5;background:#0a0e17;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 15% 0%,rgba(120,100,255,.10),transparent 50%),radial-gradient(ellipse at 85% 0%,rgba(255,90,140,.08),transparent 50%);pointer-events:none;z-index:0}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  #setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;overflow-y:auto;z-index:10}
  #setup h1{font-size:34px;font-weight:800;letter-spacing:6px;background:linear-gradient(135deg,#8b9fff 0%,#c084fc 50%,#f472b6 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
  #setup .sub{color:#6b7a94;font-size:13px;letter-spacing:3px;margin-bottom:24px}
  .opt{display:flex;flex-direction:column;gap:10px;width:min(880px,100%)}
  .opt-label{font-size:11px;color:#6b7a94;letter-spacing:3px;font-weight:600}
  .seg{display:flex;gap:8px}
  .seg-btn{flex:1;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);color:#8a95a8;font-weight:500;transition:all .15s}
  .seg-btn.active{background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(139,92,246,.15));border-color:rgba(139,92,246,.5);color:#fff;font-weight:700}
  .roles{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
  .role-card{flex:0 0 auto;width:88px;padding:12px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s}
  .role-card.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
  .rc-avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;background:var(--c);color:#0a0e17}
  .rc-name{font-size:12px;font-weight:700}
  .rc-title{font-size:10px;color:#6b7a94}
  .rc-hp{font-size:10px;color:#ef5350;font-weight:600}
  .start{margin-top:12px;padding:16px 72px;border-radius:12px;font-size:15px;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
  #game{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:10px 14px;gap:10px}
  .topbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-radius:12px;background:rgba(16,22,38,.6);border:1px solid rgba(255,255,255,.05)}
  .turn-indicator{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
  .turn-pulse{width:8px;height:8px;border-radius:50%;background:#8b5cf6;box-shadow:0 0 12px #8b5cf6;animation:turnPulse 1.6s ease-in-out infinite}
  @keyframes turnPulse{0%,100%{opacity:1}50%{opacity:.5}}
  #turnLabel{color:#c5cfe3}
  .phase-label{font-size:11px;padding:2px 10px;border-radius:8px;background:rgba(139,92,246,.2);color:#c4b5fd;font-weight:800;letter-spacing:1px;border:1px solid rgba(139,92,246,.4)}
  .btn{padding:8px 18px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);font-size:12px;font-weight:600}
  .btn:disabled{opacity:.3;cursor:not-allowed}
  .board{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .side{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:rgba(16,22,38,.45);border:1px solid rgba(255,255,255,.05);min-height:0;overflow:hidden;--c:#7c9cff}
  .side.active{border-color:color-mix(in srgb,var(--c) 40%,transparent);box-shadow:0 0 20px -8px color-mix(in srgb,var(--c) 40%,transparent)}
  .side.hit{animation:sideHit .55s}
  @keyframes sideHit{0%{box-shadow:0 0 0 0 rgba(239,68,68,0)}25%{box-shadow:0 0 0 8px rgba(239,68,68,.55)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  .side.counter-glow{border-color:#f0abfc;box-shadow:0 0 32px -4px rgba(240,171,252,.7),0 0 0 2px rgba(240,171,252,.4) inset}
  .side.counter-glow.no-energy{border-color:#ef4444;box-shadow:0 0 32px -4px rgba(239,68,68,.6),0 0 0 2px rgba(239,68,68,.4) inset}
  .hud{flex:none;display:flex;flex-direction:column;gap:8px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.05)}
  .hud-top{display:flex;gap:10px;align-items:center}
  .avatar{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:900;background:linear-gradient(155deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#0a0e17;transition:transform .25s}
  .avatar.pulse{animation:avatarPulse .4s}
  @keyframes avatarPulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .name-hp{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .name-line{display:flex;align-items:baseline;gap:8px}
  .pname{font-size:15px;font-weight:800;color:#fff}
  .prole{font-size:11px;color:#6b7a94}
  .handcount{font-size:10px;color:#a0aabf;margin-left:auto;background:rgba(255,255,255,.06);padding:1px 8px;border-radius:8px;font-weight:700}
  .handcount.over{background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
  .hp-bar{position:relative;height:18px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden}
  .hp-fill{height:100%;background:linear-gradient(90deg,#ef4444,#f87171);transition:width .4s}
  .hp-text{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
  .side.right .hp-bar{direction:rtl}
  .side.right .hp-text{direction:ltr}
  .stats-line{display:flex;flex-direction:column;gap:5px;width:100%}
  .stats-row{display:flex;align-items:center;gap:12px;width:100%}
  .stat-group{display:flex;align-items:center;gap:6px}
  .stat-group.energy{flex:1;justify-content:center}
  .stat-num{font-size:12px;font-weight:800;color:#e6ecf5}
  .stat-num.shield-val{color:#60a5fa}
  .stat-num.energy-val{color:#fbbf24}
  .energy-pips{display:flex;gap:4px;flex-wrap:wrap}
  .pip{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.08);transition:all .2s}
  .pip.on{background:radial-gradient(circle at 35% 35%,#fde68a,#f59e0b);box-shadow:0 0 8px #f59e0b}
  .res-name{font-size:10px;font-weight:800;color:var(--c)}
  .res-pips{display:flex;gap:3px}
  .rpip{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.08);transition:all .2s}
  .rpip.on{background:var(--c);box-shadow:0 0 8px var(--c)}
  .info-btn{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;background:color-mix(in srgb,var(--c) 30%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
  .status-line{flex:none;display:flex;flex-wrap:wrap;gap:4px;min-height:22px;max-height:46px;overflow:hidden}
  .st-tag{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid transparent}
  .st-tag.combo{background:rgba(251,146,60,.15);color:#fb923c;border-color:rgba(251,146,60,.3)}
  .st-tag.buff{background:rgba(34,197,94,.12);color:#4ade80;border-color:rgba(34,197,94,.25)}
  .st-tag.debuff{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.25)}
  .st-tag.pending{background:rgba(168,85,247,.15);color:#c084fc;border-color:rgba(168,85,247,.3)}
  .st-tag.counter{background:rgba(240,171,252,.25);color:#f0abfc;border-color:#f0abfc;animation:counterPulse 0.5s ease-in-out infinite}
  .st-tag.counter-warn{background:rgba(239,68,68,.3);color:#fca5a5;border-color:#ef4444;animation:counterPulse 0.5s ease-in-out infinite}
  @keyframes counterPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,171,252,0.8)}50%{box-shadow:0 0 0 6px rgba(240,171,252,0)}}
  .actions-line{flex:none;display:flex;gap:8px}
  .actions-line.shuangwu{flex-wrap:wrap}
  .action-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);text-align:left;position:relative;overflow:hidden}
  .action-btn.disabled-style{opacity:.35;cursor:not-allowed}
  .action-btn.zaobi-counter{border-color:#f0abfc!important;box-shadow:0 0 16px -2px rgba(240,171,252,.6);animation:counterCardPulse 0.8s ease-in-out infinite}
  .btn-icon{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:900;background:rgba(255,255,255,.06)}
  .btn-content{flex:1;min-width:0}
  .btn-title{font-size:12px;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .btn-desc{font-size:10px;color:#6b7a94;line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cost-badge{flex:none;display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:5px;background:rgba(245,158,11,.15);color:#fbbf24;font-size:10px;font-weight:900;border:1px solid rgba(245,158,11,.3)}
  .skill-btn .btn-icon{background:color-mix(in srgb,var(--c) 25%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
  .ult-btn .btn-icon{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.35)}
  .ult-btn.ready{border-color:rgba(251,191,36,.5);animation:ultPulse 2s ease-in-out infinite}
  @keyframes ultPulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 0 24px -4px rgba(251,191,36,.6)}}
  .ult-btn.ready .btn-title{color:#fbbf24}
  .lend-btn .btn-icon{background:rgba(236,72,153,.15);color:#ec4899;border:1px solid rgba(236,72,153,.35)}
  .end-turn-row{flex:none;display:flex}
  .end-turn-btn{flex:1;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff}
  .end-turn-btn:disabled{background:rgba(255,255,255,.03);color:#4a5468;cursor:not-allowed}
  .hand-area{flex:1;min-height:0;display:flex;gap:10px;overflow-x:auto;align-items:center;padding:6px 4px}
  .hand-empty{flex:1;display:grid;place-items:center;color:#3a4456;font-size:12px}
  .card{flex:none;width:92px;height:128px;border-radius:12px;padding:9px 8px;display:flex;flex-direction:column;gap:3px;text-align:left;position:relative;overflow:hidden;background:linear-gradient(180deg,#1e2637 0%,#141a29 100%);border:1px solid rgba(255,255,255,.08);transition:all .15s}
  .card:disabled{opacity:.35;cursor:not-allowed}
  .card.new-card{animation:cardDeal .45s}
  @keyframes cardDeal{from{transform:translateY(-30px) scale(.7);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  .card.extra-card{box-shadow:0 0 0 1.5px #fbbf24}
  .card.sealed-card{opacity:.4;filter:grayscale(.8)}
  .card.sealed-card::after{content:"封";position:absolute;top:3px;right:5px;font-size:12px;font-weight:900;color:#ef4444;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:4px;z-index:2}
  .card.counter-active{box-shadow:0 0 0 2px #f0abfc,0 4px 24px -2px rgba(240,171,252,.9);animation:counterCardPulse 0.8s ease-in-out infinite;cursor:pointer!important}
  @keyframes counterCardPulse{0%,100%{box-shadow:0 0 0 2px #f0abfc,0 4px 24px -2px rgba(240,171,252,.9)}50%{box-shadow:0 0 0 3px #f0abfc,0 4px 32px 2px rgba(240,171,252,1)}}
  .card.no-energy-counter{box-shadow:0 0 0 2px #ef4444,0 4px 24px -2px rgba(239,68,68,.7);opacity:.6;cursor:not-allowed!important}
  .card.no-energy-counter::after{content:"能量不足";position:absolute;top:3px;right:3px;font-size:9px;font-weight:900;color:#ef4444;background:rgba(0,0,0,.8);padding:1px 4px;border-radius:3px;z-index:2}
  .card.dim-card{opacity:.3;cursor:not-allowed}
  .card.attack{border-left:3px solid #ef4444}
  .card.shield{border-left:3px solid #3b82f6}
  .card.heal{border-left:3px solid #22c55e}
  .card.draw{border-left:3px solid #a855f7}
  .card.energy{border-left:3px solid #f59e0b}
  .card.control{border-left:3px solid #8b5cf6}
  .card.trap{border-left:3px solid #06b6d4}
  .card.steal{border-left:3px solid #d946ef}
  .card.cond{border-left:3px solid #14b8a6}
  .card.cost{border-left:3px dashed #ef4444}
  .card.delay{border-left:3px dotted #8b5cf6}
  .card.retain{border-left:3px solid #eab308}
  .card.cleanse{border-left:3px solid #f0abfc}
  .side.right .card.attack{border-left:none;border-right:3px solid #ef4444}
  .side.right .card.shield{border-left:none;border-right:3px solid #3b82f6}
  .side.right .card.heal{border-left:none;border-right:3px solid #22c55e}
  .side.right .card.draw{border-left:none;border-right:3px solid #a855f7}
  .side.right .card.energy{border-left:none;border-right:3px solid #f59e0b}
  .side.right .card.control{border-left:none;border-right:3px solid #8b5cf6}
  .side.right .card.trap{border-left:none;border-right:3px solid #06b6d4}
  .side.right .card.steal{border-left:none;border-right:3px solid #d946ef}
  .side.right .card.cond{border-left:none;border-right:3px solid #14b8a6}
  .side.right .card.cost{border-left:none;border-right:3px dashed #ef4444}
  .side.right .card.delay{border-left:none;border-right:3px dotted #8b5cf6}
  .side.right .card.retain{border-left:none;border-right:3px solid #eab308}
  .side.right .card.cleanse{border-left:none;border-right:3px solid #f0abfc}
  .card.back{background:linear-gradient(180deg,#1a2133 0%,#0f1420 100%);border:1px solid rgba(255,255,255,.06)}
  .card.back::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:900;color:rgba(255,255,255,.08)}
  .card-cost{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.5);font-size:11px;font-weight:900;color:#fbbf24;border:1.5px solid rgba(251,191,36,.4);flex-shrink:0}
  .card-name{font-size:13px;font-weight:800;color:#fff;line-height:1.15}
  .card-type{font-size:8px;font-weight:700;letter-spacing:1.5px;color:#6b7a94;text-transform:uppercase}
  .card-desc{font-size:9.5px;line-height:1.35;color:#a0aabf;margin-top:auto}
  .log{flex:none;height:56px;padding:10px 16px;border-radius:12px;background:rgba(16,22,38,.6);overflow-y:auto;font-size:12px;line-height:1.5;color:#6b7a94}
  .log div:last-child{color:#e6ecf5;font-weight:600}
  .side.right .hud-top{flex-direction:row-reverse}
  .side.right .name-hp{text-align:right}
  .side.right .name-line{flex-direction:row-reverse}
  .side.right .stats-row{flex-direction:row-reverse}
  .side.right .energy-pips{flex-direction:row-reverse}
  .side.right .res-pips{flex-direction:row-reverse}
  .side.right .status-line{justify-content:flex-end}
  .side.right .actions-line{flex-direction:row-reverse}
  .side.right .action-btn{flex-direction:row-reverse}
  .side.right .action-btn .btn-content{text-align:right}
  .side.right .action-btn .btn-title{justify-content:flex-end}
  .side.right .action-btn .btn-desc{text-align:right}
  .side.right .hand-area{flex-direction:row-reverse;justify-content:flex-start}
  .tooltip{position:fixed;z-index:1000;background:rgba(20,26,40,.98);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 14px;max-width:300px;pointer-events:none}
  .tooltip-title{font-size:13px;font-weight:800;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .tooltip-title .tt-icon{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;background:color-mix(in srgb,var(--c,#8b5cf6) 30%,transparent);color:var(--c,#8b5cf6)}
  .tt-cost{display:inline-block;padding:1px 7px;border-radius:5px;background:rgba(245,158,11,.2);color:#fbbf24;font-size:10px;font-weight:900}
  .tooltip-desc{font-size:12px;line-height:1.55;color:#a0aabf}
  .modal-mask{position:fixed;inset:0;z-index:900;background:rgba(5,8,16,.72);display:flex;align-items:center;padding:20px}
  .modal-mask.side-left{justify-content:center;padding-left:5vw;padding-right:calc(50vw + 10px)}
  .modal-mask.side-right{justify-content:center;padding-right:5vw;padding-left:calc(50vw + 10px)}
  .modal-box{background:linear-gradient(160deg,#1c2336,#121826);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px 26px;width:100%;max-height:calc(100vh - 40px);overflow-y:auto}
  .modal-title{font-size:18px;font-weight:900;color:var(--c,#8b5cf6);display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
  .modal-title .mt-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:color-mix(in srgb,var(--c,#8b5cf6) 30%,transparent);color:var(--c,#8b5cf6)}
  .modal-body{display:flex;flex-direction:column;gap:10px}
  .modal-row{display:flex;gap:10px;font-size:13px;line-height:1.5}
  .modal-row .mr-label{flex:none;width:56px;color:#6b7a94;font-weight:600}
  .modal-row .mr-value{flex:1;color:#e6ecf5}
  .modal-close{margin-top:10px;width:100%;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--c,#8b5cf6) 25%,transparent);border:1px solid color-mix(in srgb,var(--c,#8b5cf6) 50%,transparent);color:var(--c,#8b5cf6);font-weight:700;font-size:13px}
  .modal-close:disabled{opacity:.4;cursor:not-allowed}
  .hand-select-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:50vh;overflow-y:auto;padding:8px}
  .hand-select-grid .card{cursor:pointer}
  .hand-select-grid .card.selected{outline:2px solid #ef4444;opacity:.75}
  .hand-select-empty{padding:40px 20px;text-align:center;color:#6b7a94;font-size:13px;width:100%}
  .n-buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .n-buttons .btn{min-width:52px;padding:10px 14px;font-size:14px;font-weight:800}
  .choice-btn{padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);font-size:13px;font-weight:700;text-align:left;margin-bottom:10px;width:100%}
  .choice-btn .cb-title{font-size:14px;color:#fff;margin-bottom:4px}
  .choice-btn .cb-desc{font-size:11px;color:#8a95a8;font-weight:500}
  #arena{position:fixed;inset:0;pointer-events:none;z-index:100}
  .screen-hit{position:fixed;inset:0;pointer-events:none;z-index:150;background:radial-gradient(ellipse at center,transparent 40%,rgba(239,68,68,.5) 100%);animation:screenHit .5s ease-out forwards}
  @keyframes screenHit{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
  .flying-card{position:fixed;border-radius:10px;transition:all .55s cubic-bezier(.3,.7,.4,1);z-index:200;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:12px;box-shadow:0 0 40px rgba(255,255,255,.6)}
  .fly-damage{position:fixed;font-size:68px;font-weight:900;color:#ef4444;text-shadow:0 0 20px #ef4444,0 4px 0 #7a0010,0 0 3px #fff;pointer-events:none;z-index:300;animation:floatUp 1.3s ease-out forwards}
  .fly-heal{position:fixed;font-size:40px;font-weight:900;color:#4ade80;pointer-events:none;z-index:300;animation:floatUp 1.2s ease-out forwards}
  .fly-shield{position:fixed;font-size:34px;font-weight:900;color:#60a5fa;pointer-events:none;z-index:300;animation:floatUp 1.2s ease-out forwards}
  .fly-immunity{position:fixed;font-size:28px;font-weight:900;color:#9ca3af;pointer-events:none;z-index:300;animation:floatUp 1.1s ease-out forwards}

const MAX_ENERGY = 6;

const HAND_LIMIT = 6;

const SHIELD_MAX = 5;

const clickAudio = new Audio("oneclick.mp3");
clickAudio.volume = 0.4;
function playClick(rate = 1) { try { clickAudio.currentTime = 0; clickAudio.playbackRate = rate; clickAudio.play().catch(() => {}); } catch (e) {} }

const state = { mode: "human", players: [], current: 0, over: false, logs: [], busy: false, _busyTimer: null, turnCount: 0, counterWindow: null, phase: "idle" };
const setup = { mode: "human", p0: "zhangxiang", p1: "yangkaidong" };

function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function log(msg) { state.logs.push(msg); }
function normalHand(p) { return p.hand.filter(c => !c.isExtra); }
function addRes(p, n) { const max = ROLES[p.role].resource.max; const before = p.resource; p.resource = Math.min(max, p.resource + n); if (n > 0 && p.resource > before) floatRes(state.players.indexOf(p), "+" + (p.resource - before), p.role); }
function subRes(p, n) { p.resource = Math.max(0, p.resource - n); }
function onLoseCard(p, n = 1) { if (p.role === "lujiancheng") { addRes(p, n * 2); log(`${p.name} 失去 ${n} 张牌，风度 +${n * 2}`); } }

function onTap(el, handler) {
  let armed = false;
  el.addEventListener("pointerdown", () => { armed = true; });
  el.addEventListener("pointerup", (e) => { if (armed) { armed = false; handler(e); } });
  el.addEventListener("pointerleave", () => { armed = false; });
  el.addEventListener("pointercancel", () => { armed = false; });
}

function draw(p, n, allowOverflow = false) {
  for (let i = 0; i < n; i++) {
    if (!p.deck.length) { if (!p.discard.length) return; p.deck = shuffle(p.discard); p.discard = []; }
    const c = p.deck.pop();
    if (!allowOverflow && normalHand(p).length >= HAND_LIMIT) { p.discard.push(c); onLoseCard(p, 1); }
    else p.hand.push({ key: c, born: state.turnCount, isNew: true });
  }
}
function totalShield(p) { if (p.role === "zhiyuchen") return p.resource; return p.shields.reduce((s, l) => s + l.amount, 0); }
function gainShield(p, n) {
  const cur = totalShield(p); const add = Math.min(SHIELD_MAX - cur, n);
  if (add <= 0) return;
  if (p.role === "zhiyuchen") { p.resource += add; p.shieldTimer = SHIELD_TURNS; }
  else p.shields.push({ amount: add, turns: SHIELD_TURNS });
  log(`${p.name} 获得 ${add} 点护盾`);
  floatText(state.players.indexOf(p), "+" + add, "shield");
}
function damageShield(p, dmg) {
  if (p.role === "zhiyuchen") { const use = Math.min(p.resource, dmg); p.resource -= use; return use; }
  let remaining = dmg;
  for (const layer of p.shields) { if (remaining <= 0) break; const absorb = Math.min(layer.amount, remaining); layer.amount -= absorb; remaining -= absorb; }
  p.shields = p.shields.filter(l => l.amount > 0);
  return dmg - remaining;
}
function tickShields(p) {
  if (p.role === "zhiyuchen") {
    if (p.shieldTimer > 0) {
      p.shieldTimer--;
      if (p.shieldTimer === 0 && p.resource > 0) { const half = Math.ceil(p.resource / 2); log(`${p.name} 护盾减半：${p.resource} → ${half}`); p.resource = half; }
    }
    return;
  }
  p.shields.forEach(l => l.turns--);
  const before = totalShield(p);
  p.shields = p.shields.filter(l => l.turns > 0);
  const after = totalShield(p);
  if (before > after) log(`${p.name} 有 ${before - after} 点护盾过期消失`);
}
function tickTrap(p) {
  if (p.trap > 0) {
    p.trapTurns--;
    if (p.trapTurns <= 0) { p.trap = 0; p.trapTurns = 0; log(`${p.name} 的陷阱失效了`); }
  }
}
function heal(p, n) { const before = p.hp; p.hp = Math.min(p.maxHp, p.hp + n); const g = p.hp - before; if (g > 0) { log(`${p.name} 回复 ${g} 点生命`); floatText(state.players.indexOf(p), "+" + g, "heal"); } }

  return true;
}

function floatText(idx, text, type) {

  document.getElementById("arena").appendChild(el); setTimeout(() => el.remove(), 1400);
}

  el.style.color = ROLES[role].color;

}
function flashSide(idx, isHit = false) { const el = document.getElementById("side" + idx); if (!el) return; el.classList.remove("shake", "hit"); void el.offsetWidth; el.classList.add(isHit ? "hit" : "shake"); }

function pulseAvatar(idx) { const side = document.getElementById("side" + idx); if (!side) return; const av = side.querySelector(".avatar"); if (!av) return; av.classList.remove("pulse"); void av.offsetWidth; av.classList.add("pulse"); }
function banner(text, color = "#fbbf24") { const el = document.createElement("div"); el.className = "banner-tag"; el.textContent = text; el.style.color = color; document.getElementById("arena").appendChild(el); setTimeout(() => el.remove(), 1400); }
