function useWuxieActive(p) {
  const removed = [];
  if (p.locked) { p.locked = false; removed.push("出牌封锁"); }
  if (p.noSkill) { p.noSkill = false; removed.push("技能封锁"); }
  if (p.frozen) { p.frozen = false; removed.push("罚站"); }
  if (p.firstAtkDebuff > 0) { p.firstAtkDebuff = 0; removed.push("首攻削减"); }
  if (p.energyBonus < 0) { p.energyBonus = 0; removed.push("能量惩罚"); }
  if (p.rouMarks > 0) { p.rouMarks = 0; removed.push("记仇"); }
  if (p.noEnergyGain) { p.noEnergyGain = false; removed.push("能量封锁"); }
  const curses = p.pending.filter(e => e.type === "curse");
  if (curses.length > 0) { p.pending = p.pending.filter(e => e.type !== "curse"); removed.push("诅咒"); }
  const sealedBefore = p.hand.filter(c => c.sealed).length;
  p.hand.forEach(c => c.sealed = false);
  if (sealedBefore > 0) removed.push(`封印×${sealedBefore}`);
  const opp = state.players[1 - state.players.indexOf(p)];
  const oppAmbush = opp.pending.filter(e => e.type === "ambush").length;
  const selfAmbush = p.pending.filter(e => e.type === "ambush").length;
  p.pending = p.pending.filter(e => e.type !== "ambush");
  opp.pending = opp.pending.filter(e => e.type !== "ambush");
  if (selfAmbush > 0) removed.push("自身埋伏");
  if (oppAmbush > 0) removed.push("对手埋伏");
  if (removed.length > 0) log(`${p.name} 无懈可击：清除 ${removed.join("、")}`);
  else log(`${p.name} 无懈可击：无负面可清除`);
  floatText(state.players.indexOf(p), "无懈可击", "cleanse");
}

/* ============================================================
 * 反制系统（已修复：删扣敌方能量，偶数层原牌生效）
 * ============================================================ */
function getWuxieInfo(idx) {
  const p = state.players[idx];
  const idxs = [];
  p.hand.forEach((c, i) => { if (c.key === "cleanse" && !c.sealed) idxs.push(i); });
  return { has: idxs.length > 0, hasEnergy: p.energy >= 1, canCounter: idxs.length > 0 && p.energy >= 1 };
}

function getZhaobiInfo(idx) {
  const p = state.players[idx];
  if (p.role !== "shuangwu") return { canUse: false };
  if (p.skillCd > 0) return { canUse: false };
  if (p.energy < 1) return { canUse: false };
  return { canUse: true };
}

function openCounterWindow(attackerIdx, cardObj, execFn, counterCount) {
  const respPlayer = counterCount % 2 === 0 ? (1 - attackerIdx) : attackerIdx;
  const resp = state.players[respPlayer];
  const winfo = getWuxieInfo(respPlayer);
  const zinfo = getZhaobiInfo(respPlayer);

  // AI 响应
  if (state.mode === "ai" && respPlayer === 1) {
    if (winfo.canCounter && aiShouldCounter(cardObj, resp, counterCount)) {
      setTimeout(() => doCounterAI(attackerIdx, cardObj, execFn, counterCount, "wuxie"), 300);
      return;
    }
    if (zinfo.canUse && aiShouldCounter(cardObj, resp, counterCount)) {
      setTimeout(() => doCounterAI(attackerIdx, cardObj, execFn, counterCount, "zhaobi"), 300);
      return;
    }
    setTimeout(() => resolveCounter(execFn, counterCount), 100);
    return;
  }

  // 玩家响应：无可用手段
  if (!winfo.has && !zinfo.canUse) {
    setTimeout(() => resolveCounter(execFn, counterCount), 100);
    return;
  }

  state.counterWindow = {
    active: true, attackerIdx, cardObj, execFn, counterCount,
    responsePlayer: respPlayer, hasEnergy: winfo.hasEnergy,
    hasWuxie: winfo.has, canZhaobi: zinfo.canUse, timer: null,
  };

  if (winfo.hasEnergy && winfo.has) {
    log(`⚡ ${resp.name} 有 ${COUNTER_WINDOW_MS / 1000} 秒反制时间（无懈可击${zinfo.canUse ? " / 扎啤" : ""}）`);
    counterBar("⚡ " + resp.name + " · 反制窗口 " + (COUNTER_WINDOW_MS / 1000) + "s");
  } else if (zinfo.canUse) {
    log(`⚡ ${resp.name} 可用扎啤反制（${COUNTER_WINDOW_MS / 1000}s）`);
    counterBar("⚡ " + resp.name + " · 可用扎啤反制 " + (COUNTER_WINDOW_MS / 1000) + "s");
  } else if (winfo.has && !winfo.hasEnergy) {
    log(`⚠ ${resp.name} 有可用无懈可击，但能量不足`);
    counterBar("⚠ 能量不足，无法反制", true);
  }
  render();

  state.counterWindow.timer = setTimeout(() => {
    if (state.counterWindow && state.counterWindow.active) {
      resolveCounter(execFn, counterCount);
    }
  }, COUNTER_WINDOW_MS);
}

function resolveCounter(execFn, counterCount) {
  if (state.counterWindow) {
    clearTimeout(state.counterWindow.timer);
    state.counterWindow = null;
  }
  clearTimeout(state._busyTimer);
  state._busyTimer = null;
  state.busy = false;

  if (counterCount % 2 === 0) {
    log(`✅ 反制链结束（${counterCount} 次反制，原牌生效）`);
    try { execFn(); } catch (e) { console.error(e); }
    setTimeout(() => { try { render(); } catch(e){} }, 50);
  } else {
    log(`✨ 反制成功！牌被抵消（${counterCount} 次反制，牌失效）`);
    flyCounter("牌被抵消");
    try { render(); } catch (e) { console.error(e); }
  }
}

function doCounterFromWindow(type = "wuxie") {
  const cw = state.counterWindow;
  if (!cw || !cw.active) return;

  const respPlayer = cw.responsePlayer;
  const resp = state.players[respPlayer];
  clearTimeout(cw.timer);

  if (type === "zhaobi") {
    if (resp.role !== "shuangwu" || resp.skillCd > 0 || resp.energy < 1) return;
    resp.energy -= 1;
    resp.skillCd = getSkillCd(ROLES[resp.role]);
    log(`💪 ${resp.name} 用扎啤反制「${CARDS[cw.cardObj.key].name}」！能量 -1，CD 重置`);
    flyCounter("扎啤反制！");
    floatText(respPlayer, "能量 -1", "energy");
  } else {
    const wuxieIdx = resp.hand.findIndex(c => c.key === "cleanse" && !c.sealed);
    if (wuxieIdx < 0) return;
    if (resp.energy < 1) return;
    const wuxie = resp.hand.splice(wuxieIdx, 1)[0];
    resp.discard.push(wuxie.key);
    resp.energy -= 1;
    const label = cw.counterCount === 0 ? "反制" : "反制反制";
    log(`✨ ${resp.name} 用无懈可击${label}「${CARDS[cw.cardObj.key].name}」！手牌 -1，能量 -1`);
    flyCounter(label + "！");
    floatText(respPlayer, "-1 手牌", "handmin");
    floatText(respPlayer, "能量 -1", "energy");
  }

  const savedAttackerIdx = cw.attackerIdx;
  const savedCardObj = cw.cardObj;
  const savedExecFn = cw.execFn;
  const savedCount = cw.counterCount;

  state.counterWindow = null;
  playClick(1.4);
  render();

  setTimeout(() => {
    openCounterWindow(savedAttackerIdx, savedCardObj, savedExecFn, savedCount + 1);
  }, 500);
}

function doCounterAI(attackerIdx, cardObj, execFn, counterCount, type) {
  const respPlayer = counterCount % 2 === 0 ? (1 - attackerIdx) : attackerIdx;
  const resp = state.players[respPlayer];

  if (type === "zhaobi") {
    if (resp.role !== "shuangwu" || resp.skillCd > 0 || resp.energy < 1) { resolveCounter(execFn, counterCount); return; }
    resp.energy -= 1;
    resp.skillCd = getSkillCd(ROLES[resp.role]);
    log(`💪 电脑用扎啤反制「${CARDS[cardObj.key].name}」！`);
    flyCounter("扎啤反制！");
    floatText(respPlayer, "能量 -1", "energy");
  } else {
    const wuxieIdx = resp.hand.findIndex(c => c.key === "cleanse" && !c.sealed);
    if (wuxieIdx < 0 || resp.energy < 1) { resolveCounter(execFn, counterCount); return; }
    const wuxie = resp.hand.splice(wuxieIdx, 1)[0];
    resp.discard.push(wuxie.key);
    resp.energy -= 1;
    const label = counterCount === 0 ? "反制" : "反制反制";
    log(`✨ 电脑用无懈可击${label}「${CARDS[cardObj.key].name}」！手牌 -1，能量 -1`);
    flyCounter(label + "！");
    floatText(respPlayer, "-1 手牌", "handmin");
    floatText(respPlayer, "能量 -1", "energy");
  }

  playClick(1.4);
  render();
  setTimeout(() => { openCounterWindow(attackerIdx, cardObj, execFn, counterCount + 1); }, 500);
}

function aiShouldCounter(cardObj, resp, counterCount) {
  const def = CARDS[cardObj.key];
  if (counterCount % 2 === 1) return true;
  if (def.type === "attack" && def.damage >= 5) return true;
  if (def.type === "control" || def.type === "delay") return true;
  if (def.type === "steal") return true;
  if (def.type === "cost") return true;
  if (resp.hp < resp.maxHp * 0.5 && def.type === "attack") return true;
  return false;
}

function tryCounter(attackerIdx, cardObj, onExecute) {
  openCounterWindow(attackerIdx, cardObj, onExecute, 0);
}

let tooltipEl = null; let tooltipTimer = null;
function showTooltip(anchor, color, icon, title, costLabel, desc) {
  hideTooltip();
  const tt = document.createElement("div"); tt.className = "tooltip"; tt.style.setProperty("--c", color);
  tt.innerHTML = `<div class="tooltip-title"><span class="tt-icon">${icon}</span><span>${title}</span>${costLabel ? `<span class="tt-cost">${costLabel}</span>` : ""}</div><div class="tooltip-desc">${desc}</div>`;
  document.body.appendChild(tt); tooltipEl = tt;
  const r = anchor.getBoundingClientRect(); const tr = tt.getBoundingClientRect(); const pad = 8;
  let top = r.top - tr.height - pad; let left = r.left + r.width / 2 - tr.width / 2;
  if (top < pad) top = r.bottom + pad;
  if (left < pad) left = pad;
  if (left + tr.width > window.innerWidth - pad) left = window.innerWidth - tr.width - pad;
  tt.style.top = top + "px"; tt.style.left = left + "px";
  clearTimeout(tooltipTimer); tooltipTimer = setTimeout(hideTooltip, 4000);
}
function hideTooltip() { clearTimeout(tooltipTimer); tooltipTimer = null; if (tooltipEl) { tooltipEl.remove(); tooltipEl = null; } }
function bindAction(btn, color, icon, title, costLabel, desc, onTapCb) {
  let pressTimer = null, longPressed = false, armed = false;
  const start = () => { armed = true; longPressed = false; clearTimeout(pressTimer); pressTimer = setTimeout(() => { longPressed = true; showTooltip(btn, color, icon, title, costLabel, desc); }, 450); };
  const end = () => { clearTimeout(pressTimer); pressTimer = null; if (armed && !longPressed) { hideTooltip(); onTapCb(); } armed = false; longPressed = false; };
  const cancel = () => { clearTimeout(pressTimer); pressTimer = null; armed = false; longPressed = false; };
  btn.addEventListener("pointerdown", start);
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointerleave", cancel);
  btn.addEventListener("pointercancel", cancel);
}

function dealDamage(aIdx, dIdx, base, opts = {}) {
  if (state.over) return;
  const atk = state.players[aIdx]; const def = state.players[dIdx];
  let dmg = base;
  if (atk.damageBuff) dmg += atk.damageBuff;
  if (atk.pendingAtkBuff && opts.isAttack) { dmg += atk.pendingAtkBuff; atk.pendingAtkBuff = 0; }
  if (atk.role === "zhangsien") { if (atk.resource >= 5) dmg += 2; else if (atk.resource >= 3) dmg += 1; }
  if (atk.role === "yangkaidong" && opts.isAttackCard) { const ratio = atk.hp / atk.maxHp; if (ratio <= 0.3) dmg += 5; else if (ratio <= 0.5) dmg += 2; }
  if (atk.nextAtkDouble && opts.isAttack) { dmg *= 2; atk.nextAtkDouble = false; log(`${atk.name} 号令触发：伤害翻倍`); }
  if (atk.doubleDamage) dmg *= 2;
  if (opts.isAttack && atk.firstAtkDebuff > 0) { dmg = Math.max(0, dmg - atk.firstAtkDebuff); atk.firstAtkDebuff = 0; }
  if (def.role === "yangkaidong" && def.resource >= 5) dmg -= 2;
  if (def.role === "gu") dmg -= def.resource;
  if (def.role === "zhiban" && def.resource >= 3) dmg -= 1;
  if (def.damageHalfThisTurn) dmg = Math.floor(dmg / 2);
  dmg = Math.max(0, dmg);
  if (!opts.ignoreShield) { const absorbed = damageShield(def, dmg); if (absorbed > 0) { dmg -= absorbed; log(`${def.name} 护盾抵挡 ${absorbed} 点`); } }
  if (dmg > 0) {
    def.hp = Math.max(0, def.hp - dmg);
    log(`${def.name} 受到 ${dmg} 点伤害`);
    floatText(dIdx, "-" + dmg, "damage"); flashSide(dIdx, true); screenHit();
  } else { floatText(dIdx, "免疫", "immunity"); flashSide(dIdx, false); }
  if (dmg > 0) {
    if (def.role === "yangkaidong") addRes(def, 3);
    if (def.role === "rou") { addRes(def, 1); atk.rouMarks = (atk.rouMarks || 0) + 1; atk.rouMarkExpire = state.turnCount + 2; log(`${atk.name} 被${def.name}记仇（${atk.rouMarks} 层）`); }
    if (def.role === "lubiao" && opts.isAttackCard && def.counterHealsUsed < 1) { def.counterHealsUsed = (def.counterHealsUsed || 0) + 1; heal(def, 1); log(`${def.name} 反制：回复 1 生命`); }
    if (def.drawOnHurtThisTurn) { draw(def, 1); log(`${def.name} 抗压：受伤抽 1 张`); }
  }
  if (atk.role === "zhiyuchen" && dmg > 0) { atk.damageDealt = (atk.damageDealt || 0) + dmg; const gained = Math.floor(atk.damageDealt / 2); if (gained > 0) { atk.damageDealt -= gained * 2; gainShield(atk, gained); } }
  if (atk.role === "xi" && dmg > 0) { atk.damageDealt = (atk.damageDealt || 0) + dmg; while (atk.damageDealt >= 3) { atk.damageDealt -= 3; addRes(atk, 1); } }
  if (opts.isAttack && def.reflect > 0) { const rd = def.reflect; def.reflect = 0; atk.hp = Math.max(0, atk.hp - rd); log(`${def.name} 反弹 ${rd} 点`); floatText(aIdx, "-" + rd, "damage"); flashSide(aIdx, true); screenHit(); }
  if (opts.isAttack && def.trap > 0) { const td = def.trap; def.trap = 0; def.trapTurns = 0; atk.hp = Math.max(0, atk.hp - td); log(`${def.name} 陷阱触发，${atk.name} 受 ${td} 点`); floatText(aIdx, "-" + td, "damage"); flashSide(aIdx, true); screenHit(); }
  if (def.hp <= 0 && !tryEmergencyHeal(def)) { endGame(aIdx); return; }
  if (atk.hp <= 0 && !tryEmergencyHeal(atk)) { endGame(dIdx); return; }
}

function tickPending(p) {
  const triggered = [];
  p.pending = p.pending.filter(e => { e.turns--; if (e.turns <= 0) { triggered.push(e); return false; } return true; });
  triggered.forEach(e => {
    const pIdx = state.players.indexOf(p); const oppIdx = 1 - pIdx;
    if (e.type === "ambush") { log(`${p.name} 的埋伏触发！`); dealDamage(pIdx, oppIdx, 8, { isAttack: true, ignoreShield: true }); }
    else if (e.type === "curse") {
      log(`${p.name} 的诅咒爆发！`);
      p.hp = Math.max(0, p.hp - 4); floatText(pIdx, "-4", "damage"); flashSide(pIdx, true); screenHit();
      if (normalHand(p).length > 0) { const i = p.hand.findIndex(c => !c.isExtra); if (i >= 0) { const card = p.hand.splice(i, 1)[0]; p.discard.push(card.key); onLoseCard(p, 1); } }
      if (p.hp <= 0 && !tryEmergencyHeal(p)) endGame(oppIdx);
    }
  });
}

function startTurn(i) {
  state.current = i; state.turnCount++;
  const p = state.players[i]; const role = ROLES[p.role];
  state.phase = "start";

  // 阶段 1：回合开始
  if (p.rouMarkExpire && state.turnCount >= p.rouMarkExpire) { p.rouMarks = 0; p.rouMarkExpire = 0; }
  tickShields(p); tickPending(p); tickTrap(p);
  if (state.over) return;

  if (!p.started) { p.started = true; p.energy = 3; }
  else if (p.noEnergyGain) { p.noEnergyGain = false; log(`${p.name} 被封锁，本回合不获得能量`); }
  else p.energy = Math.min(MAX_ENERGY, Math.max(0, p.energy + ENERGY_PER_TURN + (p.energyBonus || 0)));
  p.energyBonus = 0;

  p.damageBuff = 0; p.doubleDamage = false; p.reflect = 0; p.combo = 0;
  p.frozen = false; p.tookDamageThisTurn = false;
  p.cardsPlayedThisTurn = 0; p.attackPlayedThisTurn = false;
  p.counterHealsUsed = 0;
  p.damageHalfThisTurn = false; p.drawOnHurtThisTurn = false;
  p.zeroResAtEndTurn = false;
  p.cannotPlayMoreThisTurn = false;
  p.lendUsed = false;
  p.skillCd = Math.max(0, p.skillCd - 1);
  if (role.resource.turnStart) addRes(p, role.resource.turnStart);

  // 阶段 2：摸牌
  state.phase = "draw";
  draw(p, 2, true);
  if (p.zhiyuchenBuff > 0) {
    p.energy = Math.min(MAX_ENERGY, p.energy + 1);
    gainShield(p, 1); heal(p, 2); draw(p, 1, true);
    p.zhiyuchenBuff--;
    log(`${p.name} 守护领域：+1 能量 +1 护盾 +2 生命 +1 抽（剩余 ${p.zhiyuchenBuff} 回合）`);
  }
  log(`—— ${p.name} 的回合 · 能量 ${p.energy}/${MAX_ENERGY} · 技能CD ${p.skillCd} ——`);

  // 阶段 3：出牌
  state.phase = "play";
  render();
  if (p.handOver > 0) promptHandOver(p, () => { render(); maybeAITurn(i); });
  else maybeAITurn(i);
}

function endTurn() {
  if (state.over || state.busy) return;
  if (state.mode === "ai" && state.current === 1) return;
  if (state.counterWindow && state.counterWindow.active) return;
  if (state.phase !== "play") return;

  const p = state.players[state.current];
  state.phase = "discard";
  const overflow = p.hand.length - HAND_LIMIT;
  if (overflow > 0) {
    promptDiscard(p, overflow, () => {
      log(`${p.name} 弃掉 ${overflow} 张牌`);
      doEndPhase(p);
    });
  } else {
    doEndPhase(p);
  }
}

function doEndPhase(p) {
  state.phase = "end";
  if (p.role === "gu" && !p.attackPlayedThisTurn) { addRes(p, 1); log(`${p.name} 未出攻击牌，伪装 +1`); }
  if (p.role === "lubiao" && p.resource >= 2) heal(p, 2);
  if (p.zeroResAtEndTurn) { p.resource = 0; log(`${p.name} 士气清零`); }
  const sealedCount = p.hand.filter(c => c.sealed).length;
  p.hand.forEach(c => c.sealed = false);
  if (sealedCount > 0) log(`${p.name} 的 ${sealedCount} 张封印牌解封`);
  p.locked = false; p.noSkill = false; p.firstAtkDebuff = 0; p.combo = 0;
  if (state.over) return;
  startTurn(1 - state.current);
}

function endTurnAI() {
  if (state.over) return;
  if (state.counterWindow && state.counterWindow.active) return;
  if (state.phase !== "play") return;
  const p = state.players[1];
  state.phase = "discard";
  const overflow = p.hand.length - HAND_LIMIT;
  if (overflow > 0) {
    for (let k = 0; k < overflow; k++) { const sel = aiPickWorstCard(p.hand); if (sel >= 0) { const card = p.hand.splice(sel, 1)[0]; p.discard.push(card.key); onLoseCard(p, 1); } }
    log(`电脑 弃掉 ${overflow} 张牌`);
  }
  doEndPhase(p);
}

function maybeAITurn(i) {
  if (state.mode === "ai" && i === 1 && !state.over) setTimeout(aiStep, 400);
}

function promptHandOver(p, onDone) {
  const idx = state.players.indexOf(p); const receiver = state.players[1 - idx];
  if (p.hand.length === 0) { log(`${p.name} 没有手牌可交`); onDone(); return; }
  if (state.mode === "ai" && idx === 1) {
    const sel = aiPickWorstCard(p.hand);
    if (sel >= 0) { const card = p.hand.splice(sel, 1)[0]; receiver.hand.push(card); log(`电脑 交给 ${receiver.name}「${CARDS[card.key].name}」`); }
    p.handOver -= 1; render(); setTimeout(onDone, 400); return;
  }
  showHandSelectModal(idx, `交给对手 1 张牌（剩余 ${p.handOver} 次）`, (selIdx) => {
    if (selIdx >= 0) { const card = p.hand.splice(selIdx, 1)[0]; receiver.hand.push(card); log(`${p.name} 交给 ${receiver.name}「${CARDS[card.key].name}」`); }
    p.handOver -= 1; render(); onDone();
  }, idx);
}

function promptDiscard(p, count, onDone) {
  const idx = state.players.indexOf(p);
  if (state.mode === "ai" && idx === 1) {
    for (let k = 0; k < count; k++) { const sel = aiPickWorstCard(p.hand); if (sel >= 0) { const card = p.hand.splice(sel, 1)[0]; p.discard.push(card.key); onLoseCard(p, 1); } }
    render(); setTimeout(onDone, 400); return;
  }
  showMultiDiscardModal(p, count, `手牌超上限（${HAND_LIMIT}），弃 ${count} 张`, () => { onDone(); });
}

function playCard(index) {
  if (state.over || state.busy) return;
  if (state.counterWindow && state.counterWindow.active) return;
  if (state.mode === "ai" && state.current === 1) return;
  if (state.phase !== "play") { log(`当前阶段不能出牌`); return; }
  const p = state.players[state.current];

  if (p.cannotPlayMoreThisTurn) { log(`${p.name} 本回合无法再出牌`); return; }

  if (p.locked) {
    const wuxieIdx = p.hand.findIndex(c => c.key === "cleanse");
    if (wuxieIdx >= 0 && p.energy >= 1) {
      const wuxie = p.hand.splice(wuxieIdx, 1)[0];
      p.discard.push(wuxie.key);
      p.energy -= 1;
      log(`${p.name} 被封锁，用无懈可击解除（手牌 -1，能量 -1）`);
      floatText(state.current, "-1 手牌", "handmin");
      floatText(state.current, "能量 -1", "energy");
      useWuxieActive(p);
      lockBusy(600); render();
      return;
    }
    log(`${p.name} 被封锁，无法出牌`);
    return;
  }

  const cardObj = p.hand[index];
  if (!cardObj) return;
  if (cardObj.sealed) { log(`「${CARDS[cardObj.key].name}」被封印，无法使用`); return; }
  const def = CARDS[cardObj.key];
  const realCost = Math.max(0, def.cost - (cardObj.stolenCostReduce ? 1 : 0));
  if (p.energy < realCost) return;

  if (cardObj.key === "cleanse") {
    p.energy -= realCost;
    p.hand.splice(index, 1);
    p.discard.push(cardObj.key);
    p.cardsPlayedThisTurn++;
    lockBusy(600); playClick(1.1); pulseAvatar(state.current);
    const sideEl = document.getElementById("side" + state.current);
    const handEl = sideEl.querySelector(".hand-area");
    const cardEl = handEl.children[index];
    const targetEl = document.getElementById("side" + (1 - state.current)).querySelector(".avatar");
    flyCard(cardEl, targetEl, "cleanse", def.name);
    useWuxieActive(p);
    render();
    return;
  }

  let comboBonus = 0;
  if (def.type === "attack") comboBonus = Math.min(p.cardsPlayedThisTurn, 3);

  const sideEl = document.getElementById("side" + state.current);
  const handEl = sideEl.querySelector(".hand-area");
  const cardEl = handEl.children[index];
  const targetEl = document.getElementById("side" + (1 - state.current)).querySelector(".avatar");
  p.energy -= realCost;
  p.hand.splice(index, 1);
  p.discard.push(cardObj.key);
  if (p.role === "zhangsien") addRes(p, 1);
  if (p.role === "lubiao") addRes(p, 1);
  p.cardsPlayedThisTurn++;
  if (def.type === "attack") {
    p.attackPlayedThisTurn = true;
    if (p.role === "gu" && p.resource > 0) { log(`${p.name} 出攻击牌，伪装清零`); p.resource = 0; }
  }
  const oppP = state.players[1 - state.current];
  if (oppP.role === "zhiban") { addRes(oppP, 1); log(`${oppP.name} 抓到破绽，论据 +1`); }
  lockBusy(700); playClick(0.85); pulseAvatar(state.current);
  flyCard(cardEl, targetEl, def.type, def.name);
  log(`${p.name} 使用「${def.name}」${comboBonus > 0 ? ` (连击 +${comboBonus})` : ""}`);
  render();

  let executed = false;
  const execFn = () => {
    if (executed) return;
    executed = true;
    const p2 = state.players[state.current]; const opp2 = state.players[1 - state.current];
    if (cardObj.key === "steal" && opp2.hand.length > 0) {
      showHandSelectModal(1 - state.current, "偷取 · 选择要偷走的牌", (selIdx) => {
        if (selIdx >= 0) {
          const stolen = opp2.hand.splice(selIdx, 1)[0];
          if (p2.hand.length < HAND_LIMIT + 6) { stolen.isNew = true; p2.hand.push(stolen); log(`${p2.name} 偷走「${CARDS[stolen.key].name}」`); onLoseCard(opp2, 1); }
          else { opp2.discard.push(stolen.key); onLoseCard(opp2, 1); }
        }
        render();
      }, state.current); return;
    }
    execCardEffect(state.current, cardObj.key, comboBonus, cardObj);
    render();
  };

  setTimeout(() => { tryCounter(state.current, cardObj, execFn); }, 280);
}

function execCardEffect(playerIdx, cardKey, comboBonus = 0, cardObj = null) {
  const p = state.players[playerIdx]; const oppIdx = 1 - playerIdx; const opp = state.players[oppIdx];
  const def = CARDS[cardKey];
  const oppHandLen = normalHand(opp).length; const oppShield = totalShield(opp);
  const isStolenDamage = cardObj && cardObj.stolenDamage;
  switch (cardKey) {
    case "quick": case "strike": { let base = def.damage + comboBonus; if (isStolenDamage) base = Math.floor(def.damage / 2) + comboBonus; dealDamage(playerIdx, oppIdx, base, { isAttack: true, isAttackCard: true }); break; }
    case "block": gainShield(p, def.shield); break;
    case "heal": heal(p, def.heal); break;
    case "insight": draw(p, 2, true); log(`${p.name} 抽 2 张牌`); break;
    case "charge": p.energy = Math.min(MAX_ENERGY, p.energy + 1); log(`${p.name} 能量 +1`); break;
    case "lockdown": opp.locked = true; opp.noSkill = true; log(`${opp.name} 下回合不能出牌也不能用技能`); break;
    case "drain": opp.energy = Math.max(0, opp.energy - 1); opp.noEnergyGain = true; log(`${opp.name} 能量 -1，下回合不获得能量`); break;
    case "trap": p.trap = 4; p.trapTurns = TRAP_TURNS; log(`${p.name} 布置了陷阱（持续 ${TRAP_TURNS} 回合）`); break;
    case "steal":
      if (normalHand(opp).length > 0) {
        const idxs = opp.hand.map((c, i) => c.isExtra ? -1 : i).filter(i => i >= 0);
        if (idxs.length > 0) { const i = idxs[Math.floor(Math.random() * idxs.length)]; const stolen = opp.hand.splice(i, 1)[0]; stolen.isNew = true; p.hand.push(stolen); onLoseCard(opp, 1); log(`${p.name} 偷走 1 张手牌`); }
      } break;
    case "pierce":
      if (oppShield > 0) { dealDamage(playerIdx, oppIdx, 8, { isAttack: true, isAttackCard: true, ignoreShield: true }); log(`破防：无视护盾，8 伤`); }
      else dealDamage(playerIdx, oppIdx, 5, { isAttack: true, isAttackCard: true }); break;
    case "exploit":
      if (oppHandLen >= 4) { dealDamage(playerIdx, oppIdx, 5, { isAttack: true, isAttackCard: true }); log(`趁虚：对手手牌多，5 伤`); }
      else dealDamage(playerIdx, oppIdx, 3, { isAttack: true, isAttackCard: true }); break;
    case "bloodlust":
      dealDamage(playerIdx, oppIdx, 5, { isAttack: true, isAttackCard: true });
      if (state.over) return;
      p.hp = Math.max(0, p.hp - 2); log(`${p.name} 自损 2`); floatText(playerIdx, "-2", "damage");
      if (p.hp <= 0 && !tryEmergencyHeal(p)) { endGame(oppIdx); return; } break;
    case "overdraft": draw(p, 2, true); p.hp = Math.max(0, p.hp - 2); log(`${p.name} 透支：抽 2 张，自损 2`); floatText(playerIdx, "-2", "damage"); if (p.hp <= 0 && !tryEmergencyHeal(p)) { endGame(oppIdx); return; } break;
    case "ambush": p.pending.push({ type: "ambush", turns: 2 }); log(`${p.name} 布下埋伏，2 回合后爆发（8 伤）`); break;
    case "curse": opp.pending.push({ type: "curse", turns: 2, from: playerIdx }); log(`${opp.name} 被诅咒，2 回合后爆发`); break;
    case "buildup": {
      const extra = p.cardsPlayedThisTurn === 1 ? 3 : 0;
      dealDamage(playerIdx, oppIdx, 3 + extra, { isAttack: true, isAttackCard: true });
      if (extra > 0) log(`蓄势：本回合首张牌，额外 +3`);
      break;
    }
  }
}

function getSkillCd(role) { return role.skill.specialCd || SKILL_CD; }

function checkSkillReady(p) {
  const role = ROLES[p.role];
  if (p.skillCd > 0 || p.frozen || p.noSkill) return false;
  if (p.role === "lujiancheng") {
    const opp = state.players[1 - state.players.indexOf(p)];
    const maxN = Math.min(normalHand(opp).length, p.energy, p.resource);
    return maxN >= 1;
  }
  const sk = role.skill;
  if (p.energy >= sk.cost) {
    if (sk.resCost === "all") return p.resource >= 1;
    return p.resource >= sk.resCost;
  }
  return false;
}

function useSkill() {
  if (state.over || state.busy) return;
  if (state.counterWindow && state.counterWindow.active) return;
  if (state.mode === "ai" && state.current === 1) return;
  const p = state.players[state.current]; const role = ROLES[p.role]; const sk = role.skill;
  if (!checkSkillReady(p)) return;

  if (p.role === "lujiancheng") {
    const opp = state.players[1 - state.current];
    const maxN = Math.min(normalHand(opp).length, p.energy, p.resource);
    showNSelectModal(p, "夺牌", maxN, (n) => { if (n >= 1) doLujianchengSkill(p, n); });
    return;
  }
  if (p.role === "zhangxiang") { doZhangxiangSkill(p); return; }
  if (p.role === "zhiyuchen") { doZhiyuchenSkill(p); return; }
  if (p.role === "shuangwu") { doShuangwuSkill(p); return; }

  let resCost = sk.resCost === "all" ? p.resource : sk.resCost;
  p.energy -= sk.cost; subRes(p, resCost); p.skillCd = getSkillCd(role);
  const oppIdx = 1 - state.current; const opp = state.players[oppIdx];
  if (opp.role === "zhiban") addRes(opp, 1);
  lockBusy(1000); playClick(1.3); pulseAvatar(state.current);
  banner(sk.name, role.color);
  log(`${p.name} 使用技能「${sk.name}」`);
  render();
  setTimeout(() => {
    switch (p.role) {
      case "zhangsien": p.nextAtkDouble = true; p.zeroResAtEndTurn = true; log(`${p.name} 号令：下一张攻击牌伤害翻倍`); break;
      case "yangkaidong": { const lostHp = p.maxHp - p.hp; const dmg = Math.floor(lostHp / 2); if (dmg > 0) dealDamage(state.current, oppIdx, dmg, { isAttack: true, ignoreShield: true }); log(`${p.name} 狂血：造成 ${dmg} 伤害`); break; }
      case "lubiao": p.damageHalfThisTurn = true; log(`${p.name} 精神防御：本回合受伤减半`); break;
      case "rou": { const marks = (opp.rouMarks || 0); const dmg = 2 + resCost + marks * 2; dealDamage(state.current, oppIdx, dmg, { isAttack: true }); break; }
      case "xi": {
        const se = Math.min(2, opp.energy); opp.energy -= se; p.energy = Math.min(MAX_ENERGY, p.energy + se);
        const idxs = opp.hand.map((c, i) => c.isExtra ? -1 : i).filter(i => i >= 0);
        if (idxs.length > 0) { const i = idxs[Math.floor(Math.random() * idxs.length)]; const stolen = opp.hand.splice(i, 1)[0]; stolen.isNew = true; stolen.stolenCostReduce = true; if (CARDS[stolen.key].type === "attack") stolen.stolenDamage = true; p.hand.push(stolen); onLoseCard(opp, 1); }
        break;
      }
      case "gu": {
        let dmg = 0, healAmt = 0;
        if (resCost >= 3) { dmg = 7; healAmt = 5; }
        else if (resCost === 2) { dmg = 4; healAmt = 3; }
        else if (resCost === 1) { dmg = 2; healAmt = 1; }
        if (dmg > 0) { dealDamage(state.current, oppIdx, dmg, { isAttack: true }); heal(p, healAmt); }
        opp.firstAtkDebuff = (opp.firstAtkDebuff || 0) + 2;
        p.cannotPlayMoreThisTurn = true;
        log(`伪装 ${resCost} 层：${dmg} 伤 + ${healAmt} 回，本回合无法再出牌`);
        break;
      }
      case "zhiban": p.damageHalfThisTurn = true; p.drawOnHurtThisTurn = true; log(`${p.name} 反驳：受伤减半，每次受伤抽 1`); break;
    }
    render();
  }, 350);
}

function doZhangxiangSkill(p) {
  const idx = state.players.indexOf(p);
  const opp = state.players[1 - idx];
  if (normalHand(opp).length === 0) { log(`对手没有手牌可封`); return; }
  showHandSelectModal(1 - idx, "推演 · 选择要封印的牌", (selIdx) => {
    const sk = ROLES[p.role].skill;
    if (p.energy < sk.cost || p.resource < sk.resCost || p.skillCd > 0) { log(`条件不足`); render(); return; }
    p.energy -= sk.cost; subRes(p, sk.resCost); p.skillCd = SKILL_CD;
    const oppP = state.players[1 - idx];
    if (oppP.role === "zhiban") addRes(oppP, 1);
    if (selIdx >= 0) { oppP.hand[selIdx].sealed = true; log(`${p.name} 推演，封印了「${CARDS[oppP.hand[selIdx].key].name}」`); }
    draw(p, 1, true);
    lockBusy(600); playClick(1.3); pulseAvatar(idx);
    banner(sk.name, ROLES[p.role].color);
    render();
  }, idx);
}

function doZhiyuchenSkill(p) {
  const idx = state.players.indexOf(p);
  const shieldAmt = p.resource;
  if (shieldAmt < 1) return;
  const choices = [
    { title: "转化伤害", desc: `造成 ${shieldAmt} 点伤害` },
    { title: "转化能量", desc: shieldAmt >= 2 ? `获得 ${Math.min(3, Math.floor(shieldAmt / 2))} 能量` : `护盾不足 2`, disabled: shieldAmt < 2 }
  ];
  showChoiceModal(p, "转化 · 选择方向", choices, (i) => {
    const sk = ROLES[p.role].skill;
    if (p.energy < sk.cost || p.skillCd > 0) { log(`能量不足或冷却中`); render(); return; }
    p.energy -= sk.cost; p.skillCd = SKILL_CD;
    lockBusy(900); playClick(1.3); pulseAvatar(idx);
    if (i === 0) { p.resource = 0; dealDamage(idx, 1 - idx, shieldAmt, { isAttack: true }); log(`${p.name} 转化 ${shieldAmt} 护盾 → ${shieldAmt} 伤害`); }
    else { const gain = Math.min(3, Math.floor(shieldAmt / 2)); p.resource = 0; p.energy = Math.min(MAX_ENERGY, p.energy + gain); log(`${p.name} 转化 ${shieldAmt} 护盾 → ${gain} 能量`); }
    render();
  });
}

function doShuangwuSkill(p) {
  const idx = state.players.indexOf(p);
  const sk = ROLES[p.role].skill;
  if (p.energy < sk.cost || p.skillCd > 0) return;
  p.energy -= sk.cost; p.skillCd = getSkillCd(ROLES[p.role]);
  lockBusy(600); playClick(1.3); pulseAvatar(idx);
  banner(sk.name, ROLES[p.role].color);
  useWuxieActive(p);
  render();
}

function doLujianchengSkill(p, n) {
  const idx = state.players.indexOf(p); const opp = state.players[1 - idx];
  p.energy -= n; subRes(p, n); p.skillCd = SKILL_CD;
  lockBusy(1500); playClick(1.3); pulseAvatar(idx);
  banner(ROLES[p.role].skill.name, ROLES[p.role].color);
  log(`${p.name} 夺牌：消耗 ${n} 能量 + ${n} 风度`);
  render();
  setTimeout(() => { promptOpponentDiscard(opp, n, () => { render(); unlockBusy(); }); }, 400);
}

function doShuangwuLend(p) {
  if (p.lendUsed) { log(`本回合已经交过牌`); return; }
  if (normalHand(p).length === 0) { log(`没有手牌可交`); render(); return; }
  if (p.resource >= ROLES[p.role].resource.max) { log(`精力已满`); render(); return; }
  showLendModal(p, () => {});
}

function promptOpponentDiscard(opp, count, onDone) {
  const oppIdx = state.players.indexOf(opp);
  const isAI = state.mode === "ai" && oppIdx === 1;
  const avail = Math.min(count, normalHand(opp).length);
  if (avail <= 0) { log(`${opp.name} 没有手牌可弃`); onDone(); return; }
  if (isAI) {
    for (let k = 0; k < avail; k++) { const sel = aiPickWorstCard(opp.hand); if (sel >= 0) { const card = opp.hand.splice(sel, 1)[0]; opp.discard.push(card.key); onLoseCard(opp, 1); } }
    log(`电脑 弃掉 ${avail} 张牌`); render(); setTimeout(onDone, 400); return;
  }
  showMultiDiscardModal(opp, avail, `${opp.name} 弃掉 ${avail} 张牌`, () => { log(`${opp.name} 弃掉 ${avail} 张牌`); onDone(); });
}

function checkUltReady(p) {
  const role = ROLES[p.role];
  if (p.role === "lujiancheng") return p.energy >= 4 && p.resource >= 6;
  if (p.role === "zhiyuchen") return p.energy >= 3 && p.resource >= 3;
  if (p.role === "zhangxiang") return p.energy >= 3 && p.resource >= 3;
  if (p.role === "yangkaidong") return p.energy >= 3 && p.resource >= 5 && p.hp >= 2;
  if (p.role === "zhangsien") return p.energy >= 3 && p.resource >= 1;
  if (p.role === "gu") return p.energy >= 3 && p.resource >= 3;
  if (p.role === "zhiban") return p.energy >= 3 && p.resource >= 2;
  if (p.role === "shuangwu") return p.energy >= 3 && p.resource >= 4;
  return p.energy >= 3 && p.resource >= Math.ceil(role.resource.max / 2);
}

function useUltimate() {
  if (state.over || state.busy) return;
  if (state.counterWindow && state.counterWindow.active) return;
  if (state.mode === "ai" && state.current === 1) return;
  const p = state.players[state.current]; const role = ROLES[p.role];
  if (!checkUltReady(p)) return;
  const savedRes = p.resource;
  if (p.role === "lujiancheng") { p.energy -= 4; p.resource = 0; }
  else if (p.role === "zhiyuchen") { p.energy -= 3; }
  else if (p.role === "shuangwu") { p.energy -= 2; p.resource -= 4; }
  else { p.energy -= 3; p.resource = 0; }
  p.combo = 0;
  if (p.role === "zhiban") doZhibanUlt(p, savedRes);
  else if (p.role === "yangkaidong") doYangkaidongUlt(p);
  else if (p.role === "shuangwu") doShuangwuUlt(p);
  else {
    lockBusy(1200); playClick(1.6); pulseAvatar(state.current);
    banner("终极 · " + role.ultimate.name, "#fbbf24");
    log(`${p.name} 发动终极技「${role.ultimate.name}」`);
    render();
    setTimeout(() => { execUltimate(state.current, savedRes); render(); }, 500);
  }
}

function doShuangwuUlt(p) {
  const idx = state.players.indexOf(p);
  const opp = state.players[1 - idx];
  lockBusy(1200); playClick(1.6); pulseAvatar(idx);
  banner("终极 · 暴力炸精", "#fbbf24");
  const pNormal = p.hand.filter(c => !c.isExtra);
  const oppNormal = opp.hand.filter(c => !c.isExtra);
  const pExtra = p.hand.filter(c => c.isExtra);
  const oppExtra = opp.hand.filter(c => c.isExtra);
  pNormal.forEach(c => { c.isNew = true; c.born = state.turnCount; });
  oppNormal.forEach(c => { c.isNew = true; c.born = state.turnCount; });
  p.hand = oppNormal.concat(pExtra);
  opp.hand = pNormal.concat(oppExtra);
  log(`${p.name} 交换双方普通手牌（你 ${pNormal.length} 张 ⇄ 对手 ${oppNormal.length} 张）`);
  render();
}

function doZhibanUlt(p, resCost) {
  const idx = state.players.indexOf(p); const opp = state.players[1 - idx];
  lockBusy(1200); playClick(1.6); pulseAvatar(idx);
  banner("终极 · 诡辩", "#fbbf24");
  const dmg = resCost * 2;
  setTimeout(() => {
    dealDamage(idx, 1 - idx, dmg, { isAttack: true });
    if (!state.over) { opp.energy = Math.max(0, opp.energy - 2); log(`${opp.name} 下回合能量 -2`); }
    render();
  }, 500);
}

function doYangkaidongUlt(p) {
  const idx = state.players.indexOf(p);
  const half = Math.floor(p.hp / 2);
  const dmg = Math.floor(half * 1.5);
  lockBusy(1200); playClick(1.6); pulseAvatar(idx);
  banner("终极 · 血战", "#fbbf24");
  p.hp -= half; floatText(idx, "-" + half, "damage");
  log(`${p.name} 血战：自损 ${half} 生命，造成 ${dmg} 伤害（1.5 倍）`);
  setTimeout(() => {
    dealDamage(idx, 1 - idx, dmg, { isAttack: true, ignoreShield: true });
    if (p.hp <= 0 && !tryEmergencyHeal(p)) { endGame(1 - idx); return; }
    render();
  }, 500);
}

function execUltimate(idx, savedRes) {
  const p = state.players[idx]; const oppIdx = 1 - idx; const opp = state.players[oppIdx];
  switch (p.role) {
    case "zhangxiang": {
      const idxs = opp.hand.map((c, i) => c.isExtra ? -1 : i).filter(i => i >= 0);
      const sorted = idxs.sort((a, b) => CARDS[opp.hand[b].key].cost - CARDS[opp.hand[a].key].cost);
      sorted.slice(0, 2).forEach(i => { opp.hand[i].sealed = true; });
      dealDamage(idx, oppIdx, 5, { isAttack: true }); draw(p, 2, true); break;
    }
    case "zhangsien": dealDamage(idx, oppIdx, 5 + savedRes * 2, { isAttack: true }); break;
    case "zhiyuchen": p.zhiyuchenBuff = 3; gainShield(p, 1); heal(p, 2); p.energy = Math.min(MAX_ENERGY, p.energy + 1); draw(p, 1, true); break;
    case "lubiao": heal(p, 8); p.damageHalfThisTurn = true; break;
    case "rou": { const marks = opp.rouMarks || 0; const dmg = marks > 0 ? 12 : 8; dealDamage(idx, oppIdx, dmg, { isAttack: true, ignoreShield: true }); opp.rouMarks = 0; break; }
    case "xi": opp.energy = 0; dealDamage(idx, oppIdx, 8, { isAttack: true }); heal(p, 3); break;
    case "gu": dealDamage(idx, oppIdx, 10, { isAttack: true }); heal(p, 8); break;
    case "lujiancheng": { const stolenCards = opp.hand.slice(); opp.hand = []; stolenCards.forEach(c => { c.isExtra = true; c.isNew = true; p.hand.push(c); }); opp.handOver = (opp.handOver || 0) + 2; onLoseCard(opp, stolenCards.length); break; }
  }
}

function endGame(winnerIdx) {
  state.over = true; state.phase = "idle";
  const w = state.players[winnerIdx];
  log(`🏆 ${w.name} 获胜！`);
  if (state.counterWindow) { clearTimeout(state.counterWindow.timer); state.counterWindow = null; }
  clearTimeout(state._busyTimer); state._busyTimer = null; state.busy = false;
  hideTooltip(); closeModal();
  try { render(); } catch (e) { console.error(e); }
  setTimeout(() => {
    const b = document.createElement("div"); b.className = "win-banner";
    b.innerHTML = `<h2>${w.name} 获胜</h2><button class="btn" style="padding:14px 40px;font-size:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none">再来一局</button>`;
    onTap(b.querySelector("button"), () => { playClick(); location.reload(); });
    document.body.appendChild(b);
  }, 500);
}

const PHASE_NAMES = { idle: "", start: "回合开始", draw: "摸牌阶段", play: "出牌阶段", discard: "弃牌阶段", end: "回合结束" };

function renderSide(i) {
  const p = state.players[i]; const el = document.getElementById("side" + i);
  const role = ROLES[p.role]; const r = role.resource;
  el.style.setProperty("--c", role.color);
  el.classList.toggle("active", state.current === i && !state.over);

  const counterActive = !!(state.counterWindow && state.counterWindow.active);
  const isResponsePlayer = counterActive && state.counterWindow.responsePlayer === i;
  const hasEnergyForCounter = p.energy >= 1;
  el.classList.toggle("counter-glow", isResponsePlayer && hasEnergyForCounter);
  if (isResponsePlayer && !hasEnergyForCounter) el.classList.add("counter-glow", "no-energy");
  else el.classList.remove("no-energy");

  const isCurrent = state.current === i && !state.over;
  const isPlayPhase = isCurrent && state.phase === "play";
  const ultReady = checkUltReady(p) && isPlayPhase && !counterActive;
  const shieldAmt = totalShield(p);
  const skReady = checkSkillReady(p);
  const skDis = !isPlayPhase || !skReady || p.cannotPlayMoreThisTurn || counterActive;
  const skillOnCd = p.skillCd > 0;

  const winfo = getWuxieInfo(i);
  const zinfo = getZhaobiInfo(i);
  const showZhaobiCounter = counterActive && isResponsePlayer && zinfo.canUse;

  let resCostLabel;
  if (p.role === "lujiancheng") resCostLabel = "n能量+n" + r.name;
  else if (role.skill.cost === 0) resCostLabel = r.name + "×" + role.skill.resCost;
  else resCostLabel = role.skill.resCost === "all" ? "全" + r.name : role.skill.resCost + r.name;
  const ultResCost = p.role === "lujiancheng" ? 6 : (p.role === "shuangwu" ? 4 : (p.role === "zhiyuchen" ? 3 : (p.role === "zhangxiang" ? 3 : (p.role === "zhangsien" ? "任意士气" : (p.role === "zhiban" ? 2 : Math.ceil(r.max / 2))))));
  const ultEnergyCost = p.role === "lujiancheng" ? 4 : (p.role === "shuangwu" ? 2 : 3);
  const ultResLabel = p.role === "zhiyuchen" ? "护盾" : (p.role === "zhangsien" ? "" : (p.role === "zhiban" ? "论据" : r.name));
  const resRow = p.role === "zhiyuchen" ? "" : `<div class="stats-row"><div class="stat-group"><span class="res-name">${r.icon} ${r.name}</span><div class="res-pips">${Array.from({ length: r.max }, (_, k) => `<span class="rpip ${k < p.resource ? "on" : ""}"></span>`).join("")}</div><span class="stat-num" style="color:${role.color}">${p.resource}</span><button class="info-btn" data-info="${i}">?</button></div></div>`;

  const skillCostDisplay = skillOnCd ? "CD " + p.skillCd : (role.skill.cost === 0 ? resCostLabel : `${role.skill.cost}能量 · ${resCostLabel}`);
  const isShuangwu = p.role === "shuangwu";
  const lendDis = !isPlayPhase || p.lendUsed || p.resource >= r.max || normalHand(p).length === 0 || counterActive || p.cannotPlayMoreThisTurn;

  const handOverLimit = p.hand.length > HAND_LIMIT;

  el.innerHTML = `
    <div class="hud">
      <div class="hud-top">
        <div class="avatar">${role.short}</div>
        <div class="name-hp">
          <div class="name-line">
            <span class="pname">${p.name}</span>
            <span class="prole">${role.title}</span>
            <span class="handcount ${handOverLimit ? "over" : ""}">手牌 ${p.hand.length}${handOverLimit ? "/" + HAND_LIMIT : ""}</span>
          </div>
          <div class="hp-bar"><div class="hp-fill" style="width:${p.hp / p.maxHp * 100}%"></div><div class="hp-text">${p.hp} / ${p.maxHp}</div></div>
        </div>
      </div>
      <div class="stats-line">
        <div class="stats-row">
          <div class="stat-group"><span class="stat-num shield-val">🛡 ${shieldAmt}</span></div>
          <div class="stat-group energy"><div class="energy-pips">${Array.from({ length: MAX_ENERGY }, (_, k) => `<span class="pip ${k < p.energy ? "on" : ""}"></span>`).join("")}</div><span class="stat-num energy-val">${p.energy}/${MAX_ENERGY}</span></div>
        </div>
        ${resRow}
      </div>
    </div>
    <div class="status-line"></div>
    <div class="actions-line ${isShuangwu ? "shuangwu" : ""}">
      ${isShuangwu ? `
        <button class="action-btn lend-btn ${lendDis ? "disabled-style" : ""}" id="lendBtn${i}">
          <div class="btn-icon">💪</div>
          <div class="btn-content">
            <div class="btn-title"><span>交牌</span><span class="cost-badge" style="background:rgba(236,72,153,.15);color:#ec4899;border-color:rgba(236,72,153,.35)">+N 精力</span></div>
            <div class="btn-desc">交任意张手牌（每张 +1 精力，每回合限 1 次）</div>
          </div>
        </button>
      ` : ""}
      <button class="action-btn skill-btn ${skDis ? "disabled-style" : ""} ${showZhaobiCounter ? "zaobi-counter" : ""}" id="skBtn${i}">
        <div class="btn-icon">⚡</div>
        <div class="btn-content">
          <div class="btn-title"><span>${role.skill.name}${showZhaobiCounter ? " ✨反制" : ""}</span><span class="cost-badge">${skillCostDisplay}</span></div>
          <div class="btn-desc">${role.skill.desc}</div>
        </div>
      </button>
      <button class="action-btn ult-btn ${ultReady ? "ready" : ""} ${!ultReady ? "disabled-style" : ""}">
        <div class="btn-icon">★</div>
        <div class="btn-content">
          <div class="btn-title"><span>${role.ultimate.name}</span><span class="cost-badge" style="background:rgba(251,191,36,0.2);color:#fbbf24">${ultEnergyCost} · ${ultResCost}${ultResLabel}</span></div>
          <div class="btn-desc">${role.ultimate.desc}</div>
        </div>
      </button>
    </div>
    <div class="end-turn-row"><button class="end-turn-btn" id="endBtn${i}">${isPlayPhase ? "结束出牌 · 进入弃牌" : "结 束 回 合"}</button></div>
    <div class="hand-area"></div>
  `;

  const sts = [];
  if (counterActive && state.counterWindow.responsePlayer === i) {
    if (winfo.hasEnergy && winfo.has) {
      sts.push({ text: `⚡ 反制窗口！点击无懈可击${zinfo.canUse ? " / 扎啤" : ""}`, type: "counter" });
    } else if (zinfo.canUse) {
      sts.push({ text: `⚡ 可用扎啤反制`, type: "counter" });
    } else if (winfo.has && !winfo.hasEnergy) {
      sts.push({ text: `⚠ 能量不足（${p.energy}/1），无法反制`, type: "counter-warn" });
    }
  }
  if (p.cardsPlayedThisTurn > 0) sts.push({ text: `连击 ${p.cardsPlayedThisTurn}`, type: "combo" });
  if (p.pendingAtkBuff) sts.push({ text: `下次攻击+${p.pendingAtkBuff}`, type: "buff" });
  if (p.nextAtkDouble) sts.push({ text: "下张攻击翻倍", type: "buff" });
  if (p.doubleDamage) sts.push({ text: "伤害翻倍", type: "buff" });
  if (p.energyBonus) sts.push({ text: `下回合能量${p.energyBonus}`, type: "debuff" });
  if (skillOnCd) sts.push({ text: `技能CD ${p.skillCd}`, type: "debuff" });
  if (p.cannotPlayMoreThisTurn) sts.push({ text: "本回合不能再出牌", type: "debuff" });
  if (p.role === "zhangsien" && p.resource >= 5) sts.push({ text: "士气巅峰", type: "buff" });
  else if (p.role === "zhangsien" && p.resource >= 3) sts.push({ text: "士气旺盛", type: "buff" });
  if (p.role === "yangkaidong" && p.resource >= 5) sts.push({ text: "怒气护体", type: "buff" });
  if (p.role === "yangkaidong" && p.hp / p.maxHp <= 0.3) sts.push({ text: "血怒+5", type: "buff" });
  else if (p.role === "yangkaidong" && p.hp / p.maxHp <= 0.5) sts.push({ text: "血怒+2", type: "buff" });
  if (p.role === "zhiban" && p.resource >= 3) sts.push({ text: "论据充分", type: "buff" });
  if (p.trap > 0) sts.push({ text: `陷阱 ${p.trap}（${p.trapTurns}回合）`, type: "buff" });
  if (p.damageHalfThisTurn) sts.push({ text: "减伤中", type: "buff" });
  if (p.drawOnHurtThisTurn) sts.push({ text: "受伤抽牌", type: "buff" });
  if (p.firstAtkDebuff > 0) sts.push({ text: `首攻-${p.firstAtkDebuff}`, type: "debuff" });
  if (p.locked) sts.push({ text: "出牌封锁", type: "debuff" });
  if (p.noSkill) sts.push({ text: "技能封锁", type: "debuff" });
  if (p.frozen) sts.push({ text: "罚站中", type: "debuff" });
  if (p.noEnergyGain) sts.push({ text: "下回合无能量", type: "debuff" });
  if (p.rouMarks > 0) sts.push({ text: `被记仇 ${p.rouMarks} 层`, type: "debuff" });
  if (p.handOver > 0) sts.push({ text: `需交牌 ${p.handOver} 次`, type: "debuff" });
  if (p.zhiyuchenBuff > 0) sts.push({ text: `守护领域 ${p.zhiyuchenBuff} 回合`, type: "buff" });
  if (p.emergencyHealUsed) sts.push({ text: "濒死回血已用", type: "debuff" });
  if (isShuangwu && p.lendUsed) sts.push({ text: "已交牌", type: "debuff" });
  if (isCurrent && state.phase === "discard") sts.push({ text: `弃牌阶段：需弃 ${Math.max(0, p.hand.length - HAND_LIMIT)} 张`, type: "debuff" });
  const sealedOnMe = p.hand.filter(c => c.sealed).length;
  if (sealedOnMe > 0) sts.push({ text: `被封印 ${sealedOnMe} 张`, type: "debuff" });

  p.pending.forEach(e => {
    if (e.type === "ambush") sts.push({ text: `埋伏 ${e.turns} 回合`, type: "pending" });
    if (e.type === "curse") sts.push({ text: `诅咒 ${e.turns} 回合`, type: "debuff" });
  });
  const opp = state.players[1 - i];
  opp.pending.forEach(e => {
    if (e.type === "ambush") sts.push({ text: `⚠ 对手埋伏 ${e.turns} 回合`, type: "debuff" });
    if (e.type === "curse") sts.push({ text: `对手被诅咒 ${e.turns} 回合`, type: "buff" });
  });

  el.querySelector(".status-line").innerHTML = sts.map(s => `<span class="st-tag ${s.type}">${s.text}</span>`).join("");

  const infoBtn = el.querySelector(".info-btn");
  if (infoBtn) onTap(infoBtn, (e) => { e.stopPropagation(); playClick(); showResourceModal(i); });

  const lendBtn = el.querySelector(`#lendBtn${i}`);
  if (lendBtn && !lendDis) onTap(lendBtn, () => { playClick(); doShuangwuLend(p); });

  const skBtn = el.querySelector(`#skBtn${i}`);
  if (showZhaobiCounter) {
    // 扎啤反制优先
    bindAction(skBtn, role.color, "⚡", role.skill.name + " ✨反制", `${role.skill.cost}能量`, role.skill.desc, () => { playClick(1.4); doCounterFromWindow("zhaobi"); });
  } else if (i === state.current && isPlayPhase) {
    if (!skDis) bindAction(skBtn, role.color, "⚡", role.skill.name, skillCostDisplay, role.skill.desc, () => { playClick(); useSkill(); });
    else bindAction(skBtn, role.color, "⚡", role.skill.name, skillCostDisplay, role.skill.desc + "<br><br><span style='color:#6b7a94'>不可用：" + (counterActive ? "反制中" : skillOnCd ? "冷却中（剩余 " + p.skillCd + " 回合）" : p.cannotPlayMoreThisTurn ? "本回合不能再操作" : p.frozen ? "罚站" : p.noSkill ? "被封锁" : "能量或资源不足") + "</span>", () => {});
    const ultBtn = el.querySelector(".ult-btn");
    const ultDesc = role.ultimate.desc + (ultReady ? "" : "<br><br><span style='color:#6b7a94'>需要 " + ultEnergyCost + " 能量与 " + ultResCost + " " + ultResLabel + "</span>");
    if (ultReady) bindAction(ultBtn, "#fbbf24", "★", "终极 · " + role.ultimate.name, `${ultEnergyCost} 能量 · ${ultResCost}${ultResLabel}`, role.ultimate.desc, () => { playClick(); useUltimate(); });
    else bindAction(ultBtn, "#fbbf24", "★", "终极 · " + role.ultimate.name, `${ultEnergyCost} 能量 · ${ultResCost}${ultResLabel}`, ultDesc, () => {});
  }

  const endBtn = el.querySelector(`#endBtn${i}`);
  endBtn.disabled = !isPlayPhase || state.over || state.busy || counterActive || (state.mode === "ai" && i === 1);
  if (!endBtn.disabled) onTap(endBtn, () => { playClick(); if (i === state.current && !state.busy) endTurn(); });

  const handEl = el.querySelector(".hand-area");
  if (p.hand.length === 0) handEl.innerHTML = `<div class="hand-empty">${isCurrent ? "没有手牌" : "等待中"}</div>`;
  else {
    const revealAll = counterActive;
    p.hand.forEach((cardObj, idx) => {
      const def = CARDS[cardObj.key];
      const btn = document.createElement("button");
      btn.className = "card " + def.type;
      if (cardObj.isExtra) btn.classList.add("extra-card");
      if (cardObj.isNew) btn.classList.add("new-card");
      if (cardObj.sealed) btn.classList.add("sealed-card");
      if (cardObj.stolenCostReduce) btn.classList.add("stolen-card");

      const showFace = isCurrent || revealAll;
      if (!showFace) {
        btn.classList.add("back");
      } else {
        const realCost = Math.max(0, def.cost - (cardObj.stolenCostReduce ? 1 : 0));
        btn.innerHTML = `<div class="card-cost">${realCost}</div><div class="card-name">${def.name}</div><div class="card-type">${def.type}</div><div class="card-desc">${def.desc}</div>`;

        if (revealAll) {
          if (isResponsePlayer && cardObj.key === "cleanse" && !cardObj.sealed) {
            if (winfo.hasEnergy) {
              btn.classList.add("counter-active");
              btn.disabled = false;
              onTap(btn, () => { playClick(1.4); doCounterFromWindow("wuxie"); });
            } else {
              btn.classList.add("no-energy-counter");
              btn.disabled = true;
            }
          } else {
            btn.classList.add("dim-card");
            btn.disabled = true;
          }
        } else if (isCurrent) {
          const wuxieUnlock = p.locked && cardObj.key === "cleanse" && p.energy >= 1;
          btn.disabled = p.energy < realCost || state.busy || p.frozen || (p.locked && !wuxieUnlock) || cardObj.sealed || p.cannotPlayMoreThisTurn || state.phase !== "play";
          if (!btn.disabled) onTap(btn, () => { playClick(); playCard(idx); });
        } else {
          btn.disabled = true;
          btn.style.opacity = "0.6";
        }
      }
      handEl.appendChild(btn);
    });
  }
  setTimeout(() => { p.hand.forEach(c => c.isNew = false); }, 600);
}

function renderLog() { const el = document.getElementById("log"); el.innerHTML = state.logs.slice(-12).map(s => `<div>${s}</div>`).join(""); el.scrollTop = el.scrollHeight; }
function render() {
  if (!state.players.length) return;
  const p = state.players[state.current];
  document.getElementById("turnLabel").textContent = state.over ? "对战结束" : `回合 · ${p.name} · 能量 ${p.energy}/${MAX_ENERGY}`;
  const phaseLabel = document.getElementById("phaseLabel");
  if (phaseLabel) {
    if (state.phase && state.phase !== "idle") {
      phaseLabel.textContent = PHASE_NAMES[state.phase] || "";
      phaseLabel.hidden = false;
    } else {
      phaseLabel.hidden = true;
    }
  }
  renderSide(0); renderSide(1); renderLog();
}

function aiPickBestCard(hand) {
  if (hand.length === 0) return -1;
  let best = 0, bestScore = -1;
  hand.forEach((c, i) => {
    const def = CARDS[c.key];
    let score = def.cost * 10;
    if (def.type === "attack") score += 8;
    if (def.type === "control" || def.type === "steal") score += 6;
    if (def.type === "heal") score += 4;
    if (c.isExtra) score -= 20;
    if (c.sealed) score -= 30;
    if (score > bestScore) { bestScore = score; best = i; }
  });
  return best;
}
function aiPickWorstCard(hand) {
  if (hand.length === 0) return -1;
  let worst = 0, worstScore = 99999;
  hand.forEach((c, i) => {
    if (c.isExtra) return;
    const def = CARDS[c.key];
    let score = def.cost * 10;
    if (def.type === "attack") score += 8;
    if (def.type === "control" || def.type === "steal") score += 6;
    if (def.type === "heal") score += 4;
    if (score < worstScore) { worstScore = score; worst = i; }
  });
  return worst;
}
function scoreForAI(cardKey, p, o) {
  const def = CARDS[cardKey];
  if (cardKey === "pierce") return totalShield(o) > 0 ? 13 : 8;
  if (cardKey === "exploit") return normalHand(o).length >= 4 ? 12 : 5;
  if (cardKey === "bloodlust") return p.hp > 8 ? 11 : 3;
  if (cardKey === "overdraft") return p.hp > 8 && normalHand(p).length <= 3 ? 9 : 2;
  if (cardKey === "ambush") return 7;
  if (cardKey === "curse") return 8;
  if (cardKey === "buildup") return p.cardsPlayedThisTurn === 0 ? 10 : 4;
  if (cardKey === "cleanse") return 6;
  if (def.type === "attack") {
    const comboBoost = Math.min(p.cardsPlayedThisTurn, 3);
    return 8 + (def.damage + comboBoost) * 0.5;
  }
  if (def.type === "heal") return p.hp < p.maxHp * 0.5 ? 10 : 3;
  if (def.type === "shield") return p.hp < p.maxHp * 0.5 ? 7 : 4;
  if (cardKey === "lockdown") return o.energy >= 4 ? 11 : 5;
  if (cardKey === "drain") return o.energy >= 2 ? 7 : 3;
  if (cardKey === "trap") return 5;
  if (cardKey === "steal") return normalHand(o).length >= 2 ? 8 : 4;
  if (def.type === "draw") return 4;
  if (def.type === "energy") return 3;
  return 5;
}

function aiStep() {
  if (state.over || state.current !== 1 || state.mode !== "ai") return;
  if (state.busy) { setTimeout(aiStep, 300); return; }
  if (state.counterWindow && state.counterWindow.active) { setTimeout(aiStep, 300); return; }
  if (state.phase !== "play") { setTimeout(aiStep, 300); return; }
  const p = state.players[1]; const opp = state.players[0];
  if (p.frozen) { setTimeout(() => endTurnAI(), 500); return; }
  if (p.cannotPlayMoreThisTurn) { setTimeout(() => endTurnAI(), 500); return; }
  if (p.role === "shuangwu" && !p.lendUsed && p.resource < ROLES[p.role].resource.max && normalHand(p).length > 0) {
    if (Math.random() < 0.9) { aiLend(); return; }
  }
  if (checkUltReady(p) && Math.random() < 0.85) { useUltimateFromAI(); return; }
  if (checkSkillReady(p)) {
    let use = true;
    if (p.role === "lubiao" && p.hp > p.maxHp - 5) use = false;
    if (p.role === "zhiyuchen" && p.resource < 2) use = false;
    if (p.role === "zhangsien" && normalHand(p).length === 0) use = false;
    if (p.role === "gu" && p.resource < 2) use = false;
    if (p.role === "rou" && p.resource < 3) use = false;
    if (p.role === "yangkaidong" && (p.maxHp - p.hp) < 5) use = false;
    if (p.role === "lujiancheng") { const maxN = Math.min(normalHand(opp).length, p.energy, p.resource); if (maxN < 2) use = false; }
    if (use) { useSkillFromAI(); return; }
  }
  if (!p.locked) {
    const playable = [];
    p.hand.forEach((c, idx) => { if (p.energy >= CARDS[c.key].cost - (c.stolenCostReduce ? 1 : 0) && !c.sealed && !p.cannotPlayMoreThisTurn) playable.push({ c, idx }); });
    if (playable.length) { playable.sort((a, b) => scoreForAI(b.c.key, p, opp) - scoreForAI(a.c.key, p, opp)); playCardFromAI(playable[0].idx); return; }
  }
  setTimeout(() => endTurnAI(), 500);
}

function aiLend() {
  const p = state.players[1];
  const opp = state.players[0];
  if (p.lendUsed || normalHand(p).length === 0 || p.resource >= ROLES[p.role].resource.max) return;
  const maxRes = ROLES[p.role].resource.max - p.resource;
  const maxCards = Math.min(normalHand(p).length, maxRes);
  if (maxCards < 1) return;
  // 交 1 张最差的牌
  const sel = aiPickWorstCard(p.hand);
  if (sel < 0) return;
  const card = p.hand.splice(sel, 1)[0];
  opp.hand.push(card);
  p.lendUsed = true;
  addRes(p, 1);
  log(`电脑 交给「${CARDS[card.key].name}」，精力 +1`);
  render();
  setTimeout(aiStep, 500);
}

function endTurnAI() {
  if (state.over) return;
  if (state.counterWindow && state.counterWindow.active) return;
  if (state.phase !== "play") return;
  const p = state.players[1];
  state.phase = "discard";
  const overflow = p.hand.length - HAND_LIMIT;
  if (overflow > 0) {
    for (let k = 0; k < overflow; k++) { const sel = aiPickWorstCard(p.hand); if (sel >= 0) { const card = p.hand.splice(sel, 1)[0]; p.discard.push(card.key); onLoseCard(p, 1); } }
    log(`电脑 弃掉 ${overflow} 张牌`);
    render();
    setTimeout(() => doEndPhase(p), 400);
  } else {
    setTimeout(() => doEndPhase(p), 400);
  }
}

function playCardFromAI(index) {
  const p = state.players[1]; const cardObj = p.hand[index];
  if (!cardObj || cardObj.sealed) { endTurnAI(); return; }
  const def = CARDS[cardObj.key];
  const realCost = Math.max(0, def.cost - (cardObj.stolenCostReduce ? 1 : 0));
  if (p.energy < realCost) { endTurnAI(); return; }

  if (cardObj.key === "cleanse") {
    p.energy -= realCost;
    p.hand.splice(index, 1);
    p.discard.push(cardObj.key);
    p.cardsPlayedThisTurn++;
    lockBusy(600); playClick(1.1); pulseAvatar(1);
    log(`电脑 使用无懈可击`);
    useWuxieActive(p);
    render();
    setTimeout(() => { if (!state.over) aiStep(); }, 550);
    return;
  }

  let comboBonus = 0;
  if (def.type === "attack") comboBonus = Math.min(p.cardsPlayedThisTurn, 3);
  const handEl = document.getElementById("side1").querySelector(".hand-area");
  const cardEl = handEl.children[index] || handEl.firstChild;
  const targetEl = document.getElementById("side0").querySelector(".avatar");
  p.energy -= realCost;
  p.hand.splice(index, 1);
  p.discard.push(cardObj.key);
  if (p.role === "zhangsien") addRes(p, 1);
  if (p.role === "lubiao") addRes(p, 1);
  p.cardsPlayedThisTurn++;
  if (def.type === "attack") { p.attackPlayedThisTurn = true; if (p.role === "gu" && p.resource > 0) p.resource = 0; }
  const oppP = state.players[0];
  if (oppP.role === "zhiban") { addRes(oppP, 1); log(`${oppP.name} 抓到破绽，论据 +1`); }
  lockBusy(700); playClick(0.85); pulseAvatar(1);
  flyCard(cardEl, targetEl, def.type, def.name);
  log(`电脑 使用「${def.name}」`);
  render();

  let executed = false;
  const execFn = () => {
    if (executed) return;
    executed = true;
    const opp2 = state.players[0]; const p2 = state.players[1];
    if (cardObj.key === "steal" && normalHand(opp2).length > 0) {
      const sel = aiPickBestCard(opp2.hand);
      if (sel >= 0) {
        const stolen = opp2.hand.splice(sel, 1)[0];
        stolen.isNew = true; p2.hand.push(stolen); log(`电脑 偷走「${CARDS[stolen.key].name}」`); onLoseCard(opp2, 1);
      }
      render(); setTimeout(() => { if (!state.over) aiStep(); }, 550); return;
    }
    execCardEffect(1, cardObj.key, comboBonus, cardObj);
    render(); setTimeout(() => { if (!state.over) aiStep(); }, 550);
  };

  setTimeout(() => { tryCounter(1, cardObj, execFn); }, 280);
}

function useSkillFromAI() {
  const p = state.players[1]; const role = ROLES[p.role]; const opp = state.players[0];
  if (p.role === "lujiancheng") {
    const maxN = Math.min(normalHand(opp).length, p.energy, p.resource);
    const n = Math.max(1, Math.min(maxN, 2));
    p.energy -= n; subRes(p, n); p.skillCd = SKILL_CD;
    lockBusy(1500); playClick(1.3); pulseAvatar(1); banner(role.skill.name, role.color);
    log(`电脑 夺牌：消耗 ${n} 能量 + ${n} 风度`);
    render();
    setTimeout(() => { promptOpponentDiscard(opp, n, () => { render(); setTimeout(() => { if (!state.over) aiStep(); }, 550); }); }, 400); return;
  }
  if (p.role === "zhangxiang") {
    const sk = role.skill;
    if (normalHand(opp).length === 0) { endTurnAI(); return; }
    p.energy -= sk.cost; subRes(p, sk.resCost); p.skillCd = SKILL_CD;
    const sel = aiPickBestCard(opp.hand);
    if (sel >= 0) opp.hand[sel].sealed = true;
    draw(p, 1, true);
    lockBusy(600); playClick(1.3); pulseAvatar(1); banner(sk.name, role.color);
    log(`电脑 推演，封印了一张牌`);
    render(); setTimeout(() => { if (!state.over) aiStep(); }, 550); return;
  }
  if (p.role === "zhiyuchen") {
    const sk = role.skill;
    p.energy -= sk.cost; p.skillCd = SKILL_CD;
    const shieldAmt = p.resource; p.resource = 0;
    if (shieldAmt > 0) dealDamage(1, 0, shieldAmt, { isAttack: true });
    lockBusy(900); playClick(1.3); pulseAvatar(1); banner(sk.name, role.color);
    log(`电脑 转化 ${shieldAmt} 护盾 → ${shieldAmt} 伤害`);
    render(); setTimeout(() => { if (!state.over) aiStep(); }, 550); return;
  }
  if (p.role === "shuangwu") {
    const sk = role.skill;
    p.energy -= sk.cost; p.skillCd = getSkillCd(role);
    lockBusy(600); playClick(1.3); pulseAvatar(1); banner(sk.name, role.color);
    useWuxieActive(p);
    render(); setTimeout(() => { if (!state.over) aiStep(); }, 550); return;
  }
  let resCost = sk.resCost === "all" ? p.resource : sk.resCost;
  p.energy -= sk.cost; subRes(p, resCost); p.skillCd = getSkillCd(role);
  if (opp.role === "zhiban") addRes(opp, 1);
  lockBusy(1000); playClick(1.3); pulseAvatar(1); banner(sk.name, role.color);
  log(`电脑 使用技能「${sk.name}」`);
  render();
  setTimeout(() => {
    switch (p.role) {
      case "zhangsien": p.nextAtkDouble = true; p.zeroResAtEndTurn = true; break;
      case "yangkaidong": { const dmg = Math.floor((p.maxHp - p.hp) / 2); if (dmg > 0) dealDamage(1, 0, dmg, { isAttack: true, ignoreShield: true }); break; }
      case "lubiao": p.damageHalfThisTurn = true; break;
      case "rou": { const marks = opp.rouMarks || 0; dealDamage(1, 0, 2 + resCost + marks * 2, { isAttack: true }); break; }
      case "xi": { const se = Math.min(2, opp.energy); opp.energy -= se; p.energy = Math.min(MAX_ENERGY, p.energy + se); const idxs = opp.hand.map((c, i) => c.isExtra ? -1 : i).filter(i => i >= 0); if (idxs.length > 0) { const i = idxs[Math.floor(Math.random() * idxs.length)]; const stolen = opp.hand.splice(i, 1)[0]; stolen.isNew = true; stolen.stolenCostReduce = true; if (CARDS[stolen.key].type === "attack") stolen.stolenDamage = true; p.hand.push(stolen); onLoseCard(opp, 1); } break; }
      case "gu": { let dmg = 0, healAmt = 0; if (resCost >= 3) { dmg = 7; healAmt = 5; } else if (resCost === 2) { dmg = 4; healAmt = 3; } else if (resCost === 1) { dmg = 2; healAmt = 1; } if (dmg > 0) { dealDamage(1, 0, dmg, { isAttack: true }); heal(p, healAmt); } opp.firstAtkDebuff = (opp.firstAtkDebuff || 0) + 2; p.cannotPlayMoreThisTurn = true; break; }
      case "zhiban": p.damageHalfThisTurn = true; p.drawOnHurtThisTurn = true; break;
    }
    render();
    setTimeout(() => { if (!state.over) aiStep(); }, 550);
  }, 350);
}

function useUltimateFromAI() {
  const p = state.players[1]; const role = ROLES[p.role]; const savedRes = p.resource;
  if (p.role === "lujiancheng") { p.energy -= 4; p.resource = 0; }
  else if (p.role === "zhiyuchen") { p.energy -= 3; }
  else if (p.role === "shuangwu") { p.energy -= 2; p.resource -= 4; }
  else { p.energy -= 3; p.resource = 0; }
  lockBusy(1200); playClick(1.6); pulseAvatar(1); banner("终极 · " + role.ultimate.name, "#fbbf24");
  log(`电脑 发动终极技「${role.ultimate.name}」`);
  render();
  setTimeout(() => {
    if (p.role === "zhiban") { const dmg = savedRes * 2; dealDamage(1, 0, dmg, { isAttack: true }); if (!state.over) { state.players[0].energy = Math.max(0, state.players[0].energy - 2); } }
    else if (p.role === "yangkaidong") { const half = Math.floor(p.hp / 2); const dmg = Math.floor(half * 1.5); p.hp -= half; dealDamage(1, 0, dmg, { isAttack: true, ignoreShield: true }); }
    else if (p.role === "shuangwu") { doShuangwuUlt(p); }
    else { execUltimate(1, savedRes); }
    render();
    setTimeout(() => { if (!state.over) aiStep(); }, 550);
  }, 500);
}

function buildRoleList(containerId, selected, onSelect) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  Object.entries(ROLES).forEach(([key, role]) => {
    const btn = document.createElement("button");
    btn.className = "role-card" + (key === selected ? " sel" : "");
    btn.style.setProperty("--c", role.color);
    btn.innerHTML = `<div class="rc-avatar">${role.short}</div><div class="rc-name">${role.name}</div><div class="rc-title">${role.title}</div><div class="rc-hp">HP ${role.hp}</div>`;
    onTap(btn, () => { playClick(); onSelect(key); buildRoleList(containerId, key, onSelect); });
    container.appendChild(btn);
  });
}

function createPlayer(roleKey, name) {
  const r = ROLES[roleKey];
  return {
    role: roleKey, name, hp: r.hp, maxHp: r.hp,
    shields: [], energy: 0,
    hand: [], deck: shuffle(DECK_LIST), discard: [],
    resource: r.resource.init || 0,
    damageBuff: 0, pendingAtkBuff: 0, nextAtkDouble: false,
    doubleDamage: false, energyBonus: 0,
    skillCd: 0,
    reflect: 0, damageDealt: 0, combo: 0,
    frozen: false, locked: false, noSkill: false,
    trap: 0, trapTurns: 0, firstAtkDebuff: 0, tookDamageThisTurn: false,
    cardsPlayedThisTurn: 0, attackPlayedThisTurn: false,
    started: false, pending: [],
    rouMarks: 0, rouMarkExpire: 0, handOver: 0,
    noEnergyGain: false, shieldTimer: 0, counterHealsUsed: 0,
    damageHalfThisTurn: false, drawOnHurtThisTurn: false,
    zeroResAtEndTurn: false, zhiyuchenBuff: 0,
    emergencyHealUsed: false,
    cannotPlayMoreThisTurn: false,
    lendUsed: false
  };
}

function startGame() {
  state.mode = setup.mode; state.over = false; state.logs = []; state.busy = false;
  state._busyTimer = null; state.current = 0; state.turnCount = 0; state.counterWindow = null; state.phase = "idle";
  const keys = Object.keys(ROLES);
  const role1 = setup.mode === "ai" ? keys[Math.floor(Math.random() * keys.length)] : setup.p1;
  state.players = [createPlayer(setup.p0, "玩家 1"), createPlayer(role1, setup.mode === "ai" ? "电脑" : "玩家 2")];
  draw(state.players[0], INITIAL_HAND); draw(state.players[1], INITIAL_HAND);
  document.getElementById("setup").hidden = true;
  document.getElementById("game").hidden = false;
  log(`对局开始：${state.players[0].name}（${ROLES[setup.p0].name}） VS ${state.players[1].name}（${ROLES[role1].name}）`);
  log(`回合分为 4 阶段：回合开始 → 摸牌 → 出牌 → 弃牌 → 结束`);
  startTurn(0);
}

function initSetup() {
  buildRoleList("roles0", setup.p0, (k) => setup.p0 = k);
  buildRoleList("roles1", setup.p1, (k) => setup.p1 = k);
  document.querySelectorAll("#modeSeg .seg-btn").forEach(btn => {
    onTap(btn, () => {
      playClick();
      document.querySelectorAll("#modeSeg .seg-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active"); setup.mode = btn.dataset.mode;
      const wrap = document.getElementById("roles1").parentElement;
      wrap.style.opacity = setup.mode === "ai" ? ".4" : "1";
      wrap.style.pointerEvents = setup.mode === "ai" ? "none" : "";
    });
  });
  onTap(document.getElementById("startBtn"), () => { playClick(); startGame(); });
}

onTap(document.getElementById("restartBtn"), () => { playClick(); location.reload(); });
document.addEventListener("pointerdown", (e) => { if (tooltipEl && !tooltipEl.contains(e.target)) hideTooltip(); });

initSetup();
</script>
