<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝖘𝖚𝖓𝖘𝖊𝖙 | 个人主页</title>
    <style>
        /* ================= 基础设置 ================= */
        :root {
            --bg-color: #050505;
            --gold: #d4af37;
            --amber: #ffb300;
            --blood-red: #8b0000;
            --text-color: #e0e0e0;
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* 隐藏默认鼠标 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            user-select: none;
        }

        /* ================= 背景与特效层 ================= */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ================= 可拖拽的月亮 ================= */
        .moon {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            z-index: 50;
            background: radial-gradient(circle at 30% 30%, #fffde7 0%, #ffd54f 40%, #ffb300 80%, #ff8f00 100%);
            box-shadow: 
                0 0 50px 15px rgba(255, 179, 0, 0.3),
                0 0 100px 40px rgba(255, 179, 0, 0.1),
                inset -20px -20px 40px rgba(0, 0, 0, 0.7),
                inset 10px 10px 20px rgba(255, 255, 255, 0.5);
            cursor: grab;
            touch-action: none;
            transition: box-shadow 0.3s, transform 0.3s;
            transform: scale(1);
            top: 50px;
            left: 50px;
        }

        .moon::before {
            content: '';
            position: absolute;
            top: 25%;
            left: 20%;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.12);
            box-shadow: inset 3px 3px 8px rgba(0, 0, 0, 0.4);
        }
        .moon::after {
            content: '';
            position: absolute;
            top: 60%;
            left: 65%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15);
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
        .moon-crater {
            position: absolute;
            top: 65%;
            left: 25%;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.1);
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .moon.dragging {
            transform: scale(1.08);
            box-shadow: 
                0 0 80px 25px rgba(255, 179, 0, 0.5),
                0 0 150px 60px rgba(255, 179, 0, 0.2),
                inset -20px -20px 40px rgba(0, 0, 0, 0.7),
                inset 10px 10px 20px rgba(255, 255, 255, 0.5);
            cursor: grabbing;
            transition: box-shadow 0.2s, transform 0.2s;
        }

        /* ================= 音乐播放器 ================= */
        .music-player {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 100;
        }

        .music-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            color: #fff;
        }

        .music-btn:hover {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            color: var(--gold);
            transform: scale(1.1);
        }

        .music-icon {
            font-size: 1.3rem;
            transition: transform 0.3s;
        }

        .music-btn.playing .music-icon {
            animation: spin 3s linear infinite;
        }

        .music-btn.playing {
            border-color: var(--amber);
            box-shadow: 0 0 20px rgba(255, 179, 0, 0.5);
            color: var(--amber);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ================= 自定义鼠标指针 ================= */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.9) 0%, rgba(212, 175, 55, 0) 70%);
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            transition: width 0.2s, height 0.2s;
        }
        body.moon-hover .cursor {
            width: 40px;
            height: 40px;
        }

        .trail-particle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--amber);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            animation: fadeOut 0.8s ease-out forwards;
            box-shadow: 0 0 10px var(--gold);
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) translateY(20px) scale(0.2); }
        }

        /* ================= 主容器 ================= */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            perspective: 1000px;
            pointer-events: none;
        }
        
        .avatar-wrapper, .info-section, .btn, .qq-card {
            pointer-events: auto;
        }

        /* ================= 头像区域 ================= */
        .avatar-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            animation: float 6s ease-in-out infinite;
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
            filter: contrast(1.1) brightness(0.9);
            transition: filter 0.3s ease;
        }

        .avatar:hover {
            filter: contrast(1.2) brightness(1.1) drop-shadow(0 0 15px var(--amber));
        }

        .glow-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--gold), transparent, var(--amber), transparent);
            animation: rotate 4s linear infinite;
            z-index: 1;
            filter: blur(15px);
            opacity: 0.6;
        }

        /* ================= 信息区域 ================= */
        .info-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transform: translateZ(30px);
        }

        .name-title {
            font-size: 3.2rem;
            font-weight: bold;
            color: transparent;
            background: linear-gradient(90deg, #fff, var(--gold), var(--amber), var(--gold));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
            letter-spacing: 6px;
            font-family: "Cinzel", "Georgia", "Times New Roman", serif;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            min-height: 65px;
        }

        /* ================= 霸气台词（恢复系统书法体） ================= */
        .slogan {
            font-size: 1.7rem; 
            font-weight: 900;
            letter-spacing: 5px; /* 系统书法体需要适当的字间距来展现气势 */
            margin: 10px 0;
            
            /* 血色到鎏金的渐变 */
            background: linear-gradient(180deg, #ff4b4b 0%, #ffb300 50%, #d4af37 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            
            /* 血色发光与暗影 */
            text-shadow: 
                0 0 10px rgba(255, 0, 0, 0.6),
                0 0 20px rgba(255, 0, 0, 0.4),
                0 0 40px rgba(255, 179, 0, 0.4);
            
            /* 恢复为系统自带的经典书法体栈 */
            font-family: "STXingkai", "华文行楷", "STKaiti", "楷体", "SimSun", serif;
            
            opacity: 0;
            transform: scale(1.5) translateY(-20px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 入场动画，由 JS 触发 */
        .slogan.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            animation: breathe 3s infinite alternate ease-in-out 1s;
        }

        /* 呼吸灯特效 */
        @keyframes breathe {
            0% { text-shadow: 0 0 10px rgba(255, 0, 0, 0.6), 0 0 20px rgba(255, 0, 0, 0.4), 0 0 40px rgba(255, 179, 0, 0.4); }
            100% { text-shadow: 0 0 20px rgba(255, 0, 0, 1), 0 0 50px rgba(255, 0, 0, 0.6), 0 0 70px rgba(212, 175, 55, 0.8); }
        }

        /* ================= 按钮组 ================= */
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        .btn {
            position: relative;
            padding: 12px 28px;
            border-radius: 8px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn:hover {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3), inset 0 0 10px rgba(212, 175, 55, 0.1);
            transform: translateY(-4px);
            color: var(--gold);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        .btn:hover::before { left: 100%; }

        .btn-primary {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(255, 179, 0, 0.1));
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--gold), var(--amber));
            color: #000;
            box-shadow: 0 0 30px rgba(255, 179, 0, 0.6);
        }

        /* QQ 卡片 */
        .qq-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 12px 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            position: relative;
        }

        .qq-card:hover {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .qq-label {
            color: var(--gold);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .qq-number {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
        }

        .toast {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show { opacity: 1; }

        /* ================= 模态框通用样式 ================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--glass-bg);
            border: 1px solid var(--gold);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-content h2 {
            color: var(--gold);
            margin-bottom: 20px;
            letter-spacing: 2px;
            font-size: 1.5rem;
            font-family: "STXingkai", "华文行楷", "SimSun", serif;
        }

        .modal-content p {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* ================= 游戏选择菜单特有样式 ================= */
        .game-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .game-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-option::after {
            content: '▶';
            color: var(--gold);
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
        }

        .game-option:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            transform: translateX(5px);
        }

        .game-option:hover::after {
            opacity: 1;
            transform: translateX(0);
        }

        .game-tag {
            color: var(--amber);
            font-family: monospace;
            font-size: 0.8rem;
            margin-right: 10px;
            opacity: 0.7;
        }

        .close-btn {
            padding: 8px 25px;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: #aaa;
            border-radius: 5px;
            transition: 0.3s;
            font-family: inherit;
        }

        .close-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* ================= 全局提示框 ================= */
        .global-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 25px 40px;
            color: #fff;
            text-align: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            backdrop-filter: blur(15px);
        }
        
        .global-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .global-toast h3 {
            color: var(--amber);
            margin-bottom: 10px;
            font-size: 1.3rem;
            letter-spacing: 2px;
        }

        .global-toast .group-num {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
            margin: 10px 0;
            text-shadow: 0 0 10px var(--amber);
        }

        /* ================= 动画 ================= */
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes shine { to { background-position: 200% center; } }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .name-title { font-size: 2.2rem; }
            .slogan { font-size: 1.3rem; letter-spacing: 2px; }
            .avatar-wrapper { width: 180px; height: 180px; }
            .container { gap: 20px; }
            * { cursor: auto; } 
            .cursor, .trail-particle { display: none; }
            .action-buttons { flex-direction: column; width: 100%; max-width: 250px; }
            .modal-content { padding: 25px; }
            .game-option { padding: 12px 15px; font-size: 1rem; }
            .global-toast { width: 90%; padding: 20px; }
            .moon { width: 90px; height: 90px; top: 20px; left: 20px; }
            .music-player { top: 20px; right: 20px; }
            .music-btn { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>
    <canvas id="particle-canvas"></canvas>

    <div class="music-player">
        <div class="music-btn" id="musicBtn" title="播放/暂停">
            <span class="music-icon">🎵</span>
        </div>
        <audio id="audioPlayer" loop src="music.FLAC"></audio>
    </div>

    <div class="moon" id="moon">
        <div class="moon-crater"></div>
    </div>

    <div class="container">
        <div class="avatar-wrapper" id="avatar-wrapper">
            <div class="glow-ring"></div>
            <img src="avatar.jpg" alt="Sunset Avatar" class="avatar" onerror="this.src='https://api.dicebear.com/7.x/adventurer/svg?seed=sunset&backgroundColor=111111'">
        </div>

        <div class="info-section">
            <h1 class="name-title" id="typewriter"></h1>
            
            <!-- 霸气台词 -->
            <div class="slogan" id="slogan">我重临世界之日，诸逆臣皆当死去</div>
            
            <div class="qq-card" onclick="copyQQ()">
                <span class="qq-label">Contact QQ</span>
                <span class="qq-number">3168565832</span>
                <div class="toast" id="toast">已复制到剪贴板</div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="toggleGameModal(true)">🎮 进入游戏</button>
                <button class="btn" onclick="toggleAboutModal(true)">💡 关于我</button>
                <button class="btn" onclick="joinQQGroup()">👥 加入QQ群</button>
            </div>
        </div>
    </div>

    <!-- 游戏选择模态框 -->
    <div class="modal-overlay" id="gameModal">
        <div class="modal-content">
            <h2>选择游戏</h2>
            <p>请选择你要进入的游戏世界</p>
            <div class="game-options">
                <a href="game1.html" class="game-option"><span><span class="game-tag">[01]</span>Game 1</span></a>
                <a href="game2.html" class="game-option"><span><span class="game-tag">[02]</span>Game 2</span></a>
                <a href="game3.html" class="game-option"><span><span class="game-tag">[03]</span>Game 3</span></a>
            </div>
            <button class="close-btn" onclick="toggleGameModal(false)">取消返回</button>
        </div>
    </div>

    <!-- 关于我模态框 -->
    <div class="modal-overlay" id="aboutModal">
        <div class="modal-content">
            <h2>关于 𝖘𝖚𝖓𝖘𝖊𝖙</h2>
            <p>这里是暗夜的边缘，也是代码与创意的交汇处。<br>热爱游戏，热爱编程。<br>欢迎来到我的世界。</p>
            <button class="close-btn" onclick="toggleAboutModal(false)">返回主页</button>
        </div>
    </div>

    <!-- 全局提示框 -->
    <div class="global-toast" id="globalToast">
        <h3>✨ 群号已复制 ✨</h3>
        <p>请打开手机或电脑 QQ 搜索加入</p>
        <div class="group-num">1128453039</div>
    </div>

    <script>
        // 1. 打字机与台词入场
        const nameText = "𝖘𝖚𝖓𝖘𝖊𝖙";
        const typewriterElement = document.getElementById("typewriter");
        const sloganElement = document.getElementById("slogan");
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < nameText.length) {
                typewriterElement.innerHTML += nameText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 200);
            } else {
                setTimeout(() => sloganElement.classList.add("show"), 500);
            }
        }
        window.onload = () => setTimeout(typeWriter, 500);

        // 2. 复制QQ
        function copyQQ() {
            navigator.clipboard.writeText("3168565832").then(() => {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 2000);
            });
        }

        // 3. 加群
        function joinQQGroup() {
            navigator.clipboard.writeText("1128453039").then(() => {
                const toast = document.getElementById("globalToast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 3000);
            }).catch(() => {
                const toast = document.getElementById("globalToast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 3000);
            });
        }

        // 4. 模态框
        function toggleGameModal(show) {
            document.getElementById('gameModal').classList[show ? 'add' : 'remove']('active');
        }
        function toggleAboutModal(show) {
            document.getElementById('aboutModal').classList[show ? 'add' : 'remove']('active');
        }
        window.onclick = (event) => {
            if (event.target === document.getElementById('gameModal')) toggleGameModal(false);
            if (event.target === document.getElementById('aboutModal')) toggleAboutModal(false);
        }

        // 5. 音乐
        const musicBtn = document.getElementById('musicBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        musicBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => musicBtn.classList.add('playing')).catch(err => console.error(err));
            } else {
                audioPlayer.pause();
                musicBtn.classList.remove('playing');
            }
        });

        // 6. 鼠标与拖尾
        const cursor = document.getElementById("cursor");
        document.addEventListener("mousemove", (e) => {
            cursor.style.left = e.clientX + "px";
            cursor.style.top = e.clientY + "px";
            if (Math.random() > 0.3) createTrailParticle(e.clientX, e.clientY);
        });

        function createTrailParticle(x, y) {
            const particle = document.createElement("div");
            particle.classList.add("trail-particle");
            particle.style.left = (x + (Math.random() - 0.5) * 20) + "px";
            particle.style.top = (y + (Math.random() - 0.5) * 20) + "px";
            const size = Math.random() * 6 + 2;
            particle.style.width = size + "px";
            particle.style.height = size + "px";
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 800);
        }

        // 7. 头像3D
        const wrapper = document.getElementById("avatar-wrapper");
        document.addEventListener("mousemove", (e) => {
            wrapper.style.transform = `rotateY(${(window.innerWidth / 2 - e.pageX) / 20}deg) rotateX(${(window.innerHeight / 2 - e.pageY) / 20}deg)`;
        });
        document.addEventListener("mouseleave", () => {
            wrapper.style.transform = `rotateY(0deg) rotateX(0deg)`;
            wrapper.style.transition = "transform 0.5s ease";
        });
        document.addEventListener("mouseenter", () => wrapper.style.transition = "transform 0.1s ease-out");

        // 8. 月亮拖拽
        const moon = document.getElementById('moon');
        let isDragging = false, offX = 0, offY = 0;
        moon.addEventListener('mouseenter', () => document.body.classList.add('moon-hover'));
        moon.addEventListener('mouseleave', () => document.body.classList.remove('moon-hover'));

        function startDrag(e) {
            const cx = e.clientX || (e.touches && e.touches[0].clientX);
            const cy = e.clientY || (e.touches && e.touches[0].clientY);
            if (!cx) return;
            isDragging = true;
            const rect = moon.getBoundingClientRect();
            offX = cx - rect.left; offY = cy - rect.top;
            moon.classList.add('dragging'); moon.style.transition = 'none';
            e.preventDefault(); e.stopPropagation();
        }
        function onDrag(e) {
            if (!isDragging) return;
            const cx = e.clientX || (e.touches && e.touches[0].clientX);
            const cy = e.clientY || (e.touches && e.touches[0].clientY);
            if (!cx) return;
            let x = Math.max(0, Math.min(cx - offX, window.innerWidth - moon.offsetWidth));
            let y = Math.max(0, Math.min(cy - offY, window.innerHeight - moon.offsetHeight));
            moon.style.left = x + 'px'; moon.style.top = y + 'px'; moon.style.right = 'auto';
            e.preventDefault();
        }
        function stopDrag() {
            if (isDragging) { isDragging = false; moon.classList.remove('dragging'); moon.style.transition = 'box-shadow 0.3s, transform 0.3s'; }
        }
        moon.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);
        moon.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('touchmove', onDrag, { passive: false });
        document.addEventListener('touchend', stopDrag);

        // 9. Canvas粒子
        const canvas = document.getElementById("particle-canvas"), ctx = canvas.getContext("2d");
        let W, H, particles = [], m = { x: null, y: null, r: 150 };
        window.addEventListener("mousemove", (e) => { m.x = e.x; m.y = e.y; });
        window.addEventListener("mouseout", () => { m.x = null; m.y = null; });

        function initCanvas() {
            W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
            particles = Array.from({ length: Math.floor(W * H / 10000) }, () => ({
                x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5,
                bx: 0, by: 0, d: Math.random() * 30 + 1,
                c: ['rgba(212, 175, 55, 0.8)', 'rgba(255, 179, 0, 0.6)', 'rgba(255,255,255,0.3)'][Math.floor(Math.random() * 3)]
            })).map(p => { p.bx = p.x; p.by = p.y; return p; });
        }
        function animate() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => {
                if (m.x != null) {
                    let dx = m.x - p.x, dy = m.y - p.y, dist = Math.hypot(dx, dy);
                    if (dist < m.r) { p.x -= (dx / dist) * ((m.r - dist) / m.r) * p.d; p.y -= (dy / dist) * ((m.r - dist) / m.r) * p.d; }
                    else { p.x -= (p.x - p.bx) / 10; p.y -= (p.y - p.by) / 10; }
                } else { p.x -= (p.x - p.bx) / 10; p.y -= (p.y - p.by) / 10; }
                ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        initCanvas(); animate(); window.addEventListener("resize", initCanvas);
    </script>
</body>
</html>
