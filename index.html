<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规则怪谈·驭鬼者与龙王</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a10;color:#dcdce6;font-family:system-ui,sans-serif;max-width:800px;margin:0 auto;padding:12px 12px 60px;}
.box{background:#15151f;padding:14px 16px;border-radius:10px;margin-bottom:10px;border:1px solid #2a2a3a;}
h2{color:#c99eff;font-size:18px;margin-bottom:6px;}
button{padding:9px 16px;border:none;border-radius:6px;background:#6b4bd0;color:#fff;font-size:15px;margin:3px 4px 3px 0;cursor:pointer;}
button:hover:not(:disabled){background:#7e5ce8;}
button:disabled{background:#2c2c3a;color:#6a6a7a;cursor:not-allowed;}
input[type=number]{width:62px;padding:6px;font-size:15px;background:#20202e;color:#fff;border:1px solid #3d3d52;border-radius:4px;text-align:center;}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;flex-wrap:wrap;}
.row label{width:48px;color:#a8a8bd;font-size:14px;}
.tip{font-size:12px;color:#7a7a92;line-height:1.6;}
#log{min-height:220px;max-height:440px;overflow-y:auto;line-height:1.8;font-size:14.5px;}
#log>div{margin:2px 0;}
.good{color:#7dff9b;}.bad{color:#ff7a7a;}.god{color:#ffdf6e;}.epic{color:#ffb3ff;font-weight:700;}
.normal{color:#c9c9d8;}.dead{color:#ff5252;font-weight:700;}
.win{color:#3dffb0;font-weight:700;font-size:15px;}
.intel{color:#a0e5ff;}.ghost{color:#c58aff;}.partner{color:#ffb37a;}
.xu{color:#ff8ac7;font-weight:700;}.danger{color:#ff9d5c;}.blood{color:#c00020;font-weight:700;font-size:15px;}
.star{color:#ffe066;font-weight:700;}.zx{color:#ffcc44;font-weight:700;}
.story{color:#c8b8ff;}.youhe{color:#ff4444;font-weight:700;}
.rule{color:#88ffe0;font-weight:700;}.fight{color:#ffb060;font-weight:700;}
#statusBar{font-size:12.5px;color:#9aa0b5;line-height:1.9;}
#statusBar b{color:#c9c9d8;font-weight:600;}
#choiceBox{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #4a4a66;}
#choiceBox .title{color:#c9a9ff;font-size:14px;font-weight:600;margin-bottom:6px;}
.choice-btn{display:block;width:100%;text-align:left;background:#28284a;color:#dfe0ff;padding:11px 13px;margin:7px 0;border-radius:6px;font-size:14.5px;line-height:1.55;border:1px solid transparent;cursor:pointer;}
.choice-btn:hover:not(:disabled){background:#3a3a6a;border-color:#7e5ce8;}
.choice-btn:disabled{opacity:.45;cursor:not-allowed;background:#1a1a26;}
#achievePopup{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#4a3a7a,#2a2a4a);border:2px solid #ffe066;border-radius:10px;padding:14px 22px;box-shadow:0 0 30px rgba(255,224,102,.5);z-index:9999;display:none;color:#ffe066;font-size:15px;font-weight:700;text-align:center;animation:achPulse .5s ease;}
@keyframes achPulse{0%{transform:translateX(-50%) scale(.7);opacity:0;}100%{transform:translateX(-50%) scale(1);opacity:1;}}
#achievePopup .sub{color:#c8b8ff;font-size:12px;font-weight:400;margin-top:4px;}
#achieveCount{color:#ffe066;font-weight:700;}
</style>
</head>
<body>

<div id="achievePopup"></div>

<div class="box">
  <h2>👁️ 规则怪谈·驭鬼者与龙王</h2>
  <p class="tip">每只鬼都有杀人规律。观察后必须猜测它的规律——猜对可活，猜错即死。</p>
  <p class="tip" style="color:#ffe066;margin-top:6px;">🏆 已解锁成就：<span id="achieveCount">0</span>/15</p>
  <div class="row"><label>颜值</label><input type="number" id="beauty" min="0" max="10" value="0"></div>
  <div class="row"><label>智力</label><input type="number" id="intelli" min="0" max="10" value="0"></div>
  <div class="row"><label>体质</label><input type="number" id="physic" min="0" max="10" value="0"></div>
  <div class="row"><label>家境</label><input type="number" id="family" min="0" max="10" value="0"></div>
  <p style="margin:8px 0;">剩余点数：<b id="remain" style="color:#9fffa8;">20</b></p>
  <button type="button" id="randomBtn" style="background:#3a8f6b;">🎲 随机分配20点</button>
  <button type="button" id="rollBtn">🎲 抽取3个怪谈天赋</button>
  <div id="talentShow" style="margin:8px 0;"></div>
  <button type="button" id="startBtn" disabled>🔁 开启怪谈人生</button>
</div>

<div class="box">
  <div class="row" style="margin:0;">
    <span>年龄：<b id="ageText" style="color:#c99eff;">0</b> 岁</span>
    <span style="margin-left:14px;">状态：<b id="aliveText" style="color:#7dff9b;">存活</b></span>
  </div>
  <div id="statusBar"></div>
</div>

<div class="box">
  <div id="log"></div>
  <div id="choiceBox">
    <div class="title">⚡ 抉择</div>
    <div id="choiceList"></div>
  </div>
</div>

<div class="box" style="display:flex;gap:8px;flex-wrap:wrap;">
  <button type="button" id="restartBtn">🔄 重新轮回</button>
  <button type="button" id="skipBtn" style="background:#444;">⏩ 跳过等待</button>
</div>

<script>
window.addEventListener('DOMContentLoaded', function(){
"use strict";
function $(id){return document.getElementById(id);}
var inputs=[$('beauty'),$('intelli'),$('physic'),$('family')];
var remainEl=$('remain'),rollBtn=$('rollBtn'),startBtn=$('startBtn');
var randomBtn=$('randomBtn');
var restartBtn=$('restartBtn'),skipBtn=$('skipBtn');
var talentShow=$('talentShow'),logDom=$('log');
var ageText=$('ageText'),aliveText=$('aliveText'),statusBar=$('statusBar');
var choiceBox=$('choiceBox'),choiceList=$('choiceList');
var ATTR_MAX=10,POINT_MAX=20,SPEED=1500,MAXAGE=120;

var S={beauty:0,intelli:0,physic:0,family:0,age:0,
  talents:[],talentIds:{},intel:[],intelIds:{},
  ghosts:[],partners:[],items:[],
  flags:{},arcs:{},usedEvents:{},
  usedYearAll:{},alive:true,ended:false,skip:false,xuAllies:0,running:false,
  zzPraise:0,xuServant:false,starFormed:false,
  zxAlive:true,zxGrant:0,knownRules:{},battle35Done:false,
  xuDefeated:false,usedFate:false};

function sleep(ms){return new Promise(function(r){setTimeout(r,S.skip?20:ms);});}
function hasT(id){return !!S.talentIds[id];}
function hasF(f){return !!S.flags[f];}
function setF(f){if(f)S.flags[f]=true;}
function hasI(id){return !!S.intelIds[id];}
function trueIntelCount(){var c=0;for(var i=0;i<S.intel.length;i++)if(S.intel[i].real)c++;return c;}
function intelBonus(){return Math.min(0.30,S.intel.length*0.02);}
function rnd(a,b){return a+Math.random()*(b-a);}
function logLine(t,c){var d=document.createElement('div');if(c)d.className=c;d.textContent=t;logDom.appendChild(d);logDom.scrollTop=logDom.scrollHeight;}
function story(lines,cls){for(var i=0;i<lines.length;i++){logLine('　　'+lines[i],cls||'story');}}

var ACHIEVES={
  'first_ghost':{name:'初次驭鬼',desc:'驾驭第一只鬼'},
  'three_ghosts':{name:'三鬼同行',desc:'同时驾驭3只鬼'},
  'ghost_master':{name:'驭鬼者',desc:'同时驾驭5只鬼'},
  'know_all_rules':{name:'鬼律通晓',desc:'洞悉全部鬼的杀人规律'},
  'star_form':{name:'双子星',desc:'陆标与杨开冬并肩'},
  'xu_servant':{name:'王者气度',desc:'让许云汐真诚道歉'},
  'xu_defeat':{name:'宿敌终章',desc:'击败许云汐'},
  'truth_knower':{name:'真相窥探者',desc:'获知世界终极真相'},
  'dragon_rider':{name:'驭龙者',desc:'驾驭龙王之影'},
  'blood_king':{name:'凡王之血，必以剑终',desc:'为陆标复仇成功'},
  'king_blood':{name:'孤独的王',desc:'献祭所有伙伴成王'},
  'king_together':{name:'欲与天公试比高',desc:'与伙伴共灭优呵'},
  'no_regret':{name:'不留遗憾',desc:'复仇许云汐后安老'},
  'fk_lip':{name:'唇齿相依',desc:'与嘴唇结盟'},
  'fk_zx_witness':{name:'龙的见证',desc:'亲眼目睹张响陨落'}
};
function loadAchieves(){
  try{var a=localStorage.getItem('gz_achieves');if(a)return JSON.parse(a);}catch(e){}
  return {};
}
function saveAchieves(a){try{localStorage.setItem('gz_achieves',JSON.stringify(a));}catch(e){}}
var unlockedAchieves=loadAchieves();
function updateAchCount(){
  var el=document.getElementById('achieveCount');
  if(el)el.textContent=String(Object.keys(unlockedAchieves).length);
}
function unlockAchieve(id){
  if(unlockedAchieves[id])return;
  unlockedAchieves[id]=true;
  saveAchieves(unlockedAchieves);
  updateAchCount();
  var a=ACHIEVES[id];if(!a)return;
  var p=document.getElementById('achievePopup');
  if(p){
    p.innerHTML='🏆 成就解锁：'+a.name+'<div class="sub">'+a.desc+'</div>';
    p.style.display='block';
    setTimeout(function(){p.style.display='none';},2800);
  }
}

var ITEMS={
  blackUmbrella:{name:'黑伞',desc:'雨天免疫雨点鬼',effect:function(){if(S.knownRules['雨点鬼']!==true)S.knownRules['雨点鬼']=true;}},
  dragonScale:{name:'龙鳞',desc:'战力+5',effect:function(){}},
  oldNote:{name:'旧笔记',desc:'洞悉规律成功率+15%',effect:function(){}},
  bloodPact:{name:'血契',desc:'驾驭鬼成功率+10%',effect:function(){}},
  dragonRing:{name:'龙纹戒指',desc:'情报获取效率翻倍',effect:function(){}},
  echoStone:{name:'回声石',desc:'猜测规律时显示正确方向',effect:function(){}}
};
function hasItem(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return true;return false;}
function addItem(id){
  if(hasItem(id))return;
  var it=ITEMS[id];if(!it)return;
  S.items.push({id:id,name:it.name,desc:it.desc});
  if(it.effect)it.effect();
  story(['【获得】'+it.name+'｜'+it.desc],'epic');
  renderStatus();
}

var PHYSIC_COEF=1.2;
function ghostPowerSum(){var s=0;for(var i=0;i<S.ghosts.length;i++)s+=S.ghosts[i].power;return s;}
function partnerPowerSum(){var s=0;for(var i=0;i<S.partners.length;i++){if(S.partners[i].alive&&S.partners[i].side==='player')s+=S.partners[i].power;}return s;}
function intelPowerBonus(){return Math.min(20,Math.floor(trueIntelCount()/3)*2);}
function myPower(){
  var p=S.physic*PHYSIC_COEF+ghostPowerSum()+partnerPowerSum();
  if(hasT('dragonBlood'))p+=5;
  if(S.starFormed)p+=5;
  if(S.xuServant)p+=3;
  if(hasItem('dragonScale'))p+=5;
  if(hasI('i_bg_dragon'))p+=10;
  p+=intelPowerBonus();
  return Math.round(p);
}
function xuPower(){
  var p=65;
  for(var i=0;i<S.partners.length;i++){
    var q=S.partners[i];
    if(q.side==='xu'&&q.alive)p+=q.power;
  }
  if(S.xuDefeated)p=Math.round(p*0.3);
  return Math.round(p);
}
function maxGhosts(){
  var base=Math.floor(S.physic/2)+1;
  if(base>5)base=5;
  if(hasT('ghostBlood'))base+=1;
  return base;
}

function renderStatus(){
  ageText.textContent=S.age;
  aliveText.textContent=S.alive?'存活':'死亡';
  aliveText.style.color=S.alive?'#7dff9b':'#ff5252';
  var g=S.ghosts.length?S.ghosts.map(function(x){return x.name+'('+x.power+')';}).join('、'):'无';
  var mine=S.partners.filter(function(p){return p.alive&&p.side==='player';});
  var xu=S.partners.filter(function(p){return p.alive&&p.side==='xu';});
  var pStr=mine.length?mine.map(function(x){return x.name+(x.isGhostMaster?'(驭)':'');}).join('、'):'无';
  var extra='';
  if(xu.length)extra+=' ｜ <span style="color:#ff8ac7">许营：'+xu.map(function(x){return x.name;}).join('、')+'</span>';
  if(S.starFormed)extra+=' ｜ <span style="color:#ffe066">★双子星★</span>';
  if(S.xuServant)extra+=' ｜ <span style="color:#ffe066">许云汐已道歉</span>';
  if(S.xuDefeated)extra+=' ｜ <span style="color:#ff8ac7">许云汐已败</span>';
  var knownKeys=Object.keys(S.knownRules);
  var known=knownKeys.length?knownKeys.join('、'):'无';
  var itemsStr=S.items.length?'<br><b>道具</b> <span style="color:#ffb3ff">'+S.items.map(function(x){return x.name;}).join('、')+'</span>':'';
  statusBar.innerHTML='<b>属性</b> 颜'+S.beauty+' 智'+S.intelli+' 体'+S.physic+' 家'+S.family+'<br>'+
    '<b>我方战力</b> <span style="color:#ffb060;font-weight:700;font-size:15px;">'+myPower()+'</span>'+
    '（体'+Math.round(S.physic*PHYSIC_COEF)+'+鬼'+ghostPowerSum()+'+伴'+partnerPowerSum()+
    (intelPowerBonus()>0?'+情报'+intelPowerBonus():'')+'）'+
    (hasF('xu_active')&&!S.xuServant?' ｜ 许云汐战力 <span style="color:#ff8ac7">'+xuPower()+'</span>':'')+'<br>'+
    '<b>驾驭之鬼</b> '+g+'（'+S.ghosts.length+'/'+maxGhosts()+'）<br>'+
    '<b>我方伙伴</b> '+pStr+extra+'<br>'+
    '<b>已洞悉</b> <span style="color:#88ffe0">'+known+'</span>'+itemsStr;
}
function addIntel(id,text,real){
  if(!id||S.intelIds[id])return false;
  S.intelIds[id]=true;S.flags[id]=true;
  S.intel.push({id:id,text:text,real:real});renderStatus();return true;
}
function removeT(id){delete S.talentIds[id];S.talents=S.talents.filter(function(t){return t.id!==id;});}
function applyMod(m){if(!m)return;
  if(m.beauty)S.beauty=Math.max(0,S.beauty+m.beauty);
  if(m.intelli)S.intelli=Math.max(0,S.intelli+m.intelli);
  if(m.physic)S.physic=Math.max(0,S.physic+m.physic);
  if(m.family)S.family=Math.max(0,S.family+m.family);}

function die(r){
  if(!S.alive)return;
  if(hasT('fateBreaker')&&!S.usedFate){
    S.usedFate=true;removeT('fateBreaker');
    logLine('【逆命】你的命运被改写——你从死地复活！','god');
    story(['你感到灵魂被拉回。','代价是，你的体质被永久削弱。'],'danger');
    applyMod({physic:-2});return;
  }
  if(hasT('godBless')){
    removeT('godBless');
    logLine('【神明眷顾】张响在你耳边低语，你从死亡中挣脱！','god');
    story(['一道温暖的龙力将你从死地拉回。','"别死。"他轻声说。','"你还没到该死的时候。"','"这份庇佑，已经用尽了。"'],'god');
    return;
  }
  if(hasT('zhiban')){
    removeT('zhiban');
    logLine('【智板眷顾】智板无声地出现，替你挡下死劫。','good');
    story(['他站在你面前。','什么也没说。','但那道阴影——替你挡下了一切。'],'good');
    return;
  }
  S.alive=false;
  logLine('【死亡】'+r,'dead');
}

function getP(n){for(var i=0;i<S.partners.length;i++)if(S.partners[i].name===n)return S.partners[i];return null;}
function alivePlayerPartners(){return S.partners.filter(function(p){return p.alive&&p.side==='player';});}
function aliveXuPartners(){return S.partners.filter(function(p){return p.alive&&p.side==='xu';});}

var lock=false;
function enforce(){
  if(lock)return;lock=true;
  try{
    var v=[0,0,0,0];
    for(var i=0;i<4;i++){var x=parseInt(inputs[i].value,10);if(isNaN(x)||x<0)x=0;if(x>ATTR_MAX)x=ATTR_MAX;v[i]=x;}
    var t=v[0]+v[1]+v[2]+v[3];
    for(var i=0;i<4&&t>POINT_MAX;i++){var c=Math.min(v[i],t-POINT_MAX);v[i]-=c;t-=c;}
    for(var i=0;i<4;i++){var s=String(v[i]);if(inputs[i].value!==s)inputs[i].value=s;}
    remainEl.textContent=String(Math.max(0,POINT_MAX-(v[0]+v[1]+v[2]+v[3])));
  }finally{lock=false;}
}
inputs.forEach(function(el){['input','change','keyup','paste','blur','mouseup','focusout'].forEach(function(e){el.addEventListener(e,enforce);});});
setInterval(function(){if(S.age===0||!S.alive)enforce();},250);

randomBtn.addEventListener('click',function(){
  var remaining=POINT_MAX;
  var v=[0,0,0,0];
  while(remaining>0){
    var i=Math.floor(Math.random()*4);
    if(v[i]<ATTR_MAX){v[i]++;remaining--;}
  }
  inputs[0].value=String(v[0]);inputs[1].value=String(v[1]);
  inputs[2].value=String(v[2]);inputs[3].value=String(v[3]);
  enforce();
});

var TALENTS=[
{id:'ghostEye',name:'鬼眼',type:'good',mod:{intelli:1},desc:'规律更易洞悉。'},
{id:'yinBody',name:'阴煞之体',type:'good',mod:{physic:2},desc:'体质+2。'},
{id:'soulAnchor',name:'镇魂',type:'good',mod:{},desc:'复苏免疫一次。'},
{id:'recoverImmune',name:'复苏免疫',type:'epic',mod:{},desc:'免疫复苏致死。'},
{id:'ghostBlood',name:'鬼血',type:'epic',mod:{physic:1,intelli:1},desc:'驭鬼上限+1。'},
{id:'photographic',name:'过目不忘',type:'good',mod:{intelli:2},desc:'智力+2。'},
{id:'intuition',name:'直觉敏锐',type:'good',mod:{intelli:1},desc:'危险预感。'},
{id:'network',name:'人脉广',type:'good',mod:{beauty:1},desc:'颜值+1。'},
{id:'richFamily',name:'神秘家世',type:'god',mod:{family:3},desc:'家境+3。'},
{id:'ruleKeeper',name:'规则谨记',type:'good',mod:{intelli:1},desc:'规避意外。'},
{id:'godBless',name:'神明眷顾',type:'god',mod:{family:2},desc:'豁免一次死亡。'},
{id:'zhiban',name:'智板眷顾',type:'good',mod:{physic:1},desc:'智板庇护一次。'},
{id:'ordinary',name:'平凡路人',type:'normal',mod:{},desc:'与陆标相识。'},
{id:'conservative',name:'保守',type:'good',mod:{physic:1},desc:'不碰禁忌。'},
{id:'curious',name:'好奇心重',type:'bad',mod:{intelli:1},desc:'易查三班。'},
{id:'kindCurse',name:'善良执念',type:'bad',mod:{beauty:1},desc:'后期反噬。'},
{id:'doomed',name:'厄运体质',type:'bad',mod:{physic:-1},desc:'靠近校门遭厄运。'},
{id:'lipMagnet',name:'诡谲吸引',type:'bad',mod:{},desc:'易被嘴唇盯上。'},
{id:'ghostMagnet',name:'撞鬼体质',type:'bad',mod:{},desc:'遇鬼概率大幅提升。'},
{id:'radical',name:'激进',type:'epic',mod:{intelli:2,physic:-1},desc:'执念真相。'},
{id:'dragonBlood',name:'龙王血裔',type:'epic',mod:{beauty:1,physic:1},desc:'战力+5。'},
{id:'twinSoul',name:'双生残魂',type:'epic',mod:{intelli:1,family:1},desc:'听懂龙语。'},
{id:'trueName',name:'真名感知',type:'god',mod:{intelli:2},desc:'识破谎言。'},
{id:'charisma',name:'领袖气质',type:'god',mod:{beauty:2},desc:'招募翻倍。'},
{id:'strategist',name:'谋主',type:'epic',mod:{intelli:2},desc:'识破假情报。'},
{id:'mindReader',name:'读心',type:'epic',mod:{intelli:2},desc:'猜测规律时减少错误选项。'},
{id:'ironWill',name:'铁心',type:'good',mod:{physic:1},desc:'免疫一次伙伴背叛。'},
{id:'charmer',name:'魅惑',type:'epic',mod:{beauty:2},desc:'许云汐诱拐成功率减半。'},
{id:'bornGhost',name:'天生鬼种',type:'god',mod:{physic:2,intelli:2},desc:'遇鬼概率翻倍，驾驭成功率+20%。'},
{id:'timeLoop',name:'轮回记忆',type:'epic',mod:{intelli:1},desc:'开局已知2条情报。'},
{id:'fateBreaker',name:'逆命',type:'god',mod:{},desc:'死亡时50%概率复活一次。'}

function fightGhost(g){
  if(trueIntelCount()>=3){
    story(['【情报加成】你掌握 '+trueIntelCount()+' 条真情报，战力+'+intelPowerBonus()+'。'],'intel');
  }
  var mp=myPower();
  story(['⚔️ 战斗开始','【我方战力】'+mp+' ｜ 【'+g.name+'战力】'+g.power],'fight');
  if(mp>g.power){
    story(['你的鬼群压了上去。'],'fight');
    if(mp>=g.power+15){
      story(['碾压。','它甚至没有反抗。','——它认了你。'],'fight');
    } else {
      story(['一场苦战。','你的鬼群与它纠缠了很久。','最后，它低下头。'],'fight');
    }
    return true;
  } else if(mp===g.power){
    story(['双方战力持平。'],'fight');
    if(Math.random()<0.5){
      story(['你在最后一刻压制了它。','它认了你。'],'fight');
      return true;
    } else {
      story(['它在最后一刻反扑。','你的鬼群被撕碎。'],'fight');
      die('战斗失败，你被【'+g.name+'】吞噬。');return false;
    }
  } else {
    story(['你冲上去。','——毫无悬念。','它甚至没有动。'],'fight');
    die('战力不足，你被【'+g.name+'】碾碎。');return false;
  }
}

function tryGhost(g){
  if(S.ghosts.length>=maxGhosts()){logLine('【驭鬼】已达上限。','ghost');return false;}
  if(S.physic >= g.diff){
    S.ghosts.push(g);
    logLine('【驭鬼成功】驾驭【'+g.name+'】！','ghost');
    applyMod({physic:-1});
    renderStatus();
    checkGhostAchieves();
    return true;
  }
  story(['你的体质不足以压制【'+g.name+'】。','它反噬了你。'],'bad');

}

function recruit(key){

  if(hasF('xu_active'))ch-=6+S.xuAllies*4;

function checkBetray(){
  if(!S.alive)return;
  var list=S.partners.slice();
  var betrayals=[];
  for(var i=0;i<list.length;i++){
    var p=list[i];
    if(!p.alive||p.side!=='player')continue;
    if(p.key==='guTingyu'&&!p.betrayed&&S.age>=p.joinedAt+6+Math.floor(Math.random()*4)){
      betrayals.push({p:p,type:'gu'});continue;
    }
    if(hasF('xu_active')&&p.trust<45&&Math.random()<0.12){
      var r=S.intelli*0.8+S.beauty*0.6+(p.trust-50)*0.3+S.intel.length*0.5;
      if(S.starFormed)r+=5;if(S.xuServant)r+=99;if(r>10)continue;
      betrayals.push({p:p,type:'xu'});

  }
  if(betrayals.length===0)return;

    removeT('ironWill');
    story(['【铁心】你的意志坚定，抵挡了这一次背叛。'],'good');

    if(betrayals[i].type==='gu'){
      p.betrayed=true;p.side='xu';S.xuAllies++;
      story(['【'+p.name+'】"对不起。我从来就不是你这边的。"']);

      p.betrayed=true;p.side='xu';S.xuAllies++;

        var atk=Math.floor(Math.random()*3);
        if(atk===0){applyMod({physic:-1});}

        else{applyMod({physic:-1});}
      }
    }
  }
}

function ask(choices){
  return new Promise(function(res){
    var list=(choices||[]).filter(function(c){return c&&c.text;});
    if(!list.length){list=[{text:'……继续前行',effect:function(){logLine('　→ 你继续前行。','normal');}}];}
    choiceBox.style.display='block';choiceList.innerHTML='';
    logLine('　▸ 做出选择……','tip');
    var anyAvail=false;
    list.forEach(function(c,i){
      var avail=true;
      if(c.cond){try{avail=!!c.cond();}catch(e){avail=false;}}
      if(avail)anyAvail=true;
      var b=document.createElement('button');
      b.type='button';b.className='choice-btn';
      if(!avail){b.disabled=true;b.textContent='【'+(i+1)+'】'+c.text+'（条件不足）';}
      else b.textContent='【'+(i+1)+'】'+c.text;
      b.addEventListener('click',function(){
        if(!avail)return;
        choiceBox.style.display='none';choiceList.innerHTML='';
        logLine('　→ 你选择了：'+c.text,'intel');
        var result;
        try{result=c.effect?c.effect(S):undefined;}
        catch(err){console.error('effect error:',err);result=undefined;}
        Promise.resolve(result).then(function(){renderStatus();res(c);})
        .catch(function(err){console.error('effect promise error:',err);renderStatus();res(c);});
      });
      choiceList.appendChild(b);
    });
    if(!anyAvail){
      var cb=document.createElement('button');
      cb.type='button';cb.className='choice-btn';
      cb.textContent='【继续】条件不足，你只能继续前行……';
      cb.addEventListener('click',function(){
        choiceBox.style.display='none';choiceList.innerHTML='';
        logLine('　→ 你继续前行。','normal');
        res({text:'继续前行'});
      });
      choiceList.appendChild(cb);
    }
    try{choiceBox.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
  });
}

function makeGuessChoices(g, onCorrect){
  var guessChoices=[];
  var sourceGuess=g.guess.slice();
  if(hasT('mindReader')){
    var wrongs=sourceGuess.filter(function(o){return !o.correct;});
    var corrects=sourceGuess.filter(function(o){return o.correct;});
    var keepWrongs=wrongs.slice(0,Math.ceil(wrongs.length/2));
    sourceGuess=corrects.concat(keepWrongs);
  }
  var shuffled=sourceGuess.slice();
  for(var i=shuffled.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=tmp;
  }
  shuffled.forEach(function(opt){
    guessChoices.push({text:'　"'+opt.text+'"',effect:function(){
      if(opt.correct){
        story(['—— 你说对了。'],'rule');
        S.knownRules[g.name]=true;
        addIntel('i_rule_'+g.name,'【'+g.name+'】规律：'+g.rule,true);
        logLine('【洞悉】你摸清了【'+g.name+'】的杀人规律：'+g.rule,'rule');
        if(Object.keys(S.knownRules).length>=13)unlockAchieve('know_all_rules');
        return onCorrect();
      } else {
        story(['—— 你猜错了。'],'bad');
        die(g.wrongDeath||('你违反了【'+g.name+'】的规律。'));
      }
    }});
  });
  return guessChoices;
}

      if(r){story(['它认了你。','但它的规则不允许被驾驭。','你只能离开。'],'ghost');}
    }});
  }

  choices.push({text:'😨 转身就逃',effect:function(){
    if(kind==='normal'){
      if(S.knownRules[g.name]){story(['你按规律后退。','它没有追来。']);applyMod({intelli:1});}
      else if(hasItem('blackUmbrella')&&g.name==='雨点鬼'){story(['你撑开黑伞。','雨点落在伞面上，安静地滑开。']);applyMod({intelli:1});}
      else if(Math.random()<0.55){die(g.flee);}
      else{story(['你转身就跑。它没有立刻追来。']);applyMod({physic:-1});}
    } else if(kind==='strong'){
      if(Math.random()<0.40){story(['你跑得很快。']);applyMod({physic:-1});}
      else die(g.flee);
    } else {die(g.flee);}
  }});

  choices.push({text:'👁️ 冷静观察，猜测它的规律',effect:function(){
    if(kind==='top'){die(g.obs);return;}
    story(['你强迫自己不动，仔细观察它。'],'ghost');
    story(['【提示】'+g.hint],'rule');
    story(['现在，你必须猜测它的杀人规律——猜错会死。'],'danger');
    var guessChoices = makeGuessChoices(g, function(){
      story(['你摸清了它的规律——现在，你可以尝试驾驭它。'],'rule');
      return askTame(g);
    });
    return ask(guessChoices);
  }});

  choices.push({text:'💬 尝试与它对话',effect:function(){
    if(kind==='normal'){
      if(S.intelli>=7||hasT('trueName')){
        story(['你开口说了一句话。','它停住了。']);
        story(['【提示】'+g.hint],'rule');
        var guessChoices = makeGuessChoices(g, function(){
          story(['你摸清了它的规律——现在，你可以尝试驾驭它。'],'rule');
          return askTame(g);
        });
        return ask(guessChoices);
      } else {
        if(Math.random()<0.5)die(g.wrongDeath||('你的话触犯了它的禁忌。'));
        else{story(['它只是看着你。']);applyMod({physic:-1});}
      }
    } else if(kind==='strong'){
      if(S.intelli>=8&&Math.random()<0.6){
        story(['你冷静开口。','它停了一瞬，然后退去。']);
        addIntel('i_t_'+g.name,'你和它对话过。',true);applyMod({intelli:1});
      } else die(g.wrongDeath||('你的话触犯了它的禁忌。'));
    } else if(kind==='special'){
      if(S.intelli>=8||hasT('trueName')){
        story(['你冷静说了一句话。','它停住了。']);
        story(['【提示】'+g.hint],'rule');
        var guessChoices = makeGuessChoices(g, function(){
          story(['你摸清了它的规律。'],'rule');
        });
        return ask(guessChoices);
      } else {
        if(Math.random()<0.4)die(g.wrongDeath);
        else{story(['它没有理你。']);applyMod({physic:-1});}
      }
    } else {
      if(S.physic>=9&&S.intelli>=8&&(hasT('twinSoul')||hasI('i_twin'))&&trueIntelCount()>=6){
        story(g.ok,'god');S.ghosts.push(g);logLine('【驭龙】你驾驭了龙王之影！','win');applyMod({physic:-2});renderStatus();
        unlockAchieve('dragon_rider');
      } else die(g.wrongDeath||'你的话触犯了它。');
    }
  }});

  return {id:'enc_'+g.name,minAge:minAge,maxAge:MAXAGE,once:true,_isGhost:true,text:text,infoLines:infoLines,choices:choices};
}

   story(['—— 人心 ——'],'xu');
   var defected=[];
   var mine=alivePlayerPartners();
   for(var i=0;i<mine.length;i++){
     var p=mine[i];
     var charmChance=0.45+S.beauty*0.02-p.trust*0.005;
     if(hasT('charmer'))charmChance*=0.5;
     if(p.key==='yangKaidong')charmChance-=0.1;
     if(p.key==='luBiao')charmChance-=0.1;
     if(S.starFormed)charmChance-=0.05;
     if(Math.random()<charmChance){
       p.side='xu';S.xuAllies++;defected.push(p.name);
       story(['【'+p.name+'】把一封短信放在你桌上。'],'xu');
       story(['短信上只有两个字：'],'xu');
       story(['"对不起。"'],'xu');
       story(['你看着那两个字。'],'danger');
       story(['想起了他第一次对你笑的样子。'],'danger');
     }
   }
   if(S.starFormed&&defected.length>0){S.starFormed=false;story(['★【双子星·破碎】'],'danger');}
   if(!defected.length){
     story(['但你的伙伴们，一个都没有走。'],'good');
     story(['他们看着你的眼神，很平静。'],'partner');
     story(['"她确实漂亮。"'],'partner');
     story(['"但我们又不是为了漂亮才跟着你。"'],'partner');
     logLine('【忠诚】没有人离开。','good');
     return;
   }
   logLine('【损失】'+defected.length+'名伙伴被许云汐带走。','xu');
   var mp=myPower();var xp=xuPower();
   return ask([
     {text:'⚔️ 现在就去抢回他们！（战力 '+mp+' vs '+xp+'）',effect:function(){
       story(['你没有犹豫。'],'fight');
       story(['你直接走向她的住处。'],'fight');
       story(['—— 抢人 ——'],'fight');
       story(['"把他们还给我。"'],'fight');
       story(['她站在门口。'],'xu');
       story(['白裙。'],'xu');
       story(['"他们自己选的。"'],'xu');
       story(['"那就问他们敢不敢当着我的面再说一遍。"'],'fight');
       story(['你召出了所有的鬼。'],'fight');
       if(mp>xp){
         story(['战斗只持续了十分钟。'],'fight');
         story(['你站在她面前。'],'fight');
         story(['她退了三步。'],'xu');
         story(['她的脸第一次失了颜色。'],'xu');
         story(['"我输了。"'],'xu');
         for(var i=0;i<S.partners.length;i++){
           if(S.partners[i].side==='xu'&&S.partners[i].key!=='xuYunxi'){
             S.partners[i].side='player';S.partners[i].trust=45;
             story(['【'+S.partners[i].name+'】低着头走了回来。'],'partner');
             story(['"对不起。"'],'partner');
           }
         }
         S.xuAllies=0;renderStatus();
         logLine('【胜利】你抢回了所有伙伴。','win');
         var lu=getP('陆标'),yk=getP('杨开冬');
         if(lu&&yk&&lu.alive&&yk.alive&&lu.side==='player'&&yk.side==='player'){
           S.starFormed=true;
           story(['★ 陆标与杨开冬重新并肩。'],'star');
         }
       } else if(mp>=xp*0.8){
         story(['一场惨烈的战斗。'],'fight');
         story(['血。'],'fight');
         story(['灵力的爆炸。'],'fight');
         story(['你没能抢回所有人。','但你抢回了几个。'],'fight');
         var recov=0;
         for(var i=0;i<S.partners.length;i++){
           if(S.partners[i].side==='xu'&&S.partners[i].key!=='xuYunxi'&&recov<defected.length/2){
             S.partners[i].side='player';S.partners[i].trust=40;recov++;
             story(['【'+S.partners[i].name+'】走了回来。'],'partner');
           }
         }
         S.xuAllies=Math.max(0,S.xuAllies-recov);
         renderStatus();
         logLine('【惨胜】你只抢回了一半伙伴。','danger');
         applyMod({physic:-2});
       } else {
         story(['—— 你冲上去。'],'fight');
         story(['她的鬼群比你想象的更强。'],'fight');
         story(['你被围住。'],'fight');
         story(['"记住今天。"'],'xu');
         story(['她转身走了。'],'xu');
         logLine('【失败】你没能抢回任何人。','blood');
         applyMod({physic:-3});
       }
     }},
     {text:'💬 先忍下来。君子报仇，十年不晚。',effect:function(){
       story(['你收起了所有的怒气。'],'normal');
       story(['"我会记住的。"你说。'],'xu');
       story(['她笑。'],'xu');
       story(['"我等你。"'],'xu');
       story(['你转身走了。'],'xu');
       story(['你心里某个东西——冷了。'],'danger');
     }}
   ]);
 }},

var ALL=EVENTS.concat(RP).concat(GHOST_ENCOUNTERS);

function resolveFinal(){
  var mp=myPower();
  var mine=alivePlayerPartners();
  var pp=mine.reduce(function(a,p){return a+p.power;},0);
  var tp=mp+pp;
  if(hasF('path_blood')){
    for(var i=0;i<S.partners.length;i++){
      var p=S.partners[i];
      if(p.alive&&p.side==='player'&&p.key!=='xuYunxi'){p.alive=false;story(['【献祭】你亲手结束了 '+p.name+' 的生命。'],'blood');}
    }
    story(['血顺着你的手流下来。','"成王者，须手刃所爱。"'],'blood');
    story(['第一道光从墙缝透出。第二道光从天花板落下。第三道光从你的脚底升起。'],'blood');
    story(['你看见了优呵的过去。','"为什么杀死所有人？"','"因为只有我，值得活着。"'],'youhe');
    story(['你戴上了王冠。','"你终于来了。另一个我。"'],'youhe');
    story(['——那不是战斗。','那是两个孤独者，互相撕咬。'],'youhe');
    logLine('🏆【坏结局·血之哀】你与优呵一样，坐在孤独的王座上。','blood');
    S.ended=true;return;
  }
  if(hasF('path_alone')){
    if(tp>=60)die('优呵的规则将你抹除。逆者，皆当死去。');else die('你被抹除。');return;
  }
  if(hasF('path_together')){
    var yk=getP('杨开冬');
    var ykOK=yk&&yk.alive&&yk.side==='player'&&yk.isGhostMaster;
    var gOK=S.ghosts.length>=3;
    if(ykOK&&gOK&&tp>=70){
      story(['优呵的恶意如山。','每一秒，都有人在倒下。','但你们没有退。'],'youhe');
      story(['三小时后，优呵的力量第一次出现了枯竭。'],'win');
      logLine('🏆【真结局·欲与天公试比高】优呵被彻底击溃，诡异终结。','win');
      S.ended=true;return;
    }
    if(!ykOK){die('杨开冬不在。');return;}
    if(!gOK){die('你的鬼不够多。');return;}
    if(tp<70){die('力量差距太大。逆者，皆当死去。');return;}
  }
  if(tp>=80){logLine('🏆【隐藏结局·破壁者】','win');S.ended=true;}
  else die('你的力量不足以撼动优呵。');
}

function checkReq(e,usedArcs){
  if(e.once&&S.usedEvents[e.id])return false;
  if(S.age<e.minAge||S.age>e.maxAge)return false;
  if(e.arc&&usedArcs&&usedArcs[e.arc])return false;
  if(e.arc&&e.stage){var cur=S.arcs[e.arc]||0;if(e.stage!==cur+1)return false;}
  if(e.requires){for(var i=0;i<e.requires.length;i++){if(!hasF(e.requires[i]))return false;}}
  if(e.cond){try{if(!e.cond(S))return false;}catch(err){return false;}}
  return true;
}
function pick(usedArcs,usedYear,usedGlobal){
  try{
    var pool=[];
    ALL.forEach(function(e){
      if(usedYear&&usedYear[e.id])return;
      if(e.repeatable&&usedGlobal&&usedGlobal[e.id]&&(S.age-usedGlobal[e.id])<10)return;
      if(checkReq(e,usedArcs))pool.push(e);
    });
    if(!pool.length)return null;
    var isGM=hasT('ghostMagnet');
    var bornG=hasT('bornGhost');
    var ghostPool=pool.filter(function(e){return e._isGhost;});
    var normalPool=pool.filter(function(e){return !e._isGhost;});
    var ghostChance=isGM?0.55:0.12;
    if(bornG)ghostChance+=0.15;
    var arr;
    if(ghostPool.length&&Math.random()<ghostChance)arr=ghostPool;
    else if(normalPool.length)arr=normalPool;
    else if(ghostPool.length)arr=ghostPool;
    else arr=pool;
    var total=arr.reduce(function(a,e){return a+(e.weight||1);},0);
    var rr=Math.random()*total;
    for(var i=0;i<arr.length;i++){var w=arr[i].weight||1;rr-=w;if(rr<=0)return arr[i];}
    return arr[arr.length-1];
  }catch(err){return null;}
}

function runEvent(e){
  var ev=e;
  if(e.repeatable&&e.variants&&e.variants.length){
    var v=e.variants[Math.floor(Math.random()*e.variants.length)];
    ev=Object.assign({},e,v);
  }
  if(ev.once)S.usedEvents[ev.id]=true;
  if(ev.arc&&ev.stage)S.arcs[ev.arc]=ev.stage;
  if(ev.sets){for(var k in ev.sets){if(ev.sets[k])S.flags[k]=true;}}
  if(ev.repeatable)S.usedYearAll[ev.id]=S.age;
  var text=typeof ev.text==='function'?ev.text(S):ev.text;
  logLine('【'+S.age+'岁】'+text);
  if(ev.infoLines){
  var lines = (typeof ev.infoLines==='function') ? ev.infoLines() : ev.infoLines;
  for(var li=0;li<lines.length;li++){logLine('　　'+lines[li],'intel');}
}
  return new Promise(function(res){
    try{
      if(ev.effect&&!ev.choices){
        var ret=ev.effect(S);
        Promise.resolve(ret).then(function(){renderStatus();res();}).catch(function(){renderStatus();res();});
      } else if(ev.choices){
        if(ev.effect){try{ev.effect(S);}catch(err){}}
        ask(ev.choices).then(function(){renderStatus();res();}).catch(function(){renderStatus();res();});
      } else {
        renderStatus();res();
      }
    }catch(err){console.error(err);renderStatus();res();}
  });
}

function gameLoop(){
  return new Promise(function(res){
    function step(){
      try{
        if(!S.alive||S.ended||S.age>=120){res();return;}
        S.age++;renderStatus();
        if(S.age>85&&Math.random()<0.15){story(['你在睡梦中安然离世。']);S.alive=false;res();return;}
        var hasEvent=Math.random()<0.60;
        if(!hasEvent){
          logLine('【'+S.age+'岁】这一年平平安安，什么都没有发生。','good');
          afterYear(res,step);return;
        }
        var cnt=1+Math.floor(Math.random()*3);
        var usedA={},usedY={},anyE=false,n=0;
        var one=function(){
          if(n>=cnt||!S.alive||S.ended)return Promise.resolve();
          var e=pick(usedA,usedY,S.usedYearAll);
          if(!e)return Promise.resolve();
          usedY[e.id]=true;if(e.arc)usedA[e.arc]=true;
          anyE=true;n++;
          return runEvent(e).then(function(){
            if(S.alive&&!S.ended&&n<cnt)return sleep(SPEED*0.6).then(one);
          });
        };
        one().then(function(){afterYear(res,step);}).catch(function(err){console.error(err);sleep(SPEED).then(step);});
      }catch(err){res();}
    }
    function afterYear(res,step){
      if(!S.alive||S.ended){res();return;}
      partnerEffect();checkBetray();xuRecruit();
      if(Math.random()<0.4)xuInfl();
      if(S.alive&&S.ghosts.length>=maxGhosts()&&Math.random()<0.05){
        if(hasT('recoverImmune')){removeT('recoverImmune');logLine('【厉鬼复苏】免疫挡下！','bad');}
        else if(S.physic<=3){die('多只厉鬼同时复苏，你被撕碎。');}
        else{applyMod({physic:-1});logLine('【厉鬼复苏】你强行压住。','bad');}
      }
      renderStatus();
      if(!S.alive||S.ended){res();return;}
      sleep(SPEED).then(step);
    }
    step();
  });
}

function readInputs(){return inputs.map(function(el){var v=parseInt(el.value,10);if(isNaN(v))v=0;return Math.max(0,Math.min(ATTR_MAX,v));});}
function startGame(){
  if(S.running)return;
  if(S.alive&&!S.ended&&S.age>0)return;
  S.running=true;
  S.age=0;S.alive=true;S.ended=false;
  S.intel=[];S.intelIds={};S.ghosts=[];S.partners=[];S.items=[];
  S.flags={};S.arcs={};S.usedEvents={};S.usedYearAll={};S.knownRules={};
  S.skip=false;S.xuAllies=0;S.zzPraise=0;S.xuServant=false;S.starFormed=false;
  S.zxAlive=true;S.zxGrant=0;S.battle35Done=false;S.xuDefeated=false;S.usedFate=false;
  skipBtn.textContent='⏩ 跳过等待';
  logDom.innerHTML='';choiceBox.style.display='none';
  renderStatus();enforce();
  var v=readInputs();
  S.beauty=v[0];S.intelli=v[1];S.physic=v[2];S.family=v[3];
  S.talents.forEach(function(t){applyMod(t.mod);});
  if(hasT('timeLoop')){
    addIntel('i_loop_1','世界的真相远比表面复杂。',true);
    addIntel('i_loop_2','优呵是第一代龙王。',true);
  }
  startBtn.disabled=true;rollBtn.disabled=true;restartBtn.disabled=true;
  logLine('══════ 轮回开始 ══════','epic');renderStatus();
  logLine('　战力 = 体质×1.2 + 鬼力 + 队友 + 情报加成','rule');
  logLine('　驾驭鬼：体质 ≥ 鬼的驾驭难度，必定成功','rule');
  sleep(SPEED).then(function(){return gameLoop();})
  .then(function(){
    if(!S.alive&&!S.ended)logLine('【结局】你的轮回就此终结。','dead');
    S.running=false;startBtn.disabled=false;restartBtn.disabled=false;rollBtn.disabled=false;
  })
  .catch(function(err){S.running=false;startBtn.disabled=false;restartBtn.disabled=false;rollBtn.disabled=false;});
}
function resetGame(){
  if(S.running)return;
  logDom.innerHTML='';
  S.age=0;S.alive=true;S.ended=false;
  S.intel=[];S.intelIds={};S.ghosts=[];S.partners=[];S.items=[];
  S.flags={};S.arcs={};S.usedEvents={};S.usedYearAll={};
  S.talents=[];S.talentIds={};S.xuAllies=0;S.zzPraise=0;S.xuServant=false;S.starFormed=false;
  S.zxAlive=true;S.zxGrant=0;S.knownRules={};S.battle35Done=false;S.xuDefeated=false;S.usedFate=false;
  talentShow.innerHTML='';choiceBox.style.display='none';
  inputs.forEach(function(el){el.value='0';});
  enforce();renderStatus();
  startBtn.disabled=true;rollBtn.disabled=false;
}

rollBtn.addEventListener('click',function(){
  var copy=TALENTS.slice();
  S.talents=[];S.talentIds={};talentShow.innerHTML='';
  for(var i=0;i<3;i++){
    var r=Math.floor(Math.random()*copy.length);
    var t=copy.splice(r,1)[0];
    S.talents.push(t);S.talentIds[t.id]=true;
    var cls='';
    if(t.type==='good')cls='good';else if(t.type==='bad')cls='bad';
    else if(t.type==='god')cls='god';else if(t.type==='epic')cls='epic';else cls='normal';
    var d=document.createElement('div');d.className=cls;
    d.textContent='■ '+t.name+'｜'+t.desc;talentShow.appendChild(d);
  }
  startBtn.disabled=false;
});
startBtn.addEventListener('click',startGame);
restartBtn.addEventListener('click',resetGame);
skipBtn.addEventListener('click',function(){
  S.skip=!S.skip;
  skipBtn.textContent=S.skip?'⏩ 恢复等待':'⏩ 跳过等待';
});

enforce();renderStatus();updateAchCount();
logLine('欢迎来到规则怪谈世界。','tip');
});
</script>
