<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝖘𝖚𝖓𝖘𝖊𝖙 | 水灵幻境</title>
    <style>
        /* ================= 基础设置与水灵主题 ================= */
        :root {
            --aqua-light: #a3e5ff;
            --aqua-blue: #4facfe;
            --aqua-deep: #0f2027;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --text-main: #ffffff;
            --text-sub: #b0e0e6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: var(--text-main);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto; /* 允许纵向滑动 */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 100px; /* 底部留白 */
        }

        /* ================= 背景图层 (固定不随滚动移动) ================= */
        .bg-images {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
            background: #0f2027;
        }

        .bg-img {
            position: absolute;
            opacity: 0.15; /* 调高了透明度 */
            filter: blur(4px);
            transition: opacity 0.5s;
        }

        .bg-img:nth-child(1) {
            top: 10%; left: -5%; width: 500px;
            transform: rotate(-10deg);
        }
        .bg-img:nth-child(2) {
            top: 40%; right: -10%; width: 600px;
            transform: rotate(5deg);
        }
        .bg-img:nth-child(3) {
            bottom: -5%; left: 10%; width: 550px;
            transform: rotate(-5deg);
        }

        #bubble-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* ================= 水波纹特效 ================= */
        .water-ripple {
            position: fixed;
            border-radius: 50%;
            background: transparent;
            border: 2px solid rgba(163, 229, 255, 0.6);
            transform: translate(-50%, -50%) scale(0);
            animation: rippleAnim 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            pointer-events: none;
            z-index: 9999;
        }
        .water-ripple:nth-child(2) {
            border-width: 1px;
            animation-duration: 1s;
        }

        @keyframes rippleAnim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
        }

        /* ================= 瀑布流/多元网格布局 ================= */
        .dashboard {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 25px;
            width: 90%;
            max-width: 1200px;
            margin-top: 50px;
        }

        /* 响应式网格配置 */
        .col-span-12 { grid-column: span 12; }
        .col-span-8 { grid-column: span 8; }
        .col-span-6 { grid-column: span 6; }
        .col-span-4 { grid-column: span 4; }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .col-span-12, .col-span-8, .col-span-6, .col-span-4 { grid-column: span 1; }
        }

        /* ================= 透明方框 (毛玻璃) ================= */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--glass-shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(163, 229, 255, 0.4);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(163, 229, 255, 0.1);
        }

        /* ================= 个人信息卡片 ================= */
        .profile-content {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            flex-shrink: 0;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.3) 0%, transparent 70%);
            padding: 5px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            mix-blend-mode: multiply;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid var(--aqua-light);
            box-shadow: 0 0 20px rgba(163, 229, 255, 0.5);
            transition: transform 0.3s;
        }

        .avatar-container:hover .avatar-img {
            transform: scale(1.05) rotate(3deg);
        }

        .profile-text { display: flex; flex-direction: column; gap: 10px; }

        .name-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, var(--aqua-light), var(--aqua-blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 4px;
        }

        .slogan {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--aqua-light);
            text-shadow: 0 0 10px rgba(163, 229, 255, 0.5);
            opacity: 0;
            transform: translateY(10px);
            transition: all 1s ease;
            font-family: "STKaiti", "楷体", serif;
        }
        .slogan.show { opacity: 1; transform: translateY(0); }

        /* ================= 时钟模块 ================= */
        .clock-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(163, 229, 255, 0.1), transparent);
        }
        .clock-time {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px var(--aqua-blue);
            font-family: 'Courier New', Courier, monospace;
        }
        .clock-date { font-size: 1rem; color: var(--text-sub); margin-top: 5px; letter-spacing: 1px; }

        /* ================= 按钮组与面板 ================= */
        .panel-title {
            font-size: 1.2rem;
            color: var(--aqua-light);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(163, 229, 255, 0.2);
            padding-bottom: 10px;
        }

        .aqua-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(163, 229, 255, 0.3);
            color: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .aqua-btn:hover {
            background: rgba(163, 229, 255, 0.15);
            border-color: var(--aqua-light);
            box-shadow: 0 0 15px rgba(163, 229, 255, 0.3);
            padding-left: 25px;
        }

        /* ================= 俄罗斯方块模块 ================= */
        .tetris-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        #tetrisCanvas {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .tetris-info {
            display: flex; flex-direction: column; gap: 15px;
        }
        .tetris-btn {
            background: rgba(163, 229, 255, 0.1);
            border: 1px solid var(--aqua-light);
            color: #fff; padding: 10px;
            border-radius: 8px; cursor: pointer; font-size: 0.9rem;
            transition: 0.2s;
        }
        .tetris-btn:active { background: rgba(163, 229, 255, 0.3); }

        /* ================= 音乐播放器 ================= */
        .music-btn-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            margin-top: auto;
        }
        .play-btn {
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 2px solid var(--aqua-light);
            background: transparent;
            color: var(--aqua-light);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s;
        }
        .play-btn:hover { background: rgba(163, 229, 255, 0.2); box-shadow: 0 0 20px rgba(163, 229, 255, 0.6); }
        .play-btn.playing { animation: pulseAqua 2s infinite alternate; }

        @keyframes pulseAqua {
            0% { box-shadow: 0 0 10px rgba(163, 229, 255, 0.3); }
            100% { box-shadow: 0 0 30px rgba(163, 229, 255, 0.8), inset 0 0 10px rgba(163, 229, 255, 0.5); }
        }

        /* ================= 可拖拽的琉璃水泡 ================= */
        .aqua-orb {
            position: fixed;
            width: 100px; height: 100px;
            border-radius: 50%;
            z-index: 100;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8) 0%, rgba(163, 229, 255, 0.3) 40%, rgba(79, 172, 254, 0.1) 80%, transparent 100%);
            box-shadow: inset -10px -10px 20px rgba(0, 0, 0, 0.2), inset 10px 10px 20px rgba(255, 255, 255, 0.7), 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: grab;
            top: 70%; left: 85%;
            transition: transform 0.1s;
            touch-action: none;
        }
        .aqua-orb:active { cursor: grabbing; transform: scale(1.1); }
        .aqua-orb::before {
            content: '';
            position: absolute;
            top: 15%; left: 20%;
            width: 20px; height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: rotate(-45deg);
            filter: blur(2px);
        }

        /* ================= 模态框 (游戏选择) ================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 32, 39, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--aqua-light);
            border-radius: 20px;
            padding: 40px;
            width: 90%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-content h2 { color: var(--aqua-light); margin-bottom: 25px; letter-spacing: 2px; }
        .game-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .game-item {
            display: block; padding: 15px;
            background: rgba(163, 229, 255, 0.05);
            border: 1px solid rgba(163, 229, 255, 0.3);
            border-radius: 10px; color: #fff; text-decoration: none;
            transition: all 0.3s; font-weight: 500;
        }
        .game-item:hover {
            background: rgba(163, 229, 255, 0.2);
            border-color: var(--aqua-light);
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(163, 229, 255, 0.3);
        }
        .close-btn {
            background: transparent; border: none; color: #aaa; font-size: 1rem; cursor: pointer; transition: color 0.3s;
        }
        .close-btn:hover { color: var(--aqua-light); }

        @media (max-width: 768px) {
            .profile-content { flex-direction: column; text-align: center; }
            .aqua-orb { width: 70px; height: 70px; top: 85%; left: 80%; }
            .tetris-container { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <canvas id="bubble-canvas"></canvas>
    <div class="aqua-orb" id="aquaOrb"></div>

    <!-- 主内容区 -->
    <div class="dashboard">
        
        <!-- 1. 个人资料 (占据大半行) -->
        <div class="glass-panel col-span-8">
            <div class="profile-content">
                <div class="avatar-container">
                    <img src="avatar.png" alt="Sunset" class="avatar-img" onerror="this.src='https://api.dicebear.com/7.x/adventurer/svg?seed=sunset&backgroundColor=transparent'">
                </div>
                <div class="profile-text">
                    <h1 class="name-title" id="typewriter"></h1>
                    <div class="slogan" id="slogan">我重临世界之日，诸逆臣皆当死去</div>
                </div>
            </div>
        </div>

        <!-- 2. 北京时间 -->
        <div class="glass-panel col-span-4 clock-panel">
            <div class="panel-title" style="border:none; margin-bottom: 10px; padding:0;">⏱ 北京时间</div>
            <div class="clock-time" id="clock-time">00:00:00</div>
            <div class="clock-date" id="clock-date">2026年 01月 01日</div>
        </div>

        <!-- 3. 功能链接与音乐 -->
        <div class="glass-panel col-span-6">
            <div class="panel-title"><i>🔗</i> 幻境入口</div>
            
            <button class="aqua-btn" onclick="toggleGameModal(true)">
                <span>𝖬𝖞 𝖦𝖆𝖒𝖊𝖘🥣</span>
                <i>➔</i>
            </button>

            <!-- QQ API 加好友 (利用腾讯协议或提示复制) -->
            <a href="tencent://message/?uin=3168565832&Site=&menu=yes" onclick="copyQQ(event)" class="aqua-btn">
                <span>添加我为QQ好友</span>
                <i>💬</i>
            </a>

            <div class="music-btn-container">
                <div>
                    <div style="font-weight: bold; margin-bottom: 5px;">你听得到</div>
                    <div style="font-size: 0.8rem; color: var(--text-sub);">正在播放</div>
                </div>
                <button class="play-btn" id="playBtn">▶</button>
            </div>
        </div>

    </div>
    
    <!-- 4. 俄罗斯方块 -->
    <br></br>
        <div class="glass-panel col-span-6">
            <div class="panel-title"><i>🧊</i> 方块迷阵 (俄罗斯方块)</div>
            <div class="tetris-container">
                <canvas id="tetrisCanvas" width="200" height="400"></canvas>
                <div class="tetris-info">
                    <div style="font-size: 1.2rem; color: var(--aqua-light);">得分: <span id="score">0</span></div>
                    <div style="font-size: 0.85rem; color: #aaa; line-height: 1.5;">
                        使用键盘 ↑ 旋转<br>
                        使用 ← → 移动<br>
                        使用 ↓ 加速下坠
                    </div>
                    <button class="tetris-btn" onclick="startTetris()">重新开始</button>
                </div>
            </div>
        </div>

    <!-- 游戏选择模态框 -->
    <div class="modal-overlay" id="gameModal">
        <div class="modal-content">
            <h2>选择游戏</h2>
            <div class="game-list">
                <a href="game1.html" class="game-item">Game 1 · 启程</a>
                <a href="game2.html" class="game-item">Game 2 · 迷境</a>
                <a href="game3.html" class="game-item">Game 3 · 深渊</a>
                <a href="game4.html" class="game-item">Game 4 · 苍穹</a>
                <a href="game5.html" class="game-item">Game 5 · 终焉</a>
            </div>
            <button class="close-btn" onclick="toggleGameModal(false)">返回</button>
        </div>
    </div>

    <audio id="audioPlayer" loop src="music.mp3"></audio>

    <script>
        // ================= 1. 全局点击音效 & 水波纹 =================
        const clickAudio = new Audio('HomeOneclick.mp3');
        document.body.addEventListener('click', function(e) {
            clickAudio.currentTime = 0;
            clickAudio.play().catch(() => {});
            createRipple(e.clientX, e.clientY);
        });

        function createRipple(x, y) {
            for (let i = 0; i < 2; i++) {
                const ripple = document.createElement('div');
                ripple.classList.add('water-ripple');
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                const size = i === 0 ? 50 : 30;
                ripple.style.width = size + 'px';
                ripple.style.height = size + 'px';
                if (i === 1) ripple.style.animationDelay = '0.1s';
                document.body.appendChild(ripple);
                setTimeout(() => ripple.remove(), 1200);
            }
        }

        // ================= 2. 复制QQ并尝试唤起 =================
        function copyQQ(e) {
            navigator.clipboard.writeText("3168565832").then(() => {
                alert("QQ号已复制 (3168565832)！\n如果未能自动跳转QQ，请打开QQ粘贴搜索添加。");
            }).catch(() => {});
        }

        // ================= 3. 打字机效果 =================
        const nameText = "𝖘𝖚𝖓𝖘𝖊𝖙";
        const typewriterElement = document.getElementById("typewriter");
        const sloganElement = document.getElementById("slogan");
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < nameText.length) {
                typewriterElement.innerHTML += nameText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 150);
            } else {
                setTimeout(() => sloganElement.classList.add("show"), 400);
            }
        }
        window.onload = () => setTimeout(typeWriter, 500);

        // ================= 4. 北京时间时钟 =================
        function updateClock() {
            const now = new Date();
            // 转换为北京时间 (UTC+8)
            const utc = now.getTime() + now.getTimezoneOffset() * 60000;
            const bjTime = new Date(utc + (3600000 * 8));

            const h = String(bjTime.getHours()).padStart(2, '0');
            const m = String(bjTime.getMinutes()).padStart(2, '0');
            const s = String(bjTime.getSeconds()).padStart(2, '0');
            document.getElementById('clock-time').textContent = `${h}:${m}:${s}`;

            const year = bjTime.getFullYear();
            const month = String(bjTime.getMonth() + 1).padStart(2, '0');
            const date = String(bjTime.getDate()).padStart(2, '0');
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const week = weekDays[bjTime.getDay()];
            document.getElementById('clock-date').textContent = `${year}年 ${month}月 ${date}日 ${week}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ================= 5. 音乐播放 =================
        const playBtn = document.getElementById('playBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    playBtn.classList.add('playing');
                    playBtn.innerHTML = '🎵';
                }).catch(err => console.error(err));
            } else {
                audioPlayer.pause();
                playBtn.classList.remove('playing');
                playBtn.innerHTML = '▶';
            }
        });

        // ================= 6. 模态框 =================
        function toggleGameModal(show) {
            document.getElementById('gameModal').classList[show ? 'add' : 'remove']('active');
        }
        document.getElementById('gameModal').addEventListener('click', function(e) {
            if (e.target === this) toggleGameModal(false);
        });

        // ================= 7. 水泡拖拽 =================
        const orb = document.getElementById('aquaOrb');
        let isDragging = false, offX = 0, offY = 0;

        function startDrag(e) {
            const cx = e.clientX || (e.touches && e.touches[0].clientX);
            const cy = e.clientY || (e.touches && e.touches[0].clientY);
            if (!cx) return;
            isDragging = true;
            const rect = orb.getBoundingClientRect();
            offX = cx - rect.left; offY = cy - rect.top;
            e.preventDefault(); e.stopPropagation();
        }

        function onDrag(e) {
            if (!isDragging) return;
            const cx = e.clientX || (e.touches && e.touches[0].clientX);
            const cy = e.clientY || (e.touches && e.touches[0].clientY);
            if (!cx) return;
            let x = Math.max(0, Math.min(cx - offX, window.innerWidth - orb.offsetWidth));
            let y = Math.max(0, Math.min(cy - offY, window.innerHeight - orb.offsetHeight));
            orb.style.left = x + 'px'; orb.style.top = y + 'px';
            orb.style.transform = 'scale(1.1)';
            e.preventDefault();
        }

        function stopDrag() {
            if (isDragging) { isDragging = false; orb.style.transform = 'scale(1)'; }
        }

        orb.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);
        orb.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('touchmove', onDrag, { passive: false });
        document.addEventListener('touchend', stopDrag);

        // ================= 8. 背景气泡 Canvas =================
        const canvas = document.getElementById("bubble-canvas");
        const ctx = canvas.getContext("2d");
        let W, H, bubbles = [];
        const mouse = { x: null, y: null, radius: 120 };

        window.addEventListener("mousemove", (e) => {
            mouse.x = e.x; mouse.y = e.y;
        });
        window.addEventListener("mouseout", () => {
            mouse.x = null; mouse.y = null;
        });

        function initCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            bubbles = [];
            for (let i = 0; i < Math.floor(W * H / 15000); i++) {
                bubbles.push(new Bubble());
            }
        }

        class Bubble {
            constructor() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = Math.random() * 15 + 5;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.density = (Math.random() * 20) + 1;
                this.opacity = Math.random() * 0.3 + 0.1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(163, 229, 255, ${this.opacity})`;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x - this.size * 0.3, this.y - this.size * 0.3, this.size * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity + 0.2})`;
                ctx.fill();
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x, dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        this.x -= (dx / distance) * ((mouse.radius - distance) / mouse.radius) * this.density;
                        this.y -= (dy / distance) * ((mouse.radius - distance) / mouse.radius) * this.density;
                    }
                }
                if (this.y < -this.size || this.x < -this.size || this.x > W + this.size) {
                    this.y = H + this.size;
                    this.x = Math.random() * W;
                }
                this.draw();
            }
        }
        function animate() {
            ctx.clearRect(0, 0, W, H);
            bubbles.forEach(b => b.update());
            requestAnimationFrame(animate);
        }
        initCanvas(); animate(); window.addEventListener("resize", initCanvas);

        // ================= 9. 俄罗斯方块逻辑 =================
        const tetrisCanvas = document.getElementById('tetrisCanvas');
        const tCtx = tetrisCanvas.getContext('2d');
        const COLS = 10, ROWS = 20, BLOCK_SIZE = 20;
        
        let board = [];
        let score = 0;
        let dropCounter = 0, dropInterval = 1000, lastTime = 0;
        let piece = null;
        let gameOver = false;
        let tetrisInterval = null;

        // 水灵色系方块
        const COLORS = ['#a3e5ff', '#4facfe', '#00f2fe', '#43e97b', '#38f9d7', '#fa709a', '#fee140'];
        const SHAPES = [
            [[1,1,1,1]], // I
            [[1,1],[1,1]], // O
            [[0,1,0],[1,1,1]], // T
            [[1,0,0],[1,1,1]], // L
            [[0,0,1],[1,1,1]], // J
            [[0,1,1],[1,1,0]], // S
            [[1,1,0],[0,1,1]]  // Z
        ];

        function createPiece() {
            const typeId = Math.floor(Math.random() * SHAPES.length);
            const shape = SHAPES[typeId];
            return {
                shape: shape,
                color: COLORS[typeId],
                x: Math.floor(COLS / 2) - Math.floor(shape[0].length / 2),
                y: 0
            };
        }

        function drawBoard() {
            tCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            tCtx.fillRect(0, 0, tetrisCanvas.width, tetrisCanvas.height);

            // 画网格线
            tCtx.strokeStyle = 'rgba(163, 229, 255, 0.1)';
            tCtx.lineWidth = 0.5;
            for(let i=0; i<=COLS; i++) {
                tCtx.beginPath(); tCtx.moveTo(i*BLOCK_SIZE, 0); tCtx.lineTo(i*BLOCK_SIZE, ROWS*BLOCK_SIZE); tCtx.stroke();
            }
            for(let j=0; j<=ROWS; j++) {
                tCtx.beginPath(); tCtx.moveTo(0, j*BLOCK_SIZE); tCtx.lineTo(COLS*BLOCK_SIZE, j*BLOCK_SIZE); tCtx.stroke();
            }

            // 画已固定的方块
            board.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        tCtx.fillStyle = value;
                        tCtx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                        // 水灵高光
                        tCtx.fillStyle = 'rgba(255,255,255,0.4)';
                        tCtx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, 3);
                    }
                });
            });

            // 画当前下落的方块
            if (piece) {
                piece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            tCtx.fillStyle = piece.color;
                            tCtx.fillRect((piece.x + x) * BLOCK_SIZE, (piece.y + y) * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                            tCtx.fillStyle = 'rgba(255,255,255,0.4)';
                            tCtx.fillRect((piece.x + x) * BLOCK_SIZE, (piece.y + y) * BLOCK_SIZE, BLOCK_SIZE - 1, 3);
                        }
                    });
                });
            }

            if (gameOver) {
                tCtx.fillStyle = 'rgba(0,0,0,0.7)';
                tCtx.fillRect(0, tetrisCanvas.height / 2 - 30, tetrisCanvas.width, 60);
                tCtx.fillStyle = '#fff';
                tCtx.font = '20px sans-serif';
                tCtx.textAlign = 'center';
                tCtx.fillText('游戏结束', tetrisCanvas.width / 2, tetrisCanvas.height / 2 + 7);
            }
        }

        function collide() {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x] !== 0) {
                        let newX = piece.x + x;
                        let newY = piece.y + y;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY >= 0 && board[newY][newX]) return true;
                    }
                }
            }
            return false;
        }

        function merge() {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        if (piece.y + y >= 0) {
                            board[piece.y + y][piece.x + x] = piece.color;
                        }
                    }
                });
            });
            clearLines();
            piece = createPiece();
            if (collide()) {
                gameOver = true;
                clearInterval(tetrisInterval);
            }
        }

        function clearLines() {
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(value => value !== null)) {
                    board.splice(y, 1);
                    board.unshift(new Array(COLS).fill(null));
                    score += 100;
                    document.getElementById('score').innerText = score;
                    y++;
                }
            }
        }

        function drop() {
            piece.y++;
            if (collide()) {
                piece.y--;
                merge();
            }
            dropCounter = 0;
        }

        function rotate() {
            const shape = piece.shape;
            const rotated = shape[0].map((_, i) => shape.map(row => row[i]).reverse());
            const oldShape = piece.shape;
            piece.shape = rotated;
            if (collide()) piece.shape = oldShape; // 踢墙简易处理
        }

        function move(dir) {
            piece.x += dir;
            if (collide()) piece.x -= dir;
        }

        function updateTetris(time = 0) {
            if (gameOver) return;
            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) drop();

            drawBoard();
            if (!gameOver) requestAnimationFrame(updateTetris);
        }

        function startTetris() {
            board = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
            score = 0;
            document.getElementById('score').innerText = score;
            gameOver = false;
            piece = createPiece();
            lastTime = performance.now();
            dropCounter = 0;
            
            if (tetrisInterval) clearInterval(tetrisInterval);
            requestAnimationFrame(updateTetris);
        }

        // 键盘控制
        document.addEventListener('keydown', e => {
            if (gameOver || !piece) return;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault(); // 防止页面滚动
                if (e.key === 'ArrowUp') rotate();
                if (e.key === 'ArrowDown') { drop(); drawBoard(); }
                if (e.key === 'ArrowLeft') { move(-1); drawBoard(); }
                if (e.key === 'ArrowRight') { move(1); drawBoard(); }
            }
        });

        // 初始化游戏
        startTetris();
    </script>
</body>
</html>
