function showEndingOverlay(reason) {
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('overlayTitle');
  const body = document.getElementById('overlayBody');
  const btn = document.getElementById('overlayBtn');
  if (!overlay) return;
  const ending = ENDINGS[reason] || ENDINGS.survive;
  title.textContent = ending.title;
  body.textContent = ending.body;
  overlay.classList.add('show');
  btn.textContent = '重来';
  btn.onclick = () => {
    overlay.classList.remove('show');
    resetGame();
  };
}

function triggerGameEnd(reason) {
  if (world.gameOver) return;
  world.gameOver = true;
  world.winner = ['caught_killer', 'player_escape', 'survive'].includes(reason)
    ? 'player' : 'npc';
  world.ending = reason;
  closeDialogue();
  showEndingOverlay(reason);
}

/* ==========================================================
   Q · 渲染
   ========================================================== */
function drawFloorBase(R, gridStep, gridColor) {
  const B = R.bounds;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(B.x, B.y, B.w, B.h);
  ctx.save();
  ctx.beginPath();
  ctx.rect(B.x, B.y, B.w, B.h);
  ctx.clip();
  ctx.strokeStyle = gridColor || 'rgba(0,0,0,0.04)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let gx = B.x; gx <= B.x + B.w; gx += gridStep) {
    ctx.moveTo(gx + 0.5, B.y);
    ctx.lineTo(gx + 0.5, B.y + B.h);
  }
  for (let gy = B.y; gy <= B.y + B.h; gy += gridStep) {
    ctx.moveTo(B.x, gy + 0.5);
    ctx.lineTo(B.x + B.w, gy + 0.5);
  }
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = '#111111';
  ctx.lineWidth = 3;
  ctx.strokeRect(B.x, B.y, B.w, B.h);
}

function drawSolids(R) {
  for (const s of R.solids) {
    if (s.kind === 'podium') {
      ctx.fillStyle = '#f7f7f7';
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      rr(s.x, s.y, s.w, s.h, 6);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s.x + 14, s.y + s.h / 2);
      ctx.lineTo(s.x + s.w - 14, s.y + s.h / 2);
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    } else if (s.kind === 'desk' || s.kind === 'table') {
      ctx.fillStyle = '#fafafa';
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 1.8;
      rr(s.x, s.y, s.w, s.h, 6);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s.x + 8, s.y + 10);
      ctx.lineTo(s.x + s.w - 8, s.y + 10);
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    } else {
      ctx.fillStyle = '#f0f0f0';
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      rr(s.x, s.y, s.w, s.h, 6);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s.x + s.w / 2, s.y + 6);
      ctx.lineTo(s.x + s.w / 2, s.y + s.h - 6);
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }
}

function drawBackground(R) {
  switch (R.bg) {
    case 'classroom': drawFloorBase(R, 70); drawSolids(R); break;
    case 'hallway':
      drawFloorBase(R, 90, 'rgba(0,0,0,0.045)');
      ctx.strokeStyle = 'rgba(0,0,0,0.03)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(R.bounds.x, R.bounds.y + R.bounds.h / 2);
      ctx.lineTo(R.bounds.x + R.bounds.w, R.bounds.y + R.bounds.h / 2);
      ctx.stroke();
      drawSolids(R); break;
    case 'storage': drawFloorBase(R, 50, 'rgba(0,0,0,0.06)'); drawSolids(R); break;
    case 'canteen': drawFloorBase(R, 80); drawSolids(R); break;
    case 'washroom': drawFloorBase(R, 40, 'rgba(0,0,0,0.05)'); drawSolids(R); break;
    case 'rooftop':
      drawFloorBase(R, 100, 'rgba(0,0,0,0.06)');
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 3;
      ctx.strokeRect(R.bounds.x + 6, R.bounds.y + 6, R.bounds.w - 12, R.bounds.h - 12);
      drawSolids(R); break;
    case 'infirmary': drawFloorBase(R, 60, 'rgba(0,0,0,0.04)'); drawSolids(R); break;
  }
}

function drawDoor(d) {
  const w = 72;
  ctx.beginPath();
  ctx.ellipse(d.x, d.y, w * 0.6, 20, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#111111';
  ctx.lineWidth = 2.4;
  rr(d.x - w / 2, d.y - 18, w, 36, 4);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(d.x, d.y - 18);
  ctx.lineTo(d.x, d.y + 18);
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(d.x + w / 2 - 12, d.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#111111';
  ctx.fill();
  const pulse = 0.5 + Math.sin(world.time * 3.2) * 0.5;
  ctx.globalAlpha = 0.2 + pulse * 0.4;
  ctx.beginPath();
  ctx.moveTo(d.x - 6, d.y - 30);
  ctx.lineTo(d.x,     d.y - 24);
  ctx.lineTo(d.x + 6, d.y - 30);
  ctx.strokeStyle = '#111111';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.textAlign = 'center';
  ctx.fillText(d.label || '', d.x, d.y + 34);
}

function drawActor(a, t) {
  if (!a.alive) return;
  const moving = a.moving;
  const bobFreq = moving ? 9 : 2;
  const bobAmp = moving ? 0.7 : 1.2;
  const bob = Math.sin(t * bobFreq + a.bobPhase) * bobAmp;
  const y = a.y + bob;

  ctx.beginPath();
  ctx.ellipse(a.x, a.y + a.r * 0.6, a.r * 0.8, a.r * 0.35, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fill();

  if (a.id === 'xuyunxi') {
    ctx.beginPath();
    ctx.arc(a.x, y, a.r + 11, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(232,160,180,0.15)';
    ctx.fill();
  }

  if (a.isPlayer && world.playerWeaponId) {
    ctx.beginPath();
    ctx.arc(a.x, y, a.r + 6, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(185,28,28,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  if (!a.isPlayer && a.panicTimer > 0) {
    ctx.beginPath();
    ctx.arc(a.x, y, a.r + 8, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(109,40,217,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  if (!a.isPlayer && a.desire === 'approach_player') {
    ctx.beginPath();
    ctx.arc(a.x, y, a.r + 5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(34,197,94,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(a.x, y, a.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = a.isPlayer ? 2.8 : 2.4;
  ctx.strokeStyle = '#111111';
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(a.x, y, a.r * 0.5, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.save();
  ctx.translate(a.x, y);
  ctx.rotate(a.facing);
  const ex = a.r * 0.48, eo = a.r * 0.3;
  const er = Math.max(1.1, a.r * 0.1);
  ctx.beginPath();
  ctx.arc(ex, -eo, er, 0, Math.PI * 2);
  ctx.arc(ex,  eo, er, 0, Math.PI * 2);
  ctx.fillStyle = '#111111';
  ctx.fill();
  ctx.restore();

  drawActorAnchor(a, y, t);

  if (!a.isPlayer) {
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.textAlign = 'center';
    ctx.fillText(a.name, a.x, a.y - a.r - 8);
  }
}

function drawActorAnchor(a, y, t) {
  switch (a.anchor) {
    case 'book': {
      ctx.save(); ctx.translate(a.x, y); ctx.rotate(a.facing);
      ctx.fillStyle = '#fafafa'; ctx.strokeStyle = '#111111'; ctx.lineWidth = 1.6;
      rr(a.r * 0.15, -a.r * 0.55, a.r * 0.65, a.r * 0.4, 1.5);
      ctx.fill(); ctx.stroke(); ctx.restore(); break;
    }
    case 'shoulder': {
      ctx.beginPath();
      ctx.moveTo(a.x - a.r * 0.9, y + a.r * 0.2);
      ctx.lineTo(a.x + a.r * 0.9, y + a.r * 0.2);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.stroke(); break;
    }
    case 'backpack': {
      const backA = a.facing + Math.PI;
      const bx = a.x + Math.cos(backA) * a.r * 0.55;
      const by = y + Math.sin(backA) * a.r * 0.55;
      ctx.beginPath();
      ctx.arc(bx, by, a.r * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1.4; ctx.stroke(); break;
    }
    case 'big': {
      ctx.beginPath();
      ctx.arc(a.x, y, a.r + 4, Math.PI * 0.75, Math.PI * 1.25);
      ctx.arc(a.x, y, a.r + 4, -Math.PI * 0.25, Math.PI * 0.25);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2.4; ctx.stroke(); break;
    }
    case 'coin': {
      const coinA = a.facing + Math.PI / 2;
      const cx = a.x + Math.cos(coinA) * (a.r + 5);
      const cy = y + Math.sin(coinA) * (a.r + 5);
      const speed = 3 + (a.fear + a.anger) * 0.08;
      const wob = Math.sin(t * speed + a.bobPhase) * 0.5;
      ctx.beginPath();
      ctx.arc(cx + wob, cy, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = '#111111'; ctx.fill(); break;
    }
    case 'arms': {
      ctx.save(); ctx.translate(a.x, y); ctx.rotate(a.facing);
      ctx.beginPath();
      ctx.moveTo(-a.r * 0.2, -a.r * 0.9);
      ctx.quadraticCurveTo(-a.r * 0.95, 0, -a.r * 0.2, a.r * 0.9);
      ctx.moveTo(-a.r * 0.2, -a.r * 0.9);
      ctx.quadraticCurveTo(a.r * 0.4, 0, -a.r * 0.2, a.r * 0.9);
      ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.lineWidth = 1.6; ctx.stroke(); ctx.restore(); break;
    }
    case 'bow': {
      const headA = a.facing - Math.PI * 0.55;
      const bx = a.x + Math.cos(headA) * (a.r + 1);
      const by = y + Math.sin(headA) * (a.r + 1);
      ctx.save(); ctx.translate(bx, by);
      ctx.rotate(headA + Math.PI / 2 + Math.sin(t * 1.7 + a.bobPhase) * 0.055);
      ctx.fillStyle = '#e8a0b4'; ctx.strokeStyle = '#111111'; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.ellipse(-3.4, 0, 3.6, 2.3, -0.42, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(3.4, 0, 3.6, 2.3, 0.42, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, 1.1, 2.6, 0, 0, Math.PI * 2); ctx.fillStyle = '#111111'; ctx.fill();
      ctx.restore(); break;
    }
    case 'shrink': {
      ctx.save(); ctx.translate(a.x, y); ctx.rotate(a.facing);
      ctx.beginPath();
      ctx.moveTo(-a.r * 0.3, -a.r * 0.7); ctx.lineTo(a.r * 0.1, -a.r * 0.4);
      ctx.moveTo(-a.r * 0.3,  a.r * 0.7); ctx.lineTo(a.r * 0.1,  a.r * 0.4);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); break;
    }
    case 'point': {
      ctx.save(); ctx.translate(a.x, y); ctx.rotate(a.facing);
      ctx.beginPath();
      ctx.moveTo(a.r * 0.7, -a.r * 0.3); ctx.lineTo(a.r * 1.7, -a.r * 0.55);
      ctx.strokeStyle = '#111111'; ctx.lineWidth = 1.8; ctx.stroke();
      ctx.beginPath();
      ctx.arc(a.r * 1.7, -a.r * 0.55, 1.4, 0, Math.PI * 2);
      ctx.fillStyle = '#111111'; ctx.fill(); ctx.restore(); break;
    }
    case 'shoe': {
      const wobble = a.moving ? Math.sin(t * 12 + a.bobPhase) * 1.6 : 0;
      ctx.save(); ctx.translate(a.x, y); ctx.rotate(a.facing);
      ctx.beginPath();
      ctx.ellipse(a.r * 0.15 + wobble, -a.r * 0.65, a.r * 0.35, a.r * 0.18, 0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill(); ctx.restore(); break;
    }
  }
}

function drawDeadActor(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.beginPath();
  ctx.arc(0, 0, a.r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
  const r = a.r * 0.4;
  ctx.beginPath();
  ctx.moveTo(-r, -r); ctx.lineTo(r, r);
  ctx.moveTo(r, -r);  ctx.lineTo(-r, r);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawGroundWeapon(w, t) {
  const bob = Math.sin(t * 2 + w.x) * 1.5;
  ctx.beginPath();
  ctx.arc(w.x, w.y + bob, 8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(w.x, w.y + bob, 5, 0, Math.PI * 2);
  ctx.fillStyle = w.usedInKill ? '#b91c1c' : '#ffffff';
  ctx.fill();
  ctx.strokeStyle = w.usedInKill ? '#b91c1c' : '#111111';
  ctx.lineWidth = 1.6;
  ctx.stroke();
}

function drawActors(t) {
  const deadInRegion = world.actors.filter(a =>
    !a.alive && a.region === world.region && !a.escaped && !a.jailed
  );
  for (const a of deadInRegion) drawDeadActor(a);
  const ws = weaponsInRegion(world.region);
  for (const w of ws) drawGroundWeapon(w, t);
  const aliveInRegion = world.actors
    .filter(a => a.alive && a.region === world.region)
    .sort((a, b) => a.y - b.y);
  for (const a of aliveInRegion) drawActor(a, t);
}

function drawHighlight(t) {
  if (!world.activeInteractable) return;
  if (dialogue.active) return;
  const o = world.activeInteractable;
  const pulse = 0.5 + Math.sin(t * 3.4) * 0.5;
  const r = (o.r || 20) + 9 + pulse * 3.5;
  ctx.beginPath();
  ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(0,0,0,${0.16 + pulse * 0.28})`;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 5]);
  ctx.lineDashOffset = -t * 18;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineDashOffset = 0;
}

function drawBroadcast() {
  const active = broadcastLog.filter(b => b.until > world.time);
  if (!active.length) return;
  const text = active[active.length - 1].text;
  const barH = 34;
  const w = Math.min(W - 40, 460);
  const x = (W - w) / 2;
  const y = 30;
  ctx.beginPath();
  rr(x, y, w, barH, 8);
  ctx.fillStyle = 'rgba(17,17,17,0.88)';
  ctx.fill();
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + barH / 2);
  ctx.textBaseline = 'alphabetic';
}

function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  const R = REGIONS[world.region];
  if (!R) return;
  ctx.save();
  ctx.translate(-camX, -camY);
  drawBackground(R);
  for (const d of R.doors) drawDoor(d);
  drawActors(t);
  drawHighlight(t);
  ctx.restore();
  if (world.fade > 0) {
    ctx.fillStyle = `rgba(255,255,255,${world.fade})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawBroadcast();
}

/* ==========================================================
   R · 交互 / 更新 / 状态条
   ========================================================== */
function findInteractable() {
  const P = world.player;
  if (!P || !P.alive) return null;
  const body = getBodyAt(world.region, P.x, P.y);
  if (body) return { kind: 'body', ref: body, r: 24, x: body.victim.x, y: body.victim.y };

  /* 玩家已有武器时，地上的武器不作为可交互对象（除非已杀人的作为证据线索） */
  if (!world.playerWeaponId) {
    const ws = weaponsInRegion(world.region);
    let bestW = null, bestWD = Infinity;
    for (const w of ws) {
      if (w.usedInKill) continue;
      const d = Math.hypot(w.x - P.x, w.y - P.y);
      if (d < P.r + 20 + CONFIG.INTERACT_PAD && d < bestWD) {
        bestWD = d; bestW = w;
      }
    }
    if (bestW) return { kind: 'weapon', ref: bestW, r: 12, x: bestW.x, y: bestW.y };
  }

  let best = null, bestD = Infinity;
  for (const a of world.actors) {
    if (a.isPlayer || !a.alive || a.region !== world.region) continue;
    const d = Math.hypot(a.x - P.x, a.y - P.y);
    const reach = a.r + P.r + CONFIG.INTERACT_PAD;
    if (d < reach && d < bestD) {
      bestD = d;
      best = { kind: 'npc', ref: a, r: a.r, x: a.x, y: a.y };
    }
  }
  const R = REGIONS[world.region];
  if (R.props) {
    for (const pr of R.props) {
      const d = Math.hypot(pr.x - P.x, pr.y - P.y);
      const reach = (pr.r || 12) + P.r + CONFIG.INTERACT_PAD;
      if (d < reach && d < bestD) {
        bestD = d;
        best = { kind: 'prop', ref: pr, r: pr.r || 12, x: pr.x, y: pr.y };
      }
    }
  }
  for (const s of R.solids) {
    if (!s.examine) continue;
    const nx = clamp(P.x, s.x, s.x + s.w);
    const ny = clamp(P.y, s.y, s.y + s.h);
    const d = Math.hypot(P.x - nx, P.y - ny);
    const reach = P.r + CONFIG.INTERACT_PAD + 8;
    if (d < reach && d < bestD) {
      bestD = d;
      best = {
        kind: 'prop',
        ref: { ...s, x: s.x + s.w / 2, y: s.y + s.h / 2 },
        r: Math.max(s.w, s.h) * 0.4,
        x: s.x + s.w / 2, y: s.y + s.h / 2,
      };
    }
  }
  return best;
}

function onActionPress() {
  if (dialogue.active) return;
  if (world.struggleActive || world.gameOver) return;
  if (voteState.active) {
    if (dialogue.mode === 'vote_speech') advanceSpeech();
    return;
  }
  const target = world.activeInteractable;
  if (!target) {
    if (world.playerWeaponId) dropWeaponUI();
    return;
  }
  if (target.kind === 'body') { examineBody(target.ref); return; }
  if (target.kind === 'weapon') { pickUpWeapon(world.player, target.ref.id); return; }
  if (target.kind === 'npc' && world.playerWeaponId) {
    const npc = target.ref;
    if (npc.trust >= 65) {
      if (confirm(`你真的要杀 ${npc.name} 吗？\n\n${npc.name} 一直很相信你。`)) {
        tryPlayerKillTarget(npc);
      }
      return;
    }
    tryPlayerKillTarget(npc);
    return;
  }
  if (target.kind === 'npc') openDialogueForNpc(target.ref);
  else if (target.kind === 'prop') openDialogueForProp(target.ref);
}

function updateStatusBar() {
  const alive = world.actors.filter(a => a.alive).length;
  const aliveEl = document.getElementById('aliveLabel');
  const timeEl = document.getElementById('timeLabel');
  if (aliveEl) aliveEl.textContent = alive + ' 人';

  if (timeEl) {
    let suffix = '';
    if (world.playerIsKiller && world.escapeTimers['player'] !== undefined) {
      suffix += ' · 逃 ' + formatEscapeRemaining(world.escapeTimers['player']);
    }
    if (world.playerWeaponId) {
      const w = worldWeapons[world.playerWeaponId];
      if (w) suffix += ` · ${w.name}(X)`;
    }
    if (world.playerIsKiller) {
      suffix += ` · 杀${world.playerKillCount}/${CONFIG.MAX_KILLS}`;
    }
    if (canStartVote() && world.time - lastForceVoteTime > 30) {
      suffix += ' · V';
    }
    timeEl.textContent = formatGameTime(world.gameTime) + suffix;
  }

  const btn = document.getElementById('actionBtn');
  if (!btn) return;

  if (world.gameOver || voteState.active) {
    btn.classList.remove('ready', 'danger-ready');
    btn.textContent = '';
    return;
  }
  if (world.playerWeaponId && world.activeInteractable &&
      world.activeInteractable.kind === 'npc') {
    if (!canKill(world.player)) {
      btn.classList.remove('danger-ready', 'ready');
      btn.textContent = '';
    } else {
      btn.classList.add('danger-ready');
      btn.classList.remove('ready');
      btn.textContent = '动手';
    }
  } else if (world.activeInteractable) {
    btn.classList.remove('danger-ready');
    btn.classList.add('ready');
    btn.textContent = '交互';
  } else if (world.playerWeaponId) {
    btn.classList.remove('danger-ready');
    btn.classList.add('ready');
    btn.textContent = '放下';
  } else {
    btn.classList.remove('ready', 'danger-ready');
    btn.textContent = '';
  }
}

function update(dt, t) {
  if (world.gameOver) return;
  world.time += dt;
  world.gameTime += dt * CONFIG.TIME_SCALE;

  updatePlayerInput(dt);
  resolvePlayerCollisions();
  checkDoors(dt);

  if (world.fade > 0) world.fade = Math.max(0, world.fade - dt * 3);

  const R = REGIONS[world.region];
  if (R) {
    camX = camAxis(world.player.x, W, R.bounds.w);
    camY = camAxis(world.player.y, H, R.bounds.h);
  }

  for (const a of world.actors) {
    if (!a.alive || a.isPlayer) continue;
    thinkActor(a, dt);
    updateNpcMovement(a, dt);
  }

  world.activeInteractable = (dialogue.active || voteState.active)
    ? null : findInteractable();

  if (dialogueUI.timer > 0) {
    dialogueUI.timer -= dt;
    if (dialogueUI.timer <= 0 && !dialogueUI.persistent) closeDialogue();
  }

  updateStatusBar();
  tickEscapeTimers(dt);
  tickMemoryDecay(dt);
  checkBodyDiscoveries();
  simulateBackgroundRegions(dt);
  for (const a of world.actors) {
    if (a.alive && !a.isPlayer) tryNpcKill(a);
  }
  resolveActorCollisions();
  if (!voteState.active) checkForceVote();
}

/* ==========================================================
   S · 主循环 / 重开 / 启动
   ========================================================== */
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = now / 1000;
  update(dt, t);
  render(t);
  requestAnimationFrame(loop);
}

function resetGame() {
  world.time = 0;
  world.gameTime = 0;
  world.phase = 'calm';
  world.region = 'main';
  world.dead = [];
  world.jailed = [];
  world.killers = [];
  world.killEvents = [];
  world.escapeTimers = {};
  world.playerIsKiller = false;
  world.playerKillCount = 0;
  world.playerWeaponId = null;
  world.playerLies = [];
  world.voteHistory = [];
  world.gameOver = false;
  world.winner = null;
  world.ending = null;
  world.doorCooldown = 0;
  world.fade = 1;
  world.activeInteractable = null;
  world.struggleActive = false;
  world.struggleKiller = null;

  voteState.active = false;
  voteState.phase = 'idle';
  voteState.speeches = {};
  voteState.npcVotes = {};
  voteState.playerVote = null;
  voteState.jailedId = null;
  voteState.savedPositions = {};

  dialogue.active = false;
  dialogue.persistent = false;
  dialogue.timer = 0;
  document.getElementById('dialog').classList.remove('show');

  broadcastLog.length = 0;
  document.getElementById('struggle').classList.remove('show');
  if (struggleTimerId) {
    clearTimeout(struggleTimerId);
    struggleTimerId = null;
  }

  spawnAllActors();
  initWorldWeapons();
  lastForceVoteTime = 0;
  lastKillTime = -999;

  document.getElementById('regionLabel').textContent = '主教室';
  document.getElementById('aliveLabel').textContent = '11 人';

  const R = REGIONS[world.region];
  camX = camAxis(world.player.x, W, R.bounds.w);
  camY = camAxis(world.player.y, H, R.bounds.h);

  document.getElementById('overlay').classList.remove('show');
  lastTime = performance.now();

  broadcast('校门被封了。没有人能出去。', 6);
}

if (DEBUG) {
  window.__game = {
    get world() { return world; },
    get weapons() { return worldWeapons; },
    get vote() { return voteState; },
    get actors() { return world.actors; },
    get player() { return world.player; },
    teleport: (regionId, x, y) => switchRegion(regionId, { x, y }),
    kill: (killerId, victimId) => {
      const k = getActor(killerId);
      const v = getActor(victimId);
      if (!k || !v) return 'actor 不存在';
      if (!k.hasWeapon) {
        const w = Object.values(worldWeapons).find(w => w.onGround);
        if (w) pickUpWeapon(k, w.id);
      }
      return executeKill(k, v);
    },
    vote: () => { if (canStartVote()) startVote(); else return '现在不能投票'; },
    end: (reason) => triggerGameEnd(reason || 'survive'),
    dump: () => {
      for (const a of world.actors) {
        if (!a.alive) continue;
        console.group(a.name + ` (${a.faction})`);
        console.log('信任:', a.trust.toFixed(0), '杀意:', a.killIntent.toFixed(0),
                    '恐惧:', a.fear.toFixed(0), '愤怒:', a.anger.toFixed(0),
                    '杀人数:', a.kills.length + '/' + CONFIG.MAX_KILLS,
                    '武器:', a.hasWeapon || '无');
        console.groupEnd();
      }
    },
  };
  Object.defineProperty(window.__game, 'god', {
    get: () => debugState.god,
    set: (v) => { debugState.god = v; },
  });
  console.log('[封锁] __game 就绪');
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if ((e.code === 'KeyE' || e.code === 'Space') && !e.repeat) onActionPress();
  if (e.code === 'Escape' && dialogue.active && !dialogue.persistent) closeDialogue();
  if (e.code === 'KeyV' && !e.repeat) {
    if (canStartVote()) startVote();
    else broadcast('现在还不是时候。');
  }
  if (e.code === 'KeyX' && !e.repeat) {
    if (world.playerWeaponId) dropWeaponUI();
  }
  if (world.struggleActive &&
      (e.code === 'Space' || e.code === 'KeyE' || e.code === 'Enter')) {
    e.preventDefault();
    onStrugglePress();
  }
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); resetJoy(); });

const joystickEl = document.getElementById('joystick');
const knobEl = document.getElementById('knob');

function updateJoy(e) {
  const rect = joystickEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const maxR = rect.width * 0.36;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const d = Math.hypot(dx, dy);
  if (d > maxR) { dx = dx / d * maxR; dy = dy / d * maxR; }
  knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  joyVec.x = dx / maxR;
  joyVec.y = dy / maxR;
}
function resetJoy() {
  joyId = null;
  joyVec.x = joyVec.y = 0;
  knobEl.style.transform = 'translate(0px, 0px)';
}
joystickEl.addEventListener('pointerdown', (e) => {
  if (joyId !== null || dialogue.active || world.gameOver) return;
  joyId = e.pointerId;
  joystickEl.setPointerCapture(e.pointerId);
  updateJoy(e);
  e.preventDefault();
});
joystickEl.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyId) return;
  updateJoy(e);
  e.preventDefault();
});
function endJoy(e) { if (e.pointerId === joyId) resetJoy(); }
joystickEl.addEventListener('pointerup', endJoy);
joystickEl.addEventListener('pointercancel', endJoy);
joystickEl.addEventListener('lostpointercapture', endJoy);

const actionBtn = document.getElementById('actionBtn');
actionBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  actionBtn.classList.add('pressed');
  onActionPress();
});
window.addEventListener('pointerup', () => actionBtn.classList.remove('pressed'));
window.addEventListener('pointercancel', () => actionBtn.classList.remove('pressed'));

document.getElementById('struggleBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  e.stopPropagation();
  onStrugglePress();
});

(function boot() {
  resize();
  spawnAllActors();
  initWorldWeapons();
  const R = REGIONS[world.region];
  camX = camAxis(world.player.x, W, R.bounds.w);
  camY = camAxis(world.player.y, H, R.bounds.h);
  document.getElementById('regionLabel').textContent = R.name;
  updateStatusBar();
  broadcast('校门被封了。没有人能出去。', 6);
  setTimeout(() => broadcast('走廊尽头有人喊了一声："都过来！"', 5), 2500);
  setTimeout(() => broadcast('有人说：昨晚有人……', 5), 5000);
  requestAnimationFrame(loop);
})();
</script>
