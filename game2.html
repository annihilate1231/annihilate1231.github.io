<title>封锁</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #eef0f3;

    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #statusBar {
    position: fixed; top: 0; left: 0; width: 100%; height: 22px;
    display: flex; align-items: center; justify-content: space-between;

  #stage {
    position: fixed; left: 0; top: 33.333vh;

    border: 2px solid #111111; background: #ffffff;
    overflow: hidden; touch-action: none; z-index: 2;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  #topBar {
    position: fixed; top: 0; left: 0; width: 100%; height: 33.333vh;
    display: flex; align-items: center; justify-content: center;
    padding: 0 20px; pointer-events: none; z-index: 5;
  }
  #dialog {
    display: flex; align-items: flex-start; gap: 13px;
    width: 100%; max-width: 470px; padding: 14px 17px;
    background: #ffffff; border: 1.5px solid rgba(0,0,0,0.09);
    border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.07);
    opacity: 0; transform: translateY(-8px);
    transition: opacity .25s ease, transform .25s ease;
    max-height: calc(33.333vh - 20px); overflow-y: auto;
  }
  #dialog.show { opacity: 1; transform: translateY(0); }
  #avatarBox {
    flex: 0 0 48px; width: 48px; height: 48px;
    border-radius: 50%; background: #f6f7f9;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #avatarBox svg { width: 100%; height: 100%; display: block; }
  #dialogBody { flex: 1 1 auto; min-width: 0; }
  #speaker { font-size: 11px; letter-spacing: 2.5px; color: #9ca3af; margin-bottom: 6px; }
  #line {
    font-size: 15px; font-weight: 500; line-height: 1.6;
    color: #111827; word-break: break-word; white-space: pre-wrap;
  }
  #choices { margin-top: 8px; }
  .choice {
    display: block; width: 100%; margin-top: 6px; padding: 8px 12px;
    font: inherit; font-size: 13px; font-weight: 500;
    text-align: left; color: #111111; background: #ffffff;
    border: 1.4px solid rgba(0,0,0,0.16); border-radius: 8px;
    cursor: pointer; pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s, color .15s, border-color .15s;
  }
  .choice:active, .choice:hover {
    background: #111111; color: #ffffff; border-color: #111111;
  }
  .choice.danger { color: #b91c1c; border-color: rgba(185,28,28,0.35); }
  .choice.danger:active, .choice.danger:hover {
    background: #b91c1c; color: #ffffff; border-color: #b91c1c;
  }
  .choice.lie { color: #6d28d9; border-color: rgba(109,40,217,0.35); }
  .choice.lie:active, .choice.lie:hover {
    background: #6d28d9; color: #ffffff; border-color: #6d28d9;
  }
  #joystick {
    position: fixed; left: 24px; bottom: 9vh;
    width: 128px; height: 128px; border-radius: 50%;
    background: rgba(0,0,0,0.022); border: 1px solid rgba(0,0,0,0.09);
    touch-action: none; z-index: 10; transition: opacity .25s ease;
  }
  #joystick.locked { opacity: 0.3; }
  #joystick::after {
    content: ""; position: absolute; inset: 20px;
    border-radius: 50%; border: 1px dashed rgba(0,0,0,0.06);
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: #111;
    box-shadow: 0 3px 12px rgba(0,0,0,0.22);
    pointer-events: none; will-change: transform;
  }
  #actionBtn {
    position: fixed; right: 28px; bottom: 9vh;
    width: 90px; height: 90px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; letter-spacing: 2px;
    color: rgba(0,0,0,0.32); background: #ffffff;
    border: 1.5px solid rgba(0,0,0,0.12);
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);

  }
  #actionBtn.ready {

  }

    color: #ffffff; background: #b91c1c; border-color: #b91c1c;
    box-shadow: 0 4px 20px rgba(185,28,28,0.4);
  }

  #actionBtn.hidden { opacity: 0; pointer-events: none; }
  #overlay {

/* ==========================================================
   C · 画布 / 工具
   ========================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let camX = 0, camY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth || 1;
  const h = canvas.clientHeight || 1;
  W = w; H = h;
  canvas.width  = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 160));
resize();

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
}
function camAxis(p, view, size) {
  if (size <= view) return (size - view) / 2;
  return clamp(p - view / 2, 0, size - view);
}
function formatGameTime(gameSec) {
  const h = Math.floor(gameSec / 3600);
  const m = Math.floor((gameSec % 3600) / 60);
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function formatEscapeRemaining(gameSec) {
  const h = Math.floor(gameSec / 3600);
  const m = Math.floor((gameSec % 3600) / 60);
  return `${h}h ${m}m`;
}

function createActor(id, def, spawn) {
  return {
    id, name: def.name, isPlayer: id === 'player',
    r: def.r, anchor: def.anchor, avatar: def.avatar,
    style: def.style || 'default',
    faction: def.faction || 'none',
    intro: def.intro || '……',
    alibi: def.alibi || '……',
    secret: def.secret || null,
    secretLine: def.secretLine || '……',
    trust: def.trust ?? 50,
    killIntent: def.killIntent ?? 30,
    observe: def.observe ?? 50,
    loyalty: def.loyalty ?? 50,
    secretKnownByPlayer: false,
    region: spawn.region,
    x: spawn.x, y: spawn.y,
    facing: spawn.facing ?? -Math.PI / 2,
    vx: 0, vy: 0, moving: false,
    moveSpeed: id === 'player' ? CONFIG.MAX_SPEED : CONFIG.NPC_SPEED,
    bobPhase: Math.random() * Math.PI * 2,
    desire: 'idle',
    target: null,
    waitTimer: 1 + Math.random() * 3,
    thinkTimer: 0.5 + Math.random() * 1.5,
    memory: [],
    suspicion: {},
    fear: 0, anger: 0,
    alive: true,
    hasWeapon: null,
    kills: [],
    killer: false,
    escaped: false,
    jailed: false,
    discoveredBodies: [],
    panicTimer: 0,
    /* 跟随系统 */
    followUntil: 0,
    followCooldownUntil: 0,
  };
}

function spawnAllActors() {
  world.actors.length = 0;
  const p = createActor('player', CHARACTER_DEFS.player, {
    region: 'main', x: 350, y: 460, facing: -Math.PI / 2,
  });
  world.player = p;
  world.actors.push(p);
  for (const sp of INITIAL_SPAWNS) {
    const def = CHARACTER_DEFS[sp.id];
    if (!def) continue;
    world.actors.push(createActor(sp.id, def, sp));
  }
}

function getActor(id) { return world.actors.find(a => a.id === id) || null; }
function getActorName(id) {
  if (!id) return '？';
  const a = getActor(id);
  return a ? a.name : '？';
}
function canKill(actor) { return (actor.kills || []).length < CONFIG.MAX_KILLS; }

/* ==========================================================
   G · 事件总线 / 目击 / 记忆
   ========================================================== */
const bus = {
  handlers: [],
  on(fn) { this.handlers.push(fn); },
  emit(event) {
    event.time = world.time;
    event.gameTime = world.gameTime;
    event.region = event.region ?? world.region;
    for (const h of this.handlers) {
      try { h(event); } catch (e) { console.error('[bus]', e); }
    }
  },
};

function witnessEvent(event) {
  const witnesses = world.actors.filter(a =>
    a.alive && a.region === event.region && a.id !== event.actorId
  );
  for (const w of witnesses) {
    const clarity = w.observe >= 70 ? 'full'
                  : w.observe >= 30 ? 'partial' : 'vague';
    addMemory(w, event, clarity);
    updateSuspicion(w, event, clarity);
    updateEmotion(w, event);
    reactToEvent(w, event, clarity);
  }
}

function addMemory(actor, event, clarity) {
  const mem = {
    type: event.type,
    actorId: event.actorId,
    actorName: event.actorName || getActorName(event.actorId),
    targetId: event.targetId || null,
    targetName: event.targetName || (event.targetId ? getActorName(event.targetId) : null),
    detail: event.detail || null,
    clarity, time: event.time, gameTime: event.gameTime, region: event.region,
    strength: 100,
  };
  actor.memory.push(mem);
  if (actor.memory.length > CONFIG.MEMORY_CAP) {
    actor.memory.sort((a, b) => (a.strength - b.strength) || (a.time - b.time));
    actor.memory.shift();
  }
}

function updateSuspicion(watcher, event, clarity) {
  const weight = clarity === 'full' ? 3 : clarity === 'partial' ? 2 : 1;
  switch (event.type) {
    case 'talk':
      if (event.actorId !== watcher.id && event.targetId !== watcher.id) {
        if (watcher.style === 'leader') {
          bump(watcher, event.actorId, 4 * weight);
          bump(watcher, event.targetId, 2 * weight);
        } else if (watcher.style === 'analytic') {
          bump(watcher, event.actorId, 2 * weight);
        } else if (watcher.style === 'smooth') {
          bump(watcher, event.actorId, 3 * weight);
          bump(watcher, event.targetId, 3 * weight);
        } else {
          bump(watcher, event.actorId, 1 * weight);
        }
      }
      break;
    case 'examine':
      if (watcher.style === 'analytic') bump(watcher, event.actorId, 5 * weight);
      else if (watcher.style === 'smooth') bump(watcher, event.actorId, 4 * weight);
      else if (watcher.style === 'argue') bump(watcher, event.actorId, 3 * weight);
      else bump(watcher, event.actorId, 2 * weight);
      break;
    case 'pick_weapon':
      bump(watcher, event.actorId, 15 * weight);
      break;
    case 'threat':
      if (event.targetId === watcher.id) bump(watcher, event.actorId, 10 * weight);
      else bump(watcher, event.actorId, 5 * weight);
      break;
    case 'kill':
      bump(watcher, event.actorId, 80 * weight);
      break;
    case 'lie':
      if (event.targetId === watcher.id) bump(watcher, event.actorId, 30 * weight);
      break;
  }
}

function bump(watcher, subjectId, delta) {
  if (!watcher.suspicion[subjectId]) watcher.suspicion[subjectId] = 0;
  watcher.suspicion[subjectId] = Math.min(100, watcher.suspicion[subjectId] + delta);
}

function updateEmotion(actor, event) {
  switch (event.type) {
    case 'kill':
      actor.fear = Math.min(100, actor.fear + 50);
      actor.anger = Math.min(100, actor.anger + 25);
      actor.panicTimer = 8;
      actor.thinkTimer = 0;
      break;
    case 'pick_weapon':
      actor.fear = Math.min(100, actor.fear + 15);
      break;
    case 'threat':
      if (event.targetId === actor.id) {
        actor.fear = Math.min(100, actor.fear + 15);
        actor.anger = Math.min(100, actor.anger + 10);
      }
      break;
    case 'found_body':
      actor.fear = Math.min(100, actor.fear + 40);
      actor.panicTimer = 6;
      actor.thinkTimer = 0;
      break;
    case 'lie':
      if (event.targetId === actor.id) {
        actor.anger = Math.min(100, actor.anger + 20);
        actor.trust = Math.max(0, actor.trust - 15);
      }
      break;
  }
}

function reactToEvent(actor, event, clarity) {
  if (actor.id === 'zhiyuchen' && event.actorId === 'zhangsien') {
    actor.trust = Math.min(100, actor.trust + 1);
  }
  if (actor.id === 'ruanrou' && event.actorId === 'player') {
    actor.trust = Math.min(100, actor.trust + 0.5);
  }
  if (actor.style === 'smooth' && event.type === 'talk') {
    actor.trust = Math.max(0, actor.trust - 0.5);
  }
}

bus.on(witnessEvent);

function narrateMemory(mem, style) {
  const A = mem.actorName || '？';
  const T = mem.targetName || null;
  const P = mem.detail?.propName;
  const unclear = mem.clarity === 'vague';
  const partial = mem.clarity === 'partial';

  switch (mem.type) {
    case 'talk':
      if (unclear) return `好像看到${A}跟谁在说话。`;
      if (partial) return `${A}跟${T}说了话。`;
      if (style === 'analytic') return `记录：${A}与${T}进行了私下对话。`;
      if (style === 'sharp')    return `${A}去找${T}了。`;
      if (style === 'smooth')   return `${A}和${T}聊了一会儿。`;
      if (style === 'leader')   return `${A}和${T}有交流。`;
      return `${A}和${T}说了话。`;
    case 'examine':
      if (unclear) return `有人动了什么东西。`;
      return `${A}在${P || '那儿'}翻了翻。`;
    case 'pick_weapon':
      if (unclear) return `有人拿了什么东西。`;
      return `${A}拿走了${P || '一样东西'}。`;
    case 'kill':
      if (unclear) return `有人倒下了。我没看清是谁。`;
      if (partial) return `我看见${A}对${T}动了手。`;
      if (style === 'weak') return `（她在发抖）${A}……${A}杀了${T}……`;
      return `${A}杀了${T}。我亲眼看见的。`;
    case 'found_body':
      return `我看到${T}了。躺在地上。没有动。`;
    case 'lie':
      return `${A}对我撒了谎。`;
    case 'threat':
      if (style === 'sharp') return `${A}威胁了${T}。`;
      return `${A}对${T}说了什么。不太友好。`;
  }
  return null;
}

function mostSuspicious(actor, excludeIds = []) {
  let best = null, bestScore = 0;
  for (const [id, score] of Object.entries(actor.suspicion)) {
    if (excludeIds.includes(id)) continue;
    if (id === actor.id) continue;
    const target = getActor(id);
    if (!target || !target.alive) continue;
    if (score > bestScore) { bestScore = score; best = target; }
  }
  return best ? { actor: best, score: bestScore } : null;
}

function memoriesAbout(actor, subjectId) {
  return actor.memory.filter(m =>
    m.actorId === subjectId || m.targetId === subjectId
  );
}

    if (threatenedBefore && npc.trust < 30) {
      text = pickByStyle(npc.style, {
        leader:  '（他看着你，眼神很冷）还有事？',
        sharp:   '（她往后退半步）你又来干什么。',
        weak:    '（她缩得更紧）……别再那样了。',
        smooth:  '（她笑了一下，但没到眼睛里）你又来了。',
        blunt:   '（他把脸转开）滚。',
        analytic:'（他合上书）如果没有新的信息，我不想再重复。',
        argue:   '（他抬起下巴）你想好了怎么回答我的问题了吗？',
        loyal:   '（他低着头）……我不想跟你说话。',
        joke:    '（他转了转硬币，没笑）',
        lucky:   '（他摊了摊手）又来？',
      });
    }
  }

  renderNpcDialogue(npc, text, buildNpcMenu(npc));
}

function buildNpcMenu(npc) {
  const opts = [];
  opts.push({ label: '你昨晚在哪？', key: 'ask_alibi' });
  opts.push({ label: '你看到什么了？', key: 'ask_witness' });
  opts.push({ label: '你怀疑谁？', key: 'ask_suspect' });

  const others = world.actors.filter(a =>
    !a.isPlayer && a.alive && a.id !== npc.id
  );
  if (others.length) opts.push({ label: '关于某个人……', key: 'ask_about_open' });

  if (npc.secret && !npc.secretKnownByPlayer) {
    opts.push({ label: '（盯住他）你有事瞒着我。', key: 'try_secret' });
  }
  if (world.playerIsKiller && (world.playerKillCount || 0) > 0) {
    opts.push({ label: '（说谎）我昨晚什么都没做。', key: 'lie', lie: true });
    opts.push({ label: '（说谎）我一直和别人在一起。', key: 'lie2', lie: true });
  }
  opts.push({ label: '别让我怀疑你。', key: 'threaten', danger: true });
  opts.push({ label: '你还好吗？', key: 'comfort' });
  if (npc.trust >= 55) {
    opts.push({ label: '我们合作吧。', key: 'recruit' });
  }
  opts.push({ label: '没事了。', key: 'bye' });
  return opts;
}

function renderNpcDialogue(npc, text, opts) {
  dialogueUI.speaker.textContent = npc.name;
  dialogueUI.avatarBox.innerHTML = avatarSVG(npc.avatar);
  dialogueUI.line.textContent = text;
  dialogueUI.el.classList.add('show');
  dialogueUI.timer = 0;
  dialogueUI.persistent = true;
  dialogueUI.choices.innerHTML = '';

  for (const o of opts) {
    const b = document.createElement('button');
    let cls = 'choice';
    if (o.danger) cls += ' danger';
    if (o.lie)    cls += ' lie';
    b.className = cls;
    b.type = 'button';
    b.textContent = o.label;
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      handleNpcAction(npc, o.key);
    });
    dialogueUI.choices.appendChild(b);
  }
}

function handleNpcAction(npc, key) {
  switch (key) {
    case 'bye': closeDialogue(); return;
    case 'ask_alibi':
      renderNpcDialogue(npc, answerAlibi(npc), buildNpcMenu(npc)); return;
    case 'ask_witness':
      renderNpcDialogue(npc, answerWitness(npc), buildNpcMenu(npc)); return;
    case 'ask_suspect':
      renderNpcDialogue(npc, answerSuspect(npc), buildNpcMenu(npc)); return;
    case 'ask_about_open': {
      const others = world.actors.filter(a =>
        !a.isPlayer && a.alive && a.id !== npc.id
      );
      const subOpts = others.map(o => ({
        label: o.name, key: 'ask_about:' + o.id,
      }));
      subOpts.push({ label: '← 返回', key: 'back' });
      renderNpcDialogue(npc, '你想问谁？', subOpts);
      return;
    }
    case 'back':
      renderNpcDialogue(npc, npc.intro, buildNpcMenu(npc)); return;
    case 'threaten':
      renderNpcDialogue(npc, doThreaten(npc), buildNpcMenu(npc)); return;
    case 'comfort':
      renderNpcDialogue(npc, doComfort(npc), buildNpcMenu(npc)); return;
    case 'recruit':
      renderNpcDialogue(npc, doRecruit(npc), buildNpcMenu(npc)); return;
    case 'try_secret':
      renderNpcDialogue(npc, tryRevealSecret(npc), buildNpcMenu(npc)); return;
    case 'lie':
      renderNpcDialogue(npc, doLie(npc, 0), buildNpcMenu(npc)); return;
    case 'lie2':
      renderNpcDialogue(npc, doLie(npc, 1), buildNpcMenu(npc)); return;
  }
  if (key.startsWith('ask_about:')) {
    const targetId = key.slice('ask_about:'.length);
    renderNpcDialogue(npc, answerAbout(npc, targetId), buildNpcMenu(npc));
  }
}

function answerWitness(npc) {
  const relevant = npc.memory
    .filter(m => ['talk', 'examine', 'pick_weapon', 'kill', 'found_body'].includes(m.type))
    .filter(m => m.actorId !== 'player' || m.targetId !== npc.id)
    .slice(-4);

  if (!relevant.length) {
    return pickByStyle(npc.style, {
      leader:  '这段时间里没有值得注意的事。',
      sharp:   '我什么都没看到。你问这个干嘛？',
      weak:    '我、我没看到什么……',
      smooth:  '（她温柔地）你希望我看到什么？',
      blunt:   '没有。',
      analytic:'记录为空。',
      argue:   '你问这个是不是因为你心里有鬼？',
      loyal:   '……我没注意到。',
      joke:    '我这人嘛，什么都记不住。',
      lucky:   '我看到的一切都太正常了。正常得不正常。',
    });
  }

  const limit = npc.trust >= 70 ? 4 : npc.trust >= 40 ? 3 : 2;
  const lines = [];
  for (let i = 0; i < Math.min(limit, relevant.length); i++) {
    const line = narrateMemory(relevant[i], npc.style);
    if (line) lines.push(line);
  }

  if (!lines.length) return '……我什么都没看到。';

  const prefix = pickByStyle(npc.style, {
    leader:  '我注意到几件事。',
    sharp:   '就你问得最多——好吧。',
    weak:    '我、我看到……',
    smooth:  '（她慢慢地说）',
    blunt:   '',
    analytic:'记录如下。',
    argue:   '你要听？那你要认真听。',
    loyal:   '……我记得。',
    joke:    '让我想想啊——',
    lucky:   '巧的是，我都看到了。',
  });

  return (prefix ? prefix + '\n' : '') + lines.join('\n');
}

}

/* ==========================================================
   K · 玩家控制
   ========================================================== */
function updatePlayerInput(dt) {
  const P = world.player;
  if (!P || !P.alive) return;
  let ix = 0, iy = 0;
  if (!dialogue.active && !world.struggleActive && !world.gameOver && !voteState.active) {
    if (keys.has('ArrowLeft')  || keys.has('KeyA')) ix -= 1;
    if (keys.has('ArrowRight') || keys.has('KeyD')) ix += 1;
    if (keys.has('ArrowUp')    || keys.has('KeyW')) iy -= 1;
    if (keys.has('ArrowDown')  || keys.has('KeyS')) iy += 1;
    const jm = Math.hypot(joyVec.x, joyVec.y);
    if (jm > 0.12) {
      const k = (jm - 0.12) / (1 - 0.12);
      ix += (joyVec.x / jm) * k;
      iy += (joyVec.y / jm) * k;
    }
  }
  const len = Math.hypot(ix, iy);
  if (len > 1) { ix /= len; iy /= len; }
  const tvx = ix * CONFIG.MAX_SPEED;
  const tvy = iy * CONFIG.MAX_SPEED;
  const f = 1 - Math.exp(-CONFIG.ACCEL * dt);
  P.vx += (tvx - P.vx) * f;
  P.vy += (tvy - P.vy) * f;
  if (Math.abs(P.vx) < 0.6) P.vx = 0;
  if (Math.abs(P.vy) < 0.6) P.vy = 0;
  const spd = Math.hypot(P.vx, P.vy);
  if (spd > 8) P.facing = Math.atan2(P.vy, P.vx);
  P.moving = spd > 20;
  P.x += P.vx * dt;
  P.y += P.vy * dt;
}

function resolvePlayerCollisions() {
  if (debugState.god) return;
  const P = world.player;
  if (!P || !P.alive) return;
  const R = REGIONS[world.region];
  const B = R.bounds;
  for (const s of R.solids) {
    const nx = clamp(P.x, s.x, s.x + s.w);
    const ny = clamp(P.y, s.y, s.y + s.h);
    const dx = P.x - nx;
    const dy = P.y - ny;
    const d = Math.hypot(dx, dy);
    if (d < P.r) {
      if (d === 0) {
        const left = P.x - s.x, right = s.x + s.w - P.x;
        const top = P.y - s.y, bottom = s.y + s.h - P.y;
        const m = Math.min(left, right, top, bottom);
        if (m === left)        P.x = s.x - P.r;
        else if (m === right)  P.x = s.x + s.w + P.r;
        else if (m === top)    P.y = s.y - P.r;
        else                   P.y = s.y + s.h + P.r;
      } else {
        const push = (P.r - d) / d;
        P.x += dx * push;
        P.y += dy * push;
      }
    }
  }
  P.x = clamp(P.x, B.x + P.r, B.x + B.w - P.r);
  P.y = clamp(P.y, B.y + P.r, B.y + B.h - P.r);
}

function resolveActorCollisions() {
  const P = world.player;
  if (!P || !P.alive) return;
  for (const a of world.actors) {
    if (a.isPlayer || !a.alive || a.region !== world.region) continue;
    const dx = P.x - a.x, dy = P.y - a.y;
    const d = Math.hypot(dx, dy);
    const minD = P.r + a.r;
    if (d < minD && d > 0.001) {
      const push = (minD - d) / d * 0.5;
      P.x += dx * push;
      P.y += dy * push;
    }
  }
}

function checkDoors(dt) {
  if (world.doorCooldown > 0) { world.doorCooldown -= dt; return; }
  if (dialogue.active || world.struggleActive || world.gameOver) return;
  if (voteState.active) return;
  const P = world.player;
  const R = REGIONS[world.region];
  for (const d of R.doors) {
    if (Math.hypot(P.x - d.x, P.y - d.y) < d.r) {
      switchRegion(d.to, d.spawn);
      return;
    }
  }
}

function switchRegion(toId, spawn) {
  const R = REGIONS[toId];
  if (!R) return;
  const prevRegion = world.region;
  world.region = toId;
  world.player.region = toId;
  world.player.x = spawn.x;
  world.player.y = spawn.y;
  world.player.vx = world.player.vy = 0;
  world.player.moving = false;
  world.player.facing = -Math.PI / 2;
  world.doorCooldown = CONFIG.DOOR_COOLDOWN;
  world.fade = 1;
  document.getElementById('regionLabel').textContent = R.name;
  bus.emit({
    type: 'leave', actorId: 'player', actorName: '你',
    region: prevRegion, detail: { to: toId },
  });
  bus.emit({
    type: 'enter', actorId: 'player', actorName: '你',
    region: toId, detail: { from: prevRegion },
  });
}

/* ==========================================================
   L · NPC 大脑（含跟随冷却）
   ========================================================== */
function thinkActor(actor, dt) {
  if (!actor.alive || actor.isPlayer) return;
  if (actor.desire === 'cross_region') return;

  actor.thinkTimer -= dt;
  if (actor.thinkTimer > 0) return;
  actor.thinkTimer = 1.2 + Math.random() * 1.5;

  if (actor.panicTimer > 0) actor.panicTimer -= 1.5;

  /* ---------- 恐慌 → 聚集 ---------- */
  if (actor.panicTimer > 0 || actor.fear >= 60) {
    const closest = findNearestActor(actor, a =>
      a.id !== actor.id && a.alive && a.region === actor.region
    );
    if (closest) {
      actor.desire = 'gather';
      actor.target = { kind: 'actor', id: closest.id };
    } else {
      const otherRegion = findNearestOccupiedRegion(actor);
      if (otherRegion) setCrossRegion(actor, otherRegion);
      else { actor.desire = 'idle'; actor.waitTimer = 2; }
    }
    return;
  }

  /* ---------- 杀意极高 ---------- */
  if (actor.killIntent >= 80 && !actor.killer && canKill(actor)) {
    if (actor.hasWeapon) {
      let victim = null, vd = Infinity;
      for (const a of world.actors) {
        if (!a.alive || a.id === actor.id) continue;
        if (a.region !== actor.region) continue;
        if (a.isPlayer && debugState.god) continue;
        const d = Math.hypot(a.x - actor.x, a.y - actor.y);
        if (d < vd) { vd = d; victim = a; }
      }
      if (victim) {
        actor.desire = 'approach_target';
        actor.target = { kind: 'actor', id: victim.id };
      } else {
        const targetRegion = findNearestOccupiedRegion(actor);
        if (targetRegion) setCrossRegion(actor, targetRegion);
        else { actor.desire = 'idle'; actor.waitTimer = 2; }
      }
    } else {
      actor.desire = 'seek_weapon';
    }
    return;
  }

  /* ---------- 愤怒 → 追玩家 ---------- */
  if (actor.anger >= 50 && world.player.alive) {
    if (world.player.region !== actor.region) {
      setCrossRegion(actor, world.player.region);
      return;
    }
    actor.desire = 'approach_target';
    actor.target = { kind: 'actor', id: 'player' };
    return;
  }

  /* ---------- 怀疑 → 观察 ---------- */
  const topSusp = mostSuspicious(actor, ['player']);
  if (topSusp && topSusp.score >= 25) {
    const t = topSusp.actor;
    if (t.region !== actor.region) {
      if (Math.random() < 0.35) {
        setCrossRegion(actor, t.region);
        return;
      }
    } else {
      actor.desire = 'observe';
      actor.target = { kind: 'actor', id: t.id };
      return;
    }
  }

  /* ---------- 信任玩家 → 短期跟随（有冷却） ---------- */
  if (actor.trust >= 65 && world.player.alive &&
      actor.followCooldownUntil < world.time) {
    const distToPlayer = actor.region === world.player.region
      ? Math.hypot(actor.x - world.player.x, actor.y - world.player.y)
      : Infinity;
    /* 距离够远才触发跟随 */
    if (distToPlayer > CONFIG.FOLLOW_TRIGGER_DIST) {
      if (actor.region !== world.player.region && Math.random() < 0.25) {
        setCrossRegion(actor, world.player.region);
        return;
      } else if (actor.region === world.player.region) {
        actor.desire = 'approach_player';
        actor.target = { kind: 'actor', id: 'player' };
        actor.followUntil = world.time + CONFIG.FOLLOW_DURATION;
        return;
      }
    }
  }

  /* ---------- 游荡 ---------- */
  if (actor.waitTimer > 0) {
    actor.desire = 'idle';
    return;
  }
  actor.desire = 'wander';
  pickWanderTarget(actor);
  actor.waitTimer = 3 + Math.random() * 5;
}

function pickWanderTarget(actor) {
  const R = REGIONS[actor.region];
  if (!R) return;
  const B = R.bounds;
  for (let attempt = 0; attempt < 20; attempt++) {
    const x = B.x + actor.r + 20 + Math.random() * (B.w - actor.r * 2 - 40);
    const y = B.y + actor.r + 20 + Math.random() * (B.h - actor.r * 2 - 40);
    let blocked = false;
    for (const s of R.solids) {
      if (x > s.x - actor.r && x < s.x + s.w + actor.r &&
          y > s.y - actor.r && y < s.y + s.h + actor.r) {
        blocked = true; break;
      }
    }
    if (blocked) continue;
    let nearDoor = false;
    for (const d of R.doors) {
      if (Math.hypot(x - d.x, y - d.y) < d.r + 30) { nearDoor = true; break; }
    }
    if (nearDoor) continue;
    actor.target = { kind: 'point', x, y };
    return;
  }
}

function updateNpcMovement(actor, dt) {
  if (!actor.alive || actor.isPlayer) return;

  if (actor.desire === 'idle') {
    actor.vx = actor.vy = 0;
    actor.moving = false;
    if (actor.waitTimer > 0) actor.waitTimer -= dt;
    return;
  }

  if (actor.desire === 'cross_region' && actor.target?.kind === 'door') {
    const door = actor.target.door;
    const d = Math.hypot(actor.x - door.x, actor.y - door.y);
    if (d < door.r + 15) {
      actor.region = door.to;
      actor.x = door.spawn.x;
      actor.y = door.spawn.y;
      actor.vx = actor.vy = 0;
      actor.moving = false;
      actor.target = null;
      actor.desire = 'idle';
      actor.waitTimer = 0.5;
      actor.thinkTimer = 0.3;
      return;
    }
    moveNpcTowards(actor, door.x, door.y, dt);
    return;
  }

  if (actor.desire === 'gather') {
    const other = getActor(actor.target?.id);
    if (!other || !other.alive || other.region !== actor.region) {
      actor.desire = 'idle';
      actor.waitTimer = 1;
      return;
    }
    const d = Math.hypot(actor.x - other.x, actor.y - other.y);
    if (d > 50) moveNpcTowards(actor, other.x, other.y, dt);
    else { actor.vx = actor.vy = 0; actor.moving = false; }
    return;
  }

  if (actor.desire === 'seek_weapon') {
    const ws = weaponsInRegion(actor.region);
    if (ws.length) {
      const w = ws[0];
      const d = Math.hypot(w.x - actor.x, w.y - actor.y);
      if (d < 30) {
        pickUpWeapon(actor, w.id);
        actor.desire = 'idle';
        actor.waitTimer = 1;
      } else {
        moveNpcTowards(actor, w.x, w.y, dt);
      }
    } else {
      const targetRegion = findRegionWithWeapon();
      if (targetRegion && targetRegion !== actor.region) {
        setCrossRegion(actor, targetRegion);
      } else {
        actor.desire = 'idle';
        actor.waitTimer = 2;
      }
    }
    return;
  }

  if (!actor.target) {
    actor.desire = 'idle';
    actor.waitTimer = 1;
    return;
  }

  if (actor.target.kind === 'point') {
    moveNpcTowards(actor, actor.target.x, actor.target.y, dt);
    return;
  }

  if (actor.target.kind === 'actor') {
    const other = getActor(actor.target.id);
    if (!other || !other.alive) {
      actor.target = null;
      actor.desire = 'idle';
      actor.waitTimer = 1;
      return;
    }
    if (other.region !== actor.region) {
      setCrossRegion(actor, other.region);
      return;
    }
    const d = Math.hypot(actor.x - other.x, actor.y - other.y);

    if (actor.desire === 'approach_target') {
      if (d > 40) moveNpcTowards(actor, other.x, other.y, dt);
      else { actor.vx = actor.vy = 0; actor.moving = false; }
    } else if (actor.desire === 'approach_player') {
      /* 跟随超时 → 停止并进入冷却 */
      if (world.time > actor.followUntil) {
        actor.desire = 'idle';
        actor.target = null;
        actor.waitTimer = 2 + Math.random() * 3;
        actor.followCooldownUntil = world.time + CONFIG.FOLLOW_COOLDOWN;
        actor.vx = actor.vy = 0;
        actor.moving = false;
        return;
      }
      /* 太近了也停 */
      if (d > 80) moveNpcTowards(actor, other.x, other.y, dt);
      else { actor.vx = actor.vy = 0; actor.moving = false; }
    } else if (actor.desire === 'observe') {
      if (d > 200) moveNpcTowards(actor, other.x, other.y, dt);
      else if (d < 120) {
        const dx = actor.x - other.x, dy = actor.y - other.y;
        const dd = Math.hypot(dx, dy) || 1;
        moveNpcTowards(actor, actor.x + (dx / dd) * 150,
                       actor.y + (dy / dd) * 150, dt);
      } else { actor.vx = actor.vy = 0; actor.moving = false; }
    }
  }
}

function moveNpcTowards(actor, tx, ty, dt) {
  const dx = tx - actor.x;
  const dy = ty - actor.y;
  const d = Math.hypot(dx, dy);
  if (d < 5) {
    actor.vx = actor.vy = 0;
    actor.moving = false;
    if (actor.desire === 'wander') {
      actor.target = null;
      actor.desire = 'idle';
      actor.waitTimer = 2 + Math.random() * 4;
    }
    return;
  }
  const R = REGIONS[actor.region];
  const B = R.bounds;
  let nx = dx / d, ny = dy / d;
  const lookAhead = actor.r + 8;
  const probeX = actor.x + nx * lookAhead;
  const probeY = actor.y + ny * lookAhead;
  for (const s of R.solids) {
    if (probeX > s.x && probeX < s.x + s.w &&
        probeY > s.y && probeY < s.y + s.h) {
      const perpX = -ny, perpY = nx;
      nx = nx * 0.3 + perpX * 0.7;
      ny = ny * 0.3 + perpY * 0.7;
      break;
    }
  }
  const speed = (actor.panicTimer > 0 || actor.fear >= 60)
    ? CONFIG.NPC_SPEED_PANIC : CONFIG.NPC_SPEED;
  actor.vx = nx * speed;
  actor.vy = ny * speed;
  actor.x += actor.vx * dt;
  actor.y += actor.vy * dt;
  actor.facing = Math.atan2(actor.vy, actor.vx);
  actor.moving = true;
  actor.x = clamp(actor.x, B.x + actor.r, B.x + B.w - actor.r);
  actor.y = clamp(actor.y, B.y + actor.r, B.y + B.h - actor.r);
}

function findNearestActor(self, filterFn) {
  let best = null, bestD = Infinity;
  for (const a of world.actors) {
    if (a.id === self.id) continue;
    if (!filterFn(a)) continue;
    const d = Math.hypot(a.x - self.x, a.y - self.y);
    if (d < bestD) { bestD = d; best = a; }
  }
  return best;
}

function setCrossRegion(actor, targetRegionId) {
  if (actor.region === targetRegionId) return;
  const R = REGIONS[actor.region];
  let door = R.doors.find(d => d.to === targetRegionId);
  if (!door) {
    const intermediate = findPathThrough(actor.region, targetRegionId);
    if (intermediate) door = R.doors.find(d => d.to === intermediate);
  }
  if (!door) {
    actor.desire = 'idle';
    actor.waitTimer = 2;
    return;
  }
  actor.desire = 'cross_region';
  actor.target = { kind: 'door', door };
}

function findPathThrough(fromRegion, toRegion) {
  const fromR = REGIONS[fromRegion];
  const toR = REGIONS[toRegion];
  if (!fromR || !toR) return null;
  if (fromR.doors.some(d => d.to === toRegion)) return toRegion;
  if (fromRegion !== 'hall' && toRegion !== 'hall') {
    if (fromR.doors.some(d => d.to === 'hall') &&
        toR.doors.some(d => d.to === 'hall')) {
      return 'hall';
    }
  }
  return null;
}

function findNearestOccupiedRegion(actor) {
  const regions = new Set();
  for (const a of world.actors) {
    if (a.alive && a.id !== actor.id && a.region !== actor.region) {
      regions.add(a.region);
    }
  }
  const candidates = [...regions];
  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function findRegionWithWeapon() {
  for (const w of Object.values(worldWeapons)) {
    if (w.onGround && w.region) return w.region;
  }
  return null;
}

            '天台边缘有拖拽痕迹。'] },
  pill: { id: 'pill', name: '药瓶', region: 'infirmary', x: 380, y: 240,
    clues: ['死者无明显外伤，嘴唇发紫。',
            '桌上有一只空杯子。',
            '死者手里攥着一片药。'] },
  syringe: { id: 'syringe', name: '注射器', region: 'infirmary', x: 420, y: 100,
    clues: ['死者手臂上有针孔。',
            '注射器里有残留液体。',
            '死者表情安详。'] },
};

const worldWeapons = {};

function initWorldWeapons() {
  for (const k of Object.keys(worldWeapons)) delete worldWeapons[k];
  for (const w of Object.values(WEAPON_DEFS)) {
    worldWeapons[w.id] = {
      id: w.id, name: w.name, region: w.region, x: w.x, y: w.y,
      clues: [...w.clues],
      heldBy: null, onGround: true, usedInKill: false,
    };
  }
}

function weaponsInRegion(regionId) {
  return Object.values(worldWeapons).filter(w =>
    w.region === regionId && w.onGround && !w.heldBy
  );
}

/* ---------- 拾取（禁止双持） ---------- */
function pickUpWeapon(actor, weaponId) {
  /* 已经持有武器 → 拒绝 */
  if (actor.hasWeapon) {
    if (actor.isPlayer) broadcast('你手上已经有一件凶器了。先放下再拿。');
    return false;
  }
  const w = worldWeapons[weaponId];
  if (!w || w.heldBy || !w.onGround) return false;
  if (w.region !== actor.region) return false;

  w.onGround = false;
  w.heldBy = actor.id;
  w.region = null;
  actor.hasWeapon = weaponId;

  bus.emit({
    type: 'pick_weapon',
    actorId: actor.id, actorName: actor.name,
    region: actor.region,
    detail: { weaponId, weaponName: w.name, propName: w.name },
  });

  for (const other of world.actors) {
    if (other.isPlayer) continue;
    if (!other.alive) continue;
    if (other.region !== actor.region) continue;
    if (other.id === actor.id) continue;
    const d = Math.hypot(other.x - actor.x, other.y - actor.y);
    if (d < 300) {
      other.fear = Math.min(100, other.fear + 20);
      other.trust = Math.max(0, other.trust - 10);
      if (other.style === 'leader' || other.style === 'blunt') {
        other.anger = Math.min(100, other.anger + 15);
      }
    }
  }

  if (actor.isPlayer) {
    broadcast(`你拿起了 ${w.name}。`);
    world.playerWeaponId = weaponId;
  } else if (world.player.alive && world.player.region === actor.region) {
    const dx = actor.x - world.player.x;
    const dy = actor.y - world.player.y;
    if (Math.hypot(dx, dy) < 400) {
      broadcast(`${actor.name} 拿起了 ${w.name}。`);
    }
  }
  return true;
}

function dropWeapon(actor) {
  if (!actor.hasWeapon) return;
  const w = worldWeapons[actor.hasWeapon];
  if (!w) { actor.hasWeapon = null; return; }
  w.onGround = true;
  w.heldBy = null;
  w.region = actor.region;
  w.x = actor.x + (Math.random() - 0.5) * 30;
  w.y = actor.y + (Math.random() - 0.5) * 30;
  actor.hasWeapon = null;
  if (actor.isPlayer) world.playerWeaponId = null;
}

function dropWeaponUI() {
  if (!world.playerWeaponId) return;
  const w = worldWeapons[world.playerWeaponId];
  if (!w) {
    world.playerWeaponId = null;
    world.player.hasWeapon = null;
    return;
  }
  const name = w.name;
  dropWeapon(world.player);
  broadcast(`你放下了 ${name}。`);
}

/* ==========================================================
   N · 杀人系统
   ========================================================== */
function executeKill(killer, victim) {
  if (!killer || !victim) return false;
  if (!killer.alive || !victim.alive) return false;
  if (killer.id === victim.id) return false;
  if (killer.region !== victim.region) return false;
  if (!killer.hasWeapon) return false;
  const w = worldWeapons[killer.hasWeapon];
  if (!w) return false;
  if (!canKill(killer)) {
    if (killer.isPlayer) broadcast('你不能再杀人了。');
    return false;
  }
  if (victim.isPlayer) {
    if (!world.struggleActive && !world.gameOver) startStruggle(killer);
    return false;
  }
  doKill(killer, victim, w);
  return true;
}

function doKill(killer, victim, weapon) {
  victim.alive = false;
  world.dead.push(victim.id);
  killer.killer = true;
  killer.kills = killer.kills || [];
  killer.kills.push(world.time);
  if (!world.killers.includes(killer.id)) world.killers.push(killer.id);
  killer.hasWeapon = null;
  if (killer.isPlayer) {
    world.playerIsKiller = true;
    world.playerKillCount = (world.playerKillCount || 0) + 1;
  }
  const w = worldWeapons[weapon.id];
  w.onGround = true;
  w.heldBy = null;
  w.region = victim.region;
  w.x = victim.x + 8;
  w.y = victim.y + 8;
  w.usedInKill = true;
  const shuffled = [...w.clues].sort(() => Math.random() - 0.5);
  const picked = shuffled.slice(0, 2 + Math.floor(Math.random() * 2));
  const evt = {
    killerId: killer.id, killerName: killer.name,
    victimId: victim.id, victimName: victim.name,
    weaponId: weapon.id, weaponName: weapon.name,
    time: world.time, gameTime: world.gameTime, region: victim.region,
    clues: picked, witnessed: [],
  };
  world.killEvents.push(evt);
  const witnesses = world.actors.filter(a =>
    a.alive && !a.isPlayer &&
    a.region === victim.region &&
    a.id !== killer.id && a.id !== victim.id
  );
  evt.witnessed = witnesses.map(a => a.id);
  bus.emit({
    type: 'kill',
    actorId: killer.id, actorName: killer.name,
    targetId: victim.id, targetName: victim.name,
    region: victim.region,
    detail: { weaponId: weapon.id, weaponName: weapon.name },
  });
  for (const a of world.actors) {
    if (!a.alive || a.isPlayer) continue;
    a.fear = Math.min(100, a.fear + 20);
    if (a.region === victim.region) {
      a.fear = Math.min(100, a.fear + 30);
      a.panicTimer = 10;
      a.thinkTimer = 0;
      if (a.id !== killer.id) {
        a.desire = 'gather';
        a.target = null;
        a.waitTimer = 0;
      }
    }
  }
  for (const wId of evt.witnessed) {
    const wActor = getActor(wId);
    if (!wActor) continue;
    const mem = wActor.memory.find(m =>
      m.type === 'kill' && m.actorId === killer.id && m.targetId === victim.id
    );
    if (mem) mem.strength = 9999;
  }
  startEscapeTimer(killer.id);
  if (killer.isPlayer) {
    broadcast(`你杀了 ${victim.name}。`, 5);
  } else if (world.player.alive) {
    if (world.player.region === victim.region) {
      broadcast(`${victim.name} 倒下了。凶手是 ${killer.name}。`, 5);
    } else {
      broadcast(`远处传来一声响。${victim.name} 出事了。`, 5);
    }
  }
  if (world.phase === 'calm') world.phase = 'tense';
  else if (world.killEvents.length >= 3) world.phase = 'chaos';
  checkAliveCount();
  return evt;
}

function killConsequences(killerId, victimId) {
  const killer = getActor(killerId);
  const victim = getActor(victimId);
  if (!killer || !victim) return;
  for (const a of world.actors) {
    if (!a.alive || a.isPlayer) continue;
    if (a.id === killerId) continue;
    if (a.faction === killer.faction && a.faction !== 'none' && a.faction !== 'lone') {
      a.trust = Math.max(0, a.trust - 20);
      a.anger = Math.min(100, a.anger + 20);
      a.killIntent = Math.min(100, a.killIntent + 10);
    }
    if (a.faction === victim.faction && a.faction !== 'none' && a.faction !== 'lone') {
      a.anger = Math.min(100, a.anger + 40);
      a.killIntent = Math.min(100, a.killIntent + 15);
      const faction = FACTIONS[a.faction];
      if (faction && faction.leader === victim.id) {
        for (const memberId of faction.members) {
          const m = getActor(memberId);
          if (m && m.alive) m.loyalty = 0;
        }
      }
    }
    if (a.id === 'zhiyuchen' && victimId === 'zhangsien') {
      a.fear = 100; a.anger = 100; a.killIntent = 100; a.trust = 0;
    }
    if (a.id === 'ruanrou' && victimId === 'player') {
      a.anger = 100; a.killIntent = 100; a.fear = 80;
    }
  }
  if (killer.isPlayer) {
    for (const a of world.actors) {
      if (!a.alive || a.isPlayer) continue;
      a.trust = Math.max(0, a.trust - 25);
    }
  }
}

bus.on((event) => {
  if (event.type === 'kill') killConsequences(event.actorId, event.targetId);
});

function checkAliveCount() {
  const alive = world.actors.filter(a => a.alive).length;
  if (alive <= CONFIG.WIN_REMAIN && !world.gameOver) {
    if (world.player.alive) triggerGameEnd('survive');
    else if (world.ending !== 'player_dead') triggerGameEnd('all_dead');
  }
}

function startEscapeTimer(killerId) {
  world.escapeTimers[killerId] = CONFIG.ESCAPE_GAME_SEC;
}

function tickEscapeTimers(dt) {
  const gameDt = dt * CONFIG.TIME_SCALE;
  for (const killerId of Object.keys(world.escapeTimers)) {
    world.escapeTimers[killerId] -= gameDt;
    if (world.escapeTimers[killerId] <= 0) {
      executeEscape(killerId);
      delete world.escapeTimers[killerId];
    }
  }
}

function executeEscape(killerId) {
  const killer = getActor(killerId);
  if (!killer || !killer.alive) return;
  killer.alive = false;
  killer.escaped = true;
  world.dead.push(killer.id);
  broadcast(`${killer.name} 走出了校门。`, 6);
  for (const a of world.actors) {
    if (!a.alive || a.isPlayer) continue;
    if (a.id === killer.id) continue;
    addMemory(a, {
      type: 'escape', actorId: killer.id, actorName: killer.name,
      region: a.region, time: world.time, gameTime: world.gameTime,
    }, 'full');
    a.fear = Math.min(100, a.fear + 30);
  }
  if (killer.isPlayer) { triggerGameEnd('player_escape'); return; }
  checkAliveCount();
}

function tickMemoryDecay(dt) {
  const decay = dt * (1 / 60);
  for (const a of world.actors) {
    if (!a.alive) continue;
    for (let i = a.memory.length - 1; i >= 0; i--) {
      const m = a.memory[i];
      if (m.strength === 9999) continue;
      m.strength -= decay;
      if (m.strength <= 0) { a.memory.splice(i, 1); continue; }
      if (m.strength > 70)      m.clarity = 'full';
      else if (m.strength > 30) m.clarity = 'partial';
      else                      m.clarity = 'vague';
    }
  }
}

function checkBodyDiscoveries() {
  for (const a of world.actors) {
    if (!a.alive || a.isPlayer) continue;
    for (const evt of world.killEvents) {
      if (a.discoveredBodies.includes(evt.victimId)) continue;
      const victim = getActor(evt.victimId);
      if (!victim || victim.alive) continue;
      const witnessed = a.memory.some(m =>
        m.type === 'kill' && m.targetId === evt.victimId
      );
      if (witnessed) {
        a.discoveredBodies.push(evt.victimId);
        continue;
      }
      if (a.region !== evt.region) continue;
      const d = Math.hypot(victim.x - a.x, victim.y - a.y);
      if (d < 100) {
        a.discoveredBodies.push(evt.victimId);
        a.fear = Math.min(100, a.fear + 40);
        a.anger = Math.min(100, a.anger + 15);
        a.panicTimer = 8;
        a.thinkTimer = 0;
        addMemory(a, {
          type: 'found_body',
          actorId: 'unknown', actorName: '？',
          targetId: evt.victimId, targetName: evt.victimName,
          region: a.region, time: world.time, gameTime: world.gameTime,
          detail: { weaponName: evt.weaponName },
        }, 'full');
        if (world.player.alive) {
          broadcast(`${a.name} 发现了 ${evt.victimName}。`, 5);
        }
        for (const other of world.actors) {
          if (other.alive && !other.isPlayer && other.id !== a.id) {
            other.fear = Math.min(100, other.fear + 10);
          }
        }
      }
    }
  }
}

let backgroundTick = 0;
let lastKillTime = -999;

function simulateBackgroundRegions(dt) {
  backgroundTick += dt;
  if (backgroundTick < 10) return;
  backgroundTick = 0;
  if (world.time - lastKillTime < 90) return;
  const allRegions = Object.keys(REGIONS);
  for (const regionId of allRegions) {
    if (regionId === world.region) continue;
    const actorsHere = world.actors.filter(a =>
      a.alive && !a.isPlayer && a.region === regionId
    );
    if (actorsHere.length < 2) continue;
    for (const killer of actorsHere) {
      if (killer.killIntent < 85) continue;
      if (!canKill(killer)) continue;
      if (!killer.hasWeapon) {
        const ws = weaponsInRegion(regionId);
        if (ws.length) pickUpWeapon(killer, ws[0].id);
        continue;
      }
      const candidates = actorsHere.filter(a => a.id !== killer.id && a.alive);
      if (!candidates.length) continue;
      candidates.sort((a, b) => {
        const sa = killer.suspicion[a.id] || 0;
        const sb = killer.suspicion[b.id] || 0;
        if (sa !== sb) return sb - sa;
        return a.trust - b.trust;
      });
      const victim = candidates[0];
      doKill(killer, victim, worldWeapons[killer.hasWeapon]);
      lastKillTime = world.time;
      return;
    }
  }
}

function tryNpcKill(actor) {
  if (!actor.alive || actor.isPlayer) return;
  if (!actor.hasWeapon) return;
  if (actor.killIntent < 80) return;
  if (actor.panicTimer > 0 || actor.fear >= 70) return;
  if (!canKill(actor)) return;
  let best = null, bestD = Infinity;
  for (const a of world.actors) {
    if (!a.alive) continue;
    if (a.id === actor.id) continue;
    if (a.region !== actor.region) continue;
    if (a.isPlayer && debugState.god) continue;
    const d = Math.hypot(a.x - actor.x, a.y - actor.y);
    if (d < 120 && d < bestD) { bestD = d; best = a; }
  }
  if (!best) return;
  if (Math.random() < 0.05) executeKill(actor, best);
}

function tryPlayerKillTarget(npc) {
  if (!npc || !npc.alive) return;
  if (!world.playerWeaponId) return;
  if (!canKill(world.player)) {
    broadcast('你已经杀过两个人了。不能再动手。');
    return;
  }
  const w = worldWeapons[world.playerWeaponId];
  if (!w) return;
  const d = Math.hypot(npc.x - world.player.x, npc.y - world.player.y);
  if (d > CONFIG.KILL_DISTANCE + 10) {
    broadcast('太远了，走近点。');
    return;
  }
  const confirmed = confirm(`用 ${w.name} 杀了 ${npc.name}？\n\n你现在是凶手了。`);
  if (!confirmed) return;
  const success = executeKill(world.player, npc);
  if (success) lastKillTime = world.time;
}

function getBodyAt(regionId, x, y, r = 25) {
  for (const evt of world.killEvents) {
    if (evt.region !== regionId) continue;
    const victim = getActor(evt.victimId);
    if (!victim) continue;
    if (!victim.alive) {
      const d = Math.hypot(victim.x - x, victim.y - y);
      if (d < r + 20) return { event: evt, victim };
    }
  }
  return null;
}

function examineBody(body) {
  const lines = [`${body.victim.name}。`];
  if (body.event.clues.length) {
    for (const c of body.event.clues) lines.push('· ' + c);
  }
  if (body.event.witnessed.includes('player')) {
    lines.push(`· 你看到是 ${body.event.killerName} 动的手。`);
  }
  if (body.victim.trust >= 65) {
    lines.push(`· （你想起${body.victim.name}之前对你说过的话。）`);
  }
  dialogue.active = true;
  dialogue.persistent = false;
  dialogue.timer = 4.5;
  document.getElementById('joystick').classList.add('locked');
  document.getElementById('actionBtn').classList.add('hidden');
  dialogueUI.speaker.textContent = '现场';
  dialogueUI.avatarBox.innerHTML = avatarSVG('dead');
  dialogueUI.line.textContent = lines.join('\n');
  dialogueUI.choices.innerHTML = '';
  dialogueUI.el.classList.add('show');
  const btn = document.createElement('button');
  btn.className = 'choice';
  btn.textContent = '离开';
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    closeDialogue();
  });
  dialogueUI.choices.appendChild(btn);
  bus.emit({
    type: 'examine',
    actorId: 'player', actorName: '你',
    region: body.event.region,
    detail: { propName: '尸体', propKind: 'body' },
  });
}

/* ==========================================================
   O · 投票系统
   ========================================================== */
const voteState = {
  active: false, phase: 'idle', speakers: [], speakerIndex: -1,
  speeches: {}, npcVotes: {}, playerVote: null,
  savedPositions: {}, jailedId: null,
};
let lastForceVoteTime = 0;

function canStartVote() {
  if (voteState.active) return false;
  if (dialogue.active) return false;
  if (world.struggleActive || world.gameOver) return false;
  const aliveActors = world.actors.filter(a => a.alive);
  if (aliveActors.length <= CONFIG.WIN_REMAIN) return false;
  const aliveNpcs = aliveActors.filter(a => !a.isPlayer);
  if (aliveNpcs.length < 1) return false;
  return true;
}

function startVote() {
  if (!canStartVote()) { broadcast('现在还不适合。'); return; }
  voteState.active = true;
  voteState.phase = 'speech';
  voteState.speeches = {};
  voteState.npcVotes = {};
  voteState.playerVote = null;
  voteState.jailedId = null;
  voteState.savedPositions = {};
  broadcast('有人在主教室喊了一声："都过来！"', 4);
  for (const a of world.actors) {
    if (!a.alive || a.isPlayer) continue;
    voteState.savedPositions[a.id] = { region: a.region, x: a.x, y: a.y };
  }
  const R = REGIONS.main;
  const aliveNpcs = world.actors.filter(a => a.alive && !a.isPlayer);
  aliveNpcs.forEach((a, i) => {
    const angle = (i / aliveNpcs.length) * Math.PI * 2;
    const rx = 350 + Math.cos(angle) * 180;
    const ry = 250 + Math.sin(angle) * 150;
    a.region = 'main';
    a.x = clamp(rx, R.bounds.x + a.r, R.bounds.x + R.bounds.w - a.r);
    a.y = clamp(ry, R.bounds.y + a.r, R.bounds.y + R.bounds.h - a.r);
    a.vx = a.vy = 0;
    a.moving = false;
    a.facing = Math.atan2(250 - a.y, 350 - a.x);
    a.desire = 'idle';
    a.waitTimer = 999;
  });
  if (world.player.alive && world.region !== 'main') {
    switchRegion('main', { x: 350, y: 460 });
  }
  xuyunxiShadowAction();
  voteState.speakers = aliveNpcs.sort((a, b) => {
    if (a.style === 'leader') return -1;
    if (b.style === 'leader') return 1;
    return (b.observe || 0) - (a.observe || 0);
  });
  voteState.speakerIndex = -1;
  advanceSpeech();
}

function xuyunxiShadowAction() {
  const xuyunxi = getActor('xuyunxi');
  if (!xuyunxi || !xuyunxi.alive) return;
  const herSuspicion = estimateSuspicionOn(xuyunxi.id);
  if (herSuspicion < 30) return;
  const targets = world.actors
    .filter(a => a.alive && !a.isPlayer && a.id !== 'xuyunxi')
    .filter(a => a.observe < 60 || a.trust < 50)
    .slice(0, 2);
  for (const t of targets) {
    const scapegoat = world.actors
      .filter(a => a.alive && !a.isPlayer && a.id !== 'xuyunxi' && a.id !== t.id)
      .sort((a, b) => estimateSuspicionOn(b.id) - estimateSuspicionOn(a.id))[0];
    if (scapegoat) {
      t.suspicion[scapegoat.id] = Math.min(100, (t.suspicion[scapegoat.id] || 0) + 15);
    }
  }
}

function estimateSuspicionOn(targetId) {
  let total = 0, count = 0;
  for (const a of world.actors) {
    if (!a.alive || a.isPlayer) continue;
    if (a.id === targetId) continue;
    total += (a.suspicion[targetId] || 0);
    count++;
  }
  return count > 0 ? total / count : 0;
}

function generateSpeech(npc) {
  const recentKill = npc.memory.filter(m => m.type === 'kill').sort((a, b) => b.time - a.time)[0];
  const recentWeapon = npc.memory.filter(m => m.type === 'pick_weapon').sort((a, b) => b.time - a.time)[0];
  const recentLie = npc.memory.filter(m => m.type === 'lie' && m.actorId === 'player').sort((a, b) => b.time - a.time)[0];

  if (recentKill && recentKill.clarity === 'full') {
    switch (npc.style) {
      case 'leader':   return `（他站起来，声音很稳）\n我看见${recentKill.actorName}动了手。\n这不是猜测。${recentKill.targetName}倒下的时候，我就在不远处。`;
      case 'analytic': return `（他推了推眼镜）\n我记录如下：${recentKill.actorName}在${formatGameTime(recentKill.gameTime)}，对${recentKill.targetName}实施了致命行为。\n没有其他解释空间。`;
      case 'sharp':    return `（她一下子站起来）\n${recentKill.actorName}！\n我看见了，就在${recentKill.targetName}旁边。\n我一直在看着。`;
      case 'weak':     return `（她颤抖着举起手）\n我、我看见了……${recentKill.actorName}……他把${recentKill.targetName}……\n对不起……对不起我不是不想说……`;
      case 'smooth':   return `（她慢慢开口，语气很轻）\n我其实不想说的。\n但我看见了${recentKill.actorName}。\n在那个时刻，他就在${recentKill.targetName}身边。`;
      case 'blunt':    return `（他直接看向${recentKill.actorName}）\n是你。\n我看见了。`;
      case 'argue':    return `（他站起来，指着${recentKill.actorName}）\n你要解释一下吗？\n${recentKill.targetName}倒下的时候，你就在那儿。别告诉我你只是路过。`;
      case 'loyal':    return `（他咬着嘴唇）\n我看见了……是${recentKill.actorName}。\n我……我不想相信。但我看见了。`;
      case 'joke':     return `（他难得没有笑）\n……我看见${recentKill.actorName}了。\n我不想当那个说话的人，但我看见了。`;
      case 'lucky':    return `（他苦笑了一下）\n巧的是，我看得一清二楚。\n${recentKill.actorName}。`;
    }
  }
  if (recentLie) {
    return pickByStyle(npc.style, {
      leader:  '（他冷冷地说）\n有人对我说了谎。\n我不打算公开是谁。\n但那个人自己心里清楚。',
      analytic:'（他翻着笔记本）\n记录：有人说谎。\n数据对比不一致。',
      sharp:   '（她看了你一眼）\n有人不老实。\n我不想点名。但你要知道，我记性很好。',
      weak:    '（她小声）\n……有人骗我了……\n我不想说是谁……',
      smooth:  '（她笑得很温和）\n有人撒了个小谎。\n真的。就一个小小的谎。',
      blunt:   '（他抱着手臂）\n有人撒谎。\n我记着。',
      argue:   '（他冷笑）\n有人对我说了假话。\n我希望他自己站起来说清楚。',
      loyal:   '（他低着头）\n……有人骗我了。\n我不太想相信。',
      joke:    '（他没笑）\n有人对我说了谎。\n这不好笑。',
      lucky:   '（他摊了摊手）\n巧的是，我刚好发现有个谎。',
    });
  }
  if (recentWeapon && recentWeapon.clarity !== 'vague') {
    return generateWeaponSpeech(npc, recentWeapon);
  }
  const top = mostSuspicious(npc, []);
  const topIsPlayer = top && top.actor.isPlayer;
  if (!top || top.score < 10) return generateVagueSpeech(npc);
  const targetName = topIsPlayer ? '你' : top.actor.name;
  switch (npc.style) {
    case 'leader':   return `（他扫视了一圈）\n我看${targetName}。\n不是因为证据。是因为他今天的每个动作，都不像他平时的样子。\n我需要一个解释。`;
    case 'analytic': return `（他翻了一页笔记）\n数据分析：${targetName}的行为模式，与基准偏离最大。\n我不会下结论。但这是唯一值得关注的人。`;
    case 'sharp':    return `（她抱着手臂，目光很冷）\n${targetName}。\n我早就觉得他不对劲了。\n你们爱信不信。`;
    case 'weak':     return `（她小声说）\n我、我不确定……\n但${targetName}……他今天让我有点害怕……`;
    case 'smooth':   return `（她轻轻笑了一下）\n我不好说。\n但${targetName}今天很安静。安静得让人不舒服。\n我只是说说而已。`;
    case 'blunt':    return `（他直接开口）\n${targetName}。\n感觉不对。`;
    case 'argue':    return `（他抬起下巴）\n${targetName}。\n我想听他怎么解释。\n不解释，就是默认。`;
    case 'loyal':    return `（他低着头，声音很小）\n我不想说人坏话。\n但${targetName}……我真的有点担心。`;
    case 'joke':     return `（他转了转手里的硬币）\n我不太会分析啊。\n但${targetName}今天，怎么说呢……像是有事。`;
    case 'lucky':    return `（他看了看${targetName}）\n我的直觉一向挺准。\n${targetName}。`;
  }
  return `${targetName}。`;
}

function generateWeaponSpeech(npc, mem) {
  const s = mem.actorName;
  const wn = mem.detail?.weaponName || '一把凶器';
  switch (npc.style) {
    case 'leader':   return `（他语气很重）\n我看见${s}拿了${wn}。\n这不是一件小事。\n无论他拿去做什么，我们都应该搞清楚。`;
    case 'analytic': return `（他平静地说）\n记录：${s}在${formatGameTime(mem.gameTime)}，拿走了${wn}。\n这件事本身不构成杀人证据。\n但它需要解释。`;
    case 'sharp':    return `（她直接看向${s}）\n你拿了${wn}。\n别否认，我看见了。\n你拿去干什么了？`;
    case 'weak':     return `（她很小声）\n${s}……拿了${wn}……\n我看见了……我不敢说……`;
    case 'smooth':   return `（她缓缓地说）\n${s}拿了${wn}。\n我没有别的意思。\n只是想问问，那是用来做什么的？`;
    case 'blunt':    return `（他直说）\n${s}拿了${wn}。\n我要知道为什么。`;
    case 'argue':    return `（他冷冷地）\n${s}，你拿${wn}干什么？\n你可以不回答。但答案会说明一切。`;
    case 'loyal':    return `（他犹豫了很久）\n……我看见${s}拿了${wn}。\n我不想想太多。但……`;
    case 'joke':     return `（他笑容有点僵）\n${s}拿了${wn}。\n说真的，我希望只是个误会。`;
    case 'lucky':    return `（他摸摸口袋）\n${s}拿了${wn}。\n巧的是，我当时就在旁边。`;
  }
  return `${s}拿了${wn}。`;
}

function generateVagueSpeech(npc) {
  switch (npc.style) {
    case 'leader':   return `（他沉默了一会儿）\n我没有证据。\n但我建议所有人接下来不要单独行动。`;
    case 'analytic': return `（他推了推眼镜）\n目前数据不足以下结论。\n但我建议，先观察，不要急着投任何人。`;
    case 'sharp':    return `（她翻了个白眼）\n我看不出来。\n但我不相信任何人。`;
    case 'weak':     return `（她缩着肩膀）\n我、我什么都不知道……\n我真的不知道……`;
    case 'smooth':   return `（她慢慢地环视一圈）\n大家都很好。\n我希望大家都很好。\n但我心里有点……说不出的感觉。`;
    case 'blunt':    return `（他抱着手臂）\n我没感觉。\n随便。`;
    case 'argue':    return `（他摊了摊手）\n你们想投谁就投谁。\n我保留意见。`;
    case 'loyal':    return `（他低着头）\n我……我不想投任何人。\n大家都不像坏人。`;
    case 'joke':     return `（他笑了一下）\n我今天什么都没看见。\n也许我该去配副眼镜。`;
    case 'lucky':    return `（他摸摸头）\n我觉得今天有个人不对劲。\n但我一时说不上来。`;
  }
  return '……';
}

function advanceSpeech() {
  voteState.speakerIndex++;
  if (voteState.speakerIndex >= voteState.speakers.length) {
    beginPlayerVote();
    return;
  }
  const speaker = voteState.speakers[voteState.speakerIndex];
  if (!speaker || !speaker.alive) { advanceSpeech(); return; }
  if (!voteState.speeches[speaker.id]) {
    voteState.speeches[speaker.id] = generateSpeech(speaker);
  }
  dialogue.active = true;
  dialogue.mode = 'vote_speech';
  dialogue.persistent = true;
  dialogueUI.speaker.textContent = speaker.name + ' 的发言';
  dialogueUI.avatarBox.innerHTML = avatarSVG(speaker.avatar);
  dialogueUI.line.textContent = voteState.speeches[speaker.id];
  dialogueUI.el.classList.add('show');
  dialogueUI.choices.innerHTML = '';
  const continueBtn = document.createElement('button');
  continueBtn.className = 'choice';
  continueBtn.type = 'button';
  const remaining = voteState.speakers.length - voteState.speakerIndex - 1;
  continueBtn.textContent = remaining > 0
    ? `继续（还剩 ${remaining} 人发言）` : '开始投票';
  continueBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    advanceSpeech();
  });
  dialogueUI.choices.appendChild(continueBtn);
}

function beginPlayerVote() {
  voteState.phase = 'player_vote';
  dialogue.active = true;
  dialogue.mode = 'vote_choice';
  dialogue.persistent = true;
  dialogueUI.speaker.textContent = '投 票';
  dialogueUI.avatarBox.innerHTML = avatarSVG('player');
  dialogueUI.line.textContent = '你要把票投给谁？\n（票数最高的人将被关押）';
  dialogueUI.el.classList.add('show');
  dialogueUI.choices.innerHTML = '';
  const candidates = world.actors.filter(a =>
    a.alive && !a.isPlayer &&
    !world.jailed.includes(a.id) && !a.escaped
  );
  for (const c of candidates) {
    const btn = document.createElement('button');
    btn.className = 'choice danger';
    btn.type = 'button';
    btn.textContent = c.name;
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      castPlayerVote(c.id);
    });
    dialogueUI.choices.appendChild(btn);
  }
  const abstainBtn = document.createElement('button');
  abstainBtn.className = 'choice';
  abstainBtn.type = 'button';
  abstainBtn.textContent = '（弃权）';
  abstainBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    castPlayerVote(null);
  });
  dialogueUI.choices.appendChild(abstainBtn);
}

function castPlayerVote(targetId) {
  voteState.playerVote = targetId;
  voteState.phase = 'result';
  collectNpcVotes();
  const tally = tallyVotes();
  showVoteResult(tally);
}

function collectNpcVotes() {
  voteState.npcVotes = {};
  for (const npc of world.actors) {
    if (!npc.alive || npc.isPlayer) continue;
    if (world.jailed.includes(npc.id) || npc.escaped) continue;
    voteState.npcVotes[npc.id] = decideNpcVote(npc);
  }
  applyInfluence();
}

function decideNpcVote(npc) {
  const killMem = npc.memory.filter(m => m.type === 'kill' && m.clarity === 'full').sort((a, b) => b.time - a.time)[0];
  if (killMem) return killMem.actorId;
  if (npc.style === 'leader') {
    const top = mostSuspicious(npc, []);
    if (top && top.score >= 15) return top.actor.id;
  }
  if (npc.style === 'sharp' && npc.trust >= 60 && voteState.playerVote) {
    const myS = npc.suspicion[voteState.playerVote] || 0;
    if (myS >= 5) return voteState.playerVote;
  }
  if (npc.style === 'weak') {
    const top = mostSuspicious(npc, []);
    if (top && top.score >= 10) return top.actor.id;
    return null;
  }
  if (npc.style === 'argue') {
    const candidates = world.actors
      .filter(a => a.alive && a.id !== npc.id && !a.isPlayer)
      .sort((a, b) => (npc.suspicion[a.id] || 0) - (npc.suspicion[b.id] || 0));
    if (candidates.length) return candidates[0].id;
    return null;
  }
  if (npc.style === 'lucky') {
    const realKillers = world.killers.filter(id => {
      const a = getActor(id);
      return a && a.alive && !world.jailed.includes(id);
    });
    if (realKillers.length && Math.random() < 0.6) {
      return realKillers[Math.floor(Math.random() * realKillers.length)];
    }
    const candidates = world.actors.filter(a =>
      a.alive && a.id !== npc.id && !a.isPlayer
    );
    if (candidates.length) {
      return candidates[Math.floor(Math.random() * candidates.length)].id;
    }
    return null;
  }
  const top = mostSuspicious(npc, []);
  if (top && top.score >= 10) return top.actor.id;
  return null;
}

function applyInfluence() {
  const zhangsien = getActor('zhangsien');
  if (zhangsien && zhangsien.alive && voteState.npcVotes[zhangsien.id]) {
    const hisTarget = voteState.npcVotes[zhangsien.id];
    const zhiyuchen = getActor('zhiyuchen');
    if (zhiyuchen && zhiyuchen.alive && zhiyuchen.loyalty >= 60) {
      if (Math.random() < 0.6) voteState.npcVotes[zhiyuchen.id] = hisTarget;
    }
    const lubiao = getActor('lubiao');
    if (lubiao && lubiao.alive && lubiao.loyalty >= 25) {
      if (Math.random() < 0.4) voteState.npcVotes[lubiao.id] = hisTarget;
    }
  }
  const yangVotes = Object.values(voteState.npcVotes).filter(v => v === 'yangkaidong').length;
  if (yangVotes >= 2) {
    for (const [voterId, targetId] of Object.entries(voteState.npcVotes)) {
      if (targetId === 'yangkaidong' && voterId !== 'ruanrou' && voterId !== 'zhiban') {
        const voter = getActor(voterId);
        if (voter && voter.style !== 'blunt' && Math.random() < 0.5) {
          const other = mostSuspicious(voter, ['yangkaidong']);
          if (other && other.score >= 5) voteState.npcVotes[voterId] = other.actor.id;
          else delete voteState.npcVotes[voterId];
          break;
        }
      }
    }
  }
  const guVotes = Object.entries(voteState.npcVotes).filter(([, t]) => t === 'gutingyu');
  if (guVotes.length > 0 && Math.random() < 0.3) {
    const [voterId] = guVotes[0];
    const voter = getActor(voterId);
    if (voter && voter.style !== 'blunt' && voter.style !== 'argue') {
      delete voteState.npcVotes[voterId];
    }
  }
  const ruanrou = getActor('ruanrou');
  if (ruanrou && ruanrou.alive && ruanrou.trust >= 60 && voteState.playerVote) {
    const myS = ruanrou.suspicion[voteState.playerVote] || 0;
    if (myS >= 3) voteState.npcVotes[ruanrou.id] = voteState.playerVote;
  }
}

function tallyVotes() {
  const tally = {};
  for (const [, targetId] of Object.entries(voteState.npcVotes)) {
    if (!targetId) continue;
    tally[targetId] = (tally[targetId] || 0) + 1;
  }
  if (voteState.playerVote) {
    tally[voteState.playerVote] = (tally[voteState.playerVote] || 0) + 1;
  }
  return tally;
}

function showVoteResult(tally) {
  const entries = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  let text = '';
  if (entries.length === 0) {
    text = '没有人被投票。\n所有人沉默地看着彼此。';
  } else {
    const topScore = entries[0][1];
    const topCandidates = entries.filter(([, v]) => v === topScore);
    text += '【投票结果】\n';
    for (const [voterId, targetId] of Object.entries(voteState.npcVotes)) {
      if (!targetId) continue;
      const voter = getActor(voterId);
      const target = getActor(targetId);
      if (voter && target) text += `${voter.name} → ${target.name}\n`;
    }
    if (voteState.playerVote) {
      const target = getActor(voteState.playerVote);
      if (target) text += `你 → ${target.name}\n`;
    }
    text += '\n';
    if (topCandidates.length === 1) {
      const [targetId, votes] = topCandidates[0];
      const target = getActor(targetId);
      if (target) {
        text += `【${target.name} 被关押】\n（${votes} 票）`;
        voteState.jailedId = targetId;
      }
    } else {
      const names = topCandidates.map(([id]) => getActor(id)?.name || '？').join('、');
      text += `【平票：${names}】\n没有人被关押。\n所有人都不满意地散开。`;
    }
  }
  dialogue.active = true;
  dialogue.mode = 'vote_result';
  dialogue.persistent = true;
  dialogueUI.speaker.textContent = '结 果';
  dialogueUI.avatarBox.innerHTML = avatarSVG('obj');
  dialogueUI.line.textContent = text;
  dialogueUI.el.classList.add('show');
  dialogueUI.choices.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'choice';
  btn.type = 'button';
  btn.textContent = voteState.jailedId
    ? `确认关押 ${getActor(voteState.jailedId)?.name}` : '散会';
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    finishVote();
  });
  dialogueUI.choices.appendChild(btn);
}

function finishVote() {
  closeDialogue();
  if (voteState.jailedId) jailActor(voteState.jailedId);
  for (const a of world.actors) {
    if (!a.alive || a.isPlayer) continue;
    const saved = voteState.savedPositions[a.id];
    if (saved) {
      a.region = saved.region;
      a.x = saved.x;
      a.y = saved.y;
      a.desire = 'idle';
      a.waitTimer = 2 + Math.random() * 3;
    }
  }
  voteState.active = false;
  voteState.phase = 'idle';
  voteState.jailedId = null;
  voteState.playerVote = null;
  voteState.npcVotes = {};
  voteState.speeches = {};
  voteState.savedPositions = {};
  checkAliveCount();
}

function jailActor(actorId) {
  const actor = getActor(actorId);
  if (!actor || !actor.alive) return;
  actor.alive = false;
  actor.jailed = true;
  world.jailed.push(actorId);
  if (actor.hasWeapon) dropWeapon(actor);
  delete world.escapeTimers[actorId];
  const isKiller = world.killers.includes(actorId);
  if (world.player.alive) {
    broadcast(`${actor.name} 被关进了储藏室旁的小屋。`, 5);
  }
  if (actor.isPlayer) { triggerGameEnd('player_jailed'); return; }
  if (isKiller) {
    const remainingKillers = world.killers.filter(id => {
      const a = getActor(id);
      return a && a.alive && !a.jailed;
    });
    if (remainingKillers.length === 0) { triggerGameEnd('caught_killer'); return; }
    else { broadcast(`还有一个凶手在外面。`, 5); }
  } else {
    broadcast(`他也许是无辜的。也许。`, 5);
    for (const a of world.actors) {
      if (!a.alive || a.isPlayer) continue;
      a.fear = Math.min(100, a.fear + 10);
      a.anger = Math.min(100, a.anger + 5);
    }
  }
  reorganizeFactions(actorId);
  checkAliveCount();
}

function reorganizeFactions(removedId) {
  const removed = getActor(removedId);
  if (!removed) return;
  const faction = FACTIONS[removed.faction];
  if (!faction) return;
  if (!faction.leader && faction.members.length === 0) return;
  if (faction.leader === removedId) {
    for (const memberId of faction.members) {
      if (memberId === removedId) continue;
      const m = getActor(memberId);
      if (!m || !m.alive) continue;
      m.loyalty = 0;
      m.faction = 'lone';
      m.anger = Math.min(100, m.anger + 20);
      m.killIntent = Math.min(100, m.killIntent + 10);
    }
    return;
  }
  for (const memberId of faction.members) {
    if (memberId === removedId) continue;
    const m = getActor(memberId);
    if (!m || !m.alive) continue;
    if (world.killers.includes(removedId)) {
      m.loyalty = Math.max(0, m.loyalty - 30);
      m.anger = Math.min(100, m.anger + 30);
    }
  }
}

function checkForceVote() {
  if (voteState.active) return;
  if (!canStartVote()) return;
  if (world.time - lastForceVoteTime < CONFIG.VOTE_FORCE_TIME) return;
  if (world.time < 60) return;
  const aliveNpcs = world.actors.filter(a => a.alive && !a.isPlayer);
  if (aliveNpcs.length < 2) return;
  lastForceVoteTime = world.time;
  broadcast('有人开始催促："不能再拖了，投票吧。"', 4);
  setTimeout(() => {
    if (!world.gameOver && !voteState.active && !dialogue.active) startVote();
  }, 1500);
}

/* ==========================================================
   P · 挣扎 / 结局
   ========================================================== */
let struggleTimerId = null;

function startStruggle(killer) {
  if (world.struggleActive || world.gameOver) return;
  if (!killer || !killer.alive) return;
  world.struggleActive = true;
  world.struggleStart = performance.now();
  world.struggleKiller = killer.id;
  document.getElementById('struggle').classList.add('show');
  struggleTimerId = setTimeout(() => {
    if (world.struggleActive) resolveStruggle(false);
  }, CONFIG.STRUGGLE_WINDOW * 1000);
}

function onStrugglePress() {
  if (!world.struggleActive) return;
  const elapsed = (performance.now() - world.struggleStart) / 1000;
  clearTimeout(struggleTimerId);
  let chance;
  if (elapsed < 0.3)      chance = 0.80;
  else if (elapsed < 0.6) chance = 0.60;
  else if (elapsed < 1.0) chance = 0.40;
  else if (elapsed < 1.5) chance = 0.25;
  else                    chance = 0.10;
  resolveStruggle(Math.random() < chance);
}

function resolveStruggle(success) {
  if (!world.struggleActive) return;
  world.struggleActive = false;
  const killer = getActor(world.struggleKiller);
  world.struggleKiller = null;
  document.getElementById('struggle').classList.remove('show');
  if (!killer) return;
  if (success) {
    broadcast(`你挣脱了 ${killer.name}！`, 5);
    bus.emit({
      type: 'kill',
      actorId: killer.id, actorName: killer.name,
      targetId: 'player', targetName: '你',
      region: killer.region,
      detail: { weaponName: '凶器' },
    });
    killer.alive = false;
    killer.captured = true;
    world.dead.push(killer.id);
    for (const a of world.actors) {
      if (!a.alive || a.isPlayer) continue;
      a.fear = Math.min(100, a.fear + 40);
    }
    checkAliveCount();
  } else {
    const w = killer.hasWeapon ? worldWeapons[killer.hasWeapon] : null;
    world.player.alive = false;
    world.dead.push('player');
    killer.killer = true;
    killer.kills = killer.kills || [];
    killer.kills.push(world.time);
    if (!world.killers.includes(killer.id)) world.killers.push(killer.id);
    if (w) {
      w.onGround = true;
      w.heldBy = null;
      w.region = killer.region;
      w.x = world.player.x + 8;
      w.y = world.player.y + 8;
      w.usedInKill = true;
      killer.hasWeapon = null;
    }
    world.killEvents.push({
      killerId: killer.id, killerName: killer.name,
      victimId: 'player', victimName: '你',
      weaponId: w ? w.id : 'unknown',
      weaponName: w ? w.name : '凶器',
      time: world.time, gameTime: world.gameTime, region: killer.region,
      clues: w ? w.clues.slice(0, 2) : [],
      witnessed: [],
    });
    triggerGameEnd('player_dead');
  }
}
