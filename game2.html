<html lang="zh-CN">
<head>
<meta charset="UTF-8">

  html,body{width:100%;height:100%;overflow:hidden;background:#0b0e16;

  #game{display:block;position:fixed;inset:0;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;padding:12px 14px;z-index:5}
  #hpWrap{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  #lvTag{font-size:12px;font-weight:700;color:#9ec5ff;min-width:44px;letter-spacing:.5px}
  .bar{flex:1;height:11px;border-radius:6px;background:rgba(255,255,255,.09);
    overflow:hidden;border:1px solid rgba(255,255,255,.07)}
  .bar>i{display:block;height:100%;width:0;border-radius:6px;transition:width .1s linear}
  #hpBar>i{background:linear-gradient(90deg,#e63958,#ff7b93)}
  #xpBar{display:block;height:8px;border-radius:6px;background:rgba(255,255,255,.09);
    overflow:hidden;border:1px solid rgba(255,255,255,.07);margin-bottom:8px}
  #xpBar>i{display:block;height:100%;width:0;border-radius:6px;

  .stick{position:fixed;width:132px;height:132px;border-radius:50%;z-index:10;

  .skillBtn:active{transform:scale(.94)}

  .skillBtn .sName{position:relative;padding:0 6px}
  .skillBtn .sCd{position:absolute;font-size:22px;font-weight:800;opacity:0;
    text-shadow:0 2px 8px rgba(0,0,0,.8);color:#dbe9ff}

  /* ---------- 覆盖层 ---------- */
  .ov{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:22px;
    background:rgba(6,9,16,.9);backdrop-filter:blur(6px);overflow-y:auto}
  .ov.show{display:flex}
  .ovTitle{font-size:25px;font-weight:800;color:#e8f0ff;letter-spacing:3px}
  .ovSub{font-size:13px;color:#8fa3c4;letter-spacing:.5px;text-align:center;line-height:1.7}
  .btn{margin-top:6px;padding:13px 46px;border-radius:999px;font-size:16px;font-weight:700;
    color:#eaf2ff;letter-spacing:3px;cursor:pointer;
    background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 6px 24px rgba(59,130,246,.4);

  /* 角色选择 */
  #charList{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:min(560px,94vw)}
  .charCard{background:linear-gradient(180deg,#161e2d,#111722);border:2px solid #24304a;
    border-radius:14px;padding:13px 13px 12px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}

  .charCard .cName{font-size:16px;font-weight:800;color:var(--c);letter-spacing:1px}

  .charCard .line.p b{color:#7ee0a8}

  /* 升级卡 */
  .cards{display:flex;flex-direction:column;gap:11px;width:min(400px,92vw)}
  .card{background:linear-gradient(180deg,#1a2233,#131a27);border:1px solid #2b3a55;
    border-radius:14px;padding:14px 17px;cursor:pointer;transition:.13s;position:relative}
  .card:active{transform:scale(.97);border-color:#4f8cff}
  .card .kind{position:absolute;right:14px;top:14px;font-size:10px;font-weight:700;
    padding:2px 8px;border-radius:99px;letter-spacing:1px}
  .card .kind.skill{background:rgba(79,140,255,.18);color:#7fb0ff}
  .card .kind.passive{background:rgba(126,224,168,.15);color:#7ee0a8}
  .card .kind.base{background:rgba(255,255,255,.07);color:#8fa3c4}
  .card h3{font-size:16px;color:#e8f0ff;margin-bottom:5px;letter-spacing:.5px;padding-right:60px}
  .card p{font-size:12.5px;color:#8fa3c4;line-height:1.5}
</style>

<script>
/* =========================================================
   工具
========================================================= */
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const cvs = $('#game');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   双摇杆
========================================================= */
function createStick(el, maxR) {
  const knob = el.querySelector('.knob');
  const out = { x: 0, y: 0, power: 0, active: false };
  let pid = null, cx = 0, cy = 0;

  function move(e) {
    const dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    const k = d > maxR ? maxR / d : 1;
    knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    const power = d / maxR;
    out.power = power < 0.14 ? 0 : Math.min(power, 1);
    out.active = out.power > 0;
    if (d > 0.001) { out.x = dx / d; out.y = dy / d; }
  }

  el.addEventListener('pointerdown', e => {
    if (pid !== null) return;
    pid = e.pointerId;
    el.setPointerCapture(pid);
    const r = el.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
    move(e);
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });

  function end(e) {
    if (e.pointerId !== pid) return;
    pid = null;
    out.x = out.y = out.power = 0; out.active = false;
    knob.style.transform = 'translate(0,0)';
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  return out;
}

const stickL = createStick($('#stickL'), 44);
const stickR = createStick($('#stickR'), 44);

/* =========================================================
   ★ 主动技能冷却计算：每升 1 级 CD 减少 7%
========================================================= */
function getSkillCd(sk, lv) {
  if (lv == null) lv = (G.skillLv[sk.id] || 1);
  const v = sk.cd * Math.pow(0.93, lv - 1);
  return Math.round(v * 10) / 10;
}

/* =========================================================
   角色表
========================================================= */
const CHARS = {
  zhiyuchen: {
    id: 'zhiyuchen', name: '智宇晨', title: '音波使者', color: '#5ea9ff',
    base: { maxHp: 95, speed: 210, dmg: 13, fireRate: 0.36, bulletSpeed: 640, bulletRange: 560, bulletR: 5 },
    passive: {
      name: '疾风', max: 5,
      desc: lv => `射击速度与移动速度 +${25 + (lv - 1) * 7}%`,
      mul: lv => 1 + (25 + (lv - 1) * 7) / 100,
    },
    passiveApply(p, lv) {
      const o = lv <= 1 ? 1 : this.passive.mul(lv - 1);
      const n = this.passive.mul(lv);
      p.speed = p.speed / o * n;
      p.fireRate = p.fireRate * o / n;
    },
    actives: [
      {
        id: 'sonic', name: '音波震慑', short: '震慑', cd: 20, max: 5, button: true,
        desc: lv => `半径 ${260 + (lv - 1) * 45} · 范围内全部敌人减速 ${55 - (lv - 1) * 5}% · 持续 ${(3 + (lv - 1) * 0.5).toFixed(1)}s`,
        run(p, lv) {
          const R = 260 + (lv - 1) * 45;
          const slowMul = 1 - (55 - (lv - 1) * 5) / 100;
          const dur = 3 + (lv - 1) * 0.5;
          for (const e of G.enemies) {
            if (Math.hypot(e.x - p.x, e.y - p.y) < R + e.r) {
              e.slowT = Math.max(e.slowT, dur);
              e.slowMul = Math.min(e.slowMul, slowMul);
            }
          }
          G.rings.push({ x: p.x, y: p.y, r: 12, maxR: R, life: 0.65, max: 0.65, color: '#5ea9ff', w: 8 });
          burst(p.x, p.y, '#8fc9ff', 26, 300);
        }
      },
      {
        id: 'blink', name: '瞬移', short: '瞬移', cd: 8, max: 5,
        button: false, tap: true,
        radius: lv => 180 + (lv - 1) * 30,
        desc: lv => `瞬移半径 ${180 + (lv - 1) * 30} · 点击范围内任意点`,
        run(p, lv, wx, wy) {
          burst(p.x, p.y, '#8fc9ff', 14, 220);
          G.rings.push({ x: p.x, y: p.y, r: 8, maxR: 70, life: 0.35, max: 0.35, color: '#5ea9ff', w: 4 });
          p.x = wx; p.y = wy;
          burst(p.x, p.y, '#cfe4ff', 14, 220);
          G.rings.push({ x: p.x, y: p.y, r: 8, maxR: 70, life: 0.35, max: 0.35, color: '#cfe4ff', w: 4 });
        }
      }
    ]
  },

  zhiban: {
    id: 'zhiban', name: '智板', title: '时之停者', color: '#a78bfa',
    base: { maxHp: 140, speed: 215, dmg: 15, fireRate: 0.38, bulletSpeed: 680, bulletRange: 600, bulletR: 6 },
    passive: null,
    actives: [
      {
        id: 'timestop', name: '时间暂停', short: '时停', cd: 30, max: 5, button: true,
        desc: lv => `冻结全场 ${(2.5 + (lv - 1) * 0.6).toFixed(1)}s`,
        run(p, lv) {
          const t = 2.5 + (lv - 1) * 0.6;
          G.timeStop = Math.max(G.timeStop, t);
          G.rings.push({ x: p.x, y: p.y, r: 20, maxR: Math.max(W, H), life: 0.75, max: 0.75, color: '#c4b5fd', w: 9 });
          burst(p.x, p.y, '#c4b5fd', 26, 300);
        }
      }
    ]
  },

  zhangsien: {
    id: 'zhangsien', name: '张思恩', title: '爆裂学者', color: '#fb923c',
    base: { maxHp: 108, speed: 200, dmg: 16, fireRate: 0.42, bulletSpeed: 610, bulletRange: 540, bulletR: 5 },
    passive: {
      name: '求知', max: 5,
      desc: lv => `经验获取 +${10 + (lv - 1) * 5}%`,
      mul: lv => 1 + (10 + (lv - 1) * 5) / 100,
    },
    passiveApply(p, lv) { G.xpMul = this.passive.mul(lv); },
    actives: [
      {
        id: 'blast', name: '湮灭爆炸', short: '爆炸', cd: 40, max: 5, button: true,
        desc: lv => `半径 ${210 + (lv - 1) * 45} · 伤害 ${140 + (lv - 1) * 90}`,
        run(p, lv) {
          const R = 210 + (lv - 1) * 45;
          const dmg = 140 + (lv - 1) * 90;
          for (const e of G.enemies) {
            if (Math.hypot(e.x - p.x, e.y - p.y) < R + e.r) {
              e.hp -= dmg; e.hurtT = 0.16;
              addText(e.x, e.y - e.r - 6, Math.round(dmg), '#ffb26b');
              if (e.hp <= 0) killEnemy(e);
            }
          }
          G.rings.push({ x: p.x, y: p.y, r: 14, maxR: R, life: 0.7, max: 0.7, color: '#fb923c', w: 12 });
          burst(p.x, p.y, '#ffb26b', 42, 440);
          G.shake = 0.32;
        }
      }
    ]
  },

  lujiancheng: {
    id: 'lujiancheng', name: '陆建成', title: '铁壁守卫', color: '#34d399',
    base: { maxHp: 105, speed: 185, dmg: 15, fireRate: 0.44, bulletSpeed: 590, bulletRange: 520, bulletR: 6 },
    passive: {
      name: '坚韧', max: 5,
      desc: lv => `生命上限 +${35 + (lv - 1) * 12}%`,
      mul: lv => 1 + (35 + (lv - 1) * 12) / 100,
    },
    passiveApply(p, lv) {
      const o = lv <= 1 ? 1 : this.passive.mul(lv - 1);
      const n = this.passive.mul(lv);
      const oldMax = p.maxHp;
      p.maxHp = p.maxHp / o * n;
      p.hp = Math.min(p.maxHp, p.hp + (p.maxHp - oldMax));
    },
    actives: [
      {
        id: 'heal', name: '生命祝福', short: '回血', cd: 15, max: 5, button: true,
        desc: lv => `立即回复 ${40 + (lv - 1) * 20} 生命`,
        run(p, lv) {
          const heal = 40 + (lv - 1) * 20;
          p.hp = Math.min(p.maxHp, p.hp + heal);
          addText(p.x, p.y - 30, '+' + heal, '#4ade80');
          burst(p.x, p.y, '#4ade80', 22, 200);
          G.rings.push({ x: p.x, y: p.y, r: 14, maxR: 110, life: 0.5, max: 0.5, color: '#34d399', w: 5 });
        }
      }
    ]
  },

  lubiao: {
    id: 'lubiao', name: '陆标', title: '双枪浪客', color: '#fbbf24',
    base: { maxHp: 115, speed: 200, dmg: 13, fireRate: 0.40, bulletSpeed: 620, bulletRange: 560, bulletR: 5 },
    damageTakenMul: 1.08,
    passive: {
      name: '脆弱', max: 1,
      desc: () => '受到的伤害 +8%',
    },
    passiveApply() {},
    actives: [
      {
        id: 'dual', name: '双持', short: '双持', cd: 14, max: 5, button: true,
        desc: lv => `持续 ${(4 + (lv - 1) * 0.5).toFixed(1)}s：子弹数×2、体积×2、伤害×1.5`,
        run(p, lv) {
          p.dualT = 4 + (lv - 1) * 0.5;
          burst(p.x, p.y, '#ffd166', 18, 240);
          G.rings.push({ x: p.x, y: p.y, r: 10, maxR: 80, life: 0.4, max: 0.4, color: '#ffd166', w: 5 });
        }
      }
    ]
  }
};

/* =========================================================
   基础属性升级池
========================================================= */
const UPGRADES = [
  { id:'dmg',    name:'强化弹头', desc:'子弹伤害 +20%',           max:99, apply(p){ p.dmg *= 1.20; } },
  { id:'rate',   name:'高速扳机', desc:'射击间隔 -12%',           max:99, apply(p){ p.fireRate = Math.max(0.08, p.fireRate * 0.88); } },
  { id:'speed',  name:'疾行战靴', desc:'移动速度 +10%',           max:99, apply(p){ p.speed *= 1.10; } },
  { id:'hp',     name:'强化躯壳', desc:'生命上限 +25 并回复 25',  max:99, apply(p){ p.maxHp += 25; p.hp += 25; } },
  { id:'bsize',  name:'巨型弹药', desc:'子弹体积 +18%',           max:6,  apply(p){ p.bulletR = Math.min(18, p.bulletR * 1.18); } },
  { id:'bspd',   name:'加速弹道', desc:'子弹速度 +15%',           max:99, apply(p){ p.bulletSpeed *= 1.15; } },
  { id:'brng',   name:'远程校准', desc:'子弹射程 +15%',           max:8,  apply(p){ p.bulletRange *= 1.15; } },
  { id:'multi',  name:'多重射击', desc:'子弹数量 +1',             max:4,  apply(p){ p.bulletCount = Math.min(5, p.bulletCount + 1); } },
  // ★ 拾取范围加强
  { id:'magnet', name:'磁力护符', desc:'拾取范围 +60',            max:99, apply(p){ p.pickupRange += 60; } },
  { id:'regen',  name:'细胞再生', desc:'每秒回复 +0.8',           max:99, apply(p){ p.regen += 0.8; } },
  { id:'explode', name:'爆裂子弹', max:5,
    desc() {
      const nl = (G.player ? G.player.explodeLv : 0) + 1;
      return `子弹命中产生半径 ${40 + nl * 15} 爆炸，额外造成 ${Math.round((0.35 + nl * 0.10) * 100)}% 子弹伤害`;
    },
    apply(p) {
      p.explodeLv++;
      p.explodeRadius = 40 + p.explodeLv * 15;
      p.explodeDmgMul = 0.35 + p.explodeLv * 0.10;
    }
  },
];

/* =========================================================
   敌人模板
========================================================= */
const TYPES = {
  grunt:   { r:13, hp:20,  speed:84,  dmg:8,  xp:1,  color:'#ff6b81' },
  fast:    { r:10, hp:14,  speed:168, dmg:6,  xp:1,  color:'#5ee1ff' },
  tank:    { r:24, hp:98,  speed:56,  dmg:16, xp:4,  color:'#ffa94d' },
  shooter: { r:15, hp:44,  speed:74,  dmg:10, xp:3,  color:'#a78bfa',
             ranged:true, keepDist:285, shootRange:470, shootInterval:2.0 },
  boss:    { r:40, hp:880, speed:66,  dmg:26, xp:32, color:'#c084fc' },
};

/* =========================================================
   状态
========================================================= */
const G = { player: null, running: false, paused: false };
let CH = null, uid = 1;
let skillBtns = [];

function getTapSkill() {
  if (!CH || !CH.actives) return null;
  return CH.actives.find(a => a.tap) || null;
}

function resetGame() {
  G.running = true; G.paused = false;
  G.time = 0; G.timeStop = 0; G.shake = 0;
  G.enemies = []; G.bullets = []; G.ebullets = []; G.gems = [];
  G.particles = []; G.texts = []; G.rings = [];
  G.spawnTimer = 0; G.bossTimer = 55;
  G.level = 1; G.xp = 0; G.xpNeed = 9; G.kills = 0; G.pending = 0;
  G.upCounts = {};
  G.passiveLv = 1;
  G.xpMul = 1; G.hurtFlash = 0;

  G.skillLv = {};
  G.skillCd = {};
  for (const sk of CH.actives) { G.skillLv[sk.id] = 1; G.skillCd[sk.id] = 0; }

  const b = CH.base;
  const p = G.player = {
    x: 0, y: 0, r: 16,
    speed: b.speed, maxHp: b.maxHp, hp: b.maxHp,
    dmg: b.dmg, fireRate: b.fireRate,
    bulletSpeed: b.bulletSpeed, bulletRange: b.bulletRange, bulletR: b.bulletR,
    bulletCount: 1,
    pickupRange: 180,          // ★ 拾取范围加大
    regen: 0,
    aim: -Math.PI / 2,
    fireCd: 0, hurtCd: 0, hurtFlash: 0,
    explodeLv: 0, explodeRadius: 0, explodeDmgMul: 0,
    dualT: 0,
  };

  if (CH.passive) CH.passiveApply(p, 1);
  p.hp = p.maxHp;

  G.cam = { x: -W / 2, y: -H / 2 };
}

/* =========================================================
   特效
========================================================= */
function addText(x, y, str, color) {
  G.texts.push({ x, y, str, color, life: 0.75, vy: -52 });
}
function burst(x, y, color, n, spd = 170) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rand(spd * 0.22, spd);
    G.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.25, 0.6), max: 0.6, color, r: rand(1.5, 3.6),
    });
  }
}

/* =========================================================
   生成（★ 密度大幅下调）
========================================================= */
function pickType() {
  const t = G.time, r = Math.random();
  if (t < 15) return 'grunt';
  if (t < 30) return r < 0.22 ? 'fast' : 'grunt';
  if (t < 50) {
    if (r < 0.20) return 'fast';
    if (r < 0.34) return 'shooter';
    if (r < 0.45) return 'tank';
    return 'grunt';
  }
  if (r < 0.22) return 'fast';
  if (r < 0.40) return 'shooter';
  if (r < 0.60) return 'tank';
  return 'grunt';
}

function spawnEnemy(type) {
  const t = TYPES[type], p = G.player;
  const ang = Math.random() * TAU;
  const rad = Math.hypot(W, H) / 2 + 110;
  const hpScale = 1 + G.time * 0.038;
  const dmgScale = 1 + G.time * 0.018;

  G.enemies.push({
    id: uid++, type,
    x: p.x + Math.cos(ang) * rad,
    y: p.y + Math.sin(ang) * rad,
    r: t.r,
    hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    speed: t.speed * (1 + G.time * 0.002),
    dmg: t.dmg * dmgScale,
    xp: t.xp, color: t.color,
    hurtT: 0, dead: false,
    slowT: 0, slowMul: 1,
    ranged: !!t.ranged,
    keepDist: t.keepDist || 0,
    shootRange: t.shootRange || 0,
    shootInterval: t.shootInterval || 2,
    shootCd: rand(0.6, t.shootInterval || 2),
  });
}

function spawnLogic(dt) {
  if (G.timeStop > 0) return;

  // ★ 密度降低：初始间隔更长、衰减更慢、最低间隔抬高
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0) {
    G.spawnTimer = Math.max(0.32, 1.35 * Math.pow(0.988, G.time));
    const n = 1 + Math.floor(G.time / 80);
    for (let i = 0; i < n; i++) spawnEnemy(pickType());
  }

  // ★ Boss 出现间隔延长
  G.bossTimer -= dt;
  if (G.bossTimer <= 0) { G.bossTimer = 60; spawnEnemy('boss'); }
}

/* =========================================================
   战斗
========================================================= */
function updateWeapon(dt) {
  const p = G.player;
  p.fireCd -= dt;

  if (!stickR.active) {
    if (p.fireCd < 0) p.fireCd = 0;
    return;
  }

  p.aim = Math.atan2(stickR.y, stickR.x);
  if (p.fireCd > 0) return;
  p.fireCd = p.fireRate;

  const dual = p.dualT > 0;
  const count = dual ? p.bulletCount * 2 : p.bulletCount;
  const bR = dual ? p.bulletR * 2 : p.bulletR;
  const bDmg = dual ? p.dmg * 1.5 : p.dmg;
  const spread = dual ? 0.10 : 0.14;

  for (let i = 0; i < count; i++) {
    const a = p.aim + (i - (count - 1) / 2) * spread;
    G.bullets.push({
      x: p.x + Math.cos(a) * (p.r + 6),
      y: p.y + Math.sin(a) * (p.r + 6),
      vx: Math.cos(a) * p.bulletSpeed,
      vy: Math.sin(a) * p.bulletSpeed,
      r: bR, dmg: bDmg,
      traveled: 0, maxDist: p.bulletRange, life: 3,
      dual,
    });
  }
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  G.kills++;
  burst(e.x, e.y, e.color, e.type === 'boss' ? 28 : 7, e.type === 'boss' ? 320 : 170);

  const waveBonus = 1 + Math.floor(G.time / 60);
  const gemCount = e.type === 'boss' ? 8 : 1;
  const per = Math.max(1, Math.round(e.xp * waveBonus / gemCount));

  for (let i = 0; i < gemCount; i++) {
    const a = Math.random() * TAU, d = gemCount > 1 ? Math.random() * 48 : rand(0, 6);
    G.gems.push({ x: e.x + Math.cos(a) * d, y: e.y + Math.sin(a) * d, value: per, pulse: Math.random() * 6 });
  }
}

function updateBullets(dt) {
  const p = G.player;

  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    const sx = b.vx * dt, sy = b.vy * dt;
    b.x += sx; b.y += sy;
    b.traveled += Math.hypot(sx, sy);
    b.life -= dt;

    if (b.life <= 0 || b.traveled >= b.maxDist) { G.bullets.splice(i, 1); continue; }

    let gone = false;
    for (const e of G.enemies) {
      if (e.dead) continue;
      const dx = e.x - b.x, dy = e.y - b.y;
      const rr = e.r + b.r;
      if (dx * dx + dy * dy < rr * rr) {
        e.hp -= b.dmg; e.hurtT = 0.12;
        addText(e.x + rand(-6, 6), e.y - e.r - 4, Math.round(b.dmg), '#fff');
        burst(b.x, b.y, b.dual ? '#ffd166' : '#cfe4ff', 3, 120);
        if (e.hp <= 0) killEnemy(e);

        if (p.explodeRadius > 0) {
          const exDmg = b.dmg * p.explodeDmgMul;
          for (const e2 of G.enemies) {
            if (e2.dead || e2 === e) continue;
            const edx = e2.x - b.x, edy = e2.y - b.y;
            const rr2 = p.explodeRadius + e2.r;
            if (edx * edx + edy * edy < rr2 * rr2) {
              e2.hp -= exDmg; e2.hurtT = 0.12;
              addText(e2.x, e2.y - e2.r - 4, Math.round(exDmg), '#ffb26b');
              if (e2.hp <= 0) killEnemy(e2);
            }
          }
          G.rings.push({ x: b.x, y: b.y, r: 6, maxR: p.explodeRadius,
                         life: 0.22, max: 0.22, color: '#ffb26b', w: 5 });
          burst(b.x, b.y, '#ffb26b', 8, 180);
        }

        gone = true;
        break;
      }
    }
    if (gone) G.bullets.splice(i, 1);
  }

  for (let i = G.enemies.length - 1; i >= 0; i--) {
    if (G.enemies[i].dead) G.enemies.splice(i, 1);
  }
}

function hurtPlayer(dmg) {
  const p = G.player;
  if (p.hurtCd > 0) return;
  dmg *= (CH.damageTakenMul || 1);

  p.hp -= dmg;
  p.hurtCd = 0.35;
  p.hurtFlash = 0.28;
  G.hurtFlash = 0.35;
  G.shake = 0.18;
  addText(p.x, p.y - 28, '-' + Math.round(dmg), '#ff5c7a');
  burst(p.x, p.y, '#ff5c7a', 6, 150);
  if (p.hp <= 0) { p.hp = 0; gameOver(); }
}

function updateEnemies(dt) {
  const p = G.player;
  const frozen = G.timeStop > 0;

  for (const e of G.enemies) {
    if (e.dead) continue;
    if (e.hurtT > 0) e.hurtT = Math.max(0, e.hurtT - dt);
    if (frozen) continue;

    if (e.slowT > 0) {
      e.slowT -= dt;
      if (e.slowT <= 0) e.slowMul = 1;
    }

    const spd = e.speed * e.slowMul;
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;

    if (d > 2600) { e.dead = true; continue; }

    if (e.ranged) {
      let mx = 0, my = 0;
      if (d > e.keepDist + 70) { mx = dx / d; my = dy / d; }
      else if (d < e.keepDist - 70) { mx = -dx / d; my = -dy / d; }
      else { mx = -dy / d; my = dx / d; }
      e.x += mx * spd * dt;
      e.y += my * spd * dt;

      e.shootCd -= dt;
      if (e.shootCd <= 0 && d < e.shootRange) {
        e.shootCd = e.shootInterval;
        const a = Math.atan2(dy, dx);
        G.ebullets.push({
          x: e.x + Math.cos(a) * e.r,
          y: e.y + Math.sin(a) * e.r,
          vx: Math.cos(a) * 215, vy: Math.sin(a) * 215,
          r: 6, dmg: e.dmg, life: 4,
        });
      }
    } else {
      e.x += dx / d * spd * dt;
      e.y += dy / d * spd * dt;
      if (d < e.r + p.r) hurtPlayer(e.dmg);
    }
  }
}

function updateEBullets(dt) {
  if (G.timeStop > 0) return;
  const p = G.player;

  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const b = G.ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;

    const dx = p.x - b.x, dy = p.y - b.y;
    if (dx * dx + dy * dy < (p.r + b.r) * (p.r + b.r)) {
      hurtPlayer(b.dmg);
      burst(b.x, b.y, '#c084fc', 6, 150);
      G.ebullets.splice(i, 1);
      continue;
    }
    if (b.life <= 0) G.ebullets.splice(i, 1);
  }
}

/* =========================================================
   经验 / 升级
========================================================= */
function gainXp(v) {
  G.xp += Math.max(1, Math.round(v * G.xpMul));
  const p = G.player;

  while (G.xp >= G.xpNeed) {
    G.xp -= G.xpNeed;
    G.level++;
    G.xpNeed = Math.round(6 + G.level * 3 + G.level * G.level * 0.4);

    const oldMax = p.maxHp;
    p.maxHp = oldMax * 1.032;
    const heal = oldMax * 0.15;
    p.hp = Math.min(p.maxHp, p.hp + heal);
    addText(p.x, p.y - 42, `+${Math.round(heal)}`, '#4ade80');

    G.pending++;
  }
  if (G.pending > 0 && !G.paused) openLevelUp();
}

let cardLock = 0;

function buildPool() {
  const pool = [];

  // 主动技能升级（★ 显示 CD 前后对比）
  for (const sk of CH.actives) {
    const lv = G.skillLv[sk.id] || 1;
    if (lv < sk.max) {
      const oldCd = getSkillCd(sk, lv);
      const newCd = getSkillCd(sk, lv + 1);
      pool.push({
        kind: 'skill', w: sk.tap ? 1.6 : 2.4,
        name: `${sk.name} Lv.${lv + 1}`,
        desc: `${sk.desc(lv + 1)} · CD ${oldCd}s → ${newCd}s`,
        apply() { G.skillLv[sk.id] = lv + 1; },
      });
    }
  }

  if (CH.passive && G.passiveLv < CH.passive.max) {
    pool.push({
      kind: 'passive', w: 2.0,
      name: `${CH.passive.name} Lv.${G.passiveLv + 1}`,
      desc: CH.passive.desc(G.passiveLv + 1),
      apply() {
        G.passiveLv++;
        CH.passiveApply(G.player, G.passiveLv);
      },
    });
  }

  for (const u of UPGRADES) {
    if ((G.upCounts[u.id] || 0) >= u.max) continue;
    pool.push({
      kind: 'base', w: 1,
      name: u.name, desc: u.desc,
      apply() {
        u.apply(G.player);
        G.upCounts[u.id] = (G.upCounts[u.id] || 0) + 1;
      },
    });
  }

  return pool;
}

function pickN(pool, n) {
  const arr = pool.slice(), out = [];
  while (out.length < n && arr.length) {
    let total = 0;
    for (const x of arr) total += x.w;
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < arr.length; i++) {
      r -= arr[i].w;
      if (r <= 0) { idx = i; break; }
      idx = i;
    }
    out.push(arr.splice(idx, 1)[0]);
  }
  return out;
}

function openLevelUp() {
  G.paused = true;
  renderCards();
  $('#levelOv').classList.add('show');
}

function renderCards() {
  const picks = pickN(buildPool(), 3);
  const ov = $('#levelOv');

  if (!picks.length) { G.pending = 0; closeLevelUp(); return; }

  ov.innerHTML = `
    <h2 class="ovTitle">等 级 提 升</h2>
    <p class="ovSub">Lv.${G.level} · 选择一项强化</p>
    <div class="cards">
      ${picks.map((u, i) => {
        const desc = typeof u.desc === 'function' ? u.desc() : u.desc;
        return `
          <div class="card" data-i="${i}">
            <span class="kind ${u.kind}">${u.kind === 'skill' ? '主动技能' : u.kind === 'passive' ? '被动强化' : '属性'}</span>
            <h3>${u.name}</h3>
            <p>${desc}</p>
          </div>`;
      }).join('')}
    </div>`;

  ov.querySelectorAll('.card').forEach(el => {
    el.addEventListener('pointerdown', () => {
      if (performance.now() < cardLock) return;
      cardLock = performance.now() + 200;

      picks[+el.dataset.i].apply();
      G.pending--;

      if (G.pending > 0) renderCards();
      else closeLevelUp();
    });
  });
}

function closeLevelUp() {
  $('#levelOv').classList.remove('show');
  G.paused = false;
}

/* =========================================================
   宝石 / 粒子 / 文字 / 冲击环
========================================================= */
function updateGems(dt) {
  const p = G.player;
  for (let i = G.gems.length - 1; i >= 0; i--) {
    const g = G.gems[i];
    g.pulse += dt * 6;
    const dx = p.x - g.x, dy = p.y - g.y;
    const d = Math.hypot(dx, dy) || 1;

    if (d < p.pickupRange) {
      const sp = 320 + (p.pickupRange - d) * 7;
      g.x += dx / d * sp * dt;
      g.y += dy / d * sp * dt;
    }
    if (d < p.r + 16) {
      G.gems.splice(i, 1);
      gainXp(g.value);
      if (G.paused) return;
    }
  }
}

function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const q = G.particles[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= 0.94; q.vy *= 0.94;
    q.life -= dt;
    if (q.life <= 0) G.particles.splice(i, 1);
  }
}

function updateTexts(dt) {
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i];
    t.y += t.vy * dt; t.vy *= 0.92; t.life -= dt;
    if (t.life <= 0) G.texts.splice(i, 1);
  }
}

function updateRings(dt) {
  for (let i = G.rings.length - 1; i >= 0; i--) {
    const r = G.rings[i];
    r.life -= dt;
    if (r.life <= 0) G.rings.splice(i, 1);
  }
}

/* =========================================================
   主更新
========================================================= */
function update(dt) {
  G.time += dt;
  const p = G.player;

  p.x += stickL.x * stickL.power * p.speed * dt;
  p.y += stickL.y * stickL.power * p.speed * dt;
  G.cam.x = p.x - W / 2;
  G.cam.y = p.y - H / 2;

  if (G.timeStop > 0) G.timeStop = Math.max(0, G.timeStop - dt);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 1.6);
  if (p.dualT > 0) p.dualT = Math.max(0, p.dualT - dt);
  for (const k in G.skillCd) {
    if (G.skillCd[k] > 0) G.skillCd[k] = Math.max(0, G.skillCd[k] - dt);
  }
  if (p.regen > 0) p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
  p.hurtCd = Math.max(0, p.hurtCd - dt);
  p.hurtFlash = Math.max(0, p.hurtFlash - dt);
  G.hurtFlash = Math.max(0, G.hurtFlash - dt);

  updateWeapon(dt);
  updateEnemies(dt);
  if (!G.running) return;
  updateBullets(dt);
  updateEBullets(dt);
  updateGems(dt);
  if (G.paused) return;
  updateParticles(dt);
  updateTexts(dt);
  updateRings(dt);
  spawnLogic(dt);

  updateHud();
}

/* =========================================================
   HUD
========================================================= */
const hudCache = { hp: -1, xp: -1, lv: -1, t: '', k: -1 };
const hpBarEl = $('#hpBar>i');
const xpBarEl = $('#xpBar>i');
const lvEl = $('#lvTag');
const timerEl = $('#timer');
const killsEl = $('#kills');

function fmtTime(s) {
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}

function updateHud() {
  const p = G.player;
  const hpPct = clamp(p.hp / p.maxHp, 0, 1) * 100;
  const xpPct = clamp(G.xp / G.xpNeed, 0, 1) * 100;

  if (Math.abs(hudCache.hp - hpPct) > 0.4) { hpBarEl.style.width = hpPct + '%'; hudCache.hp = hpPct; }
  if (Math.abs(hudCache.xp - xpPct) > 0.4) { xpBarEl.style.width = xpPct + '%'; hudCache.xp = xpPct; }
  if (hudCache.lv !== G.level) { lvEl.textContent = 'Lv.' + G.level; hudCache.lv = G.level; }

  const ts = fmtTime(G.time);
  if (hudCache.t !== ts) { timerEl.textContent = ts; hudCache.t = ts; }
  if (hudCache.k !== G.kills) { killsEl.textContent = '击杀 ' + G.kills; hudCache.k = G.kills; }

  // 技能按钮 CD（★ 用动态 CD 计算进度）
  for (const b of skillBtns) {
    const cd = G.skillCd[b.skill.id] || 0;
    if (cd > 0) {
      const total = getSkillCd(b.skill);
      const pct = clamp(cd / total, 0, 1);
      b.maskEl.style.background =
        `conic-gradient(rgba(6,10,20,.82) ${pct * 360}deg, rgba(0,0,0,0) 0deg)`;
      b.nameEl.style.opacity = 0;
      b.cdEl.style.opacity = 1;
      b.cdEl.textContent = cd.toFixed(1);
    } else {
      b.maskEl.style.background = 'none';
      b.nameEl.style.opacity = 1;
      b.cdEl.style.opacity = 0;
    }
  }
}

/* =========================================================
   技能按钮
========================================================= */
function rebuildSkillButtons() {
  const wrap = $('#skillBtns');
  wrap.innerHTML = '';
  skillBtns = [];

  const list = CH.actives.filter(a => a.button !== false);
  list.forEach((sk, i) => {
    const el = document.createElement('div');
    el.className = 'skillBtn';
    el.style.bottom = (186 + i * 96) + 'px';
    el.style.background = `linear-gradient(135deg, ${CH.color}, #4338ca)`;
    el.innerHTML = `
      <div class="cdMask"></div>
      <div class="sName">${sk.short || sk.name}</div>
      <div class="sCd"></div>`;

    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!G.running || G.paused) return;
      const cd = G.skillCd[sk.id] || 0;
      if (cd > 0) return;
      sk.run(G.player, G.skillLv[sk.id] || 1);
      G.skillCd[sk.id] = getSkillCd(sk);     // ★ 动态 CD
    });

    wrap.appendChild(el);
    skillBtns.push({
      el, skill: sk,
      nameEl: el.querySelector('.sName'),
      cdEl: el.querySelector('.sCd'),
      maskEl: el.querySelector('.cdMask'),
    });
  });
}

/* =========================================================
   瞬移：点击范围内任意点
========================================================= */
cvs.addEventListener('pointerdown', e => {
  if (!G.running || G.paused || !G.player) return;
  const sk = getTapSkill();
  if (!sk) return;
  if ((G.skillCd[sk.id] || 0) > 0) return;

  const p = G.player;
  const sx = W / 2, sy = H / 2;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  const dist = Math.hypot(dx, dy);
  const R = sk.radius(G.skillLv[sk.id] || 1);

  if (dist > R) return;

  sk.run(p, G.skillLv[sk.id] || 1, p.x + dx, p.y + dy);
  G.skillCd[sk.id] = getSkillCd(sk);       // ★ 动态 CD
});

/* =========================================================
   渲染
========================================================= */
function drawGrid() {
  const step = 90;
  const ox = -(((G.cam.x % step) + step) % step);
  const oy = -(((G.cam.y % step) + step) % step);
  ctx.strokeStyle = 'rgba(90,130,220,0.085)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = ox; x <= W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = oy; y <= H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function drawGems() {
  for (const g of G.gems) {
    const s = 5 + Math.sin(g.pulse) * 1.4;
    ctx.beginPath();
    ctx.arc(g.x, g.y, s, 0, TAU);
    ctx.fillStyle = '#35e6ff';
    ctx.shadowColor = '#35e6ff';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawEnemies() {
  for (const e of G.enemies) {
    if (e.slowT > 0) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 8, 0, TAU);
      ctx.strokeStyle = 'rgba(94,169,255,.55)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 5, 0, TAU);
    ctx.fillStyle = e.color + '22';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, TAU);
    ctx.fillStyle = e.hurtT > 0 ? '#fff' : e.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = e.hurtT > 0 ? '#fff' : 'rgba(255,255,255,.28)';
    ctx.stroke();

    if (e.ranged && e.shootCd < 0.45) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 10, 0, TAU);
      ctx.strokeStyle = `rgba(255,120,120,${0.6 * (1 - e.shootCd / 0.45)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if (e.type === 'boss') {
      const w = e.r * 2.2, ratio = clamp(e.hp / e.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 16, w, 6);
      ctx.fillStyle = '#c084fc';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 16, w * ratio, 6);
    }
  }
}

function drawBullets() {
  for (const b of G.bullets) {
    ctx.shadowColor = b.dual ? '#ffd166' : '#5ea9ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = b.dual ? '#ffe9a8' : '#bfe3ff';
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawEBullets() {
  ctx.shadowColor = '#c084fc';
  ctx.shadowBlur = 12;
  for (const b of G.ebullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = '#e9b8ff';
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawParticles() {
  for (const q of G.particles) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawRings() {
  for (const r of G.rings) {
    const t = 1 - r.life / r.max;
    const rad = r.r + (r.maxR - r.r) * (1 - Math.pow(1 - t, 2));
    ctx.globalAlpha = clamp(1 - t, 0, 1);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = Math.max(1, r.w * (1 - t * 0.7));
    ctx.beginPath();
    ctx.arc(r.x, r.y, rad, 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBlinkRange() {
  if (!G.running || G.paused || !G.player) return;
  const sk = getTapSkill();
  if (!sk) return;
  if ((G.skillCd[sk.id] || 0) > 0) return;

  const p = G.player;
  const R = sk.radius(G.skillLv[sk.id] || 1);
  const t = G.time;

  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x, p.y, R, 0, TAU);
  ctx.fillStyle = `rgba(120,200,255,${0.05 + 0.03 * Math.sin(t * 4)})`;
  ctx.fill();
  ctx.strokeStyle = `rgba(150,220,255,${0.45 + 0.25 * Math.sin(t * 4)})`;
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 8]);
  ctx.lineDashOffset = -t * 30;
  ctx.stroke();
  ctx.restore();
}

function drawPlayer() {
  const p = G.player;

  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 54);
  g.addColorStop(0, 'rgba(90,160,255,.30)');
  g.addColorStop(1, 'rgba(90,160,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 54, 0, TAU);
  ctx.fill();

  if (p.dualT > 0) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 12, 0, TAU);
    ctx.strokeStyle = 'rgba(255,209,102,.8)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 18, 0, TAU);
    ctx.strokeStyle = 'rgba(255,209,102,.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  if (stickR.active) {
    ctx.strokeStyle = 'rgba(160,210,255,.30)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x + Math.cos(p.aim) * (p.r + 12), p.y + Math.sin(p.aim) * (p.r + 12));
    ctx.lineTo(p.x + Math.cos(p.aim) * (p.r + 78), p.y + Math.sin(p.aim) * (p.r + 78));
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.aim);
  ctx.fillStyle = p.dualT > 0 ? '#ffd166' : '#8fc2ff';
  ctx.fillRect(p.r - 3, -4, 19, 8);
  if (p.dualT > 0) ctx.fillRect(p.r - 3, -11, 19, 6);
  ctx.restore();

  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, TAU);
  ctx.fillStyle = p.hurtFlash > 0 ? '#ff8fa3' : (CH ? CH.color : '#5ea9ff');
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#d6e8ff';
  ctx.stroke();
}

function drawTexts() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px system-ui, sans-serif';
  for (const t of G.texts) {
    ctx.globalAlpha = clamp(t.life / 0.75, 0, 1);
    ctx.fillStyle = t.color;
    ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.fillStyle = '#0b0e16';
  ctx.fillRect(0, 0, W, H);

  drawGrid();

  ctx.save();

  if (G.shake > 0) {
    const s = G.shake * 26;
    ctx.translate(rand(-s, s), rand(-s, s));
  }
  ctx.translate(-G.cam.x, -G.cam.y);

  drawGems();
  drawEnemies();
  drawBlinkRange();
  drawEBullets();
  drawBullets();
  drawParticles();
  drawRings();
  drawPlayer();
  drawTexts();

  ctx.restore();

  if (G.timeStop > 0) {
    ctx.fillStyle = `rgba(150,130,255,${0.10 + 0.05 * Math.sin(G.time * 20)})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (G.hurtFlash > 0) {
    ctx.fillStyle = `rgba(255,40,70,${G.hurtFlash * 0.45})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================
   流程
========================================================= */
function gameOver() {
  G.running = false;
  G.paused = true;
  $('#overStats').innerHTML =
    `${CH.name} · 存活 ${fmtTime(G.time)} · 击杀 ${G.kills} · Lv.${G.level}`;
  $('#overOv').classList.add('show');
  $('#levelOv').classList.remove('show');
}

function startGame() {
  $('#charOv').classList.remove('show');
  $('#overOv').classList.remove('show');
  $('#levelOv').classList.remove('show');
  resetGame();
  rebuildSkillButtons();
  hudCache.hp = hudCache.xp = hudCache.lv = -1;
  hudCache.t = ''; hudCache.k = -1;
  updateHud();
}

/* ---------- 角色选择 UI ---------- */
(function buildCharList() {
  const list = $('#charList');
  list.innerHTML = Object.values(CHARS).map(c => {
    const activeNames = c.actives.map(a => a.name).join(' / ');
    const passiveName = c.passive ? c.passive.name : '无';
    return `
      <div class="charCard" data-id="${c.id}" style="--c:${c.color}">
        <div class="cName">${c.name}</div>
        <div class="cTitle">${c.title}</div>
        <div class="line"><b>主动</b> ${activeNames}</div>
        <div class="line p"><b>被动</b> ${passiveName}</div>
      </div>`;
  }).join('');

  list.querySelectorAll('.charCard').forEach(el => {
    el.addEventListener('pointerdown', () => {
      list.querySelectorAll('.charCard').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      CH = CHARS[el.dataset.id];
    });
  });

  const first = list.querySelector('.charCard');
  first.dispatchEvent(new PointerEvent('pointerdown'));
})();

$('#startBtn').addEventListener('click', () => { if (CH) startGame(); });
$('#retryBtn').addEventListener('click', startGame);

/* =========================================================
   主循环
========================================================= */
let lastT = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastT) / 1000;
  lastT = now;

  if (!G.running || !G.player) return;

  if (dt > 0.1) dt = 0.1;
  if (!G.paused) update(Math.min(dt, 0.05));

  render();
}

requestAnimationFrame(loop);
</script>
</body>
