<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>暗域幸存者 · 双摇杆</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0e16;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #game{display:block;position:fixed;inset:0;touch-action:none}

  #hud{position:fixed;inset:0;pointer-events:none;padding:12px 14px;z-index:5}
  #hpWrap{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  #lvTag{font-size:12px;font-weight:700;color:#9ec5ff;min-width:44px;letter-spacing:.5px}
  .bar{flex:1;height:11px;border-radius:6px;background:rgba(255,255,255,.09);
    overflow:hidden;border:1px solid rgba(255,255,255,.07)}
  .bar>i{display:block;height:100%;width:0;border-radius:6px;transition:width .1s linear}
  #hpBar>i{background:linear-gradient(90deg,#e63958,#ff7b93)}
  #xpBar{display:block;height:8px;border-radius:6px;background:rgba(255,255,255,.09);
    overflow:hidden;border:1px solid rgba(255,255,255,.07);margin-bottom:8px}
  #xpBar>i{display:block;height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3b82f6,#22d3ee);transition:width .1s linear}
  #meta{display:flex;justify-content:space-between;font-size:12px;color:#7d90b0;letter-spacing:.6px}

  #statsPanel{
    position:fixed; top:64px; left:12px; z-index:6;
    display:grid; grid-template-columns:auto auto; gap:3px 10px;
    padding:8px 10px; border-radius:10px;
    background:rgba(10,16,26,.55); border:1px solid rgba(90,130,220,.18);
    font-size:10.5px; letter-spacing:.3px; pointer-events:none;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    font-variant-numeric:tabular-nums;
  }
  #statsPanel .k{color:#6b7f9e}
  #statsPanel .v{color:#cfe0ff; font-weight:700; text-align:right}

  #zoomCtl{
    position:fixed; top:64px; right:12px; z-index:11;
    display:flex; align-items:center; gap:8px;
    padding:6px 8px; border-radius:999px;
    background:rgba(10,16,26,.65); border:1px solid rgba(90,130,220,.22);
    color:#cfe0ff; font-size:12px; font-weight:700;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  #zoomCtl .zBtn{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(90,140,255,.18); border:1px solid rgba(120,170,255,.35);
    color:#dbe9ff; font-size:16px; font-weight:800; line-height:1;
    cursor:pointer; touch-action:none; user-select:none;
  }
  #zoomCtl .zBtn:active{transform:scale(.9); background:rgba(90,140,255,.35)}
  #zVal{min-width:38px; text-align:center; font-variant-numeric:tabular-nums}

  .stick{position:fixed;width:132px;height:132px;border-radius:50%;z-index:10;
    background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:2px solid rgba(120,160,255,.22);touch-action:none}
  .stick .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
    border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(170,205,255,.85),rgba(70,120,220,.5));
    box-shadow:0 0 18px rgba(80,140,255,.45);will-change:transform;pointer-events:none}
  #stickL{left:26px;bottom:30px}
  #stickR{right:26px;bottom:30px}

  #skillBtns{position:fixed;inset:0;pointer-events:none;z-index:10}
  .skillBtn{position:fixed;right:44px;bottom:186px;width:82px;height:82px;border-radius:50%;
    pointer-events:auto;touch-action:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    border:2px solid rgba(170,205,255,.4);
    box-shadow:0 0 22px rgba(80,140,255,.45);color:#fff;font-weight:800;font-size:13px;
    letter-spacing:1px;text-align:center;line-height:1.25}
  .skillBtn:active{transform:scale(.94)}
  .skillBtn .cdMask{position:absolute;inset:0;border-radius:50%;pointer-events:none}
  .skillBtn .sName{position:relative;padding:0 6px}
  .skillBtn .sCd{position:absolute;font-size:22px;font-weight:800;opacity:0;
    text-shadow:0 2px 8px rgba(0,0,0,.8);color:#dbe9ff}

  .ov{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:22px;
    background:rgba(6,9,16,.9);backdrop-filter:blur(6px);overflow-y:auto}
  .ov.show{display:flex}
  .ovTitle{font-size:25px;font-weight:800;color:#e8f0ff;letter-spacing:3px}
  .ovSub{font-size:13px;color:#8fa3c4;letter-spacing:.5px;text-align:center;line-height:1.7}
  .btn{margin-top:6px;padding:13px 46px;border-radius:999px;font-size:16px;font-weight:700;
    color:#eaf2ff;letter-spacing:3px;cursor:pointer;
    background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 6px 24px rgba(59,130,246,.4);
    transition:transform .12s}
  .btn:active{transform:scale(.95)}
  .btn.sec{background:linear-gradient(135deg,#4b5563,#374151);
    box-shadow:0 6px 24px rgba(75,85,99,.35);font-size:14px;padding:11px 38px}

  #charList{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:min(560px,94vw)}
  .charCard{background:linear-gradient(180deg,#161e2d,#111722);border:2px solid #24304a;
    border-radius:14px;padding:13px 13px 12px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
  .charCard:active{transform:scale(.97)}
  .charCard.sel{border-color:var(--c);box-shadow:0 0 22px -4px var(--c)}
  .charCard .cName{font-size:16px;font-weight:800;color:var(--c);letter-spacing:1px}
  .charCard .cTitle{font-size:10px;color:#63799b;margin:2px 0 9px;letter-spacing:1px}
  .charCard .line{font-size:11.5px;color:#94a9c8;line-height:1.5;margin-top:5px}
  .charCard .line b{color:#cfe0ff;font-weight:700}
  .charCard .line.p b{color:#7ee0a8}

  .cards{display:flex;flex-direction:column;gap:11px;width:min(400px,92vw)}
  .card{background:linear-gradient(180deg,#1a2233,#131a27);border:1px solid #2b3a55;
    border-radius:14px;padding:14px 17px;cursor:pointer;transition:.13s;position:relative}
  .card:active{transform:scale(.97);border-color:#4f8cff}
  .card .kind{position:absolute;right:14px;top:14px;font-size:10px;font-weight:700;
    padding:2px 8px;border-radius:99px;letter-spacing:1px}
  .card .kind.skill{background:rgba(79,140,255,.18);color:#7fb0ff}
  .card .kind.passive{background:rgba(126,224,168,.15);color:#7ee0a8}
  .card .kind.base{background:rgba(255,255,255,.07);color:#8fa3c4}
  .card h3{font-size:16px;color:#e8f0ff;margin-bottom:5px;letter-spacing:.5px;padding-right:60px}
  .card p{font-size:12.5px;color:#8fa3c4;line-height:1.5}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="hpWrap">
    <div id="lvTag">Lv.1</div>
    <div class="bar" id="hpBar"><i></i></div>
  </div>
  <div id="xpBar"><i></i></div>
  <div id="meta">
    <span id="timer">00:00</span>
    <span id="kills">击杀 0</span>
  </div>
</div>

<div id="statsPanel">
  <div class="k">伤害</div><div class="v" id="stDmg">-</div>
  <div class="k">攻速</div><div class="v" id="stRate">-</div>
  <div class="k">移速</div><div class="v" id="stSpd">-</div>
  <div class="k">生命</div><div class="v" id="stHp">-</div>
  <div class="k">弹数</div><div class="v" id="stCnt">-</div>
  <div class="k">射程</div><div class="v" id="stRng">-</div>
  <div class="k">穿透</div><div class="v" id="stPie">-</div>
  <div class="k">暴击</div><div class="v" id="stCrit">-</div>
  <div class="k">暴伤</div><div class="v" id="stCritDmg">-</div>
</div>

<div id="zoomCtl">
  <div class="zBtn" id="zOut">−</div>
  <span id="zVal">1.0×</span>
  <div class="zBtn" id="zIn">+</div>
</div>

<div class="stick" id="stickL"><div class="knob"></div></div>
<div class="stick" id="stickR"><div class="knob"></div></div>

<div id="skillBtns"></div>

<div class="ov show" id="charOv">
  <h2 class="ovTitle">选 择 角 色</h2>
  <div id="charList"></div>
  <div class="btn" id="startBtn">开 始</div>
</div>

<div class="ov" id="levelOv"></div>

<div class="ov" id="overOv">
  <h2 class="ovTitle" style="color:#ff6b81">你 已 倒 下</h2>
  <p class="ovSub" id="overStats"></p>
  <div class="btn" id="retryBtn">再 来 一 局</div>
  <div class="btn sec" id="changeCharBtn">更 换 角 色</div>
</div>

<script>
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const MAP_HALF = 1800;

function shade(hex, amt) {
  const c = parseInt(hex.slice(1), 16);
  let r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
  if (amt >= 0) {
    r = Math.round(r + (255 - r) * amt);
    g = Math.round(g + (255 - g) * amt);
    b = Math.round(b + (255 - b) * amt);
  } else {
    const k = 1 + amt;
    r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
  }
  return `rgb(${r},${g},${b})`;
}

const cvs = $('#game');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

let zoomLevel = 1.0;
const ZOOM_MIN = 0.6, ZOOM_MAX = 1.8, ZOOM_STEP = 0.2;
function setZoom(v) {
  zoomLevel = clamp(v, ZOOM_MIN, ZOOM_MAX);
  zoomLevel = Math.round(zoomLevel * 10) / 10;
  $('#zVal').textContent = zoomLevel.toFixed(1) + '×';
}
setZoom(1.0);
$('#zOut').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); setZoom(zoomLevel - ZOOM_STEP); });
$('#zIn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); setZoom(zoomLevel + ZOOM_STEP); });

function createStick(el, maxR) {
  const knob = el.querySelector('.knob');
  const out = { x: 0, y: 0, power: 0, active: false };
  let pid = null, cx = 0, cy = 0;
  function move(e) {
    const dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    const k = d > maxR ? maxR / d : 1;
    knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    const power = d / maxR;
    out.power = power < 0.14 ? 0 : Math.min(power, 1);
    out.active = out.power > 0;
    if (d > 0.001) { out.x = dx / d; out.y = dy / d; }
  }
  el.addEventListener('pointerdown', e => {
    if (pid !== null) return;
    pid = e.pointerId;
    el.setPointerCapture(pid);
    const r = el.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
    move(e);
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
  function end(e) {
    if (e.pointerId !== pid) return;
    pid = null;
    out.x = out.y = out.power = 0; out.active = false;
    knob.style.transform = 'translate(0,0)';
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  return out;
}

const stickL = createStick($('#stickL'), 44);
const stickR = createStick($('#stickR'), 44);

function getSkillCd(sk, lv) {
  if (lv == null) lv = (G.skillLv[sk.id] || 1);
  const v = sk.cd * Math.pow(0.92, lv - 1);
  return Math.round(v * 10) / 10;
}

/* =========================================================
   角色表（★ 所有持续技能时长随等级显著增长）
========================================================= */
const CHARS = {
  zhiyuchen: {
    id: 'zhiyuchen', name: '智宇晨', title: '音波使者', color: '#5ea9ff',
    base: { maxHp: 115, speed: 210, dmg: 13, fireRate: 0.36, bulletSpeed: 640, bulletRange: 560, bulletR: 5 },
    passive: { name: '疾风', max: 99,
      desc: lv => `射击速度与移动速度 +${25 + (lv - 1) * 7}%`,
      mul: lv => 1 + (25 + (lv - 1) * 7) / 100 },
    passiveApply(p, lv) {
      const o = lv <= 1 ? 1 : this.passive.mul(lv - 1);
      const n = this.passive.mul(lv);
      p.speed = p.speed / o * n;
      p.fireRate = p.fireRate / n * o;
    },
    actives: [{
      id: 'gravity', name: '引力场', short: '引力', cd: 20, max: 99, button: true,
      persistent: true,
      duration: lv => 4 + (lv - 1) * 0.6,
      desc: lv => {
        const R = 140 + (lv - 1) * 22;
        const pull = 180 + (lv - 1) * 45;
        const dmg = 18 + (lv - 1) * 12;
        return `半径 ${R}，吸力 ${pull}/s，场内 ${dmg}/0.5s`;
      },
      run(p, lv) {
        const R = 140 + (lv - 1) * 22;
        const dur = 4 + (lv - 1) * 0.6;
        const pull = 180 + (lv - 1) * 45;
        const dmg = 18 + (lv - 1) * 12;
        G.gravityFields.push({
          x: p.x, y: p.y, r: R, life: dur, max: dur,
          pull, dmg, tickCd: 0.3, phase: Math.random() * TAU,
        });
        burst(p.x, p.y, '#8fc9ff', 24, 260);
        G.rings.push({ x: p.x, y: p.y, r: 12, maxR: R, life: 0.5, max: 0.5, color: '#5ea9ff', w: 7 });
      }
    }]
  },

  zhiban: {
    id: 'zhiban', name: '智板', title: '时之停者', color: '#a78bfa',
    base: { maxHp: 160, speed: 215, dmg: 15, fireRate: 0.38, bulletSpeed: 680, bulletRange: 600, bulletR: 6 },
    passive: null,
    actives: [{
      id: 'timestop', name: '时间暂停', short: '时停', cd: 28, max: 99, button: true,
      persistent: true,
      duration: lv => 3 + (lv - 1) * 0.7,
      desc: lv => {
        const atkMul = 100 + (lv - 1) * 25;
        const dmg = 80 + (lv - 1) * 40;
        return `攻速 +${atkMul}%；结束全场 ${dmg} 崩解`;
      },
      run(p, lv) {
        const dur = 3 + (lv - 1) * 0.7;
        const atkMul = 1 + (100 + (lv - 1) * 25) / 100;
        const endDmg = 80 + (lv - 1) * 40;
        G.timeStop = Math.max(G.timeStop, dur);
        G.timeStopAtkMul = atkMul;
        G.timeStopEndDmg = endDmg;
        G.timeStopTotal = dur;
        G.rings.push({ x: p.x, y: p.y, r: 20, maxR: Math.max(W, H) / zoomLevel,
                       life: 0.7, max: 0.7, color: '#c4b5fd', w: 10 });
        burst(p.x, p.y, '#c4b5fd', 30, 320);
      }
    }]
  },

  zhangsien: {
    id: 'zhangsien', name: '张思恩', title: '爆裂学者', color: '#fb923c',
    base: { maxHp: 130, speed: 200, dmg: 16, fireRate: 0.42, bulletSpeed: 610, bulletRange: 540, bulletR: 5 },
    passive: { name: '求知', max: 99,
      desc: lv => `经验获取 +${10 + (lv - 1) * 5}%`,
      mul: lv => 1 + (10 + (lv - 1) * 5) / 100 },
    passiveApply(p, lv) { G.xpMul = this.passive.mul(lv); },
    actives: [{
      id: 'barrage', name: '爆裂弹幕', short: '弹幕', cd: 30, max: 99, button: true,
      charges: 2, chargeWindow: 2.5,
      desc: lv => {
        const n = 5 + (lv - 1) * 2;
        const R = 95 + (lv - 1) * 14;
        const dmg = 55 + (lv - 1) * 25;
        return `扇形 ${n} 颗爆炸弹（半径 ${R}，伤害 ${dmg}）· 2 次充能`;
      },
      run(p, lv) {
        const n = 5 + (lv - 1) * 2;
        const R = 95 + (lv - 1) * 14;
        const dmg = 55 + (lv - 1) * 25;
        const baseAng = p.aim;
        const spread = Math.PI * 0.65;
        const step = n > 1 ? spread / (n - 1) : 0;
        for (let i = 0; i < n; i++) {
          const a = baseAng - spread / 2 + i * step;
          const dist = 250 + (i % 3) * 55;
          G.bullets.push({
            x: p.x + Math.cos(a) * (p.r + 8),
            y: p.y + Math.sin(a) * (p.r + 8),
            vx: Math.cos(a) * 380, vy: Math.sin(a) * 380,
            r: 9, dmg: 0, traveled: 0, maxDist: dist, life: 2,
            explodeOnEnd: true, explodeR: R, explodeDmg: dmg,
            pierce: 0, hitSet: new Set(),
          });
        }
        G.rings.push({ x: p.x, y: p.y, r: 10, maxR: 70, life: 0.32, max: 0.32, color: '#fb923c', w: 5 });
        burst(p.x, p.y, '#ffb26b', 16, 260);
        G.shake = 0.18;
      }
    }]
  },

  lujiancheng: {
    id: 'lujiancheng', name: '陆建成', title: '铁壁守卫', color: '#34d399',
    base: { maxHp: 125, speed: 185, dmg: 15, fireRate: 0.44, bulletSpeed: 590, bulletRange: 520, bulletR: 6 },
    passive: { name: '坚韧', max: 99,
      desc: lv => `生命上限 +${35 + (lv - 1) * 12}%`,
      mul: lv => 1 + (35 + (lv - 1) * 12) / 100 },
    passiveApply(p, lv) {
      const o = lv <= 1 ? 1 : this.passive.mul(lv - 1);
      const n = this.passive.mul(lv);
      const oldMax = p.maxHp;
      p.maxHp = p.maxHp / o * n;
      p.hp = Math.min(p.maxHp, p.hp + (p.maxHp - oldMax));
    },
    actives: [{
      id: 'sanctuary', name: '守护圣域', short: '圣域', cd: 15, max: 99, button: true,
      duration: lv => 4 + (lv - 1) * 0.5,   // 护盾持续时间随等级
      desc: lv => {
        const heal = 40 + (lv - 1) * 18;
        const shield = 30 + (lv - 1) * 15;
        const dmg = 40 + (lv - 1) * 20;
        const R = 150 + (lv - 1) * 15;
        return `回复 ${heal} 生命 + ${shield} 护盾；半径 ${R} 敌人受 ${dmg} 伤害`;
      },
      run(p, lv) {
        const heal = 40 + (lv - 1) * 18;
        const shield = 30 + (lv - 1) * 15;
        const dmg = 40 + (lv - 1) * 20;
        const R = 150 + (lv - 1) * 15;
        const shieldDur = 4 + (lv - 1) * 0.5;
        p.hp = Math.min(p.maxHp, p.hp + heal);
        p.shieldAmt = Math.max(p.shieldAmt, shield);
        p.shieldT = shieldDur;
        addText(p.x, p.y - 30, '+' + heal, '#4ade80');
        for (const e of G.enemies) {
          if (e.dead) continue;
          if (Math.hypot(e.x - p.x, e.y - p.y) < R + e.r) {
            e.hp -= dmg; e.hurtT = 0.15;
            addText(e.x, e.y - e.r - 4, Math.round(dmg), '#34d399');
            if (e.hp <= 0) killEnemy(e, true);
          }
        }
        G.rings.push({ x: p.x, y: p.y, r: 14, maxR: R, life: 0.55, max: 0.55, color: '#34d399', w: 8 });
        burst(p.x, p.y, '#34d399', 26, 260);
      }
    }]
  },

  lubiao: {
    id: 'lubiao', name: '陆标', title: '双枪浪客', color: '#fbbf24',
    base: { maxHp: 135, speed: 200, dmg: 13, fireRate: 0.40, bulletSpeed: 620, bulletRange: 560, bulletR: 5 },
    damageTakenMul: 1.08,
    passive: { name: '脆弱', max: 1, desc: () => '受到的伤害 +8%' },
    passiveApply() {},
    actives: [{
      id: 'dual', name: '双持炮台', short: '炮台', cd: 16, max: 99, button: true,
      persistent: true,
      duration: lv => 4 + (lv - 1) * 0.5,
      desc: lv => {
        const turDur = 10 + 2 * lv;
        return `双持期间子弹×2、伤害×1.5；原地放炮台 ${turDur}s（继承属性）`;
      },
      run(p, lv) {
        const dualDur = 4 + (lv - 1) * 0.5;
        p.dualT = dualDur;
        G.turrets.push({
          x: p.x, y: p.y,
          life: 10 + 2 * lv, maxLife: 10 + 2 * lv,
          fireCd: 0, aim: -Math.PI / 2,
          stats: {
            dmg: p.dmg, fireRate: p.fireRate,

function addText(x, y, str, color) {
  G.texts.push({ x, y, str, color, life: 0.75, vy: -52 });
}
function burst(x, y, color, n, spd = 170) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rand(spd * 0.22, spd);
    G.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.25, 0.6), max: 0.6, color, r: rand(1.5, 3.6),
    });
  }
}

function doBlast(x, y, R, dmg, sourcePlayer) {
  if (!isFinite(dmg) || dmg <= 0) return;
  for (const e of G.enemies) {
    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y;
    if (dx * dx + dy * dy < (R + e.r) * (R + e.r)) {
      e.hp -= dmg; e.hurtT = 0.15;
      addText(e.x, e.y - e.r - 4, Math.round(dmg), '#ffb26b');
      if (e.hp <= 0) killEnemy(e, sourcePlayer);
    }
  }
  G.rings.push({ x, y, r: 8, maxR: R, life: 0.38, max: 0.38, color: '#fb923c', w: 8 });
  burst(x, y, '#ffb26b', 14, 280);
}

function pickType() {
  const t = G.time, r = Math.random();
  if (t < 12) return 'grunt';
  if (t < 25) return r < 0.25 ? 'fast' : 'grunt';
  if (t < 40) {
    if (r < 0.25) return 'fast';
    if (r < 0.48) return 'tank';
    return 'grunt';
  }
  if (t < 60) {
    if (r < 0.25) return 'fast';
    if (r < 0.32) return 'shooter';
    if (r < 0.55) return 'tank';
    return 'grunt';
  }
  if (r < 0.28) return 'fast';
  if (r < 0.40) return 'shooter';
  if (r < 0.60) return 'tank';
  return 'grunt';
}

  const t = TYPES[type], p = G.player;

function spawnLogic(dt) {
  if (G.timeStop > 0) return;
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0) {
    const interval = Math.max(0.7, 1.3 - G.time * 0.003);
    G.spawnTimer = interval;
    const n = Math.min(3, 1 + Math.floor(G.time / 80));
    const maxEnemies = 50 + Math.floor(G.time * 0.18);
    if (G.enemies.length < maxEnemies) {
      for (let i = 0; i < n; i++) {
        if (G.enemies.length >= maxEnemies) break;
        spawnEnemy(pickType());
      }
    }
  }
  G.bossTimer -= dt;
  if (G.bossTimer <= 0) { G.bossTimer = 65; spawnEnemy('boss'); }
}

function castBossSkill(e) {
  const p = G.player;
  const r = Math.random();
  if (r < 0.15) {
    const n = 16;
    const baseAng = Math.random() * TAU;
    for (let i = 0; i < n; i++) {
      const a = baseAng + (i / n) * TAU;
      G.ebullets.push({
        x: e.x + Math.cos(a) * e.r, y: e.y + Math.sin(a) * e.r,
        vx: Math.cos(a) * 200, vy: Math.sin(a) * 200,
        r: 7, dmg: e.dmg * 0.7, life: 5,
      });
    }
    addText(e.x, e.y - e.r - 10, '环形弹幕', '#e9b8ff');
    G.rings.push({ x: e.x, y: e.y, r: 30, maxR: 200, life: 0.5, max: 0.5, color: '#c084fc', w: 6 });
  } else if (r < 0.30) {
    const baseAng = Math.atan2(p.y - e.y, p.x - e.x);
    const dirs = [baseAng, baseAng + Math.PI / 2, baseAng + Math.PI, baseAng + Math.PI * 1.5];
    for (const dir of dirs) {
      for (let k = -1; k <= 1; k++) {
        const a = dir + k * 0.1;
        G.ebullets.push({
          x: e.x + Math.cos(a) * e.r, y: e.y + Math.sin(a) * e.r,
          vx: Math.cos(a) * 240, vy: Math.sin(a) * 240,
          r: 8, dmg: e.dmg * 0.6, life: 5,
        });
      }
    }
    addText(e.x, e.y - e.r - 10, '十字弹幕', '#e9b8ff');
  } else if (r < 0.45) {
    e.spiralT = 3;
    e.spiralAng = 0;
    e.spiralTick = 0;
    addText(e.x, e.y - e.r - 10, '螺旋弹幕', '#e9b8ff');
  } else if (r < 0.60) {
    for (let i = 0; i < 3; i++) {
      const a = Math.atan2(p.y - e.y, p.x - e.x) + (i - 1) * 0.4;
      const speed = 200;
      G.ebullets.push({
        x: e.x + Math.cos(a) * e.r, y: e.y + Math.sin(a) * e.r,
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        r: 9, dmg: e.dmg * 1.0, life: 6,
        homing: true, homingSpeed: speed,
      });
    }
    addText(e.x, e.y - e.r - 10, '追踪弹', '#e9b8ff');
  } else if (r < 0.75) {
    const angle = Math.random() * TAU;
    const dist = 200;
    const wallX = clamp(p.x + Math.cos(angle) * dist, -MAP_HALF + 100, MAP_HALF - 100);
    const wallY = clamp(p.y + Math.sin(angle) * dist, -MAP_HALF + 100, MAP_HALF - 100);
    const horizontal = Math.random() < 0.5;
    G.walls.push({
      x: wallX, y: wallY,
      w: horizontal ? 260 : 60,
      h: horizontal ? 60 : 260,
      life: 5, maxLife: 5,
    });
    addText(e.x, e.y - e.r - 10, '幻影墙', '#e9b8ff');
  } else {
    e.telegraphType = 'charge';
    e.telegraphT = 0.8;
    e.chargeDir = Math.atan2(p.y - e.y, p.x - e.x);
  }
}

function updateBossSkills(dt) {
  if (G.timeStop > 0) return;
  const p = G.player;
  for (const e of G.enemies) {
    if (e.type !== 'boss' || e.dead) continue;
    if (e.spiralT > 0) {
      e.spiralT -= dt;
      e.spiralTick -= dt;
      if (e.spiralTick <= 0) {
        e.spiralTick = 0.12;
        const arms = 3;
        for (let i = 0; i < arms; i++) {
          const a = e.spiralAng + (i / arms) * TAU;
          G.ebullets.push({
            x: e.x + Math.cos(a) * e.r, y: e.y + Math.sin(a) * e.r,
            vx: Math.cos(a) * 180, vy: Math.sin(a) * 180,
            r: 6, dmg: e.dmg * 0.5, life: 4,
          });
        }
        e.spiralAng += 0.45;
      }
    }
    if (e.telegraphT > 0) {
      e.telegraphT -= dt;
      if (e.telegraphT <= 0) {
        if (e.telegraphType === 'charge') e.chargeT = 0.5;
        else if (e.telegraphType === 'shockwave') {
          const R = 220;
          const dx = p.x - e.x, dy = p.y - e.y;
          if (Math.hypot(dx, dy) < R + p.r) hurtPlayer(e.dmg * 1.5);
          G.rings.push({ x: e.x, y: e.y, r: 20, maxR: R, life: 0.6, max: 0.6, color: '#c084fc', w: 10 });
        }
        e.telegraphType = null;
      }
      continue;
    }
    if (e.chargeT > 0) {
      e.chargeT -= dt;
      const spd = 700;
      e.x += Math.cos(e.chargeDir) * spd * dt;
      e.y += Math.sin(e.chargeDir) * spd * dt;
      e.x = clamp(e.x, -MAP_HALF + e.r, MAP_HALF - e.r);
      e.y = clamp(e.y, -MAP_HALF + e.r, MAP_HALF - e.r);
      const dx = p.x - e.x, dy = p.y - e.y;
      if (dx * dx + dy * dy < (e.r + p.r) * (e.r + p.r)) {
        hurtPlayer(e.dmg * 1.3);
        e.chargeT = 0;
      }
      continue;
    }
    e.skillTimer -= dt;
    if (e.skillTimer <= 0) {
      e.skillTimer = 3.5 + Math.random() * 2;
      castBossSkill(e);
    }
  }
}

function collidesWithWall(nx, ny, r) {
  for (const w of G.walls) {
    if (nx + r > w.x - w.w / 2 && nx - r < w.x + w.w / 2 &&
        ny + r > w.y - w.h / 2 && ny - r < w.y + w.h / 2) return true;
  }
  return false;
}
function updateWalls(dt) {
  for (let i = G.walls.length - 1; i >= 0; i--) {
    G.walls[i].life -= dt;
    if (G.walls[i].life <= 0) G.walls.splice(i, 1);
  }
}

function updateWeapon(dt) {
  const p = G.player;
  p.fireCd -= dt;
  if (!stickR.active) {
    if (p.fireCd < 0) p.fireCd = 0;
    return;
  }
  p.aim = Math.atan2(stickR.y, stickR.x);
  if (p.fireCd > 0) return;
  const atkMul = (G.timeStop > 0 && G.timeStopAtkMul > 1) ? G.timeStopAtkMul : 1;
  p.fireCd = p.fireRate / atkMul;
  p.vis.recoil = Math.min(1.3, p.vis.recoil + 0.95);

  const dual = p.dualT > 0;
  const count = dual ? p.bulletCount * 2 : p.bulletCount;
  const bR = dual ? p.bulletR * 2 : p.bulletR;
  let bDmg = dual ? p.dmg * 1.5 : p.dmg;
  if (p.berserk && p.hp / p.maxHp < 0.35) bDmg *= 1.5;
  const spread = dual ? 0.10 : 0.14;
  const explodeDmgValue = p.explodeRadius > 0 ? bDmg * p.explodeDmgMul : 0;

  for (let i = 0; i < count; i++) {
    const a = p.aim + (i - (count - 1) / 2) * spread;
    const isCrit = Math.random() < p.critChance;
    const finalDmg = bDmg * (isCrit ? p.critMul : 1);
    G.bullets.push({
      x: p.x + Math.cos(a) * (p.r + 6),
      y: p.y + Math.sin(a) * (p.r + 6),
      vx: Math.cos(a) * p.bulletSpeed,
      vy: Math.sin(a) * p.bulletSpeed,
      r: bR, dmg: finalDmg,
      isCrit,
      pierce: p.pierce,
      chain: p.chain, chainDmg: p.chainDmg,
      slowOnHit: p.slowOnHit,
      explodeR: p.explodeRadius,
      explodeDmg: explodeDmgValue,
      hitSet: new Set(),
      traveled: 0, maxDist: p.bulletRange, life: 3,
    });
  }
}

function fireBullet(x, y, angle, stats, isTurret) {
  const count = stats.bulletCount;
  const spread = 0.14;
  const explodeDmgValue = stats.explodeR > 0 ? stats.dmg * stats.explodeMul : 0;
  for (let i = 0; i < count; i++) {
    const a = angle + (i - (count - 1) / 2) * spread;
    const isCrit = Math.random() < stats.critChance;
    const finalDmg = stats.dmg * (isCrit ? stats.critMul : 1);
    G.bullets.push({
      x: x + Math.cos(a) * 22, y: y + Math.sin(a) * 22,
      vx: Math.cos(a) * stats.bulletSpeed,
      vy: Math.sin(a) * stats.bulletSpeed,
      r: stats.bulletR, dmg: finalDmg,
      isCrit,
      pierce: stats.pierce,
      chain: stats.chain || 0, chainDmg: stats.chainDmg || 0.6,
      slowOnHit: stats.slowOnHit || 0,
      explodeR: stats.explodeR || 0,
      explodeDmg: explodeDmgValue,
      hitSet: new Set(),
      traveled: 0, maxDist: stats.bulletRange, life: 3,
      isTurret: !!isTurret,
    });
  }
}

function killEnemy(e, sourcePlayer, isChain) {
  if (e.dead) return;
  e.dead = true;
  G.kills++;
  burst(e.x, e.y, e.color, e.type === 'boss' ? 28 : 7, e.type === 'boss' ? 320 : 170);
  const waveBonus = 1 + Math.floor(G.time / 60);
  const gemCount = e.type === 'boss' ? 8 : 1;
  const per = Math.max(1, Math.round(e.xp * waveBonus / gemCount));
  for (let i = 0; i < gemCount; i++) {
    const a = Math.random() * TAU, d = gemCount > 1 ? Math.random() * 48 : rand(0, 6);
    G.gems.push({ x: e.x + Math.cos(a) * d, y: e.y + Math.sin(a) * d, value: per, pulse: Math.random() * 6 });
  }

  if (sourcePlayer && G.player.lifestealPct > 0) {
    const heal = G.player.maxHp * G.player.lifestealPct;
    G.player.hp = Math.min(G.player.maxHp, G.player.hp + heal);
    addText(G.player.x, G.player.y - 42, '+' + Math.round(heal), '#4ade80');
  }

  if (!isChain && G.player.deathBlast) {
    const R = 80;
    const dmg = e.maxHp * 0.25;
    for (const e2 of G.enemies) {
      if (e2.dead) continue;
      if (Math.hypot(e2.x - e.x, e2.y - e.y) < R + e2.r) {
        e2.hp -= dmg;
        e2.hurtT = 0.15;
        if (e2.hp <= 0) killEnemy(e2, sourcePlayer, true);
      }
    }
    G.rings.push({ x: e.x, y: e.y, r: 10, maxR: R, life: 0.4, max: 0.4, color: '#ff6b6b', w: 6 });
    burst(e.x, e.y, '#ff6b6b', 12, 220);
  }
}

function updateBullets(dt) {
  const p = G.player;
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    const sx = b.vx * dt, sy = b.vy * dt;
    b.x += sx; b.y += sy;
    b.traveled += Math.hypot(sx, sy);
    b.life -= dt;
    if (b.life <= 0 || b.traveled >= b.maxDist) {
      if (b.explodeR > 0 && b.explodeDmg > 0) doBlast(b.x, b.y, b.explodeR, b.explodeDmg, true);
      G.bullets.splice(i, 1);
      continue;
    }
    let gone = false;
    for (const e of G.enemies) {
      if (e.dead || b.hitSet.has(e.id)) continue;
      const dx = e.x - b.x, dy = e.y - b.y;
      const rr = e.r + b.r;
      if (dx * dx + dy * dy < rr * rr) {
        b.hitSet.add(e.id);

        if (b.explodeOnEnd) {
          if (b.explodeDmg > 0) doBlast(b.x, b.y, b.explodeR, b.explodeDmg, true);
          gone = true;
          break;
        }

        let dmgValue = b.dmg;
        if (p.hunterMark && e.hp / e.maxHp < 0.3) dmgValue *= 1.5;
        e.hp -= dmgValue;
        e.hurtT = 0.12;
        addText(e.x + rand(-6, 6), e.y - e.r - 4,
                Math.round(dmgValue) + (b.isCrit ? '!' : ''),
                b.isCrit ? '#ffe066' : (p.hunterMark && e.hp / e.maxHp < 0.3 ? '#ff8080' : '#fff'));
        burst(b.x, b.y, b.isCrit ? '#ffe066' : '#cfe4ff', 3, 120);

        if (p.armorPierce > 0) {
          const extra = Math.min(e.hp * p.armorPierce, 200);
          e.hp -= extra;
        }

        if (b.slowOnHit > 0) {
          e.slowT = Math.max(e.slowT, 2);
          e.slowMul = Math.min(e.slowMul, 1 - b.slowOnHit);
        }
        if (b.chain > 0 && Math.random() < b.chain) {
          let nearest = null, nd = 220 * 220;
          for (const e2 of G.enemies) {
            if (e2.dead || e2 === e) continue;
            const d2 = (e2.x - e.x) ** 2 + (e2.y - e.y) ** 2;
            if (d2 < nd) { nd = d2; nearest = e2; }
          }
          if (nearest) {
            const a2 = Math.atan2(nearest.y - e.y, nearest.x - e.x);
            const speed = Math.hypot(b.vx, b.vy);
            G.bullets.push({
              x: e.x, y: e.y,
              vx: Math.cos(a2) * speed, vy: Math.sin(a2) * speed,
              r: b.r, dmg: b.dmg * (b.chainDmg || 0.6), isCrit: false,
              pierce: 0, chain: 0, chainDmg: 0, slowOnHit: 0,
              explodeR: 0, explodeDmg: 0, hitSet: new Set([e.id]),
              traveled: 0, maxDist: 220, life: 1.5,
            });
            G.rings.push({ x: e.x, y: e.y, r: 6, maxR: 220, life: 0.15, max: 0.15, color: '#a0e0ff', w: 3 });
          }
        }

        if (b.explodeR > 0 && b.explodeDmg > 0) {
          doBlast(e.x, e.y, b.explodeR, b.explodeDmg, true);
        }

        if (e.hp <= 0) killEnemy(e, true);

        if (b.pierce > 0) b.pierce--;
        else { gone = true; break; }
      }
    }
    if (gone) G.bullets.splice(i, 1);
  }
  for (let i = G.enemies.length - 1; i >= 0; i--) if (G.enemies[i].dead) G.enemies.splice(i, 1);
}

function hurtPlayer(dmg) {
  const p = G.player;
  if (p.hurtCd > 0) return;
  if (p.invincible) return;
  dmg *= (CH.damageTakenMul || 1);

  if (p.shieldT > 0 && p.shieldAmt > 0) {
    const absorb = Math.min(p.shieldAmt, dmg);
    p.shieldAmt -= absorb;
    dmg -= absorb;
    addText(p.x, p.y - 34, '-' + Math.round(absorb) + '盾', '#93c5fd');
    if (dmg < 0.1) { p.hurtCd = 0.2; return; }
  }

  p.hp -= dmg;
  p.hurtCd = 0.55 + (p.phase ? 0.25 : 0);
  if (p.phase) p.phaseT = 1.2;
  p.hurtFlash = 0.28;
  G.hurtFlash = 0.35;
  G.shake = 0.18;
  addText(p.x, p.y - 28, '-' + Math.round(dmg), '#ff5c7a');
  burst(p.x, p.y, '#ff5c7a', 6, 150);

  if (p.thorns > 0) {
    for (const e of G.enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - p.x, e.y - p.y) < 140 + e.r) {
        e.hp -= p.thorns; e.hurtT = 0.15;
        addText(e.x, e.y - e.r - 4, Math.round(p.thorns), '#a78bfa');
        if (e.hp <= 0) killEnemy(e, true);
      }
    }
    G.rings.push({ x: p.x, y: p.y, r: 20, maxR: 140, life: 0.35, max: 0.35, color: '#a78bfa', w: 6 });
  }

  if (p.hp <= 0) { p.hp = 0; gameOver(); }
}

function updateGravityFields(dt) {
  for (let i = G.gravityFields.length - 1; i >= 0; i--) {
    const f = G.gravityFields[i];
    f.life -= dt;
    if (f.life <= 0) { G.gravityFields.splice(i, 1); continue; }
    for (const e of G.enemies) {
      if (e.dead) continue;
      const dx = f.x - e.x, dy = f.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < f.r + e.r) {
        const force = f.pull * (1 - d / (f.r + e.r)) * dt;
        e.x += (dx / d) * force;
        e.y += (dy / d) * force;
      }
    }
    f.tickCd -= dt;
    if (f.tickCd <= 0) {
      f.tickCd = 0.5;
      for (const e of G.enemies) {
        if (e.dead) continue;
        if (Math.hypot(e.x - f.x, e.y - f.y) < f.r + e.r) {
          e.hp -= f.dmg; e.hurtT = 0.1;
          addText(e.x, e.y - e.r - 4, Math.round(f.dmg), '#8fc9ff');
          if (e.hp <= 0) killEnemy(e, true);
        }
      }
    }
  }
}

function updateTurrets(dt) {
  for (let i = G.turrets.length - 1; i >= 0; i--) {
    const t = G.turrets[i];
    t.life -= dt;
    if (t.life <= 0) { G.turrets.splice(i, 1); continue; }
    let target = null, best = Infinity;
    for (const e of G.enemies) {
      if (e.dead) continue;
      const d = (e.x - t.x) ** 2 + (e.y - t.y) ** 2;
      if (d < best && d < t.stats.bulletRange ** 2) {
        best = d; target = e;
      }
    }
    if (target) {
      t.aim = Math.atan2(target.y - t.y, target.x - t.x);
      t.fireCd -= dt;
      if (t.fireCd <= 0) {
        t.fireCd = t.stats.fireRate;
        fireBullet(t.x, t.y, t.aim, t.stats, true);
      }
    }
  }
}

function updateDashTrails(dt) {
  const p = G.player;
  if (p.dashT > 0) {
    p.dashT = Math.max(0, p.dashT - dt);
    p.invincible = true;
    p.dashTrailCd -= dt;
    if (p.dashTrailCd <= 0) {
      p.dashTrailCd = 0.14;
      G.dashTrails.push({ x: p.x, y: p.y, r: 32, life: 0.6, max: 0.6, dmg: p.dashDmg, hitCd: {} });
    }
    p.dashAuraCd -= dt;
    if (p.dashAuraCd <= 0) {
      p.dashAuraCd = 0.5;
      for (const e of G.enemies) {
        if (e.dead) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        if (dx * dx + dy * dy < (55 + e.r) * (55 + e.r)) {
          e.hp -= p.dashDmg * 0.5; e.hurtT = 0.1;
          if (e.hp <= 0) killEnemy(e, true);
        }
      }
    }
  } else p.invincible = false;

  for (let i = G.dashTrails.length - 1; i >= 0; i--) {
    const t = G.dashTrails[i];
    t.life -= dt;
    if (t.life <= 0) { G.dashTrails.splice(i, 1); continue; }
    for (const k in t.hitCd) {
      t.hitCd[k] -= dt;
      if (t.hitCd[k] <= 0) delete t.hitCd[k];
    }
    for (const e of G.enemies) {
      if (e.dead || t.hitCd[e.id] > 0) continue;
      const dx = e.x - t.x, dy = e.y - t.y;
      if (dx * dx + dy * dy < (t.r + e.r) * (t.r + e.r)) {
        t.hitCd[e.id] = 0.6;
        e.hp -= t.dmg; e.hurtT = 0.12;
        addText(e.x, e.y - e.r - 4, Math.round(t.dmg), '#ff8fa3');
        if (e.hp <= 0) killEnemy(e, true);
      }
    }
  }
}

function updateEnemies(dt) {
  const p = G.player;
  const frozen = G.timeStop > 0;
  const cullR = Math.max(W, H) / zoomLevel + 1400;
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (e.hurtT > 0) e.hurtT = Math.max(0, e.hurtT - dt);
    if (frozen) continue;
    if (e.telegraphT > 0 || e.chargeT > 0) continue;
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowMul = 1; }
    const spd = e.speed * e.slowMul;
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d > cullR) { e.dead = true; continue; }
    if (e.ranged) {
      let mx = 0, my = 0;
      if (d > e.keepDist + 70) { mx = dx / d; my = dy / d; }
      else if (d < e.keepDist - 70) { mx = -dx / d; my = -dy / d; }
      else { mx = -dy / d; my = dx / d; }
      e.x += mx * spd * dt; e.y += my * spd * dt;
      e.shootCd -= dt;
      if (e.shootCd <= 0 && d < e.shootRange) {
        e.shootCd = e.shootInterval;
        const a = Math.atan2(dy, dx);
        G.ebullets.push({
          x: e.x + Math.cos(a) * e.r, y: e.y + Math.sin(a) * e.r,
          vx: Math.cos(a) * 175, vy: Math.sin(a) * 175,
          r: 6, dmg: e.dmg, life: 4,
        });
      }
    } else {
      const minD = e.r + p.r - 3;
      if (d > minD) {
        const moveDist = Math.min(spd * dt, d - minD);
        e.x += dx / d * moveDist;
        e.y += dy / d * moveDist;
      }
      const ndx = p.x - e.x, ndy = p.y - e.y;
      const nd = Math.hypot(ndx, ndy);
      if (nd < e.r + p.r + 6) hurtPlayer(e.dmg);
    }
    e.x = clamp(e.x, -MAP_HALF + e.r, MAP_HALF - e.r);
    e.y = clamp(e.y, -MAP_HALF + e.r, MAP_HALF - e.r);
  }
}

function updateEBullets(dt) {
  if (G.timeStop > 0) return;
  const p = G.player;
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const b = G.ebullets[i];
    if (b.homing) {
      const dx = p.x - b.x, dy = p.y - b.y;
      const d = Math.hypot(dx, dy) || 1;
      const tvx = (dx / d) * b.homingSpeed;
      const tvy = (dy / d) * b.homingSpeed;
      b.vx += (tvx - b.vx) * 2.5 * dt;
      b.vy += (tvy - b.vy) * 2.5 * dt;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    const dx = p.x - b.x, dy = p.y - b.y;
    if (dx * dx + dy * dy < (p.r + b.r) * (p.r + b.r)) {
      hurtPlayer(b.dmg);
      burst(b.x, b.y, '#c084fc', 6, 150);
      G.ebullets.splice(i, 1); continue;
    }
    if (b.life <= 0) G.ebullets.splice(i, 1);
  }
}

function gainXp(v) {
  G.xp += Math.max(1, Math.round(v * G.xpMul));
  const p = G.player;
  while (G.xp >= G.xpNeed) {
    G.xp -= G.xpNeed;
    G.level++;
    G.xpNeed = Math.round(6 + G.level * 3 + G.level * G.level * 0.4);
    const oldMax = p.maxHp;
    p.maxHp = oldMax * 1.045;
    const heal = oldMax * 0.25;
    p.hp = Math.min(p.maxHp, p.hp + heal);
    addText(p.x, p.y - 42, `+${Math.round(heal)}`, '#4ade80');
    G.pending++;
  }
  if (G.pending > 0 && !G.paused) openLevelUp();
}

let cardLock = 0;

/* ★ 技能升级描述：显示持续时间 + CD 变化 */
function buildPool() {
  const pool = [];
  for (const sk of CH.actives) {
    const lv = G.skillLv[sk.id] || 1;
    if (lv < sk.max) {
      const oldCd = getSkillCd(sk, lv);
      const newCd = getSkillCd(sk, lv + 1);
      let durLine = '';
      if (sk.duration) {
        const durNow = sk.duration(lv);
        const durNext = sk.duration(lv + 1);
        const diff = durNext - durNow;
        durLine = ` · 持续 ${durNow.toFixed(1)}s → ${durNext.toFixed(1)}s (+${diff.toFixed(1)}s)`;
      }
      pool.push({
        kind: 'skill', w: 2.4,
        name: `${sk.name} Lv.${lv + 1}`,
        desc: `${sk.desc(lv + 1)}${durLine} · CD ${oldCd}s → ${newCd}s`,
        apply() { G.skillLv[sk.id] = lv + 1; },
      });
    }
  }
  if (CH.passive && G.passiveLv < CH.passive.max) {
    pool.push({
      kind: 'passive', w: 2.0,
      name: `${CH.passive.name} Lv.${G.passiveLv + 1}`,
      desc: CH.passive.desc(G.passiveLv + 1),
      apply() { G.passiveLv++; CH.passiveApply(G.player, G.passiveLv); },
    });
  }
  for (const u of UPGRADES) {
    if ((G.upCounts[u.id] || 0) >= u.max) continue;
    pool.push({
      kind: 'base', w: 1,
      name: u.name, desc: u.desc,
      apply() { u.apply(G.player); G.upCounts[u.id] = (G.upCounts[u.id] || 0) + 1; },
    });
  }
  return pool;
}

function pickN(pool, n) {
  const arr = pool.slice(), out = [];
  while (out.length < n && arr.length) {
    let total = 0;
    for (const x of arr) total += x.w;
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < arr.length; i++) {
      r -= arr[i].w;
      if (r <= 0) { idx = i; break; }
      idx = i;
    }
    out.push(arr.splice(idx, 1)[0]);
  }
  return out;
}

function openLevelUp() {
  G.paused = true;
  renderCards();
  $('#levelOv').classList.add('show');
}

function renderCards() {
  const picks = pickN(buildPool(), 3);
  const ov = $('#levelOv');
  if (!picks.length) { G.pending = 0; closeLevelUp(); return; }
  ov.innerHTML = `
    <h2 class="ovTitle">等 级 提 升</h2>
    <p class="ovSub">Lv.${G.level} · 选择一项强化</p>
    <div class="cards">
      ${picks.map((u, i) => {
        const desc = typeof u.desc === 'function' ? u.desc() : u.desc;
        return `
          <div class="card" data-i="${i}">
            <span class="kind ${u.kind}">${u.kind === 'skill' ? '主动技能' : u.kind === 'passive' ? '被动强化' : '属性'}</span>
            <h3>${u.name}</h3>
            <p>${desc}</p>
          </div>`;
      }).join('')}
    </div>`;
  ov.querySelectorAll('.card').forEach(el => {
    el.addEventListener('pointerdown', () => {
      if (performance.now() < cardLock) return;
      cardLock = performance.now() + 200;
      picks[+el.dataset.i].apply();
      G.pending--;
      if (G.pending > 0) renderCards();
      else closeLevelUp();
    });
  });
}

function closeLevelUp() {
  $('#levelOv').classList.remove('show');
  G.paused = false;
}

function updateGems(dt) {
  const p = G.player;
  for (let i = G.gems.length - 1; i >= 0; i--) {
    const g = G.gems[i];
    g.pulse += dt * 6;
    const dx = p.x - g.x, dy = p.y - g.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < p.pickupRange) {
      const sp = 320 + (p.pickupRange - d) * 7;
      g.x += dx / d * sp * dt; g.y += dy / d * sp * dt;
    }
    if (d < p.r + 16) {
      if (p.magnetBlast > 0) {
        for (const e of G.enemies) {
          if (e.dead) continue;
          if (Math.hypot(e.x - g.x, e.y - g.y) < 130 + e.r) {
            e.hp -= p.magnetBlast;
            if (e.hp <= 0) killEnemy(e, true);
          }
        }
        G.rings.push({ x: g.x, y: g.y, r: 8, maxR: 130, life: 0.3, max: 0.3, color: '#ffe066', w: 4 });
      }
      G.gems.splice(i, 1);
      gainXp(g.value);
      if (G.paused) return;
    }
  }
}
function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const q = G.particles[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= 0.94; q.vy *= 0.94;
    q.life -= dt;
    if (q.life <= 0) G.particles.splice(i, 1);
  }
}
function updateTexts(dt) {
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i];
    t.y += t.vy * dt; t.vy *= 0.92; t.life -= dt;
    if (t.life <= 0) G.texts.splice(i, 1);
  }
}
function updateRings(dt) {
  for (let i = G.rings.length - 1; i >= 0; i--) {
    const r = G.rings[i];
    r.life -= dt;
    if (r.life <= 0) G.rings.splice(i, 1);
  }
}

function update(dt) {
  G.time += dt;
  const p = G.player;
  const v = p.vis;

  const phaseMul = p.phaseT > 0 ? 1.6 : 1;
  const spd = p.speed * phaseMul * (p.dashT > 0 ? p.dashSpeedMul : 1);
  const vx = stickL.x * stickL.power * spd * dt;
  const vy = stickL.y * stickL.power * spd * dt;

  let nx = p.x + vx;
  if (!collidesWithWall(nx, p.y, p.r)) p.x = nx;
  let ny = p.y + vy;
  if (!collidesWithWall(p.x, ny, p.r)) p.y = ny;

  p.x = clamp(p.x, -MAP_HALF + p.r, MAP_HALF - p.r);
  p.y = clamp(p.y, -MAP_HALF + p.r, MAP_HALF - p.r);

  if (p.phaseT > 0) p.phaseT = Math.max(0, p.phaseT - dt);

  p.moveMag = stickL.power;
  if (stickL.power > 0.01) p.moveDir = Math.atan2(stickL.y, stickL.x);

  const targetSquash = Math.min(1, stickL.power * 1.15);
  v.squashV += (targetSquash - v.squash) * 300 * dt;
  v.squashV *= Math.exp(-16 * dt);
  v.squash += v.squashV * dt;
  v.squash = clamp(v.squash, -0.18, 1.15);

  if (stickL.power > 0.05) {
    const target = Math.atan2(stickL.y, stickL.x);
    let diff = target - v.squashAngle;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    v.squashAngle += diff * Math.min(1, dt * 15);
  }
  {
    let diff = p.aim - v.angle;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    v.angle += diff * Math.min(1, dt * 22);
  }
  v.recoil = Math.max(0, v.recoil - dt * 9);
  v.bob += dt * (2.2 + stickL.power * 4.5);

  p.trailTimer -= dt;
  if (stickL.power > 0.15 && p.trailTimer <= 0) {
    p.trailTimer = 0.045;
    p.trail.push({ x: p.x, y: p.y, life: 0.32, max: 0.32, r: p.r });
    if (p.trail.length > 12) p.trail.shift();
  }
  for (let i = p.trail.length - 1; i >= 0; i--) {
    p.trail[i].life -= dt;
    if (p.trail[i].life <= 0) p.trail.splice(i, 1);
  }

  if (G.timeStop > 0) {
    const prev = G.timeStop;
    G.timeStop = Math.max(0, G.timeStop - dt);
    if (prev > 0 && G.timeStop === 0) {
      if (G.timeStopEndDmg > 0) {
        const dmg = G.timeStopEndDmg;
        let hit = 0;
        for (const e of G.enemies) {
          if (e.dead) continue;
          e.hp -= dmg; e.hurtT = 0.2;
          addText(e.x, e.y - e.r - 6, dmg, '#c4b5fd');
          hit++;
          if (e.hp <= 0) killEnemy(e, true);
        }
        if (hit > 0) {
          G.rings.push({ x: p.x, y: p.y, r: 20, maxR: Math.max(W, H) / zoomLevel,
                         life: 0.85, max: 0.85, color: '#c4b5fd', w: 12 });
          G.shake = 0.35;
        }
      }
      G.timeStopEndDmg = 0; G.timeStopAtkMul = 1; G.timeStopTotal = 0;
    }
  }

  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 1.6);
  if (p.dualT > 0) p.dualT = Math.max(0, p.dualT - dt);
  if (p.shieldT > 0) {
    p.shieldT = Math.max(0, p.shieldT - dt);
    if (p.shieldT <= 0) p.shieldAmt = 0;
  }

  for (const sk of CH.actives) {
    const maxCh = sk.charges || 1;
    const cd = G.skillCd[sk.id];
    const active = G.skillActive[sk.id];
    const wnd = G.skillWindow[sk.id];
    if (sk.persistent && active > 0) {
      G.skillActive[sk.id] = Math.max(0, active - dt);
      if (G.skillActive[sk.id] === 0) {
        G.skillCd[sk.id] = getSkillCd(sk);
      }
      continue;
    }
    if (cd > 0) {
      G.skillCd[sk.id] = Math.max(0, cd - dt);
      if (G.skillCd[sk.id] === 0) G.skillCharges[sk.id] = maxCh;
      continue;
    }
    if (wnd > 0) {
      G.skillWindow[sk.id] = Math.max(0, wnd - dt);
      if (G.skillWindow[sk.id] === 0 && G.skillCharges[sk.id] > 0) {
        G.skillCharges[sk.id] = 0;
        G.skillCd[sk.id] = getSkillCd(sk);
      }
    }
  }

  if (p.regen > 0) p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
  p.hurtCd = Math.max(0, p.hurtCd - dt);
  p.hurtFlash = Math.max(0, p.hurtFlash - dt);
  G.hurtFlash = Math.max(0, G.hurtFlash - dt);

  updateWeapon(dt);
  updateWalls(dt);
  updateGravityFields(dt);
  updateTurrets(dt);
  updateDashTrails(dt);
  updateBossSkills(dt);
  updateEnemies(dt);
  if (!G.running) return;
  updateBullets(dt);
  updateEBullets(dt);
  updateGems(dt);
  if (G.paused) return;
  updateParticles(dt);
  updateTexts(dt);
  updateRings(dt);
  spawnLogic(dt);
  updateHud();
}

/* HUD */
const hudCache = { hp: -1, xp: -1, lv: -1, t: '', k: -1 };
const statCache = {};
const hpBarEl = $('#hpBar>i');
const xpBarEl = $('#xpBar>i');
const lvEl = $('#lvTag');
const timerEl = $('#timer');
const killsEl = $('#kills');

function fmtTime(s) {
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}
function setStat(id, v) {
  if (statCache[id] === v) return;
  statCache[id] = v;
  const el = document.getElementById(id);
  if (el) el.textContent = v;
}

function updateHud() {
  const p = G.player;
  const hpPct = clamp(p.hp / p.maxHp, 0, 1) * 100;
  const xpPct = clamp(G.xp / G.xpNeed, 0, 1) * 100;
  if (Math.abs(hudCache.hp - hpPct) > 0.4) { hpBarEl.style.width = hpPct + '%'; hudCache.hp = hpPct; }
  if (Math.abs(hudCache.xp - xpPct) > 0.4) { xpBarEl.style.width = xpPct + '%'; hudCache.xp = xpPct; }
  if (hudCache.lv !== G.level) { lvEl.textContent = 'Lv.' + G.level; hudCache.lv = G.level; }
  const ts = fmtTime(G.time);
  if (hudCache.t !== ts) { timerEl.textContent = ts; hudCache.t = ts; }
  if (hudCache.k !== G.kills) { killsEl.textContent = '击杀 ' + G.kills; hudCache.k = G.kills; }

  const dual = p.dualT > 0;
  const timeBoost = (G.timeStop > 0 && G.timeStopAtkMul > 1) ? G.timeStopAtkMul : 1;
  const effDmg = dual ? p.dmg * 1.5 : p.dmg;
  const effCnt = dual ? p.bulletCount * 2 : p.bulletCount;
  const effRate = 1 / (p.fireRate / timeBoost);

  setStat('stDmg',  Math.round(effDmg) + (dual ? '↑' : ''));
  setStat('stRate', effRate.toFixed(1) + '/s' + (timeBoost > 1 ? '⚡' : ''));
  setStat('stSpd',  String(Math.round(p.speed * (p.dashT > 0 ? p.dashSpeedMul : 1))));
  setStat('stHp',   Math.ceil(p.hp) + '/' + Math.round(p.maxHp));
  setStat('stCnt',  String(effCnt));
  setStat('stRng',  String(Math.round(p.bulletRange)));
  setStat('stPie',  p.pierce === Infinity ? '∞' : String(p.pierce));
  setStat('stCrit', Math.round(p.critChance * 100) + '%');
  setStat('stCritDmg', Math.round(p.critMul * 100) + '%');

  for (const b of skillBtns) {
    const sk = b.skill;
    const cd = G.skillCd[sk.id] || 0;
    const active = G.skillActive[sk.id] || 0;
    const charges = G.skillCharges[sk.id] || 0;
    const maxCh = sk.charges || 1;
    const wnd = G.skillWindow[sk.id] || 0;

    if (active > 0) {
      const total = sk.duration ? sk.duration(G.skillLv[sk.id] || 1) : 1;
      const pct = clamp(active / total, 0, 1);
      b.maskEl.style.background = `conic-gradient(rgba(80,180,80,.75) ${pct * 360}deg, rgba(0,0,0,0) 0deg)`;
      b.nameEl.style.opacity = 0;
      b.cdEl.style.opacity = 1;
      b.cdEl.style.color = '#a0f0a0';
      b.cdEl.textContent = active.toFixed(1);
    } else if (cd > 0) {
      const total = getSkillCd(sk);
      const pct = clamp(cd / total, 0, 1);
      b.maskEl.style.background = `conic-gradient(rgba(6,10,20,.82) ${pct * 360}deg, rgba(0,0,0,0) 0deg)`;
      b.nameEl.style.opacity = 0;
      b.cdEl.style.opacity = 1;
      b.cdEl.style.color = '#dbe9ff';
      b.cdEl.textContent = cd.toFixed(1);
    } else if (wnd > 0) {
      const total = sk.chargeWindow || 2.5;
      const pct = clamp(wnd / total, 0, 1);
      b.maskEl.style.background = `conic-gradient(rgba(80,140,255,.5) ${pct * 360}deg, rgba(0,0,0,0) 0deg)`;
      b.nameEl.style.opacity = 1;
      b.nameEl.textContent = `${sk.short || sk.name} ${charges}`;
      b.cdEl.style.opacity = 0;
    } else {
      b.maskEl.style.background = 'none';
      b.nameEl.style.opacity = 1;
      b.nameEl.textContent = maxCh > 1 ? `${sk.short || sk.name} ${charges}` : (sk.short || sk.name);
      b.cdEl.style.opacity = 0;
    }
  }
}

function rebuildSkillButtons() {
  const wrap = $('#skillBtns');
  wrap.innerHTML = '';
  skillBtns = [];
  const list = CH.actives.filter(a => a.button !== false);
  list.forEach((sk, i) => {
    const el = document.createElement('div');
    el.className = 'skillBtn';
    el.style.bottom = (186 + i * 96) + 'px';
    el.style.background = `linear-gradient(135deg, ${CH.color}, #4338ca)`;
    el.innerHTML = `<div class="cdMask"></div><div class="sName">${sk.short || sk.name}</div><div class="sCd"></div>`;
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!G.running || G.paused) return;
      const cd = G.skillCd[sk.id] || 0;
      const active = G.skillActive[sk.id] || 0;
      const charges = G.skillCharges[sk.id] || 0;
      if (cd > 0 || active > 0 || charges <= 0) return;
      sk.run(G.player, G.skillLv[sk.id] || 1);
      if (sk.persistent) {
        G.skillActive[sk.id] = sk.duration(G.skillLv[sk.id] || 1);
        G.skillCharges[sk.id] = 0;
      } else {
        G.skillCharges[sk.id]--;
        if (G.skillCharges[sk.id] <= 0) G.skillCd[sk.id] = getSkillCd(sk);
        else if ((sk.charges || 1) > 1) G.skillWindow[sk.id] = sk.chargeWindow || 2.5;
      }
    });
    wrap.appendChild(el);
    skillBtns.push({
      el, skill: sk,
      nameEl: el.querySelector('.sName'),
      cdEl: el.querySelector('.sCd'),
      maskEl: el.querySelector('.cdMask'),
    });
  });
}

/* 外观锚点 */
function drawAnchor(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = Math.max(1.2, r * 0.20);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const id = CH ? CH.id : '';
  if (id === 'zhiyuchen') {
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.arc(0, 0, r * (0.35 + i * 0.30), i * Math.PI, i * Math.PI + Math.PI * 1.2);
      ctx.stroke();
    }
  } else if (id === 'zhiban') {
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.62, 0, TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -r * 0.42);
    ctx.moveTo(0, 0); ctx.lineTo(r * 0.28, r * 0.15);
    ctx.stroke();
  } else if (id === 'zhangsien') {
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i * TAU / 4 - Math.PI / 2;
      const a2 = a + TAU / 8;
      const r1 = r * 0.72, r2 = r * 0.26;
      if (i === 0) ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      else ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a2) * r2, Math.sin(a2) * r2);
    }
    ctx.closePath();
    ctx.fill();
  } else if (id === 'lujiancheng') {
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, -r * 0.55);
    ctx.lineTo(r * 0.5, -r * 0.55);
    ctx.lineTo(r * 0.5, 0);
    ctx.quadraticCurveTo(r * 0.5, r * 0.45, 0, r * 0.7);
    ctx.quadraticCurveTo(-r * 0.5, r * 0.45, -r * 0.5, 0);
    ctx.closePath();
    ctx.fill();
  } else if (id === 'lubiao') {
    ctx.beginPath();
    ctx.arc(-r * 0.38, -r * 0.05, r * 0.18, 0, TAU);
    ctx.arc(r * 0.38, -r * 0.05, r * 0.18, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, r * 0.42);
    ctx.lineTo(r * 0.5, r * 0.42);
    ctx.stroke();
  } else if (id === 'zhangxiang') {
    ctx.beginPath();
    ctx.moveTo(r * 0.12, -r * 0.78);
    ctx.lineTo(-r * 0.38, r * 0.10);
    ctx.lineTo(-r * 0.06, r * 0.10);
    ctx.lineTo(-r * 0.16, r * 0.78);
    ctx.lineTo(r * 0.40, -r * 0.05);
    ctx.lineTo(r * 0.10, -r * 0.05);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawGun(p, invZ) {
  const v = p.vis;
  const len = p.r * 1.75 - v.recoil * p.r * 0.55;
  const w = p.r * 0.58;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(v.angle);
  const grd = ctx.createLinearGradient(0, 0, len, 0);
  grd.addColorStop(0, shade(CH.color, 0.05));
  grd.addColorStop(0.45, shade(CH.color, 0.5));
  grd.addColorStop(1, '#eaf4ff');
  ctx.lineCap = 'round';
  ctx.lineWidth = w;
  ctx.strokeStyle = grd;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(len, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(len, 0, w * 0.44, 0, TAU);
  ctx.fillStyle = p.dualT > 0 ? '#ffe9a8' : '#f5faff';
  ctx.fill();
  ctx.lineWidth = 1.5 * invZ;
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.stroke();
  if (v.recoil > 0.35) {
    const a = (v.recoil - 0.35) / 0.95;
    ctx.globalAlpha = clamp(a, 0, 1) * 0.9;
    const flashR = w * 0.85 * (0.85 + Math.random() * 0.4);
    const flashG = ctx.createRadialGradient(len, 0, 0, len, 0, flashR);
    flashG.addColorStop(0, '#ffffff');
    flashG.addColorStop(0.5, p.dualT > 0 ? '#ffd166' : '#bfe3ff');
    flashG.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = flashG;
    ctx.beginPath();
    ctx.arc(len, 0, flashR, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawGrid(p) {
  const step = 90;
  const halfW = W / 2 / zoomLevel;
  const halfH = H / 2 / zoomLevel;
  const left = p.x - halfW, right = p.x + halfW;
  const top = p.y - halfH, bottom = p.y + halfH;
  const x0 = Math.floor(left / step) * step;
  const y0 = Math.floor(top / step) * step;
  ctx.strokeStyle = 'rgba(90,130,220,0.085)';
  ctx.lineWidth = 1 / zoomLevel;
  ctx.beginPath();
  for (let x = x0; x <= right; x += step) { ctx.moveTo(x, top); ctx.lineTo(x, bottom); }
  for (let y = y0; y <= bottom; y += step) { ctx.moveTo(left, y); ctx.lineTo(right, y); }
  ctx.stroke();
}

function drawMapBoundary() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,120,120,0.6)';
  ctx.lineWidth = 6 / zoomLevel;
  ctx.strokeRect(-MAP_HALF, -MAP_HALF, MAP_HALF * 2, MAP_HALF * 2);
  ctx.strokeStyle = 'rgba(255,100,100,0.18)';
  ctx.lineWidth = 24 / zoomLevel;
  ctx.strokeRect(-MAP_HALF, -MAP_HALF, MAP_HALF * 2, MAP_HALF * 2);
  ctx.restore();
}

function drawWalls() {
  for (const w of G.walls) {
    const a = w.life / w.maxLife;
    ctx.save();
    ctx.fillStyle = `rgba(200, 130, 255, ${0.35 * a})`;
    ctx.strokeStyle = `rgba(220, 160, 255, ${0.85 * a})`;
    ctx.lineWidth = 3 / zoomLevel;
    ctx.fillRect(w.x - w.w / 2, w.y - w.h / 2, w.w, w.h);
    ctx.strokeRect(w.x - w.w / 2, w.y - w.h / 2, w.w, w.h);
    ctx.restore();
  }
}

function drawGems() {
  for (const g of G.gems) {
    const s = 5 + Math.sin(g.pulse) * 1.4;
    ctx.beginPath();
    ctx.arc(g.x, g.y, s, 0, TAU);
    ctx.fillStyle = '#35e6ff';
    ctx.shadowColor = '#35e6ff';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawGravityFields() {
  for (const f of G.gravityFields) {
    const lifeRatio = clamp(f.life / f.max, 0, 1);
    const fade = lifeRatio < 0.35 ? lifeRatio / 0.35 : 1;
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    g.addColorStop(0, `rgba(30,20,80,${0.55 * fade})`);
    g.addColorStop(0.5, `rgba(70,110,220,${0.28 * fade})`);
    g.addColorStop(1, 'rgba(94,169,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, TAU);
    ctx.fill();
    ctx.save();
    const N = 3, turns = 3;
    for (let s = 0; s < N; s++) {
      ctx.beginPath();
      for (let t = 0; t < 1; t += 0.02) {
        const a = t * Math.PI * 2 * turns + G.time * 3 + s * (Math.PI * 2 / N);
        const rr = f.r * t;
        const px = f.x + Math.cos(a) * rr;
        const py = f.y + Math.sin(a) * rr;
        if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = `rgba(150,200,255,${0.55 * fade})`;
      ctx.lineWidth = 1.6 / zoomLevel;
      ctx.stroke();
    }
    ctx.restore();
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, TAU);
    ctx.strokeStyle = `rgba(150,210,255,${0.6 * fade})`;
    ctx.lineWidth = 2 / zoomLevel;
    ctx.stroke();
  }
}

function drawTurrets() {
  for (const t of G.turrets) {
    const lifeRatio = clamp(t.life / t.maxLife, 0, 1);
    const fade = lifeRatio < 0.25 ? lifeRatio / 0.25 : 1;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 18, 0, TAU);
    ctx.fillStyle = `rgba(30,40,60,${0.85 * fade})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(255,209,102,${0.9 * fade})`;
    ctx.lineWidth = 2 / zoomLevel;
    ctx.stroke();
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.aim);
    ctx.fillStyle = `rgba(255,209,102,${0.9 * fade})`;
    ctx.fillRect(8, -3, 16, 6);
    ctx.restore();
    ctx.beginPath();
    ctx.arc(t.x, t.y, 6, 0, TAU);
    ctx.fillStyle = `rgba(255,230,150,${0.9 * fade})`;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(t.x, t.y, 24, -Math.PI / 2, -Math.PI / 2 + TAU * lifeRatio);
    ctx.strokeStyle = `rgba(255,209,102,${0.75 * fade})`;
    ctx.lineWidth = 2.5 / zoomLevel;
    ctx.stroke();
  }
}

function drawDashTrails() {
  for (const t of G.dashTrails) {
    const a = t.life / t.max;
    const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.r);
    g.addColorStop(0, `rgba(255,110,140,${0.35 * a})`);
    g.addColorStop(0.65, `rgba(244,63,94,${0.15 * a})`);
    g.addColorStop(1, 'rgba(244,63,94,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, TAU);
    ctx.fill();
  }
}

function drawEnemies() {
  const invZ = 1 / zoomLevel;
  const frozen = G.timeStop > 0;
  for (const e of G.enemies) {
    if (e.slowT > 0) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 8, 0, TAU);
      ctx.strokeStyle = 'rgba(94,169,255,.55)';
      ctx.lineWidth = 2 / zoomLevel;
      ctx.stroke();
    }
    if (frozen) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 6, 0, TAU);
      ctx.strokeStyle = 'rgba(196,181,253,.7)';
      ctx.lineWidth = 2.5 / zoomLevel;
      ctx.stroke();
    }
    if (e.telegraphType === 'charge' && e.telegraphT > 0) {
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.chargeDir) * 400, e.y + Math.sin(e.chargeDir) * 400);
      ctx.strokeStyle = `rgba(255,60,60,${0.5 + 0.3 * Math.sin(G.time * 20)})`;
      ctx.lineWidth = 6 / zoomLevel;
      ctx.setLineDash([15 / zoomLevel, 10 / zoomLevel]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.telegraphType === 'shockwave' && e.telegraphT > 0) {
      const prog = 1 - e.telegraphT / 0.6;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 220 * prog, 0, TAU);
      ctx.strokeStyle = `rgba(200,130,255,0.7)`;
      ctx.lineWidth = 3 / zoomLevel;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 5, 0, TAU);
    ctx.fillStyle = e.color + '22';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, TAU);
    ctx.fillStyle = e.hurtT > 0 ? '#fff' : (frozen ? '#c4b5fd' : e.color);
    ctx.fill();
    ctx.lineWidth = 2 / zoomLevel;
    ctx.strokeStyle = e.hurtT > 0 ? '#fff' : 'rgba(255,255,255,.28)';
    ctx.stroke();
    if (e.ranged && e.shootCd < 0.6 && !frozen) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 10, 0, TAU);
      ctx.strokeStyle = `rgba(255,120,120,${0.65 * (1 - e.shootCd / 0.6)})`;
      ctx.lineWidth = 2 / zoomLevel;
      ctx.stroke();
    }
    if (e.type === 'boss') {
      const ch = e.bossChar || '汐';
      const fs = Math.round(e.r * 1.1) * invZ;
      ctx.font = `bold ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 4 * invZ;
      ctx.strokeStyle = 'rgba(40,10,60,.85)';
      ctx.strokeText(ch, e.x, e.y + 2 * invZ);
      ctx.fillStyle = 'rgba(255,255,255,.96)';
      ctx.fillText(ch, e.x, e.y + 2 * invZ);
      const w = e.r * 2.2, ratio = clamp(e.hp / e.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 16, w, 6);
      ctx.fillStyle = '#c084fc';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 16, w * ratio, 6);
    } else {
      const pct = Math.max(0, Math.ceil(e.hp / e.maxHp * 100));
      const fs = Math.max(10, Math.round(e.r * 0.85)) * invZ;
      ctx.font = `bold ${fs}px system-ui,sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3 * invZ;
      ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText(pct + '%', e.x, e.y + 0.5 * invZ);
      ctx.fillStyle = '#fff';
      ctx.fillText(pct + '%', e.x, e.y + 0.5 * invZ);
    }
  }
}

function drawBullets() {
  for (const b of G.bullets) {
    const isBlast = b.explodeR > 0 && b.explodeDmg > 0;
    const baseColor = b.isCrit ? '#ffe066' : (isBlast ? '#ffd9a8' : '#bfe3ff');
    ctx.shadowColor = b.isCrit ? '#ffe066' : (isBlast ? '#fb923c' : '#5ea9ff');
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = baseColor;
    ctx.fill();
    if (b.isCrit) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 2, 0, TAU);
      ctx.strokeStyle = 'rgba(255,240,120,.9)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    if (isBlast) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.55, 0, TAU);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;
}

function drawEBullets() {
  ctx.shadowColor = '#c084fc';
  ctx.shadowBlur = 12;
  for (const b of G.ebullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = b.homing ? '#f0c0ff' : '#e9b8ff';
    ctx.fill();
    if (b.homing) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 3, 0, TAU);
      ctx.strokeStyle = 'rgba(240,192,255,.7)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;
}

function drawParticles() {
  for (const q of G.particles) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawRings() {
  for (const r of G.rings) {
    const t = 1 - r.life / r.max;
    const rad = r.r + (r.maxR - r.r) * (1 - Math.pow(1 - t, 2));
    ctx.globalAlpha = clamp(1 - t, 0, 1);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = Math.max(1, r.w * (1 - t * 0.7)) / zoomLevel;
    ctx.beginPath();
    ctx.arc(r.x, r.y, rad, 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const p = G.player;
  const invZ = 1 / zoomLevel;
  const v = p.vis;
  const bobY = Math.sin(v.bob) * 0.9;

  const haloR = 54 + Math.sin(v.bob) * 2;
  const haloG = ctx.createRadialGradient(p.x, p.y + bobY, 0, p.x, p.y + bobY, haloR);
  haloG.addColorStop(0, 'rgba(90,160,255,.28)');
  haloG.addColorStop(1, 'rgba(90,160,255,0)');
  ctx.fillStyle = haloG;
  ctx.beginPath();
  ctx.arc(p.x, p.y + bobY, haloR, 0, TAU);
  ctx.fill();

  for (let i = 0; i < p.trail.length; i++) {
    const t = p.trail[i];
    const a = t.life / t.max;
    ctx.globalAlpha = a * a * 0.30;
    ctx.fillStyle = CH.color;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r * (0.55 + 0.45 * a), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawGun(p, invZ);

  if (G.timeStop > 0) {
    const auraR = p.r + 26 + Math.sin(G.time * 8) * 4;
    ctx.beginPath();
    ctx.arc(p.x, p.y, auraR, 0, TAU);
    ctx.strokeStyle = 'rgba(196,181,253,.75)';
    ctx.lineWidth = 2.5 * invZ;
    ctx.stroke();
  }
  if (p.dashT > 0) {
    const pulse = Math.sin(G.time * 22) * 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 10 + pulse, 0, TAU);
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 3 * invZ;
    ctx.stroke();
  }
  if (p.phaseT > 0) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 20 + Math.sin(G.time * 18) * 3, 0, TAU);
    ctx.strokeStyle = `rgba(255,180,220,${0.5 + 0.3 * Math.sin(G.time * 18)})`;
    ctx.lineWidth = 2.5 * invZ;
    ctx.stroke();
  }
  if (p.shieldT > 0 && p.shieldAmt > 0) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 12, 0, TAU);
    ctx.strokeStyle = `rgba(96,165,250,${0.6 + 0.3 * Math.sin(G.time * 8)})`;
    ctx.lineWidth = 3 * invZ;
    ctx.stroke();
    ctx.fillStyle = 'rgba(96,165,250,.10)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 12, 0, TAU);
    ctx.fill();
  }
  if (p.dualT > 0) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 12, 0, TAU);
    ctx.strokeStyle = 'rgba(255,209,102,.8)';
    ctx.lineWidth = 3 * invZ;
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(p.x, p.y + bobY);
  ctx.rotate(v.squashAngle);
  const sq = v.squash;
  ctx.scale(1 + 0.24 * sq, 1 - 0.20 * sq);
  ctx.rotate(-v.squashAngle);
  const wiggle = Math.sin(G.time * 14) * 0.035 * Math.min(1, sq * 1.6);
  ctx.rotate(wiggle);

  const bodyGrad = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, p.r * 0.15, 0, 0, p.r);
  bodyGrad.addColorStop(0, shade(CH.color, 0.55));
  bodyGrad.addColorStop(0.55, CH.color);
  bodyGrad.addColorStop(1, shade(CH.color, -0.30));

  ctx.beginPath();
  ctx.arc(0, 0, p.r, 0, TAU);
  ctx.fillStyle = p.hurtFlash > 0 ? '#ff8fa3' : bodyGrad;
  ctx.fill();
  ctx.lineWidth = 2.2 * invZ;
  ctx.strokeStyle = 'rgba(214,232,255,.85)';
  ctx.stroke();

  drawAnchor(0, 0, p.r * 0.55);

  ctx.beginPath();
  ctx.arc(-p.r * 0.32, -p.r * 0.36, p.r * 0.18, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fill();
  ctx.restore();

  if (stickR.active) {
    ctx.save();
    ctx.setLineDash([4 / zoomLevel, 8 / zoomLevel]);
    ctx.lineDashOffset = -G.time * 40 / zoomLevel;
    ctx.strokeStyle = 'rgba(160,210,255,.22)';
    ctx.lineWidth = 1.5 * invZ;
    ctx.beginPath();
    ctx.moveTo(p.x + Math.cos(v.angle) * (p.r * 1.8), p.y + Math.sin(v.angle) * (p.r * 1.8));
    ctx.lineTo(p.x + Math.cos(v.angle) * (p.r + 80), p.y + Math.sin(v.angle) * (p.r + 80));
    ctx.stroke();
    ctx.restore();
  }
}

function drawTexts() {
  const invZ = 1 / zoomLevel;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${14 * invZ}px system-ui, sans-serif`;
  for (const t of G.texts) {
    ctx.globalAlpha = clamp(t.life / 0.75, 0, 1);
    ctx.fillStyle = t.color;
    ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.fillStyle = '#0b0e16';
  ctx.fillRect(0, 0, W, H);
  const p = G.player;
  if (!p) return;

  ctx.save();
  ctx.translate(W / 2, H / 2);
  if (G.shake > 0) {
    const s = G.shake * 26;
    ctx.translate(rand(-s, s), rand(-s, s));
  }
  ctx.scale(zoomLevel, zoomLevel);
  ctx.translate(-p.x, -p.y);

  drawGrid(p);
  drawMapBoundary();
  drawGems();
  drawWalls();
  drawGravityFields();
  drawTurrets();
  drawDashTrails();
  drawEnemies();
  drawEBullets();
  drawBullets();
  drawParticles();
  drawRings();
  drawPlayer();
  drawTexts();

  ctx.restore();

  if (G.timeStop > 0) {
    ctx.fillStyle = `rgba(150,130,255,${0.12 + 0.05 * Math.sin(G.time * 18)})`;
    ctx.fillRect(0, 0, W, H);
    const total = G.timeStopTotal || 1;
    const ratio = clamp(G.timeStop / total, 0, 1);
    const barW = Math.min(W * 0.5, 360);
    const bx = (W - barW) / 2, by = 90;
    ctx.fillStyle = 'rgba(20,10,40,.65)';
    ctx.fillRect(bx - 2, by - 2, barW + 4, 10);
    ctx.fillStyle = '#c4b5fd';
    ctx.fillRect(bx, by, barW * ratio, 6);
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e0d9ff';
    ctx.fillText(`时停 ${G.timeStop.toFixed(2)}s`, W / 2, by - 14);
  }
  if (G.player && G.player.dashT > 0) {
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,200,210,.9)';
    ctx.fillText(`无敌 ${G.player.dashT.toFixed(2)}s`, W / 2, 90);
  }
  if (G.hurtFlash > 0) {
    ctx.fillStyle = `rgba(255,40,70,${G.hurtFlash * 0.45})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================
   流程控制
========================================================= */
function gameOver() {
  G.running = false;
  G.paused = true;
  $('#overStats').innerHTML = `${CH.name} · 存活 ${fmtTime(G.time)} · 击杀 ${G.kills} · Lv.${G.level}`;
  $('#overOv').classList.add('show');
  $('#levelOv').classList.remove('show');
}

function startGame() {
  $('#charOv').classList.remove('show');
  $('#overOv').classList.remove('show');
  $('#levelOv').classList.remove('show');
  for (const k in statCache) delete statCache[k];
  hudCache.hp = hudCache.xp = hudCache.lv = -1;
  hudCache.t = ''; hudCache.k = -1;
  resetGame();
  rebuildSkillButtons();
  updateHud();
}

/* 角色选择 UI */
(function buildCharList() {
  const list = $('#charList');
  list.innerHTML = Object.values(CHARS).map(c => {
    const activeName = c.actives[0].name;
    const passiveName = c.passive ? c.passive.name : '无';
    return `
      <div class="charCard" data-id="${c.id}" style="--c:${c.color}">
        <div class="cName">${c.name}</div>
        <div class="cTitle">${c.title}</div>
        <div class="line"><b>主动</b> ${activeName}</div>
        <div class="line p"><b>被动</b> ${passiveName}</div>
      </div>`;
  }).join('');
  list.querySelectorAll('.charCard').forEach(el => {
    el.addEventListener('pointerdown', () => {
      list.querySelectorAll('.charCard').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      CH = CHARS[el.dataset.id];
    });
  });
  const first = list.querySelector('.charCard');
  first.dispatchEvent(new PointerEvent('pointerdown'));
})();

$('#startBtn').addEventListener('click', () => { if (CH) startGame(); });
$('#retryBtn').addEventListener('click', startGame);
$('#changeCharBtn').addEventListener('click', () => {
  $('#overOv').classList.remove('show');
  $('#charOv').classList.add('show');
  G.running = false;
  G.player = null;
});

/* =========================================================
   主循环
========================================================= */
let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!G.running || !G.player) return;
  if (dt > 0.1) dt = 0.1;
  if (!G.paused) update(Math.min(dt, 0.05));
  render();
}
requestAnimationFrame(loop);
</script>
