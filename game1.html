<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规则怪谈·驭鬼者与龙王·终章</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a10;color:#dcdce6;font-family:system-ui,sans-serif;max-width:860px;margin:0 auto;padding:12px 12px 60px;}

/* ============ 音乐按钮（🎵旋转） ============ */
#musicBtn{
  position:fixed;
  top:14px;
  right:14px;
  z-index:10000;
  width:46px;
  height:46px;
  border-radius:50%;
  background:rgba(107,75,208,.85);
  color:#fff;
  font-size:20px;
  border:2px solid rgba(255,255,255,.25);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s;
  box-shadow:0 2px 12px rgba(107,75,208,.5);
  padding:0;
  margin:0;
  user-select:none;
}
#musicBtn:hover{
  background:rgba(126,92,232,1);
}
#musicBtn.playing{
  animation:musicSpin 3s linear infinite;
}
@keyframes musicSpin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

/* ============ 盒子 ============ */
.box{background:#15151f;padding:14px 16px;border-radius:10px;margin-bottom:10px;border:1px solid #2a2a3a;}
h2{color:#c99eff;font-size:18px;margin-bottom:6px;}

/* ============ 按钮 ============ */
button{padding:9px 16px;border:none;border-radius:6px;background:#6b4bd0;color:#fff;font-size:15px;margin:3px 4px 3px 0;cursor:pointer;font-family:inherit;}
button:not(#musicBtn):hover:not(:disabled){background:#7e5ce8;}
button:disabled{background:#2c2c3a;color:#6a6a7a;cursor:not-allowed;}

/* ============ 输入 ============ */
input[type=number]{width:62px;padding:6px;font-size:15px;background:#20202e;color:#fff;border:1px solid #3d3d52;border-radius:4px;text-align:center;}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;flex-wrap:wrap;}
.row label{width:60px;color:#a8a8bd;font-size:14px;}
.tip{font-size:12px;color:#7a7a92;line-height:1.6;}

/* ============ 日志 ============ */
#log{min-height:240px;max-height:460px;overflow-y:auto;line-height:1.85;font-size:14.5px;padding-right:6px;}
#log>div{margin:2px 0;}

/* ============ 颜色 ============ */
.good{color:#7dff9b;}.bad{color:#ff7a7a;}.god{color:#ffdf6e;}.epic{color:#ffb3ff;font-weight:700;}
.normal{color:#c9c9d8;}.dead{color:#ff5252;font-weight:700;}
.win{color:#3dffb0;font-weight:700;font-size:15px;}
.intel{color:#a0e5ff;}.ghost{color:#c58aff;}.partner{color:#ffb37a;}
.xu{color:#ff8ac7;font-weight:700;}.danger{color:#ff9d5c;}.blood{color:#c00020;font-weight:700;font-size:15px;}
.star{color:#ffe066;font-weight:700;}.zx{color:#ffcc44;font-weight:700;}
.story{color:#c8b8ff;}.youhe{color:#ff4444;font-weight:700;}
.rule{color:#88ffe0;font-weight:700;}.fight{color:#ffb060;font-weight:700;}
.charm{color:#ff8fd0;font-weight:700;}.old{color:#e0c8a0;}
.talent{color:#ffcc44;font-weight:700;}
.talent-god{color:#ff8fd0;font-weight:700;}

/* ============ 状态栏 ============ */
#statusBar{font-size:12.5px;color:#9aa0b5;line-height:1.9;}
#statusBar b{color:#c9c9d8;font-weight:600;}

/* ============ 选择框 ============ */
#choiceBox{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed #4a4a66;}
#choiceBox .title{color:#c9a9ff;font-size:14px;font-weight:600;margin-bottom:8px;}
.choice-btn{display:block;width:100%;text-align:left;background:#28284a;color:#dfe0ff;padding:11px 13px;margin:7px 0;border-radius:6px;font-size:14.5px;line-height:1.55;border:1px solid transparent;cursor:pointer;font-family:inherit;}
.choice-btn:disabled{opacity:.45;cursor:not-allowed;background:#1a1a26;}
.choice-btn.action{background:#1e3a2e;color:#9fffa8;border:1px solid #2e6a4a;}
.choice-btn.mainline{background:#3a1e3a;color:#ffb3ff;border:1px solid #6a3a6a;}
.choice-btn.danger{background:#3a1a1a;color:#ff8a8a;border:1px solid #6a2a2a;}

/* ============ 成就弹窗 ============ */
#achievePopup{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#4a3a7a,#2a2a4a);border:2px solid #ffe066;border-radius:10px;padding:14px 22px;box-shadow:0 0 30px rgba(255,224,102,.5);z-index:9999;display:none;color:#ffe066;font-size:15px;font-weight:700;text-align:center;animation:achPulse .5s ease;max-width:90vw;}
@keyframes achPulse{0%{transform:translateX(-50%) scale(.7);opacity:0;}100%{transform:translateX(-50%) scale(1);opacity:1;}}
#achievePopup .sub{color:#c8b8ff;font-size:12px;font-weight:400;margin-top:4px;}
#achieveCount{color:#ffe066;font-weight:700;}

/* ============ 天赋碎片 ============ */
.talent-chip{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block;}
.talent-chip.normal{background:#2a2a3a;color:#c9c9d8;border:1px solid #3a3a4a;}
.talent-chip.rare{background:#1e2a4a;color:#7db3ff;border:1px solid #2e4a7a;}
.talent-chip.epic{background:#3a1e5a;color:#c58aff;border:1px solid #5a3a8a;}
.talent-chip.god{background:#4a1e2a;color:#ffdf6e;border:1px solid #7a3a4a;box-shadow:0 0 8px rgba(255,223,110,.3);}

/* ============ 复苏度进度条 ============ */
.stat-bar{display:inline-block;width:100px;height:8px;background:#1a1a26;border-radius:4px;overflow:hidden;vertical-align:middle;margin:0 6px;}
.stat-bar>span{display:block;height:100%;transition:width .3s;}
</style>
</head>
<body>

<!-- 音乐按钮（右上角） -->
<button type="button" id="musicBtn" title="播放/暂停">🎵</button>
<audio id="bgMusic" src="music.mp3" loop preload="none"></audio>

<div id="achievePopup"></div>

<!-- 开局配置 -->
<div class="box" id="setupBox">
  <h2>👁️ 规则怪谈·驭鬼者与龙王·终章</h2>
  <p class="tip">每只鬼都有杀人规律。每一次选择都在改变你的命运。</p>
  <p class="tip" style="color:#ffe066;margin-top:6px;">🏆 已解锁成就：<span id="achieveCount">0</span>/25</p>
  <div class="row"><label>颜值</label><input type="number" id="beauty" min="0" max="10" value="0"></div>
  <div class="row"><label>智力</label><input type="number" id="intelli" min="0" max="10" value="0"></div>
  <div class="row"><label>体质</label><input type="number" id="physic" min="0" max="10" value="0"></div>
  <div class="row"><label>家境</label><input type="number" id="family" min="0" max="10" value="0"></div>
  <p style="margin:8px 0;">剩余点数：<b id="remain" style="color:#9fffa8;">20</b></p>
  <p class="tip" style="color:#c58aff;">属性影响天赋池。≥6 触发对应属性天赋；≤3 移除对应属性天赋；=10 必出对应传说天赋。</p>
  <button type="button" id="randomBtn" style="background:#3a8f6b;">🎲 随机分配20点</button>
  <button type="button" id="rollBtn">🎲 抽取3个怪谈天赋</button>
  <div id="talentShow" style="margin:8px 0;"></div>
  <button type="button" id="startBtn" disabled>🔁 开启怪谈人生</button>
</div>

<!-- 状态栏 -->
<div class="box" id="statusBox" style="display:none;">
  <div class="row" style="margin:0;">
    <span>年龄：<b id="ageText" style="color:#c99eff;">0</b> 岁</span>
    <span style="margin-left:14px;">状态：<b id="aliveText" style="color:#7dff9b;">存活</b></span>
    <span style="margin-left:14px;">流派：<b id="routeText" style="color:#7a7a92;">未定</b></span>
  </div>
  <div id="statusBar"></div>
</div>

<!-- 日志与选择 -->
<div class="box" id="mainBox" style="display:none;">
  <div id="log"></div>
  <div id="choiceBox">
    <div class="title" id="choiceTitle">⚡ 抉择</div>
    <div id="choiceList"></div>
  </div>
</div>

<!-- 按钮 -->
<div class="box" id="ctrlBox" style="display:none;display:flex;gap:8px;flex-wrap:wrap;">
  <button type="button" id="restartBtn">🔄 重新轮回</button>
  <button type="button" id="skipBtn" style="background:#444;">⏩ 跳过等待</button>
</div>

<script>

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function has(arr,v){return arr.indexOf(v)>=0;}

var SPEED=1400;
var ATTR_MAX=10, POINT_MAX=20;

/* ============================================================
   核心状态
   ============================================================ */
var S = null;

function newState(){
  return {
    /* 属性 */

  'hidden_king':{name:'万王之王',desc:'解锁隐藏成王结局'},

function loadAchieves(){try{var a=localStorage.getItem('gz_v3_achieves');if(a)return JSON.parse(a);}catch(e){}return {};}
function saveAchieves(a){try{localStorage.setItem('gz_v3_achieves',JSON.stringify(a));}catch(e){}}
var unlockedAchieves=loadAchieves();
function updateAchCount(){var el=$('achieveCount');if(el)el.textContent=String(Object.keys(unlockedAchieves).length);}
function unlockAchieve(id){
  if(unlockedAchieves[id])return;
  unlockedAchieves[id]=true;saveAchieves(unlockedAchieves);updateAchCount();
  var a=ACHIEVES[id];if(!a)return;
  var p=$('achievePopup');
  if(p){p.innerHTML='🏆 成就解锁：'+a.name+'<div class="sub">'+a.desc+'</div>';p.style.display='block';
    clearTimeout(p._t);p._t=setTimeout(function(){p.style.display='none';},3000);}
}

/* ============================================================
   日志系统
   ============================================================ */

  var d=document.createElement('div');
  if(cls)d.className=cls;
  d.textContent=t;
  var lg=$('log');
  lg.appendChild(d);
  lg.scrollTop=lg.scrollHeight;
  if(S)S.logLines++;
}
function logStory(lines,cls){
  for(var i=0;i<lines.length;i++)log('　　'+lines[i],cls||'story');
}
function logChoice(t){log('　→ '+t,'intel');}
function logTalent(t){log('　【'+t+'】','talent');}
function logAwaken(t){log('　✦ 天赋觉醒：'+t+' ✦','talent-god');}

/* ============================================================
   天赋库（60 个）
   ============================================================ */

  /* ===== 普通（8） ===== */

/* ============================================================
   天赋抽取
   ============================================================ */
function rollTalents(){
  var pool=TALENTS.slice();
  pool=pool.filter(function(t){
    if(t.tag==='physic'&&S.physic<=3)return false;
    if(t.tag==='intelli'&&S.intelli<=3)return false;
    if(t.tag==='beauty'&&S.beauty<=3)return false;
    if(t.tag==='family'&&S.family<=3)return false;
    return true;
  });
  var weighted=[];
  pool.forEach(function(t){
    var w=1;
    if(t.tag==='physic'&&S.physic>=6)w+=2;
    if(t.tag==='intelli'&&S.intelli>=6)w+=2;
    if(t.tag==='beauty'&&S.beauty>=6)w+=2;
    if(t.tag==='family'&&S.family>=6)w+=2;
    if(t.tag==='curse')w=0.5;
    for(var i=0;i<w;i++)weighted.push(t);
  });
  var picked=[];
  var chosenIds={};
  while(picked.length<3&&weighted.length>0){
    var idx=Math.floor(Math.random()*weighted.length);
    var t=weighted[idx];
    if(chosenIds[t.id]){weighted.splice(idx,1);continue;}
    chosenIds[t.id]=true;
    picked.push(t);
    weighted=weighted.filter(function(x){return x.id!==t.id;});
  }
  /* 属性=10 必出对应传说 */
  if(S.physic===10&&!picked.some(function(t){return t.rarity==='god'&&t.tag==='physic';})){
    var gods=TALENTS.filter(function(t){return t.rarity==='god'&&t.tag==='physic'&&!chosenIds[t.id];});
    if(gods.length){chosenIds[picked[0].id]=false;picked[0]=gods[0];}
  }
  if(S.intelli===10&&!picked.some(function(t){return t.rarity==='god'&&t.tag==='intelli';})){
    var gods=TALENTS.filter(function(t){return t.rarity==='god'&&t.tag==='intelli'&&!chosenIds[t.id];});
    if(gods.length){chosenIds[picked[1].id]=false;picked[1]=gods[0];}
  }
  if(S.beauty===10&&!picked.some(function(t){return t.rarity==='god'&&t.tag==='beauty';})){
    var gods=TALENTS.filter(function(t){return t.rarity==='god'&&t.tag==='beauty'&&!chosenIds[t.id];});
    if(gods.length){chosenIds[picked[2].id]=false;picked[2]=gods[0];}
  }
  return picked;
}

function renderTalents(list){
  var el=$('talentShow');
  el.innerHTML='';
  list.forEach(function(t){
    var d=document.createElement('div');
    var cls={normal:'normal',rare:'rare',epic:'epic',god:'god'}[t.rarity];
    d.style.margin='4px 0';
    var rarityName={normal:'普通',rare:'稀有',epic:'史诗',god:'传说'}[t.rarity];
    d.innerHTML='<span class="talent-chip '+cls+'">'+rarityName+'</span> <b>'+t.name+'</b>：'+t.desc;
    el.appendChild(d);
  });
}

/* ============================================================
   伙伴系统
   ============================================================ */
function getP(name){
  for(var i=0;i<S.partners.length;i++)if(S.partners[i].name===name)return S.partners[i];
  return null;
}
function alivePlayerPartners(){
  return S.partners.filter(function(p){return p.alive&&p.side==='player';});
}
function aliveXuPartners(){
  return S.partners.filter(function(p){return p.alive&&p.side==='xu';});
}
function addPartner(key,side){
  side=side||'player';
  var c=CHARS[key];if(!c)return null;
  if(getP(c.name))return null;
  var p={
    key:key,name:c.name,power:c.power,side:side,
    trust:55,alive:true,
    isGhostMaster:false,charmed:false,betrayed:false,
    joinedAt:S.age
  };
  if(side==='player'&&hasT('resonance')){
    S.partners.forEach(function(q){if(q.side==='player'&&q.alive)q.power+=5;});
  }
  if(side==='player'&&hasT('contractLord'))p.power=Math.round(p.power*1.5);
  S.partners.push(p);
  if(side==='player'&&hasT('charmer')){
    if(Math.random()<0.5){
      p.charmed=true;p.trust=100;
      log('【魅惑】'+p.name+'看着你，眼神变了。','charm');
      S.flags.charmCount=(S.flags.charmCount||0)+1;
      checkAwaken('charm1');
    }
  }
  renderStatus();
  return p;
}
function recruitCheck(c){
  var ch=35+S.beauty*2+S.intelli*2+S.family*1.5-c.diff;
  ch+=(trueIntelCount()*2);
  var mine=alivePlayerPartners().length;
  ch-=mine*3;
  if(S.flags.xuActive)ch-=6;
  if(hasT('leaderAura'))ch*=1.6;
  if(hasT('contractor'))ch*=2;
  if(hasT('network'))ch+=6;
  ch+=rnd(-20,20);
  ch=clamp(ch,3,96);
  return Math.random()*100<ch;
}

/* ============================================================
   情报系统
   ============================================================ */
function addIntel(id,text,real){
  if(!id||S.intelIds[id])return false;
  S.intelIds[id]=true;
  S.intel.push({id:id,text:text,real:!!real});
  renderStatus();

}
function hasIntel(id){return !!S.intelIds[id];}
function trueIntelCount(){
  var c=0;
  for(var i=0;i<S.intel.length;i++)if(S.intel[i].real)c++;
  return c;
}

/* ============================================================
   鬼香
   ============================================================ */
function useGhostIncense(){
  if(S.ghostIncense<=0)return false;
  var target=null;
  S.ghosts.forEach(function(g){
    if(!target||(g.revive||0)>(target.revive||0))target=g;
  });
  if(!target||(target.revive||0)<85)return false;
  S.ghostIncense--;
  target.revive=Math.max(0,target.revive-15);
  log('【鬼香】'+target.name+'的复苏度降到 '+Math.round(target.revive)+'。','good');

  renderStatus();

}

/* ============================================================
   复苏度系统（含年增长机制）
   ============================================================ */
function reviveColor(val){
  if(val<30)return '#7dff9b';
  if(val<61)return '#ffdf6e';
  if(val<86)return '#ff9d5c';
  return '#ff5252';
}
function reviveStatus(val){
  if(val<31)return '稳定';
  if(val<61)return '性情变';
  if(val<86)return '鬼性显';
  if(val<100)return '濒临';
  return '复苏';
}
function addRevive(ghost,amount){
  if(ghost._married||ghost._frozen)return;
  ghost.revive=(ghost.revive||0)+amount;
  if(ghost.revive>=100){
    ghost.revive=100;
    onGhostRevive(ghost);
  }
}
function onGhostRevive(ghost){
  if(S.flags.ferryman){
    S.flags.ferryman=false;
    log('【替死鬼】你的另一只鬼站了出来。','god');
    logStory(['它挡住了它。','它替你死了。'],'god');
    var idx=S.ghosts.indexOf(ghost);
    if(idx>=0)S.ghosts.splice(idx,1);
    return;
  }
  if(S.flags.undying){
    log('【不灭战意】你没有死。只是变得很虚弱。','god');
    applyMod({physic:-2});
    ghost.revive=85;
    return;
  }
  die('体内的【'+ghost.name+'】彻底复苏。');
}

/* 复苏度年增长（分散压制机制） */
function annualReviveGrowth(){
  var n=S.ghosts.length;
  if(n===0)return 0;
  var perGhost;
  if(n===1)perGhost=3.0;
  else if(n===2)perGhost=2.5;
  else if(n===3)perGhost=2.0;
  else if(n===4)perGhost=1.5;
  else if(n===5)perGhost=1.0;
  else if(n===6)perGhost=0.7;
  else perGhost=0.5;
  return perGhost;
}

/* 驾驭新鬼所需真情报门槛（三角数） */
function ghostIntelRequirement(){
  var n=S.ghosts.length;
  return Math.round((n+1)*(n+2)/2);
}
function canTameMoreGhosts(){
  return trueIntelCount()>=ghostIntelRequirement();
}
function previewReviveGrowth(){
  return annualReviveGrowth().toFixed(1);
}

/* ============================================================
   战力
   ============================================================ */
function ghostPowerSum(){
  var s=0;
  for(var i=0;i<S.ghosts.length;i++){
    var g=S.ghosts[i];
    var p=g.power||0;
    if(g.merged)p*=1.5;
    if(g.sleeping)p=0;
    if(g._frozen)p*=0.5;
    s+=p;
  }
  return Math.round(s);
}
function partnerPowerSum(){
  var s=0;
  for(var i=0;i<S.partners.length;i++){
    var p=S.partners[i];
    if(p.alive&&p.side==='player')s+=p.power||0;
  }
  return Math.round(s);
}
function intelPowerBonus(){
  return Math.min(20,Math.floor(trueIntelCount()/3)*2);
}
function myPower(){
  var p=S.physic*1.2+ghostPowerSum()+partnerPowerSum();
  if(hasT('dragonBlood'))p+=10;
  if(hasT('dragonTrue'))p+=20;
  if(hasT('bloodRage')&&S.physic<=3)p+=30;
  if(hasT('ancientBlood')&&trueIntelCount()>=10)p+=20;
  if(S.flags.starForm)p+=8;
  if(S.flags.xuServant)p+=5;
  if(S.flags.xuSaved)p+=8;
  p+=intelPowerBonus();
  return Math.round(p);
}
function maxGhosts(){
  var base=Math.floor(S.physic/2)+1;
  if(base>5)base=5;
  if(hasT('ghostBlood'))base+=1;
  if(hasT('ghostOverload'))base+=2;
  return base;
}

/* ============================================================
   属性增减
   ============================================================ */
function applyMod(m){
  if(!m)return;
  if(m.beauty)S.beauty=Math.max(0,S.beauty+m.beauty);
  if(m.intelli)S.intelli=Math.max(0,S.intelli+m.intelli);
  if(m.physic)S.physic=Math.max(0,S.physic+m.physic);
  if(m.family)S.family=Math.max(0,S.family+m.family);
  if(m.ren)S.ren=clamp(S.ren+m.ren,0,100);
  if(m.wei)S.wei=clamp(S.wei+m.wei,0,100);
}

/* ============================================================
   死亡
   ============================================================ */
function die(reason){
  if(!S.alive)return;
  if(S.flags.resurrect){
    S.flags.resurrect=false;
    log('【死而复生】你睁开眼睛。','god');
    var alive=S.partners.filter(function(p){return p.alive&&p.side==='player';});
    if(alive.length){
      var p=alive[Math.floor(Math.random()*alive.length)];
      p.alive=false;
      log('代价：'+p.name+'消失了。','danger');
    }
    return;
  }
  S.alive=false;
  log('【死亡】'+reason,'dead');
}

function checkAwaken(cond){

/* ============================================================
   选择系统（pointerdown 立即响应）
   ============================================================ */
function ask(choices,title){
  return new Promise(function(res){
    $('choiceBox').style.display='block';
    $('choiceTitle').textContent=title||'⚡ 抉择';
    var list=$('choiceList');
    list.innerHTML='';
    var availCount=0;
    var resolved=false;

    choices.forEach(function(c){
      if(c.cond&&!c.cond())return;
      availCount++;
      var b=document.createElement('button');
      b.type='button';
      b.className='choice-btn'+(c.cls?' '+c.cls:'');
      b.textContent='【'+availCount+'】'+c.text;
      var handler=function(e){
        if(e)e.preventDefault();
        if(resolved)return;
        resolved=true;
        $('choiceBox').style.display='none';
        logChoice(c.text);
        var ret;
        try{ret=c.effect?c.effect():null;}catch(err){console.error(err);}
        Promise.resolve(ret).then(function(){renderStatus();res();})
        .catch(function(err){console.error(err);res();});
      };
      b.onpointerdown=handler;
      list.appendChild(b);
    });

    if(!availCount){
      var b=document.createElement('button');
      b.className='choice-btn';
      b.textContent='【继续】……';
      b.onpointerdown=function(e){
        e.preventDefault();
        $('choiceBox').style.display='none';
        res();
      };
      list.appendChild(b);
    }
    try{$('choiceBox').scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
  });
}

/* ============================================================
   撞鬼系统（含双门槛 + 技能战斗）
   ============================================================ */
function runGhostEncounter(g,introText){
  return new Promise(function(res){
    log('【遭遇·'+g.name+'】','ghost');
    if(introText)logStory(introText,'ghost');
    logStory(['【提示】'+g.hint],'rule');

    /* 先知直接看规律 */
    if(hasT('prophet')&&Math.random()<0.3){
      log('【先知】你看到了它的真面目。','god');
      log('【真规律】'+g.rule,'rule');
      S.knownRules[g.name]=true;
      addIntel('i_rule_'+g.name,'【'+g.name+'】规律：'+g.rule,true);
      S.flags.guessCount=(S.flags.guessCount||0)+1;
      checkAwaken('guess1');
      return ask([
        {text:'⚔️ 与它战斗',cls:'danger',effect:function(){
          return fightGhost(g).then(function(won){ if(won)return askTame(g); });
        }},
        {text:'😨 转身就跑',effect:function(){
          if(g.kind==='normal'&&Math.random()<0.5){die(g.flee);}
          else logStory(['你按规律后退。它没有追来。'],'good');
        }}
      ],'⚡ 遭遇·'+g.name).then(function(){res();});
    }

    /* 无言天赋 */
    if(hasT('silent')&&!S.flags.silentUsed&&Math.random()<0.5){
      S.flags.silentUsed=true;
      return ask([
        {text:'👻 【无言】默默退开，它似乎没注意到你',cls:'mainline',effect:function(){
          logStory(['你退后一步。','它没有看你。','就像你从没存在过。'],'god');
          applyMod({intelli:1});
        }},
        {text:'⚔️ 与它战斗',cls:'danger',effect:function(){
          return fightGhost(g).then(function(won){ if(won)return askTame(g); });
        }},
        {text:'👁️ 观察它的规律',cls:'mainline',effect:function(){
          return buildGuessAndAsk(g);
        }}
      ],'⚡ 遭遇·'+g.name).then(function(){res();});
    }

    /* 主选项 */
    var choices=[
      {text:'👁️ 观察它的规律',cls:'mainline',effect:function(){
        return buildGuessAndAsk(g);
      }}
    ];

    if(hasT('ghostWhisper')&&g.kind==='normal'){
      choices.push({text:'💬 【鬼语者】与它对话',cls:'mainline',effect:function(){
        logStory(['你开口说了一句话。','它停住了哭。','它看着你。'],'ghost');
        S.flags.talkCount=(S.flags.talkCount||0)+1;
        checkAwaken('talk3');
        return buildGuessAndAsk(g);
      }});
    }

    if(g.kind==='normal'||g.kind==='top'||g.kind==='special'){
      choices.push({text:'⚔️ 与它战斗（战力 '+myPower()+' vs '+g.power+'）',cls:'danger',effect:function(){
        return fightGhost(g).then(function(won){ if(won)return askTame(g); });
      }});
    }
    if(g.kind==='strong'){
      choices.push({text:'⚔️ 与它战斗（不可驾驭）',cls:'danger',effect:function(){
        return fightGhost(g).then(function(won){
          if(won){
            logStory(['它认了你。','但它的规则不允许被驾驭。','你只能离开。'],'ghost');
          }
        });
      }});
    }

    choices.push({text:'😨 转身就跑',effect:function(){
      if(g.kind==='normal'){
        if(S.knownRules[g.name]){logStory(['你按规律后退。','它没有追来。'],'good');applyMod({intelli:1});}
        else if(Math.random()<0.55){die(g.flee);}
        else{logStory(['你转身就跑。它没有立刻追来。'],'bad');applyMod({physic:-1});}
      } else if(g.kind==='strong'){
        if(Math.random()<0.40){logStory(['你跑得很快。'],'good');applyMod({physic:-1});}
        else die(g.flee);
      } else {die(g.flee);}
    }});

    return ask(choices,'⚡ 遭遇·'+g.name).then(function(){res();});
  });
}

function buildGuessAndAsk(g){
  var hideCount=0;
  if(hasT('ghostEye'))hideCount++;
  if(hasT('nightEye'))hideCount++;
  if(hasT('timePerception'))hideCount+=2;
  if(hasT('mindRead'))hideCount++;

  var guess=g.guess.slice();
  if(hideCount>0){
    var wrongs=guess.filter(function(o){return !o.correct;});
    var corrects=guess.filter(function(o){return o.correct;});
    var keep=wrongs.slice(0,Math.max(1,wrongs.length-hideCount));
    guess=corrects.concat(keep);
  }
  for(var i=guess.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=guess[i];guess[i]=guess[j];guess[j]=t;
  }

  return ask(guess.map(function(opt){
    return {text:'"'+opt.text+'"',effect:function(){
      if(opt.correct){
        logStory(['—— 你说对了。'],'rule');
        S.knownRules[g.name]=true;
        addIntel('i_rule_'+g.name,'【'+g.name+'】规律：'+g.rule,true);
        log('【洞悉】你摸清了【'+g.name+'】的规律：'+g.rule,'rule');
        S.flags.guessCount=(S.flags.guessCount||0)+1;
        checkAwaken('guess1');
        if(Object.keys(S.knownRules).length>=13)unlockAchieve('know_all_rules');
        if(g.kind==='normal'||g.kind==='top'){
          return askTame(g);
        }
      } else {
        logStory(['—— 你猜错了。'],'bad');
        die(g.wrongDeath||('你违反了【'+g.name+'】的规律。'));
      }
    }};
  }),'⚡ 猜测它的规律');
}

/* ============================================================
   战斗（含技能选择 + 无鬼不能打）
   ============================================================ */
function fightGhost(g){
  return new Promise(function(res){
    /* 无鬼不能打 */
    if(S.ghosts.length===0){
      log('【战斗·无法】你体内没有鬼。','danger');
      logStory([
        '你握紧拳头。',
        '但拳头打不到它。',
        '它是鬼。',
        '你只是人。',
        '',
        '你必须先驾驭一只鬼——',
        '或者，用别的方法。'
      ],'danger');
      res(false);
      return;
    }

    var available=[];
    S.ghosts.forEach(function(gh){
      if(!gh.skill)return;
      if(gh._frozen)return;
      if(gh.sleeping)return;
      if((gh.revive||0)>=95)return;
      available.push(gh);
    });

    var mp=myPower();
    var choices=[];

    choices.push({
      text:'【硬打】战力 '+mp+' ｜ 复苏度不涨',
      effect:function(){
        return resolveFight(g,{effects:[]});
      }
    });

    available.forEach(function(gh){
      var sk=gh.skill;
      var rev=(gh.revive||0);
      var willBe=Math.round(rev+sk.revive);
      var warn=willBe>=85?' ⚠️濒临':(willBe>=61?' ⚠️鬼性显':'');
      choices.push({
        text:'【'+gh.name+'·'+sk.name+'】'+sk.desc+'（复苏 '+Math.round(rev)+' → '+willBe+warn+'）',
        cls:'mainline',
        effect:function(){
          addRevive(gh, sk.revive);
          log('【'+gh.name+'·'+sk.name+'】复苏度 +'+sk.revive,'ghost');
          logStory(['它从你体内涌出。','它站在你面前。'],'ghost');
          renderStatus();
          return resolveFight(g,{effects:[sk]});
        }
      });
    });

    choices.push({
      text:'😨 转身就跑',
      cls:'danger',
      effect:function(){
        if(g.kind==='normal'){
          if(S.knownRules[g.name]){logStory(['你按规律后退。','它没有追来。'],'good');applyMod({intelli:1});res(false);}
          else if(Math.random()<0.55){die(g.flee);res(false);}
          else{logStory(['你转身就跑。'],'bad');applyMod({physic:-1});res(false);}
        } else if(g.kind==='strong'){
          if(Math.random()<0.40){logStory(['你跑得很快。'],'good');applyMod({physic:-1});res(false);}
          else{die(g.flee);res(false);}
        } else { die(g.flee); res(false); }

  });
}

function resolveFight(g,opts){
  return new Promise(function(res){
    var myBonus=0;
    var enemyDebuff=0;
    var effects=opts.effects||[];

    var mp=myPower();
    if(hasT('warIntent'))mp=Math.round(mp*1.3);
    var ep=g.power;

    var instantWin=false,immune=false,reroll=false,reflect=false,reveal=false,silence=false;

    effects.forEach(function(sk){
      if(sk.effect==='debuff'){ ep=Math.round(ep*(1-sk.value)); }
      else if(sk.effect==='poison'){ ep=Math.round(ep*(1-sk.value)); }
      else if(sk.effect==='buff'){ mp=Math.round(mp*(1+sk.value)); }
      else if(sk.effect==='instant_win'){ instantWin=true; }
      else if(sk.effect==='immune'){ immune=true; }
      else if(sk.effect==='reroll'){ reroll=true; }
      else if(sk.effect==='reflect'){ reflect=true; }
      else if(sk.effect==='reveal'){ reveal=true; }
      else if(sk.effect==='silence'){ silence=true; }
    });

    if(reveal){
      S.knownRules[g.name]=true;
      addIntel('i_rule_'+g.name,'【'+g.name+'】规律：'+g.rule,true);
      logStory(['你看见它的规律。'],'rule');
    }

    if(instantWin){
      logStory(['你的鬼伸出力量。','它被压住了。','它不能动。'],'win');
      res(true);
      return;
    }

    if(silence){
      logStory(['它张了张嘴。','没有声音。','它不能攻击。'],'win');
      res(true);
      return;
    }

    logStory(['⚔️ 战斗开始','我方 '+mp+' ｜ 敌方 '+ep],'fight');

    var ghostCount=S.ghosts.length;
    if(ghostCount===1){
      logStory(['你的鬼从你体内出来。','它站在你面前。'],'fight');
    } else if(ghostCount<=3){
      logStory(['你的鬼群站在你面前。','它和它。'],'fight');
    } else {
      logStory(['你的鬼群铺开。','它们围住了它。'],'fight');
    }

    var win=false;
    if(mp>ep){
      logStory(['一场苦战。','最后，它低下头。'],'fight');
      win=true;
    } else if(mp===ep){
      if(Math.random()<0.5){
        logStory(['你在最后一刻压制了它。'],'fight');
        win=true;
      } else {
        logStory(['它在最后一刻反扑。'],'fight');
        if(reroll){
          logStory(['【重来】时间重置了。'],'god');
          return resolveFight(g,{effects:effects}).then(res);
        }
        if(immune){
          logStory(['【替身】纸人替你挡下了。'],'god');
          res(true);
          return;
        }
        if(reflect){
          logStory(['【反伤】镜影反弹了它的攻击。'],'god');
          res(true);
          return;
        }
        die('战斗失败。');
        res(false);
        return;
      }
    } else {
      logStory(['你冲上去。','——毫无悬念。'],'fight');
      if(immune){
        logStory(['【替身】纸人替你挡下了。'],'god');
        res(true);
        return;
      }
      if(reflect){
        logStory(['【反伤】镜影反弹了它的攻击。'],'god');
        res(true);
        return;
      }
      if(S.flags.undying){
        S.flags.undying=false;
        log('【不灭战意】你没有死。只是变得很虚弱。','god');
        applyMod({physic:-2});
        res(false);
        return;
      }
      die('战力不足，你被【'+g.name+'】碾碎。');
      res(false);
      return;
    }
    res(win);
  });
}

/* ============================================================
   驾驭（双门槛：体质 + 情报）
   ============================================================ */
function tryTame(g){
  if(S.ghosts.length>=maxGhosts()){
    log('【驭鬼·容量已满】'+S.ghosts.length+'/'+maxGhosts(),'danger');
    logStory(['你身体已经装不下了。','再多一只——','它们会打起来。'],'danger');
    return;
  }

  var needDiff=g.diff;
  if(hasT('emptyHand'))needDiff=Math.max(0,needDiff-3);
  var physicOK=S.physic>=needDiff;

  var needIntel=ghostIntelRequirement();
  var haveIntel=trueIntelCount();
  var intelOK=haveIntel>=needIntel;

  log('【驾驭条件·'+g.name+'】','rule');
  logStory([
    '　▸ 体质：'+S.physic+' / 需要 '+needDiff+(physicOK?'  ✔':'  ✘'),
    '　▸ 真情报：'+haveIntel+' / 需要 '+needIntel+(intelOK?'  ✔':'  ✘')
  ],'rule');

  if(!intelOK){
    var lack=needIntel-haveIntel;
    log('【驭鬼·失败】情报不足','danger');
    logStory(['你缺 '+lack+' 条真情报。','你不知道——','它和你体内那只，','会不会打起来。'],'danger');
    return;
  }

  if(!physicOK){
    log('【驭鬼·失败】体质不足','danger');
    logStory(['你的身体撑不住。','你下手——就是死。'],'danger');
    if(S.flags.soulAnchor){
      S.flags.soulAnchor=false;
      log('【镇魂】压住复苏！','good');
      applyMod({physic:-1});
    } else {
      die('驾驭失败，厉鬼复苏。');
    }
    return;
  }

  var copy=JSON.parse(JSON.stringify(g));
  copy.revive=0;
  if(hasT('ghostBride')&&S.ghosts.length===0){
    copy.revive=0;
    copy._married=true;
    log('【鬼新娘】它与你的命运绑定。复苏度永远为0。','god');
  }
  S.ghosts.push(copy);
  log('【驭鬼成功】驾驭【'+g.name+'】！','ghost');
  logStory(['你按住它。','它挣扎了一下。','然后——它认了你。'],'ghost');
  applyMod({physic:-1});
  checkGhostAchieve();
  checkAwaken('ghost3');
  checkAwaken('ghost5');
  renderStatus();
}

function checkGhostAchieve(){
  var cnt=S.ghosts.length;
  if(cnt>=1)unlockAchieve('first_ghost');
  if(cnt>=3)unlockAchieve('three_ghosts');
  if(cnt>=5)unlockAchieve('ghost_master');
}

      if(!danger||(g.revive||0)>(danger.revive||0))danger=g;
    }

  if(!danger)return null;
  if(Math.random()>=0.40)return null;

}

function addControlButtons(){
  var ctrl=$('ctrlBox');
  if(!ctrl||$('deduceBtn'))return;

  function mkBtn(id,txt,bg,fn){
    var b=document.createElement('button');
    b.id=id;
    b.textContent=txt;
    b.style.background=bg;
    b.onpointerdown=function(e){
      e.preventDefault();
      fn();
    };
    ctrl.appendChild(b);
  }

  mkBtn('deduceBtn','📖 推演','#3a4a8f',function(){
    if(S.running&&S.alive&&!S.ended)showDeductionPanel();
    else log('【推演】现在不是推演的时候。','tip');
  });
  mkBtn('balanceBtn','⚖️ 平衡法','#3a6a4a',function(){
    if(S.routesUnlocked.balance)activateBalanceRoute();
    else log('【平衡法】未解锁。','danger');
  });
  mkBtn('freezeBtn','❄️ 死机法','#3a4a6a',function(){
    if(S.routesUnlocked.freeze)activateFreezeRoute();
    else log('【死机法】未解锁。','danger');
  });
  mkBtn('heteroBtn','👻 异类法','#6a3a6a',function(){
    if(S.routesUnlocked.hetero)activateHeteroRoute();
    else log('【异类法】未解锁。','danger');
  });
}

/* ============================================================
   天赋觉醒检查
   ============================================================ */
function triggerAwakenCheck(){
  S.talents.forEach(function(t){
    if(!t.awaken||t._awakened)return;
    var cond=t.awaken.cond;
    if(cond==='ghost3'&&S.ghosts.length>=3)checkAwaken('ghost3');
    if(cond==='ghost5'&&S.ghosts.length>=5)checkAwaken('ghost5');
    if(cond==='physic8'&&S.physic>=8)checkAwaken('physic8');
    if(cond==='partner5'&&alivePlayerPartners().length>=5)checkAwaken('partner5');
    if(cond==='talk3'&&S.flags.talkCount>=3)checkAwaken('talk3');
    if(cond==='feed5'&&S.flags.feedCount>=5)checkAwaken('feed5');
    if(cond==='language5'&&S.flags.languageCount>=5)checkAwaken('language5');
    if(cond==='charm1'&&S.flags.charmCount>=1)checkAwaken('charm1');
    if(cond==='guess1'&&S.flags.guessCount>=1)checkAwaken('guess1');
    if(cond==='i_bg_dragon'&&hasIntel('i_bg_dragon'))checkAwaken('i_bg_dragon');
  });
}

/* ============================================================
   MAINLINE 节点表 + 主循环
   ============================================================ */
var MAINLINE={};

function sleep(ms){
  return new Promise(function(r){setTimeout(r,S.skip?30:ms);});
}

function gameLoop(){
  addControlButtons();
  return new Promise(function(res){
    S.running=true;

    function step(){
      if(!S.alive||S.ended||S.age>=120){res();return;}
      S.age++;
      renderStatus();
      triggerAwakenCheck();

      /* 主线节点 */
      if(MAINLINE[S.age]){
        var node=MAINLINE[S.age];
        if(node.cond&&!node.cond()){
          return afterYear(step);
        }
        log('══════ 年龄 '+S.age+' ══════','epic');
        return Promise.resolve(node.run()).then(function(){
          if(!S.alive||S.ended){res();return;}
          return afterYear(step);
        });
      }

      /* 日常 */
      log('【'+S.age+'岁】','tip');

      /* 年龄限制撞鬼 */
      var ghostChance=0;
      if(S.age<13)ghostChance=0;
      else if(S.age<18)ghostChance=0.10;
      else if(S.age<31)ghostChance=0.40;
      else ghostChance=0.35;

      if(S.age>=13&&Math.random()<ghostChance&&S.ghosts.length<maxGhosts()+1){
        return randomGhostEvent().then(function(){
          if(!S.alive||S.ended){res();return;}
          return afterYear(step);
        });
      } else {
        var dailyEvents=[
          function(){logStory(['这一年平平安安，什么都没有发生。','天空很蓝。','你什么都没做。'],'good');},
          function(){
            if(S.ghosts.length===0){
              logStory(['这一年平平安安，什么都没有发生。'],'good');
            } else {
              applyMod({physic:1});
              logStory(['你练习了驭鬼。','你和鬼对话。','它没有回答。','但它听懂了。'],'ghost');
            }
          },
          function(){applyMod({intelli:1});logStory(['你翻看旧书。','你看到一句话：','"规则比善意更保命。"'],'intel');},
          function(){applyMod({beauty:1});logStory(['你走在街上。','有人看了你一眼。','你不认识他。','但他记住了你。'],'normal');},
          function(){
            if(Math.random()<0.15){
              addIntel('i_random_'+S.age,'你获得了一条碎片。',true);
              logStory(['你发现了一张纸片。','上面写着一些东西。','你看不懂。','但你记住了。'],'intel');
            } else {
              logStory(['这一年很平静。'],'normal');
            }
          }
        ];
        var ev=dailyEvents[ri(0,dailyEvents.length-1)];
        ev();
        return afterYear(step);
      }
    }

    function afterYear(step){
      if(!S.alive||S.ended){res();return;}
      var ret=checkGhostIncense();
      return Promise.resolve(ret).then(function(){
        if(!S.alive||S.ended){res();return;}

        /* 复苏度年增长（分散压制） */
        var growth=annualReviveGrowth();
        S.ghosts.forEach(function(g){
          if(g._married||g._frozen)return;
          var actual=growth;
          if(S.activeRoute==='balance')actual*=0.5;
          if(S.flags.yinAwaken)actual*=0.8;
          if(hasT('ghostOverload'))actual*=1.1;
          g.revive=Math.min(100,(g.revive||0)+actual);
          if(g.revive>=100)onGhostRevive(g);
        });
        if(!S.alive||S.ended){res();return;}

        /* 鬼性事件 */
        var gn=triggerGhostNatureEvent();
        return Promise.resolve(gn).then(function(){
          if(!S.alive||S.ended){res();return;}

          /* 异类法鬼性增长 */
          if(S.activeRoute==='hetero'){
            S.ghostNature+=5;
            if(S.ghostNature>=100){log('【异类·终末】你已经不是你了。','blood');die('你变成了鬼。');res();return;}
            if(S.ghostNature>=80)logStory(['你不知道你是谁了。'],'ghost');
            else if(S.ghostNature>=60)logStory(['你开始忘事。'],'ghost');
          }

          /* 时间之外/龙血：每年+3鬼性 */
          if(hasT('beyondTime')){
            S.ghostNature+=3;
            if(S.ghostNature>=100){die('你在漫长的岁月中失去了自己。');res();return;}
          }
          if(hasT('dragonTrue')){
            S.ghostNature+=3;
            if(S.ghostNature>=100){die('龙血吞噬了你的意识。');res();return;}
          }

          /* 老死 */
          if(S.age>=80&&(hasT('beyondTime')||hasT('dragonTrue'))){
            /* 不触发老死 */
          } else if(S.age>90&&Math.random()<0.08){
            logStory(['你在睡梦中安然离世。'],'old');
            S.alive=false;
            res();
            return;
          }

          renderStatus();
          return sleep(SPEED).then(step);
        });
      });
    }

    step();
  }).then(function(){
    S.running=false;
    if(!S.alive&&!S.ended)log('【结局】你的轮回就此终结。','dead');
  });
}
window.gameLoop=gameLoop;

/* ============================================================
   鬼香检查
   ============================================================ */
function checkGhostIncense(){
  if(S.ghostIncense<=0)return null;
  var danger=null;
  S.ghosts.forEach(function(g){
    if((g.revive||0)>=85&&!g._married&&!g._frozen)danger=g;
  });
  if(!danger)return null;
  return ask([
    {text:'【使用鬼香】'+danger.name+'复苏度 '+Math.round(danger.revive)+' → '+Math.round(danger.revive-15),cls:'mainline',effect:function(){
      useGhostIncense();
    }},
    {text:'【不用】继续冒风险',effect:function(){
      log('你决定不使用鬼香。','danger');
    }},
    {text:'【放弃它】主动放弃这只鬼，永久失去',cls:'danger',effect:function(){
      var idx=S.ghosts.indexOf(danger);
      if(idx>=0)S.ghosts.splice(idx,1);
      log('【放弃】'+danger.name+'消散了。','danger');
      logStory(['你手背上的纹路淡了。','你身体里的哭声停了。'],'danger');
      applyMod({ren:-5});
      renderStatus();
    }}
  ],'⚡ 危机：'+danger.name+'濒临复苏');
}

/* ============================================================
   随机鬼遭遇
   ============================================================ */
function randomGhostEvent(){
  var candidates=GHOSTS.filter(function(g){
    if(g.kind==='strong')return Math.random()<0.3;
    if(g.kind==='special')return Math.random()<0.2;
    if(g.kind==='top')return Math.random()<0.1;
    return true;
  });
  var g=candidates[ri(0,candidates.length-1)];
  return runGhostEncounter(g);
}

/* ============================================================
   启动绑定
   ============================================================ */
S=newState();

function enforce(){
  var inputs=[$('beauty'),$('intelli'),$('physic'),$('family')];
  var v=inputs.map(function(el){var n=parseInt(el.value,10);if(isNaN(n)||n<0)n=0;if(n>ATTR_MAX)n=ATTR_MAX;return n;});
  var total=v[0]+v[1]+v[2]+v[3];
  while(total>POINT_MAX){
    var mi=0;
    for(var i=1;i<4;i++)if(v[i]>v[mi])mi=i;
    v[mi]--;total--;
  }
  inputs.forEach(function(el,i){el.value=String(v[i]);});
  $('remain').textContent=String(POINT_MAX-v[0]-v[1]-v[2]-v[3]);
}

$('randomBtn').onpointerdown=function(e){
  e.preventDefault();
  if(S.running)return;
  var v=[0,0,0,0],remain=POINT_MAX;
  while(remain>0){var i=ri(0,3);if(v[i]<ATTR_MAX){v[i]++;remain--;}}
  $('beauty').value=v[0];$('intelli').value=v[1];
  $('physic').value=v[2];$('family').value=v[3];
  enforce();
};

['beauty','intelli','physic','family'].forEach(function(id){
  var el=$(id);
  ['input','change','keyup','blur'].forEach(function(ev){el.addEventListener(ev,enforce);});
});

$('rollBtn').onpointerdown=function(e){
  e.preventDefault();
  if(S.running)return;
  enforce();
  S.beauty=parseInt($('beauty').value,10)||0;
  S.intelli=parseInt($('intelli').value,10)||0;
  S.physic=parseInt($('physic').value,10)||0;
  S.family=parseInt($('family').value,10)||0;
  var picked=rollTalents();
  S.talents=picked;
  S.talentIds={};
  picked.forEach(function(t){S.talentIds[t.id]=true;});
  renderTalents(picked);
  $('startBtn').disabled=false;
};

$('startBtn').onpointerdown=function(e){
  e.preventDefault();
  if($('startBtn').disabled)return;
  var talents=S.talents;
  S=newState();
  S.talents=talents;
  S.talentIds={};
  talents.forEach(function(t){S.talentIds[t.id]=true;});
  S.beauty=parseInt($('beauty').value,10)||0;
  S.intelli=parseInt($('intelli').value,10)||0;
  S.physic=parseInt($('physic').value,10)||0;
  S.family=parseInt($('family').value,10)||0;
  talents.forEach(function(t){if(t.effect)t.effect();});

  $('setupBox').style.display='none';
  $('statusBox').style.display='block';
  $('mainBox').style.display='block';
  $('ctrlBox').style.display='flex';

  renderStatus();
  log('══════ 轮回开始 ══════','epic');
  log('欢迎来到规则怪谈世界。','tip');
  log('　属性影响天赋池：属性≥6 触发对应属性天赋，属性=10 必出传说天赋。','tip');
  log('　驾驭鬼需要双门槛：体质 ≥ 鬼的难度 + 真情报 ≥ 门槛。','tip');
  log('　真情报门槛随已驾驭鬼数增加：第1只0，第2只3，第3只7……','tip');
  log('　鬼越多，复苏越慢（分散压制）——但驾驭更多鬼需要更多情报。','tip');

  setTimeout(addControlButtons,100);
  gameLoop();
};

$('restartBtn').onpointerdown=function(e){
  e.preventDefault();
  location.reload();
};

$('skipBtn').onpointerdown=function(e){
  e.preventDefault();
  S.skip=!S.skip;
  $('skipBtn').textContent=S.skip?'⏩ 恢复等待':'⏩ 跳过等待';
};

enforce();
updateAchCount();

var _origGameLoop=gameLoop;
gameLoop=function(){
  addControlButtons();
  return new Promise(function(res){
    S.running=true;

    function step(){
      if(!S.alive||S.ended||S.age>=120){res();return;}
      S.age++;
      renderStatus();
      triggerAwakenCheck();

      /* 主线节点 */
      if(MAINLINE[S.age]){
        var node=MAINLINE[S.age];
        if(node.cond&&!node.cond()){
          return afterYear(step);
        }
        log('══════ 年龄 '+S.age+' ══════','epic');
        return Promise.resolve(node.run()).then(function(){
          if(!S.alive||S.ended){res();return;}
          return afterYear(step);
        });
      }

      /* ★ 回忆事件检查（在主线之后、日常之前） */
      var memKey=null;
      if(MEMORY_EVENTS[S.age]&&!S.flags['mem_'+S.age]){
        memKey=S.age;
      }
      if(memKey!==null){
        S.flags['mem_'+memKey]=true;
        return Promise.resolve(MEMORY_EVENTS[memKey]()).then(function(){
          if(!S.alive||S.ended){res();return;}
          return afterYear(step);
        });
      }

      /* 日常 */
      log('【'+S.age+'岁】','tip');
      var ghostChance=0;
      if(S.age<13)ghostChance=0;
      else if(S.age<18)ghostChance=0.10;
      else if(S.age<31)ghostChance=0.40;
      else ghostChance=0.35;

      if(S.age>=13&&Math.random()<ghostChance&&S.ghosts.length<maxGhosts()+1){
        return randomGhostEvent().then(function(){
          if(!S.alive||S.ended){res();return;}
          return afterYear(step);
        });
      } else {
        var dailyEvents=[
          function(){logStory(['这一年平平安安，什么都没有发生。','天空很蓝。','你什么都没做。'],'good');},
          function(){
            if(S.ghosts.length===0){logStory(['这一年平平安安，什么都没有发生。'],'good');}
            else{applyMod({physic:1});logStory(['你练习了驭鬼。','你和鬼对话。','它没有回答。','但它听懂了。'],'ghost');}
          },
          function(){applyMod({intelli:1});logStory(['你翻看旧书。','你看到一句话：','"规则比善意更保命。"'],'intel');},
          function(){applyMod({beauty:1});logStory(['你走在街上。','有人看了你一眼。','你不认识他。','但他记住了你。'],'normal');},
          function(){
            if(Math.random()<0.15){
              addIntel('i_random_'+S.age,'你获得了一条碎片。',true);
              logStory(['你发现了一张纸片。','上面写着一些东西。','你看不懂。','但你记住了。'],'intel');
            } else {
              logStory(['这一年很平静。'],'normal');
            }
          }
        ];
        var ev=dailyEvents[ri(0,dailyEvents.length-1)];
        ev();
        return afterYear(step);
      }
    }

    function afterYear(step){
      if(!S.alive||S.ended){res();return;}
      var ret=checkGhostIncense();
      return Promise.resolve(ret).then(function(){
        if(!S.alive||S.ended){res();return;}

        var growth=annualReviveGrowth();
        S.ghosts.forEach(function(g){
          if(g._married||g._frozen)return;
          var actual=growth;
          if(S.activeRoute==='balance')actual*=0.5;
          if(S.flags.yinAwaken)actual*=0.8;
          if(hasT('ghostOverload'))actual*=1.1;
          g.revive=Math.min(100,(g.revive||0)+actual);
          if(g.revive>=100)onGhostRevive(g);
        });
        if(!S.alive||S.ended){res();return;}

        var gn=triggerGhostNatureEvent();
        return Promise.resolve(gn).then(function(){
          if(!S.alive||S.ended){res();return;}

          if(S.activeRoute==='hetero'){
            S.ghostNature+=5;
            if(S.ghostNature>=100){log('【异类·终末】你已经不是你了。','blood');die('你变成了鬼。');res();return;}
            if(S.ghostNature>=80)logStory(['你不知道你是谁了。'],'ghost');
            else if(S.ghostNature>=60)logStory(['你开始忘事。'],'ghost');
          }

          if(hasT('beyondTime')){
            S.ghostNature+=3;
            if(S.ghostNature>=100){die('你在漫长的岁月中失去了自己。');res();return;}
          }
          if(hasT('dragonTrue')){
            S.ghostNature+=3;
            if(S.ghostNature>=100){die('龙血吞噬了你的意识。');res();return;}
          }

          if(S.age>=80&&(hasT('beyondTime')||hasT('dragonTrue'))){
            /* 不触发老死 */
          } else if(S.age>90&&Math.random()<0.08){
            logStory(['你在睡梦中安然离世。'],'old');
            S.alive=false;
            res();
            return;
          }

          renderStatus();
          return sleep(SPEED).then(step);
        });
      });
    }

    step();
  }).then(function(){
    S.running=false;
    if(!S.alive&&!S.ended)log('【结局】你的轮回就此终结。','dead');
  });
};

window.MEMORY_EVENTS=MEMORY_EVENTS;

function worldScene(){
  var d=S.world.ghostDensity;
  var p=S.world.peopleCount;
  var seal=S.world.sealState;

  /* 极暗 */
  if(d>=90||p<=10){
    var scenes=[
      '街上没有人。',
      '只有鬼。',
      '和鬼的影子。',
      '你走在路上。',
      '脚步声很响。',
      '因为除了你——',
      '没有人走路。'
    ];
    return scenes;
  }

  /* 混乱 */
  if(d>=60||p<=40){
    var scenes=[
      '街上人很少。',
      '每一扇窗都关着。',
      '偶尔有一声哭——',
      '但没有人在哭。',
      '你经过一家店。',
      '门开着。',
      '但里面没有人。'
    ];
    return scenes;
  }

  /* 紧张 */
  if(d>=30||p<=70){
    var scenes=[
      '街上还有人。',
      '但他们走得很快。',
      '没有人抬头看天。',
      '你经过巷口。',
      '巷子里很黑。',
      '但你没有停下。'
    ];
    return scenes;
  }

  /* 太平 */
  var scenes=[
    '街道上人来人往。',
    '孩子在巷子里追逐。',
    '一切都像没发生过。'
  ];

  if(seal==='broken'){
    scenes=[
      '街道上还有人。',
      '但比以前少了。',
      '封印破碎之后——',
      '鬼变多了。',
      '人变少了。'
    ];
  } else if(seal==='you'){
    scenes=[
      '街道上人来人往。',
      '孩子在巷子里追逐。',
      '没有人知道——',
      '有人在教室里坐着。',
      '替他们挡着鬼。'
    ];
  }

  return scenes;
}

/* ============================================================
   世界状态变化（每年结算时）
   ============================================================ */
function updateWorld(){
  /* 封印状态自然漂移 */
  if(S.world.sealState==='intact'){
    S.world.ghostDensity=Math.max(0,S.world.ghostDensity-1);
    S.world.peopleCount=Math.min(100,S.world.peopleCount+1);
  } else if(S.world.sealState==='broken'){
    S.world.ghostDensity=Math.min(100,S.world.ghostDensity+3);
    S.world.peopleCount=Math.max(0,S.world.peopleCount-2);
  } else if(S.world.sealState==='you'){
    S.world.ghostDensity=Math.max(0,S.world.ghostDensity-3);
    S.world.peopleCount=Math.min(100,S.world.peopleCount+2);
  }

  /* 你驾驭鬼太多 → 鬼密度略升 */
  if(S.ghosts.length>=4){
    S.world.ghostDensity=Math.min(100,S.world.ghostDensity+1);
  }

  /* 许云汐被杀 → 人少一点 */
  if(S.memories.xuKilled){
    S.world.peopleCount=Math.max(0,S.world.peopleCount-1);
  }

  /* 陆建成死 → 鬼密度+5 */
  if(S.memories.luBiaoDead){
    S.world.ghostDensity=Math.min(100,S.world.ghostDensity+1);
  }
}

/* ============================================================
   主循环 · 每年插入世界描写 + 世界状态更新
   ============================================================ */
var _gameLoop_world=gameLoop;
gameLoop=function(){
  addControlButtons();
  return new Promise(function(res){
    S.running=true;

    function step(){
      if(!S.alive||S.ended||S.age>=120){res();return;}
      S.age++;
      renderStatus();
      triggerAwakenCheck();

      /* 主线节点 */
      if(MAINLINE[S.age]){
        var node=MAINLINE[S.age];
        if(node.cond&&!node.cond()){
          return afterYear(step);
        }
        log('══════ 年龄 '+S.age+' ══════','epic');
        return Promise.resolve(node.run()).then(function(){
          if(!S.alive||S.ended){res();return;}
          return afterYear(step);
        });
      }

      /* 回忆事件 */
      var memKey=null;
      if(MEMORY_EVENTS[S.age]&&!S.flags['mem_'+S.age]){
        memKey=S.age;
      }
      if(memKey!==null){
        S.flags['mem_'+memKey]=true;
        return Promise.resolve(MEMORY_EVENTS[memKey]()).then(function(){
          if(!S.alive||S.ended){res();return;}
          return afterYear(step);
        });
      }

      /* 日常 */
      log('【'+S.age+'岁】','tip');

      /* 世界描写 */
      var scenes=worldScene();
      logStory(scenes,'story');

      var ghostChance=0;
      if(S.age<13)ghostChance=0;
      else if(S.age<18)ghostChance=0.10;
      else if(S.age<31)ghostChance=0.40;
      else ghostChance=0.35;

      /* 世界鬼密度影响撞鬼率 */
      if(S.world.ghostDensity>=60)ghostChance+=0.15;
      else if(S.world.ghostDensity<=20)ghostChance-=0.10;
      ghostChance=Math.max(0,Math.min(0.7,ghostChance));

      if(S.age>=13&&Math.random()<ghostChance&&S.ghosts.length<maxGhosts()+1){
        return randomGhostEvent().then(function(){
          if(!S.alive||S.ended){res();return;}
          return afterYear(step);
        });
      } else {
        /* 世界状态影响日常事件 */
        var dailyEvents=[];

        if(S.world.ghostDensity>=60){
          /* 混乱世界：日常变成"活下来" */
          dailyEvents=[
            function(){logStory(['你躲在屋里。','窗外有声音。','你没有出去。'],'danger');},
            function(){applyMod({physic:1});logStory(['你在废墟里练拳。','没有人看你。','也没有人管你。'],'ghost');},
            function(){applyMod({intelli:1});logStory(['你翻看一本烧了一半的书。','上面写着：','"规则比善意更保命。"'],'intel');},
            function(){logStory(['你数了数街上的人。','比去年少了。'],'old');}
          ];
        } else if(S.world.peopleCount<=40){
          /* 人少世界：孤独 */
          dailyEvents=[
            function(){logStory(['你走在空荡荡的街上。','没有人。'],'old');},
            function(){applyMod({intelli:1});logStory(['你写了一封信。','但不知道寄给谁。'],'intel');},
            function(){logStory(['你经过一所学校。','门关着。','里面没有声音。'],'story');},
            function(){applyMod({beauty:1});logStory(['你照了照镜子。','自己还是自己。'],'normal');}
          ];
        } else {
          /* 正常世界 */
          dailyEvents=[
            function(){logStory(['这一年平平安安，什么都没有发生。','天空很蓝。','你什么都没做。'],'good');},
            function(){
              if(S.ghosts.length===0){logStory(['这一年平平安安。'],'good');}
              else{applyMod({physic:1});logStory(['你练习了驭鬼。','你和鬼对话。','它没有回答。','但它听懂了。'],'ghost');}
            },
            function(){applyMod({intelli:1});logStory(['你翻看旧书。','你看到一句话：','"规则比善意更保命。"'],'intel');},
            function(){applyMod({beauty:1});logStory(['你走在街上。','有人看了你一眼。','他不认识你。','但他记住了你。'],'normal');},
            function(){
              if(Math.random()<0.15){
                addIntel('i_random_'+S.age,'你获得了一条碎片。',true);
                logStory(['你发现了一张纸片。','上面写着一些东西。','你看不懂。','但你记住了。'],'intel');
              } else {
                logStory(['这一年很平静。'],'normal');
              }
            }
          ];
        }

        var ev=dailyEvents[ri(0,dailyEvents.length-1)];
        ev();
        return afterYear(step);
      }
    }

    function afterYear(step){
      if(!S.alive||S.ended){res();return;}
      var ret=checkGhostIncense();
      return Promise.resolve(ret).then(function(){
        if(!S.alive||S.ended){res();return;}

        /* 复苏年增长 */
        var growth=annualReviveGrowth();
        S.ghosts.forEach(function(g){
          if(g._married||g._frozen)return;
          var actual=growth;
          if(S.activeRoute==='balance')actual*=0.5;
          if(S.flags.yinAwaken)actual*=0.8;
          if(hasT('ghostOverload'))actual*=1.1;
          g.revive=Math.min(100,(g.revive||0)+actual);
          if(g.revive>=100)onGhostRevive(g);
        });
        if(!S.alive||S.ended){res();return;}

        /* 鬼性事件 */
        var gn=triggerGhostNatureEvent();
        return Promise.resolve(gn).then(function(){
          if(!S.alive||S.ended){res();return;}

          /* 异类法 */
          if(S.activeRoute==='hetero'){
            S.ghostNature+=5;
            if(S.ghostNature>=100){log('【异类·终末】你已经不是你了。','blood');die('你变成了鬼。');res();return;}
          }
          if(hasT('beyondTime')||hasT('dragonTrue')){
            S.ghostNature+=3;
            if(S.ghostNature>=100){die('你在漫长的岁月中失去了自己。');res();return;}
          }

          /* 世界状态更新 */
          updateWorld();

          /* 老死 */
          if(S.age>=80&&(hasT('beyondTime')||hasT('dragonTrue'))){
            /* 不触发老死 */
          } else if(S.age>90&&Math.random()<0.08){
            logStory(['你在睡梦中安然离世。'],'old');
            S.alive=false;
            res();
            return;
          }

          renderStatus();
          return sleep(SPEED).then(step);
        });
      });
    }

    step();
  }).then(function(){
    S.running=false;
    if(!S.alive&&!S.ended)log('【结局】你的轮回就此终结。','dead');
  });
};
window.gameLoop=gameLoop;

          logStory(['你把所有的情报整理成册。','你把所有的鬼托付给伙伴。','你把所有的故事——写了下来。'],'good');
          logStory(['那一夜——你睡得很安稳。','第二天，你没有醒来。'],'good');
          logStory(['你的葬礼上——那些伙伴都来了。','他们把你的骨灰撒在海南中心校的操场上。'],'partner');
          logStory(['从那天起——这座城市再也没有出现过鬼。'],'win');
          unlockAchieve('old_family');
          S.ending='天伦之乐';
          S.ended=true;
        }},
        {text:'一个人安静地走',effect:function(){
          logStory(['你没有告诉任何人。','你一个人走完了最后的日子。'],'old');
          unlockAchieve('old_alone');
          S.ending='孤影成灰';
          S.ended=true;
        }}
      ]).then(res);
    }

    /* 世界混乱版 */
    if(d>=60||p<=40){
      logStory(['你七十五岁。','街上没有人。','只有鬼。'],'danger');
      if(S.world.sealState==='broken'){
        logStory(['你打破了封印。','你释放了它们。','现在——','它们在每一个角落。'],'blood');
      }
      logStory(['你的身边——只剩下 '+aliveP.length+' 个人。'],'danger');
      return ask([
        {text:'再去看看这座城市',cls:'action',effect:function(){
          logStory(['你走出门。','街上很安静。','但你听得见鬼的脚步声。'],'danger');
          if(S.memories.brokeSeal){
            logStory(['你想起三十二岁那年。','你抬起手。','你攻击了它。','它散了。'],'blood');
            logStory(['你不知道当时对不对。','现在也不知道。'],'danger');
          }
          logStory(['你回到家。','坐在窗前。','很久。'],'old');
          logStory(['第二天——','你没有醒来。'],'old');
          S.ending='世界的废墟';
          S.ended=true;
        }},
        {text:'去三班看看',effect:function(){
          logStory(['你走进海南中心校。','三班的门开着。'],'danger');
          if(S.world.sealState==='broken'){
            logStory(['里面什么都没有。','连鬼都没有。','它们都出去了。'],'blood');
          } else if(S.world.sealState==='intact'){
            logStory(['你走进教室。','最后一排靠窗的位置——','坐着一个人。','是教室鬼。'],'ghost');
            logStory(['它还在写作业。','它没有看你。','它一直在写。'],'ghost');
          } else if(S.world.sealState==='you'){
            logStory(['你走进教室。','最后一排靠窗的位置——','坐着一个人。','是你。'],'blood');
            logStory(['你走过去。','你坐下。','你和他融为一体。'],'win');
            logStory(['从这一天起——','三班又有了新的封印。'],'win');
          }
          logStory(['第二天——','你没有醒来。'],'old');
          S.ending='封印的守夜人';
          S.ended=true;
        }}
      ]).then(res);
    }

    /* 普通版 */
    logStory(['你七十五岁。'],'old');
    logStory(['你的身边——还围着 '+aliveP.length+' 个人。'],'normal');
    return ask([
      {text:'把一切交给后人',cls:'action',effect:function(){
        logStory(['你把所有的情报整理成册。','你把所有的故事——写了下来。'],'good');
        logStory(['那一夜——你睡得很安稳。','第二天，你没有醒来。'],'good');
        logStory(['你的葬礼上——那些伙伴都来了。'],'partner');
        unlockAchieve('old_family');
        S.ending='天伦之乐';
        S.ended=true;
      }},
      {text:'一个人安静地走',effect:function(){
        logStory(['你一个人走完了最后的日子。'],'old');
        unlockAchieve('old_alone');
        S.ending='孤影成灰';
        S.ended=true;
      }}
    ]).then(res);
  });
};

/* ============================================================
   结局后日谈（引用选择记忆 + 世界状态）
   ============================================================ */
function endingAftermath(ending){
  var lines=[];
  var d=S.world.ghostDensity;
  var p=S.world.peopleCount;

  /* 世界状态 */
  if(d<30&&p>70){
    lines.push('你死后，世界太平。');
    lines.push('没有人知道——');
    lines.push('曾经有人替他们挡过什么。');
  } else if(d>=60||p<=40){
    lines.push('你死后，世界很安静。');
    lines.push('安静得——');
    lines.push('像没有人住。');
  } else {
    lines.push('你死后，世界还是那样。');
    lines.push('有些人活着。');
    lines.push('有些人走了。');
  }

  /* 选择记忆 */
  if(S.memories.savedLuBiao&&!S.memories.killedLuBiao){
    lines.push('');
    lines.push('陆标还活着。');
    lines.push('他每年都来你墓前。');
    lines.push('他会说一句话：');
    lines.push('"哥，我来了。"');
  }
  if(S.memories.killedLuBiao){
    lines.push('');
    lines.push('陆标死了。');
    lines.push('死在你的手里。');
    lines.push('没有人给他上坟。');
  }
  if(S.memories.xuKilled){
    lines.push('');
    lines.push('许云汐死了。');
    lines.push('死在你手里。');
    lines.push('没有人知道她叫什么。');
  }
  if(S.memories.xuSaved){
    lines.push('');
    lines.push('许云汐活着。');
    lines.push('她每年都来。');
    lines.push('她会带一束花。');
    lines.push('然后说：');
    lines.push('"谢谢你没有杀我。"');
  }
  if(S.memories.xuLetGo&&!S.memories.xuSaved){
    lines.push('');
    lines.push('许云汐还活着。');
    lines.push('她每天都从你门口路过。');
    lines.push('但她从来没有敲过门。');
  }
  if(S.memories.brokeSeal){
    lines.push('');
    lines.push('三班的封印是你打破的。');
    lines.push('从那以后，鬼越来越多。');
    lines.push('有人恨你。');
    lines.push('有人感谢你。');
  }
  if(S.memories.keptSeal){
    lines.push('');
    lines.push('三班的封印是你守住的。');
    lines.push('代价是你母亲的命。');
    lines.push('你活了一辈子。');
    lines.push('但从来没有安心过。');
  }
  if(S.memories.becameSeal){
    lines.push('');
    lines.push('你成为了新的封印。');
    lines.push('你还在。');
    lines.push('但你不再是你。');
  }

  return lines;
}

/* 在结局被设置时自动输出后日谈 */
var _origEndCheck=null;
function wrapEnding(){
  /* 覆盖 console 输出，在 S.ended 变化时输出后日谈 */
  var checkInterval=setInterval(function(){
    if(S&&S.ended&&!S._aftermathShown&&S.ending){
      S._aftermathShown=true;
      var lines=endingAftermath(S.ending);
      logStory(lines,'story');
      clearInterval(checkInterval);
    }
  },500);
}
wrapEnding();

/* ============================================================
   全局导出
   ============================================================ */
window.worldScene=worldScene;
window.updateWorld=updateWorld;
window.endingAftermath=endingAftermath;
/* ============================================================
   IIFE 收尾
   ============================================================ */
});
</script>

<!-- 音乐控制（独立脚本） -->
<script>
(function(){
  var btn=document.getElementById('musicBtn');
  var audio=document.getElementById('bgMusic');
  if(!btn||!audio)return;
  btn.addEventListener('click',function(){
    if(audio.paused){
      audio.play().then(function(){
        btn.classList.add('playing');
      }).catch(function(e){
        console.error('播放失败：',e);
        alert('音乐播放失败。请确认 music.FLAC 文件与 game.html 在同一目录。');
      });
    } else {
      audio.pause();
      btn.classList.remove('playing');
    }
  });
  audio.addEventListener('ended',function(){
    btn.classList.remove('playing');
  });
})();
</script>
